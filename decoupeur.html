<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Découpeur NeTubeX — 3 fichiers</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px;min-height:100vh}
  .container{max-width:900px;margin:0 auto}
  h1{font-size:26px;font-weight:900;margin:0 0 6px;color:#fff}
  h1 span{color:#3b82f6}
  .sub{font-size:14px;color:#94a3b8;margin-bottom:24px;line-height:1.6}
  .step{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;margin-bottom:16px}
  .step h2{font-size:16px;font-weight:900;margin:0 0 12px;color:#3b82f6;display:flex;align-items:center;gap:8px}
  .step h2 .num{width:28px;height:28px;border-radius:50%;background:#3b82f6;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
  #codeInput{width:100%;min-height:300px;padding:14px;border-radius:12px;border:2px solid #334155;background:#0f172a;color:#e2e8f0;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.5;resize:vertical;outline:none}
  #codeInput:focus{border-color:#3b82f6}
  #charCount{font-size:12px;color:#94a3b8;margin-top:8px;text-align:right}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:12px;font-weight:900;font-size:15px;border:none;cursor:pointer;font-family:inherit;transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:#3b82f6;color:#fff;width:100%}
  .btn-primary:disabled{background:#475569;cursor:not-allowed}
  .btn-dl{background:#10b981;color:#fff;width:100%;margin-top:8px}
  .btn-group{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .file-result{display:flex;align-items:center;gap:12px;padding:14px;background:#0f172a;border-radius:10px;margin-bottom:10px}
  .file-result .ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .file-result .ico.html{background:#e34c26;color:#fff}
  .file-result .ico.css{background:#264de4;color:#fff}
  .file-result .ico.js{background:#f7df1e;color:#000}
  .file-result .info{flex:1;min-width:0}
  .file-result .name{font-weight:900;font-size:14px;color:#fff}
  .file-result .size{font-size:12px;color:#94a3b8;margin-top:2px}
  .file-result .dl-btn{padding:10px 16px;border-radius:8px;background:#3b82f6;color:#fff;border:none;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .file-result .dl-btn:hover{background:#2563eb}
  #log{background:#0f172a;border-radius:10px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#94a3b8;max-height:200px;overflow-y:auto;white-space:pre-wrap;line-height:1.6;margin-top:14px;display:none}
  #log .ok{color:#10b981}
  #log .err{color:#ef4444}
  #log .info{color:#60a5fa}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="container">
  <h1>🔧 Découpeur <span>NeTubeX</span></h1>
  <p class="sub">Colle ton code HTML monolithique ci-dessous, puis clique sur <strong>Découper</strong>. Tu obtiendras 3 fichiers : <strong>index.html</strong> + <strong>style.css</strong> + <strong>script.js</strong>. 100 % local.</p>

  <div class="step">
    <h2><span class="num">1</span> Colle ton code HTML</h2>
    <textarea id="codeInput" placeholder="Colle ici tout le contenu de ton fichier HTML (depuis <!DOCTYPE html> jusqu'à </html>)..."></textarea>
    <div id="charCount">0 caractère</div>
  </div>

  <div class="step">
    <h2><span class="num">2</span> Découper automatiquement</h2>
    <button class="btn btn-primary" id="btnDecouper" disabled>✂️ Découper en 3 fichiers</button>
    <div id="log"></div>
  </div>

  <div class="step hidden" id="resultStep">
    <h2><span class="num">3</span> Télécharger les fichiers</h2>
    <div id="resultsList"></div>
    <div class="btn-group">
      <button class="btn btn-dl" id="btnDownloadAll">⬇️ Tout télécharger (3 fichiers)</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

var originalFile = '';
var resultats = { html: '', css: '', js: '' };
var nomsFichiers = { html: 'index.html', css: 'style.css', js: 'script.js' };

var codeInput = document.getElementById('codeInput');
var charCount = document.getElementById('charCount');
var btnDecouper = document.getElementById('btnDecouper');
var btnDownloadAll = document.getElementById('btnDownloadAll');
var resultStep = document.getElementById('resultStep');
var resultsList = document.getElementById('resultsList');
var logEl = document.getElementById('log');

function log(msg, type) {
  logEl.style.display = 'block';
  var div = document.createElement('div');
  if (type) div.className = type;
  div.textContent = msg;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

codeInput.addEventListener('input', function() {
  originalFile = codeInput.value;
  var n = originalFile.length;
  charCount.textContent = n.toLocaleString('fr-FR') + ' caractère' + (n > 1 ? 's' : '') + ' (' + (n/1024).toFixed(1) + ' Ko)';
  btnDecouper.disabled = n < 100;
});

function extraireCSS(html) {
  var matches = html.match(/<style[^>]*>([\s\S]*?)<\/style>/gi) || [];
  var meilleur = '';
  matches.forEach(function(m) {
    var c = m.replace(/<style[^>]*>/i, '').replace(/<\/style>/i, '');
    if (c.length > meilleur.length) meilleur = c;
  });
  return meilleur.trim();
}

function extraireModuleFirebase(html) {
  var regex = /<script\s+type\s*=\s*["']module["'][^>]*>([\s\S]*?)<\/script>/gi;
  var matches = [];
  var m;
  while ((m = regex.exec(html)) !== null) {
    if (m[1].indexOf('import ') !== -1) matches.push(m[1]);
  }
  var meilleur = '';
  matches.forEach(function(c){ if (c.length > meilleur.length) meilleur = c; });
  return meilleur.trim();
}

function extraireScriptPrincipal(html) {
  var bodyPos = html.lastIndexOf('</body>');
  if (bodyPos === -1) bodyPos = html.length;
  var zone = html.substring(0, bodyPos);
  var regex = /<script(?![^>]*type\s*=\s*["']module["'])(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)<\/script>/gi;
  var matches = [];
  var m;
  while ((m = regex.exec(zone)) !== null) {
    if (m[1].length > 5000) matches.push(m[1]);
  }
  var meilleur = '';
  matches.forEach(function(c){ if (c.length > meilleur.length) meilleur = c; });
  return meilleur.trim();
}

function extraireBody(html) {
  var match = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
  if (!match) return '';
  var body = match[1];
  body = body.replace(/<script\s+type\s*=\s*["']module["'][^>]*>[\s\S]*?<\/script>/gi, '');
  var regex = /<script(?![^>]*type\s*=\s*["']module["'])(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)<\/script>/gi;
  var toRemove = [];
  var m;
  while ((m = regex.exec(body)) !== null) {
    if (m[1].length > 5000) toRemove.push(m[0]);
  }
  toRemove.sort(function(a,b){ return b.length - a.length; });
  toRemove.forEach(function(script){ body = body.replace(script, ''); });
  return body.trim();
}

function extraireHeadScriptsInline(html) {
  var hm = html.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
  if (!hm) return [];
  var head = hm[1];
  var regex = /<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)<\/script>/gi;
  var scripts = [];
  var m;
  while ((m = regex.exec(head)) !== null) {
    if (m[1].trim().length < 3000 && m[0].indexOf('type="module"') === -1) {
      scripts.push(m[0].trim());
    }
  }
  return scripts;
}

function extraireLiensCDN(html) {
  var hm = html.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
  if (!hm) return { links: [], scripts: [] };
  var head = hm[1];
  var links = head.match(/<link[^>]+rel=["']stylesheet["'][^>]*>/gi) || [];
  links = links.filter(function(l){ return l.indexOf('style.css') === -1; });
  var scripts = head.match(/<script[^>]+src=["'][^"']+["'][^>]*><\/script>/gi) || [];
  return { links: links, scripts: scripts };
}

function reconstruireIndexHtml(body, headScripts, cdn) {
  var SCRIPTC = '<' + 'script type="module" src="script.js"><' + '/script>';
  return '<!DOCTYPE html>\n' +
'<html lang="fr">\n<head>\n' +
'<meta charset="UTF-8">\n' +
'<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">\n' +
'<title>NeTubeX RDC</title>\n' +
'<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">\n' +
'<meta name="theme-color" content="#2563EB">\n' +
'<meta name="format-detection" content="telephone=no">\n' +
cdn.links.join('\n') + '\n' +
cdn.scripts.join('\n') + '\n' +
headScripts.join('\n') + '\n' +
'<link rel="stylesheet" href="style.css">\n' +
'</head>\n<body>\n\n' +
body + '\n\n' +
SCRIPTC + '\n' +
'</body>\n</html>\n';
}

function fusionnerScripts(moduleCode, mainCode) {
  return '/* ============================================================\n' +
'   NeTubeX RDC — script.js\n' +
'   ============================================================ */\n\n' +
'/* PARTIE 1 — MODULE FIREBASE */\n\n' +
moduleCode + '\n\n\n' +
'/* PARTIE 2 — SCRIPT PRINCIPAL */\n\n' +
mainCode + '\n';
}

btnDecouper.addEventListener('click', function() {
  if (!originalFile) return;
  btnDecouper.disabled = true;
  logEl.innerHTML = '';
  resultStep.classList.add('hidden');
  log('🔍 Analyse...', 'info');

  try {
    var css = extraireCSS(originalFile);
    var moduleCode = extraireModuleFirebase(originalFile);
    var mainCode = extraireScriptPrincipal(originalFile);
    var body = extraireBody(originalFile);
    var headScripts = extraireHeadScriptsInline(originalFile);
    var cdn = extraireLiensCDN(originalFile);

    log('📝 CSS : ' + css.length + ' car.', css ? 'ok' : 'err');
    log('📦 Module Firebase : ' + moduleCode.length + ' car.', moduleCode ? 'ok' : 'err');
    log('⚙️ Script principal : ' + mainCode.length + ' car.', mainCode ? 'ok' : 'err');
    log('📄 Body : ' + body.length + ' car.', body ? 'ok' : 'err');
    log('🔧 Scripts inline : ' + headScripts.length, 'ok');
    log('🌐 CDN : ' + cdn.links.length + ' CSS + ' + cdn.scripts.length + ' JS', 'ok');

    resultats.css = css;
    resultats.js = fusionnerScripts(moduleCode, mainCode);
    resultats.html = reconstruireIndexHtml(body, headScripts, cdn);

    log('━━━━━━━━━━━━━━━', 'info');
    log('✅ index.html : ' + resultats.html.length + ' car.', 'ok');
    log('✅ style.css : ' + resultats.css.length + ' car.', 'ok');
    log('✅ script.js : ' + resultats.js.length + ' car.', 'ok');

    afficherResultats();
  } catch (err) {
    log('❌ ' + err.message, 'err');
  } finally {
    btnDecouper.disabled = false;
  }
});

function afficherResultats() {
  resultStep.classList.remove('hidden');
  resultsList.innerHTML = '';
  var fichiers = [
    { key: 'html', ext: 'html', ico: '🌐', label: 'index.html', desc: 'HTML + scripts inline' },
    { key: 'css', ext: 'css', ico: '🎨', label: 'style.css', desc: 'Styles' },
    { key: 'js', ext: 'js', ico: '⚡', label: 'script.js', desc: 'Module + principal' }
  ];
  fichiers.forEach(function(f) {
    var contenu = resultats[f.key];
    var ko = (contenu.length / 1024).toFixed(1);
    var div = document.createElement('div');
    div.className = 'file-result';
    div.innerHTML = '<div class="ico ' + f.ext + '">' + f.ico + '</div>' +
      '<div class="info"><div class="name">' + f.label + '</div>' +
      '<div class="size">' + ko + ' Ko · ' + f.desc + '</div></div>' +
      '<button class="dl-btn">⬇️ Télécharger</button>';
    div.querySelector('.dl-btn').addEventListener('click', function() {
      telecharger(resultats[f.key], nomsFichiers[f.key]);
    });
    resultsList.appendChild(div);
  });
  resultStep.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function telecharger(contenu, nom) {
  var mime = nom.endsWith('.html') ? 'text/html' : nom.endsWith('.css') ? 'text/css' : 'text/javascript';
  var blob = new Blob([contenu], { type: mime + ';charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = nom;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  log('⬇️ ' + nom, 'ok');
}

btnDownloadAll.addEventListener('click', function() {
  telecharger(resultats.html, nomsFichiers.html);
  setTimeout(function(){ telecharger(resultats.css, nomsFichiers.css); }, 400);
  setTimeout(function(){ telecharger(resultats.js, nomsFichiers.js); }, 800);
});

})();
</script>
</body>
</html>

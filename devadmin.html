<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>Test Publication — NeTubeX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>
(function(){
  'use strict';
  const IMGBB_API_KEY = '3c7603b68d243e8bbd5fe29e8e54c8ee';
  const IMGBB_UPLOAD_URL = 'https://api.imgbb.com/1/upload';
  const MAX_SIZE = 10 * 1024 * 1024;
  const ALLOWED_TYPES = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];

  async function uploadToImgbb(file, options) {
    options = options || {};
    if (!file) throw new Error('Aucun fichier fourni');
    if (file.size > MAX_SIZE) throw new Error('Image trop grosse (max 10 Mo). Votre fichier : ' + (file.size/1024/1024).toFixed(2) + ' Mo');
    if (!ALLOWED_TYPES.includes(file.type)) throw new Error('Format non supporté (' + file.type + ')');
    if (!IMGBB_API_KEY) throw new Error('Clé API manquante');

    const base64 = await new Promise(function(resolve, reject) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;
        const commaIndex = dataUrl.indexOf(',');
        if (commaIndex === -1) return reject(new Error('Lecture du fichier échouée'));
        resolve(dataUrl.substring(commaIndex + 1));
      };
      reader.onerror = function() { reject(new Error('Lecture du fichier échouée')); };
      reader.readAsDataURL(file);
    });

    const fd = new FormData();
    fd.append('image', base64);
    if (file.name) fd.append('name', file.name.replace(/[^\w\-.]/g, '_').slice(0, 32));

    const url = IMGBB_UPLOAD_URL + '?key=' + encodeURIComponent(IMGBB_API_KEY);

    let res;
    try {
      res = await fetch(url, { method: 'POST', body: fd });
    } catch (networkError) {
      throw new Error('Erreur réseau : ' + networkError.message);
    }

    const responseText = await res.text();

    if (!res.ok) {
      throw new Error('Erreur HTTP ' + res.status + ' : ' + responseText.substring(0, 200));
    }

    let json;
    try { json = JSON.parse(responseText); }
    catch (e) { throw new Error('Réponse invalide d\'ImgBB'); }

    if (!json.success || !json.data) {
      throw new Error('ImgBB a refusé : ' + (json.error && json.error.message ? json.error.message : 'inconnu'));
    }

    return {
      image_url: json.data.display_url || json.data.url,
      page_url: json.data.url_viewer,
      delete_url: json.data.delete_url,
      image_id: json.data.id,
      width: json.data.width,
      height: json.data.height,
      size: json.data.size
    };
  }

  async function compresser(file, maxWidth, quality) {
    maxWidth = maxWidth || 1200;
    quality = quality || 0.85;
    return new Promise(function(resolve, reject) {
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ratio = Math.min(maxWidth / img.width, maxWidth / img.height, 1);
          canvas.width = Math.round(img.width * ratio);
          canvas.height = Math.round(img.height * ratio);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(function(blob) {
            if (blob) resolve(new File([blob], file.name || 'image.jpg', { type: 'image/jpeg' }));
            else reject(new Error('Compression échouée'));
          }, 'image/jpeg', quality);
        };
        img.onerror = function() { reject(new Error('Image invalide')); };
        img.src = ev.target.result;
      };
      reader.onerror = function() { reject(new Error('Lecture échouée')); };
      reader.readAsDataURL(file);
    });
  }

  async function compressAndUpload(file, maxWidth, quality) {
    const compressed = await compresser(file, maxWidth, quality);
    return uploadToImgbb(compressed, {});
  }

  window.picrd = {
    upload: uploadToImgbb,
    compressAndUpload: compressAndUpload,
    compress: compresser
  };

  console.log('✅ imgbb module chargé');
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:#f1f5f9;color:#0f172a;min-height:100vh;padding-bottom:40px}
.header{background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;padding:20px 16px;text-align:center;box-shadow:0 4px 12px rgba(30,64,175,.3)}
.header h1{font-size:20px;font-weight:900;letter-spacing:-.5px}
.header p{font-size:12px;opacity:.85;margin-top:4px}
.container{max-width:600px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(15,23,42,.06);border:1px solid #e2e8f0}
.card-title{font-size:14px;font-weight:800;color:#1e293b;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title i{color:#3b82f6}
label{display:block;font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
input[type=text],input[type=number],textarea,select{width:100%;padding:12px 14px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:15px;background:#f8fafc;color:#0f172a;font-family:inherit;outline:none;transition:all .15s}
input:focus,textarea:focus,select:focus{border-color:#3b82f6;background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
textarea{resize:vertical;min-height:80px}
.field{margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dropzone{border:2px dashed #cbd5e1;border-radius:14px;padding:24px 20px;text-align:center;cursor:pointer;background:#f8fafc;transition:all .15s}
.dropzone:active{background:#eff6ff;border-color:#3b82f6}
.dropzone-icon{font-size:40px;margin-bottom:10px}
.dropzone-title{font-size:14px;font-weight:800;color:#1e293b;margin-bottom:4px}
.dropzone-sub{font-size:11.5px;color:#64748b}
.previews{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:14px}
.preview-item{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#e2e8f0;border:2px solid #e2e8f0}
.preview-item img{width:100%;height:100%;object-fit:cover;display:block}
.preview-remove{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(239,68,68,.95);color:#fff;border:2px solid #fff;cursor:pointer;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.preview-item.loading{display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spinner{width:22px;height:22px;border:3px solid rgba(59,130,246,.25);border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{width:100%;padding:16px;border-radius:12px;font-size:15px;font-weight:800;border:none;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(180deg,#3b82f6,#1d4ed8);color:#fff;box-shadow:0 4px 0 #1e3a8a}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#0f172a;color:#fff;padding:14px 22px;border-radius:12px;font-size:14px;font-weight:700;z-index:999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:linear-gradient(135deg,#10b981,#059669)}
.toast.err{background:linear-gradient(135deg,#ef4444,#dc2626)}
.toast.info{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.feed-item{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(15,23,42,.06);border:1px solid #e2e8f0;display:flex;gap:12px}
.feed-img{width:80px;height:80px;border-radius:10px;object-fit:cover;background:#e2e8f0;flex-shrink:0}
.feed-content{flex:1;min-width:0}
.feed-title{font-size:14px;font-weight:800;color:#0f172a;line-height:1.3;margin-bottom:4px;word-break:break-word}
.feed-desc{font-size:12px;color:#64748b;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed-meta{font-size:11px;color:#94a3b8;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.feed-url{font-family:ui-monospace,monospace;font-size:10px;color:#10b981;word-break:break-all;background:#ecfdf5;padding:4px 8px;border-radius:6px;margin-top:6px;font-weight:700}
.loading{text-align:center;padding:40px 20px;color:#64748b}
.loading .spinner{margin:0 auto 12px;width:40px;height:40px;border-width:4px}
.empty{text-align:center;padding:40px 20px;color:#94a3b8}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.4}
.empty-text{font-size:13px;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:#e2e8f0;padding:4px;border-radius:12px}
.tab{flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:800;border:none;background:transparent;color:#64748b;cursor:pointer;font-family:inherit;transition:all .15s}
.tab.active{background:#fff;color:#1e40af;box-shadow:0 2px 4px rgba(0,0,0,.08)}
</style>
</head>
<body>

<div class="header">
<h1>🧪 Test Publication</h1>
<p>NeTubeX RDC — Vérification ImgBB + Firestore</p>
</div>

<div class="container">

<div class="tabs">
<button class="tab active" onclick="switchTab('publish')">📝 Publier</button>
<button class="tab" onclick="switchTab('feed')">📋 Feed</button>
</div>

<!-- ONGLET PUBLICATION -->
<div id="tabPublish">
<div class="card">
<div class="card-title">📝 Nouvelle annonce</div>

<div class="field">
<label>Titre *</label>
<input type="text" id="titre" placeholder="Ex: Appartement 3 chambres" maxlength="100">
</div>

<div class="field">
<label>Description</label>
<textarea id="desc" placeholder="Décrivez votre annonce…" maxlength="500"></textarea>
</div>

<div class="grid-2">
<div class="field">
<label>Ville</label>
<input type="text" id="ville" placeholder="Ex: Kinshasa">
</div>
<div class="field">
<label>Prix</label>
<input type="text" id="prix" placeholder="Ex: 450$ / mois">
</div>
</div>

<div class="field">
<label>Catégorie</label>
<select id="cat">
<option value="jobs">Jobs</option>
<option value="immobilier">Immobilier</option>
<option value="autre">Autre</option>
</select>
</div>

<div class="field">
<label>Photos (max 3)</label>
<div class="dropzone" onclick="document.getElementById('fileInput').click()">
<div class="dropzone-icon">📷</div>
<div class="dropzone-title">Ajouter des photos</div>
<div class="dropzone-sub">JPG, PNG, WebP — max 10 Mo</div>
</div>
<input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(event)">
<div class="previews" id="previews"></div>
</div>

<button class="btn btn-primary" id="publishBtn" onclick="publier()">
<span id="publishBtnText">🚀 Publier</span>
</button>
</div>
</div>

<!-- ONGLET FEED -->
<div id="tabFeed" style="display:none">
<div class="card">
<div class="card-title">📋 Annonces publiées (<span id="feedCount">0</span>)</div>
<div id="feedList">
<div class="loading"><div class="spinner"></div>Chargement…</div>
</div>
</div>
</div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
  authDomain: "netubexmoney.firebaseapp.com",
  projectId: "netubexmoney",
  storageBucket: "netubexmoney.firebasestorage.app",
  messagingSenderId: "856592608176",
  appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let uploadedImages = [];
let uploadingCount = 0;

window.showToast = function(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || 'info');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.classList.remove('show'); }, 3500);
};

window.switchTab = function(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tabPublish').style.display = tab === 'publish' ? 'block' : 'none';
  document.getElementById('tabFeed').style.display = tab === 'feed' ? 'block' : 'none';
  if (tab === 'feed') loadFeed();
};

window.handleFiles = async function(e) {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  const places = 3 - uploadedImages.length;
  if (places <= 0) { window.showToast('Maximum 3 photos', 'err'); return; }
  const aTraiter = files.slice(0, places);
  if (files.length > places) window.showToast('Seules les ' + places + ' premières seront ajoutées', 'info');

  for (const file of aTraiter) {
    const tempId = 'tmp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    uploadingCount++;
    addPreviewLoading(tempId);
    try {
      window.showToast('⏳ Upload en cours…', 'info');
      const result = await window.picrd.compressAndUpload(file, 1200, 0.85);
      uploadedImages.push({
        image_url: result.image_url,
        delete_url: result.delete_url,
        image_id: result.image_id,
        name: file.name
      });
      removePreview(tempId);
      renderPreviews();
      window.showToast('✅ Image ' + uploadedImages.length + '/3', 'ok');
    } catch (err) {
      removePreview(tempId);
      window.showToast('❌ ' + err.message, 'err');
    } finally {
      uploadingCount--;
    }
  }
};

function addPreviewLoading(id) {
  const c = document.getElementById('previews');
  const div = document.createElement('div');
  div.className = 'preview-item loading';
  div.id = id;
  div.innerHTML = '<div class="spinner"></div>';
  c.appendChild(div);
}

function removePreview(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function renderPreviews() {
  const c = document.getElementById('previews');
  c.querySelectorAll('.preview-item:not(.loading)').forEach(el => el.remove());
  uploadedImages.forEach((img, idx) => {
    const div = document.createElement('div');
    div.className = 'preview-item';
    div.innerHTML = '<img src="' + img.image_url + '" alt=""><button class="preview-remove" onclick="removeImage(' + idx + ')">✕</button>';
    c.appendChild(div);
  });
}

window.removeImage = function(idx) {
  uploadedImages.splice(idx, 1);
  renderPreviews();
  window.showToast('Image retirée', 'info');
};

window.publier = async function() {
  if (uploadingCount > 0) { window.showToast('Attendez la fin des uploads…', 'err'); return; }
  const titre = document.getElementById('titre').value.trim();
  if (!titre) { window.showToast('Renseignez le titre', 'err'); return; }
  if (uploadedImages.length === 0) { window.showToast('Ajoutez au moins 1 photo', 'err'); return; }

  const btn = document.getElementById('publishBtn');
  const btnText = document.getElementById('publishBtnText');
  btn.disabled = true;
  btnText.textContent = '⏳ Enregistrement…';

  try {
    const annonce = {
      titre: titre,
      desc: document.getElementById('desc').value.trim(),
      ville: document.getElementById('ville').value.trim(),
      prix: document.getElementById('prix').value.trim(),
      cat: document.getElementById('cat').value,
      img: uploadedImages[0].image_url,
      images: uploadedImages.map(i => i.image_url),
      images_delete_urls: uploadedImages.map(i => i.delete_url).filter(Boolean),
      images_ids: uploadedImages.map(i => i.image_id).filter(Boolean),
      dateCreation: new Date().toISOString(),
      actif: true,
      statut: 'en_attente',
      vues: 0,
      testSource: true
    };

    const docRef = await addDoc(collection(db, 'annonces'), annonce);
    window.showToast('✅ Publié ! ID: ' + docRef.id.slice(-8), 'ok');

    document.getElementById('titre').value = '';
    document.getElementById('desc').value = '';
    document.getElementById('ville').value = '';
    document.getElementById('prix').value = '';
    uploadedImages = [];
    renderPreviews();

    setTimeout(() => { window.switchTab('feed'); }, 800);
  } catch (err) {
    window.showToast('❌ Erreur: ' + err.message, 'err');
  } finally {
    btn.disabled = false;
    btnText.textContent = '🚀 Publier';
  }
};

async function loadFeed() {
  const list = document.getElementById('feedList');
  list.innerHTML = '<div class="loading"><div class="spinner"></div>Chargement…</div>';
  try {
    const q = query(collection(db, 'annonces'), orderBy('dateCreation', 'desc'), limit(20));
    const snap = await getDocs(q);
    const items = [];
    snap.forEach(d => items.push({ id: d.id, ...d.data() }));
    document.getElementById('feedCount').textContent = items.length;
    if (items.length === 0) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Aucune annonce publiée</div></div>';
      return;
    }
    list.innerHTML = items.map(a => {
      const isBase64 = a.img && a.img.startsWith('data:');
      const isHttp = a.img && a.img.startsWith('http');
      return '<div class="feed-item">' +
        (a.img ? '<img class="feed-img" src="' + a.img + '" alt="" onerror="this.style.background=\'#fee2e2\'">' : '<div class="feed-img"></div>') +
        '<div class="feed-content">' +
        '<div class="feed-title">' + escHtml(a.titre || '-') + '</div>' +
        (a.desc ? '<div class="feed-desc">' + escHtml(a.desc) + '</div>' : '') +
        '<div class="feed-meta">' +
        (a.ville ? '📍 ' + escHtml(a.ville) : '') +
        (a.prix ? ' · 💰 ' + escHtml(a.prix) : '') +
        ' · ' + (isHttp ? '✅ URL' : isBase64 ? '⚠️ base64' : '❓') +
        '</div>' +
        (a.img ? '<div class="feed-url">' + (isHttp ? '✅ ' : '❌ ') + escHtml(a.img).substring(0, 80) + (a.img.length > 80 ? '…' : '') + '</div>' : '') +
        '</div></div>';
    }).join('');
  } catch (err) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">❌</div><div class="empty-text">Erreur: ' + escHtml(err.message) + '</div></div>';
  }
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>

</body>
</html>

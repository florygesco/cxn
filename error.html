<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accès non autorisé</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/x-icon" href="https://www.netubex.com/favicon.ico">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Arial, sans-serif;
      background: #b30000;
      color: white;
      text-align: center;
      padding: 20px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .container {
      width: 100%;
      max-width: 460px;
      padding: 40px 24px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 20px;
      margin: auto;
    }

    .icon {
      font-size: 72px;
      margin-bottom: 14px;
      line-height: 1;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    p {
      margin: 0 auto 26px;
      font-size: 18px;
      line-height: 1.5;
      font-weight: 500;
      max-width: 380px;
    }

    .qr-section {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 16px;
      padding: 20px 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .qr-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.95;
    }

    .qr-frame {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      min-height: 180px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .qr-frame canvas,
    .qr-frame img {
      display: block;
      width: 160px;
      height: 160px;
      image-rendering: pixelated;
      max-width: 100%;
    }

    .qr-hint {
      font-size: 13px;
      line-height: 1.5;
      opacity: 0.9;
      max-width: 300px;
    }

    .btn-accueil {
      display: inline-block;
      padding: 14px 32px;
      background: white;
      color: #b30000;
      text-decoration: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      transition: 0.2s;
      width: 100%;
      max-width: 300px;
    }

    .btn-accueil:hover {
      background: #f2f2f2;
      transform: scale(1.03);
    }

    .btn-accueil:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 22px;
      font-size: 13px;
      opacity: 0.8;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    @media (max-width: 420px) {
      .container {
        padding: 32px 18px;
        border-radius: 16px;
      }
      .icon { font-size: 60px; }
      h1 { font-size: 24px; }
      p { font-size: 16px; }
      .qr-frame canvas,
      .qr-frame img {
        width: 140px;
        height: 140px;
      }
      .qr-frame {
        min-width: 160px;
        min-height: 160px;
      }
      .btn-accueil { font-size: 15.5px; padding: 13px 24px; }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">🚫</div>

    <h1>ACCÈS NON AUTORISÉ</h1>

    <p>
      Votre établissement est accessible
      <strong>uniquement depuis un mobile.</strong>
    </p>

    <div class="qr-section">
      <div class="qr-title">📱 Scannez pour accéder</div>
      <div class="qr-frame" id="qrFrame"></div>
      <div class="qr-hint">Scannez ce code avec votre téléphone pour ouvrir NeTubeX RDC.</div>
    </div>

    <a class="btn-accueil" href="https://www.netubex.com/index">
      🏠 ACCUEIL
    </a>

    <div class="footer">
      NeTubeX SARL
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

  <script>
    (function () {
      'use strict';

      document.addEventListener('mousedown', function (e) {
        if (e.button === 0) {
          e.preventDefault();
          return false;
        }
      });

      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        return false;
      });

      document.addEventListener('keydown', function (e) {
        var k = (e.key || '').toLowerCase();
        if (e.key === 'F12') { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && (k === 'i' || k === 'j' || k === 'c' || k === 'k' || k === 'e')) {
          e.preventDefault();
          return false;
        }
        if (e.ctrlKey && (k === 'u' || k === 's' || k === 'p')) {
          e.preventDefault();
          return false;
        }
      }, { capture: true });

      document.addEventListener('dragstart', function (e) {
        if (e.target && e.target.tagName === 'IMG') {
          e.preventDefault();
          return false;
        }
      }, { capture: true });

      try {
        var _n = function () {};
        window.console = {
          log: _n, info: _n, warn: _n, error: _n, debug: _n,
          trace: _n, table: _n, dir: _n, group: _n, groupEnd: _n,
          time: _n, timeEnd: _n, assert: _n, clear: _n
        };
      } catch (e) {}

      var QR_URL = 'https://www.netubex.com/rdc';
      var frame = document.getElementById('qrFrame');

      function tailleQR() {
        var w = window.innerWidth || 1200;
        if (w <= 420) return 140;
        return 160;
      }

      function genererQR() {
        if (!frame) return;
        frame.innerHTML = '';
        var t = tailleQR();
        if (window.QRCode && QRCode.toCanvas) {
          var canvas = document.createElement('canvas');
          QRCode.toCanvas(canvas, QR_URL, {
            width: t,
            margin: 1,
            color: { dark: '#b30000', light: '#ffffff' },
            errorCorrectionLevel: 'H'
          }, function (err) {
            if (err) { fallback(t); return; }
            frame.appendChild(canvas);
          });
        } else {
          fallback(t);
        }
      }

      function fallback(t) {
        if (!frame) return;
        var img = document.createElement('img');
        img.alt = 'QR Code NeTubeX RDC';
        img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=' + (t * 2) + 'x' + (t * 2) + '&margin=10&color=b30000&data=' + encodeURIComponent(QR_URL);
        img.onerror = function () {
          frame.innerHTML = '<div style="font-size:12px;color:#b30000;padding:20px;text-align:center;font-weight:800">QR indisponible</div>';
        };
        frame.appendChild(img);
      }

      var _resizeTimer;
      window.addEventListener('resize', function () {
        if (_resizeTimer) clearTimeout(_resizeTimer);
        _resizeTimer = setTimeout(genererQR, 300);
      });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', genererQR);
      } else {
        genererQR();
      }
    })();
  </script>

</body>
</html>

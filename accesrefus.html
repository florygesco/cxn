<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Accès non autorisé</title>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #b30000;
      color: white;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 500px;
      padding: 45px 25px;
      background: rgba(0, 0, 0, 0.18);
      border-radius: 20px;
    }

    .icon {
      font-size: 75px;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 32px;
      font-weight: 800;
    }

    p {
      margin: 0 auto 30px;
      font-size: 19px;
      line-height: 1.5;
      font-weight: 500;
    }

    .btn-accueil {
      display: inline-block;
      padding: 14px 32px;
      background: white;
      color: #b30000;
      text-decoration: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-accueil:hover {
      background: #f2f2f2;
      transform: scale(1.03);
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      opacity: 0.8;
    }
  </style>
</head>

<body oncontextmenu="return false">

  <div class="container">

    <div class="icon">🚫</div>

    <h1>ACCÈS NON AUTORISÉ</h1>

    <p>
      Votre établissement est accessible
      <strong>uniquement depuis Lubumbashi.</strong>
    </p>

    <a
      class="btn-accueil"
      href="https://www.netubex.com/index"
    >
      🏠 ACCUEIL
    </a>

    <div class="footer">
      NeTubeX SARL
    </div>

  </div>

  <script>
    // Désactive le clic gauche
    document.addEventListener("mousedown", function(event) {
      if (event.button === 0) {
        event.preventDefault();
        return false;
      }
    });

    // Désactive le clic droit
    document.addEventListener("contextmenu", function(event) {
      event.preventDefault();
    });

    // Désactive certains raccourcis clavier
    document.addEventListener("keydown", function(event) {
      if (
        event.key === "F12" ||
        (event.ctrlKey && event.shiftKey && event.key === "I") ||
        (event.ctrlKey && event.shiftKey && event.key === "J") ||
        (event.ctrlKey && event.key === "U")
      ) {
        event.preventDefault();
      }
    });
  </script>

</body>
</html>

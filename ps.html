<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Adsterra — NeTubeX</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background:#f8fafc; margin:0; padding:16px; }
  .container { max-width:700px; margin:0 auto; }

  h1 { font-size:20px; font-weight:900; margin:0 0 4px; color:#0f172a; }
  .sub { color:#64748b; font-size:13px; margin:0 0 20px; }

  .status { padding:12px 16px; border-radius:10px; font-size:13.5px;
            font-weight:800; margin-bottom:16px; display:flex;
            align-items:center; gap:10px; }
  .status.ok   { background:#d1fae5; color:#065f46; }
  .status.err  { background:#fee2e2; color:#991b1b; }
  .status.wait { background:#fef3c7; color:#78350f; }

  .ad-zone {
    background:#fff; border:2px dashed #cbd5e1; border-radius:14px;
    padding:20px; min-height:280px; margin-bottom:16px;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; position:relative;
  }
  .ad-zone-label {
    font-size:11px; font-weight:900; color:#94a3b8;
    text-transform:uppercase; letter-spacing:.6px;
  }
  .ad-zone-loaded { border-color:#10b981; border-style:solid; background:#f0fdf4; }

  .fake-post {
    background:#fff; border:1px solid #e2e8f0; border-radius:14px;
    padding:16px; margin-bottom:16px;
    display:flex; gap:12px; align-items:flex-start;
  }
  .fake-avatar {
    width:44px; height:44px; border-radius:50%; background:#007fff;
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:15px; flex-shrink:0;
  }
  .fake-name { font-weight:800; font-size:14.5px; color:#0f172a; margin-bottom:4px; }
  .fake-desc { font-size:14px; color:#334155; line-height:1.45; }

  #logBox {
    background:#020617; color:#5cb3ff; padding:14px;
    border-radius:10px; font-family:ui-monospace,monospace;
    font-size:11.5px; line-height:1.5; max-height:300px;
    overflow-y:auto; margin-top:16px;
  }
  #logBox .err  { color:#f87171; }
  #logBox .ok   { color:#4ade80; }
  #logBox .warn { color:#fbbf24; }
  #logBox .dim  { color:#64748b; }
  #logBox > div { margin-bottom:3px; }

  .btn {
    padding:10px 18px; border-radius:8px; border:none; cursor:pointer;
    font-family:inherit; font-weight:900; font-size:13px;
    background:#007fff; color:#fff; margin-right:8px;
  }
  .btn.gray { background:#334155; }
</style>
</head>
<body>

<div class="container">

  <h1>🧪 Test Adsterra</h1>
  <p class="sub">Key : 8d72ac770e702349d37106a49fa7a149 · Format : 300×250 iframe</p>

  <div id="status" class="status wait">
    <span>⏳</span> <span id="statusText">Chargement du script…</span>
  </div>

  <!-- Faux post avant la pub (comme dans NeTubeX) -->
  <div class="fake-post">
    <div class="fake-avatar">BE</div>
    <div>
      <div class="fake-name">Boutique Élégance</div>
      <div class="fake-desc">Robes en pagne à partir de 15$ — livraison Kinshasa.</div>
    </div>
  </div>

  <!-- EMPLACEMENT DE LA PUB -->
  <div class="ad-zone" id="adZone1">
    <div class="ad-zone-label">📢 Emplacement publicitaire</div>
    <div id="adContainer" style="display:flex;align-items:center;justify-content:center;min-height:250px">
      <!-- Le script Adsterra va injecter l'iframe ici -->
    </div>
  </div>

  <!-- Faux post après la pub -->
  <div class="fake-post">
    <div class="fake-avatar">SM</div>
    <div>
      <div class="fake-name">Super Marché Central</div>
      <div class="fake-desc">Promo riz 25kg à 45 000 FC cette semaine.</div>
    </div>
  </div>

  <button class="btn" onclick="location.reload()">🔄 Relancer</button>
  <button class="btn gray" onclick="document.getElementById('logBox').innerHTML=''">🗑️ Vider log</button>

  <div id="logBox"></div>

</div>

<!-- ============================================================
     SCRIPT ADSTERRA (inséré tel quel)
     ============================================================ -->
<script type="text/javascript">
  atOptions = {
    'key' : '8d72ac770e702349d37106a49fa7a149',
    'format' : 'iframe',
    'height' : 250,
    'width' : 300,
    'params' : {}
  };
</script>
<script type="text/javascript" src="https://bluntutilities.com/8d72ac770e702349d37106a49fa7a149/invoke.js"></script>
<!-- ============================================================ -->

<script>
(function() {
  'use strict';

  var logEl = document.getElementById('logBox');
  var statusEl = document.getElementById('status');
  var statusTxt = document.getElementById('statusText');
  var adZone = document.getElementById('adZone1');
  var adContainer = document.getElementById('adContainer');

  function log(msg, cls) {
    cls = cls || '';
    var d = document.createElement('div');
    d.className = cls;
    var t = new Date().toLocaleTimeString('fr-FR');
    d.textContent = '[' + t + '] ' + msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(txt, cls, icon) {
    statusEl.className = 'status ' + cls;
    statusTxt.textContent = txt;
    statusEl.querySelector('span').textContent = icon;
  }

  log('Script démarré', 'dim');
  log('Key : 8d72ac770e702349d37106a49fa7a149', 'dim');
  log('Format : iframe 300x250', 'dim');

  // Observer les iframes injectées par Adsterra
  var t0 = Date.now();
  var iframeDetected = false;
  var scriptLoaded = false;

  var observer = new MutationObserver(function(mutations) {
    var iframes = document.querySelectorAll('iframe');
    if (iframes.length > 0 && !iframeDetected) {
      iframeDetected = true;
      var dt = Date.now() - t0;

      log('═══════════════════════════════════', 'dim');
      log('✅ ' + iframes.length + ' iframe(s) détectée(s) en ' + dt + 'ms', 'ok');

      iframes.forEach(function(f, i) {
        log('  iframe #' + i + ' → ' + f.width + 'x' + f.height, 'ok');
        log('  src : ' + (f.src || '(pas de src)').slice(0, 100), 'dim');
        var parent = f.closest('[id*="container"]');
        log('  parent : ' + (parent ? parent.id : '—'), 'dim');
      });

      // Marquer visuellement
      adZone.classList.add('ad-zone-loaded');
      setStatus('Pub détectée et chargée !', 'ok', '✅');
    }
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

  // Détecter le chargement du script invoke.js
  window.addEventListener('load', function() {
    log('window.load déclenché en ' + (Date.now() - t0) + 'ms', 'dim');
  });

  // Vérifier périodiquement ce qui se passe
  var checks = [500, 1000, 2000, 3000, 5000];
  checks.forEach(function(delay) {
    setTimeout(function() {
      if (iframeDetected) return;

      var iframes = document.querySelectorAll('iframe');
      var scripts = document.querySelectorAll('script[src*="bluntutilities"]');
      log('Check ' + delay + 'ms → iframes=' + iframes.length +
          ' | scripts adsterra=' + scripts.length, 'dim');
    }, delay);
  });

  // Timeout final
  setTimeout(function() {
    if (iframeDetected) return;

    var iframes = document.querySelectorAll('iframe');
    if (iframes.length === 0) {
      log('═══════════════════════════════════', 'dim');
      log('❌ Aucune pub rendue après 6s', 'err');
      log('', 'dim');
      log('Causes possibles :', 'warn');
      log('1. AdBlock / uBlock active → désactive-le pour tester', 'warn');
      log('2. La clé est en attente de validation Adsterra', 'warn');
      log('3. Le site n\'est pas encore approuvé', 'warn');
      log('4. Le CDN bloque depuis file:// (essaie via serveur local)', 'warn');
      log('5. No fill pour cette zone géographique', 'warn');
      log('', 'dim');
      log('Diagnostic :', 'warn');
      log('→ Ouvre DevTools (F12) → onglet Network', 'dim');
      log('→ Cherche "invoke.js" et "bluntutilities"', 'dim');
      log('→ Regarde si HTTP 200 ou bloqué', 'dim');
      log('→ Regarde l\'onglet Console pour erreurs CORS', 'dim');
      setStatus('Aucune pub rendue', 'err', '❌');
    }
  }, 6000);

  // Capturer les erreurs réseau
  window.addEventListener('error', function(e) {
    if (e.target && e.target.tagName === 'SCRIPT') {
      log('❌ Erreur script : ' + e.target.src, 'err');
    }
  }, true);

  // Voir les iframes créées même si elles sont dans un shadow DOM ou similaire
  setInterval(function() {
    if (iframeDetected) return;
    var iframes = document.querySelectorAll('iframe');
    if (iframes.length > 0) {
      // Le MutationObserver va le détecter, mais on force ici aussi
      var dt = Date.now() - t0;
      iframeDetected = true;
      log('✅ iframe détectée en ' + dt + 'ms (catchall)', 'ok');
      adZone.classList.add('ad-zone-loaded');
      setStatus('Pub détectée !', 'ok', '✅');
    }
  }, 400);

  log('Surveillance active — attente de la pub Adsterra…', 'dim');
  log('(L\'iframe apparaîtra ci-dessus)', 'dim');

})();
</script>

</body>
</html>

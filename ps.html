<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Native Banner - Final</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background:#f8fafc; margin:0; padding:16px; }
  .container { max-width:700px; margin:0 auto; }

  h1 { font-size:20px; font-weight:900; margin:0 0 4px; color:#0f172a; }
  .sub { color:#64748b; font-size:13px; margin:0 0 12px; }
  .badge-info {
    display:inline-block; padding:6px 12px; border-radius:8px;
    background:#0f172a; color:#5cb3ff; font-size:11.5px;
    font-weight:900; margin:4px 6px 4px 0;
    font-family:ui-monospace,monospace;
  }

  .status { padding:12px 16px; border-radius:10px; font-size:13.5px;
            font-weight:800; margin-bottom:16px; display:flex;
            align-items:center; gap:10px; }
  .status.ok   { background:#d1fae5; color:#065f46; }
  .status.err  { background:#fee2e2; color:#991b1b; }
  .status.wait { background:#fef3c7; color:#78350f; }
  .status.warn { background:#fef3c7; color:#92400e; }

  .fake-post {
    background:#fff; border:1px solid #e2e8f0; border-radius:14px;
    padding:16px; margin-bottom:16px; display:flex; gap:12px;
    align-items:flex-start;
  }
  .fake-avatar {
    width:44px; height:44px; border-radius:50%; background:#007fff;
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:15px; flex-shrink:0;
  }
  .fake-name { font-weight:800; font-size:14.5px; color:#0f172a; margin-bottom:4px; }
  .fake-desc { font-size:14px; color:#334155; line-height:1.45; }

  .fb-post-ad {
    width:100%; background:#fff; border-radius:0;
    overflow:hidden; padding:0 0 12px;
  }
  .fb-post-ad + .fake-post,
  .fake-post + .fb-post-ad {
    border-top:3px solid #e2e8f0;
  }
  .fb-post-ad-head {
    display:grid; grid-template-columns:auto 1fr auto;
    align-items:center; gap:10px; padding:12px 14px 8px;
  }
  .fb-post-ad-avatar {
    width:44px; height:44px; border-radius:50%;
    background:#f59e0b; color:#fff; display:flex;
    align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
  }
  .fb-post-ad-name {
    font-weight:800; font-size:14.5px;
    color:#0f172a; line-height:1.35;
  }
  .fb-post-ad-badge {
    font-size:10px; font-weight:900; padding:5px 9px;
    border-radius:6px; text-transform:uppercase;
    letter-spacing:.4px; background:#f59e0b;
    color:#fff; flex-shrink:0;
  }
  .fb-post-ad-media {
    width:100%; background:transparent; overflow:hidden;
    display:block; position:relative; padding:8px 0;
  }
  .fb-post-ad-media img {
    max-width:100%; height:auto; display:block; margin:0 auto;
  }
  .fb-post-ad-media a { display:block; width:100%; }

  #logBox {
    background:#020617; color:#5cb3ff; padding:14px;
    border-radius:10px; font-family:ui-monospace,monospace;
    font-size:11.5px; line-height:1.5; max-height:350px;
    overflow-y:auto; margin-top:16px;
  }
  #logBox .err  { color:#f87171; }
  #logBox .ok   { color:#4ade80; }
  #logBox .warn { color:#fbbf24; }
  #logBox .dim  { color:#64748b; }
  #logBox > div { margin-bottom:3px; }

  .btn {
    padding:10px 18px; border-radius:8px; border:none;
    cursor:pointer; font-family:inherit; font-weight:900;
    font-size:13px; background:#007fff; color:#fff; margin-right:8px;
  }
  .btn.gray { background:#334155; }
</style>
</head>
<body>

<div class="container">

  <h1>🧪 Test Native Banner - Final</h1>
  <p class="sub">Key : c8e9df92013d3020593ad443d2530ad4</p>
  <div>
    <span class="badge-info" id="counter1">Enfants: 0</span>
    <span class="badge-info" id="counter2">Visibles: 0</span>
    <span class="badge-info" id="counter3">HTML: 0c</span>
  </div>

  <div id="status" class="status wait" style="margin-top:12px">
    <span>⏳</span> <span id="statusText">Chargement du Native Banner…</span>
  </div>

  <div class="fake-post">
    <div class="fake-avatar">BE</div>
    <div>
      <div class="fake-name">Boutique Élégance</div>
      <div class="fake-desc">Robes en pagne à partir de 15$ — livraison Kinshasa.</div>
    </div>
  </div>

  <article class="fb-post-ad" id="adsterraCard">
    <div class="fb-post-ad-head">
      <div class="fb-post-ad-avatar">📢</div>
      <div style="min-width:0;overflow:hidden">
        <div class="fb-post-ad-name">Sponsorisé</div>
      </div>
      <span class="fb-post-ad-badge">PUBLICITÉ</span>
    </div>
    <div class="fb-post-ad-media" id="adsterraMedia">
      <div id="adsterraSlot"></div>
    </div>
  </article>

  <div class="fake-post">
    <div class="fake-avatar">SM</div>
    <div>
      <div class="fake-name">Super Marché Central</div>
      <div class="fake-desc">Promo riz 25kg à 45 000 FC cette semaine.</div>
    </div>
  </div>

  <button class="btn" onclick="location.reload()">🔄 Relancer</button>
  <button class="btn gray" onclick="document.getElementById('logBox').innerHTML=''">🗑️ Vider</button>

  <div id="logBox"></div>

</div>

<script>
(function() {
  'use strict';

  var ADSTERRA_KEY = 'c8e9df92013d3020593ad443d2530ad4';
  var ADSTERRA_SCRIPT_URL = 'https://bluntutilities.com/c8e9df92013d3020593ad443d2530ad4/invoke.js';

  var logEl = document.getElementById('logBox');
  var statusEl = document.getElementById('status');
  var statusTxt = document.getElementById('statusText');
  var counter1 = document.getElementById('counter1');
  var counter2 = document.getElementById('counter2');
  var counter3 = document.getElementById('counter3');
  var card = document.getElementById('adsterraCard');
  var slot = document.getElementById('adsterraSlot');
  var containerId = 'container-' + ADSTERRA_KEY;

  function log(msg, cls) {
    cls = cls || '';
    var d = document.createElement('div');
    d.className = cls;
    var t = new Date().toLocaleTimeString('fr-FR');
    d.textContent = '[' + t + '] ' + msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(txt, cls, icon) {
    statusEl.className = 'status ' + cls;
    statusTxt.textContent = txt;
    statusEl.querySelector('span').textContent = icon;
  }

  function analyser() {
    var c = document.getElementById(containerId);
    if (!c) {
      counter1.textContent = 'Container absent';
      return null;
    }
    var enfants = c.children.length;
    var visibles = Array.from(c.children).filter(function(el) {
      return el.style.display !== 'none' && el.offsetHeight > 0;
    }).length;
    var htmlLen = c.innerHTML.length;
    counter1.textContent = 'Enfants: ' + enfants;
    counter2.textContent = 'Visibles: ' + visibles;
    counter3.textContent = 'HTML: ' + htmlLen + 'c';
    return { enfants: enfants, visibles: visibles, htmlLen: htmlLen };
  }

  // Ne masque QUE si plus de 1 enfant ET tous sont bien chargés
  function garderUneSeulePub() {
    var c = document.getElementById(containerId);
    if (!c) return false;
    var enfants = Array.from(c.children);
    if (enfants.length <= 1) return false;
    var nbMasques = 0;
    for (var i = 1; i < enfants.length; i++) {
      if (enfants[i].style.display !== 'none') {
        enfants[i].style.display = 'none';
        nbMasques++;
      }
    }
    if (nbMasques > 0) {
      log('🧹 ' + nbMasques + ' pub(s) masquée(s) → 1 seule reste', 'ok');
      analyser();
      return true;
    }
    return false;
  }

  log('Script démarré', 'dim');
  log('Key : ' + ADSTERRA_KEY, 'dim');
  log('Objectif : diagnostic + limitation à 1 pub', 'dim');

  var t0 = Date.now();

  // Observer : suit l'évolution du container
  var obs = new MutationObserver(function() {
    analyser();
  });
  obs.observe(slot, { childList: true, subtree: true });

  // Container + script Adsterra
  if (!slot.querySelector('#' + containerId)) {
    var c = document.createElement('div');
    c.id = containerId;
    slot.appendChild(c);
  }

  var s = document.createElement('script');
  s.type = 'text/javascript';
  s.async = true;
  s.setAttribute('data-cfasync', 'false');
  s.src = ADSTERRA_SCRIPT_URL;
  s.onerror = function() {
    log('❌ Script bloqué (AdBlock ?)', 'err');
    setStatus('Script bloqué — désactive AdBlock', 'err', '❌');
  };
  s.onload = function() {
    log('✅ invoke.js chargé', 'ok');
  };
  slot.appendChild(s);

  // Analyses progressives (diagnostic)
  [1000, 2500, 5000].forEach(function(delay) {
    setTimeout(function() {
      log('─── Analyse à ' + delay + 'ms ───', 'dim');
      var a = analyser();
      if (a) {
        log('  Enfants : ' + a.enfants + ' | Visibles : ' + a.visibles + ' | HTML : ' + a.htmlLen + 'c', 'dim');
        if (a.htmlLen > 100 && a.enfants === 0) {
          log('  ⚠️ Contenu présent mais PAS d\'enfants directs', 'warn');
          log('  → Adsterra utilise peut-être une structure imbriquée', 'warn');
        }
      }
    }, delay);
  });

  // Nettoyage progressif : démarre à 3s pour laisser Adsterra charger
  var attempts = 0;
  var iv = setInterval(function() {
    attempts++;
    // Attendre 3s avant de commencer à masquer
    if (attempts >= 12) {
      garderUneSeulePub();
    }
    if (attempts === 4 || attempts === 12 || attempts === 24 || attempts === 40) {
      analyser();
    }
    if (attempts >= 40) {
      clearInterval(iv);
      log('🏁 Nettoyage terminé après 10s', 'dim');
      var c = document.getElementById(containerId);
      if (!c) {
        setStatus('Container absent', 'err', '❌');
        return;
      }
      var visibles = Array.from(c.children).filter(function(el) {
        return el.style.display !== 'none' && el.offsetHeight > 0;
      }).length;
      var total = c.children.length;
      if (visibles === 1 && total >= 1) {
        setStatus('✅ 1 seule pub affichée (sur ' + total + ' reçues)', 'ok', '✅');
      } else if (visibles > 1) {
        setStatus(visibles + ' pubs affichées — nettoyage raté', 'warn', '⚠️');
      } else if (total === 0) {
        setStatus('Aucune pub reçue — attendre 5-10 min', 'err', '❌');
        log('Causes :', 'warn');
        log('1. Rate limit Adsterra (tu as testé trop souvent)', 'warn');
        log('2. AdBlock actif', 'warn');
        log('3. Pas de campagne dispo pour ta région', 'warn');
      } else {
        setStatus('Structure différente — voir logs', 'warn', '⚠️');
      }
    }
  }, 250);

  // Fallback : si vraiment rien après 6s, masquer la carte
  setTimeout(function() {
    var c = document.getElementById(containerId);
    var htmlLen = c ? c.innerHTML.length : 0;
    if (htmlLen < 100 && card) {
      log('❌ Rien chargé après 6s → carte masquée', 'err');
      card.style.display = 'none';
    }
  }, 6000);

  analyser();
})();
</script>

</body>
</html>

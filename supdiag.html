body{

.app{max-width:520px;margin:0 auto;padding:1.1rem .75rem 4rem}

.card{
background:linear-gradient(180deg,#ffffff 0%,#fbfcfe 100%);

0 1px 0 rgba(255,255,255,.9) inset,
0 -1px 0 rgba(10,28,51,.04) inset,
0 10px 30px rgba(10,28,51,.12),
0 3px 8px rgba(10,28,51,.06);
overflow:hidden;
border:1px solid rgba(10,28,51,.06);
position:relative;
}
.card::before{
content:"";
position:absolute;inset:0;
border-radius:18px;
padding:1px;
background:linear-gradient(140deg,rgba(201,162,74,.55),rgba(201,162,74,0) 30%,rgba(10,28,51,0) 70%,rgba(201,162,74,.35));
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
-webkit-mask-composite:xor;
mask-composite:exclude;
pointer-events:none;
}

.card-head{
padding:1.15rem 1.15rem .85rem;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:space-between;
background:linear-gradient(180deg,#ffffff 0%,#f7f9fc 100%);
}
.card-head h1{
font-size:1.08rem;
font-weight:800;
color:var(--navy);
letter-spacing:-.01em;
display:flex;align-items:center;gap:.55rem;
}
.card-head h1::before{
content:"";
width:5px;height:18px;border-radius:3px;
background:linear-gradient(180deg,var(--gold-2),var(--gold-3));
box-shadow:0 0 0 1px rgba(138,107,31,.15) inset;
}
.card-head .year{
font-size:.68rem;
font-weight:800;
letter-spacing:.18em;
color:var(--navy-3);
text-transform:uppercase;
background:linear-gradient(180deg,#f1f5fb,#e6edf6);
padding:.35rem .7rem;
border-radius:30px;
border:1px solid rgba(10,28,51,.06);
box-shadow:0 1px 0 rgba(255,255,255,.9) inset;
}

.weekdays{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:4px;
padding:.85rem .7rem .4rem;
}
.weekdays span{
text-align:center;
font-size:.66rem;
font-weight:800;
color:var(--muted);
text-transform:uppercase;
letter-spacing:.08em;
}

.days{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:4px;
padding:.25rem .7rem 1rem;
}

.day{
aspect-ratio:1/1;
border-radius:10px;
background:linear-gradient(180deg,#ffffff 0%,#eef2f7 100%);
border:1px solid rgba(10,28,51,.08);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:.22rem;
cursor:pointer;
transition:transform .14s cubic-bezier(.22,.8,.22,1),box-shadow .18s ease,background .18s ease;
position:relative;
padding:2px;
box-shadow:
0 1px 0 rgba(255,255,255,.95) inset,
0 -2px 4px rgba(10,28,51,.05) inset,
0 2px 3px rgba(10,28,51,.06),
0 4px 8px rgba(10,28,51,.04);
}
.day:hover{
background:linear-gradient(180deg,#ffffff 0%,#e5ebf3 100%);
box-shadow:
0 1px 0 rgba(255,255,255,.95) inset,
0 -2px 4px rgba(10,28,51,.06) inset,
0 4px 8px rgba(10,28,51,.10),
0 8px 18px rgba(10,28,51,.08);
transform:translateY(-2px);
}
.day:active{
transform:translateY(0) scale(.96);
box-shadow:
0 1px 0 rgba(255,255,255,.9) inset,
0 -1px 2px rgba(10,28,51,.06) inset,
0 1px 2px rgba(10,28,51,.08);
}
.day.empty{
background:transparent;
border:none;
box-shadow:none;
pointer-events:none;
}
.day .num{
font-size:.86rem;
font-weight:700;
color:var(--navy);
line-height:1;
letter-spacing:-.01em;
text-shadow:0 1px 0 rgba(255,255,255,.9);
}
.day.weekend .num{color:#96a3b5}
.day.has-event{
background:linear-gradient(180deg,#ffffff 0%,#e9eef6 100%);
border-color:rgba(10,28,51,.12);
}
.day .dot{
width:7px;height:7px;border-radius:50%;
background:var(--accent);
box-shadow:0 0 0 2px rgba(255,255,255,.9),0 2px 3px rgba(10,28,51,.18);
}
.day .dot.reunion{background:linear-gradient(180deg,#3a6ea8,#1f4a7d)}
.day .dot.b{background:linear-gradient(180deg,#1e9379,#0d5c4a)}
.day .dot.g{background:linear-gradient(180deg,#e0a747,#9b5e0a)}
.day .dot.p{background:linear-gradient(180deg,#7d3fa0,#4a1f6b)}
.day .dot.bilan{background:linear-gradient(180deg,#b23a3a,#7a1f1f)}

.day.today{
background:linear-gradient(160deg,#1c4472 0%,#0a1c33 100%);
border-color:#8a6b1f;
box-shadow:
0 1px 0 rgba(232,200,118,.35) inset,
0 -2px 6px rgba(0,0,0,.4) inset,
0 6px 14px rgba(10,28,51,.35),
0 0 0 1px rgba(201,162,74,.55),
0 0 20px rgba(201,162,74,.25);
}
.day.today::after{
content:"";
position:absolute;inset:1px;
border-radius:9px;
background:linear-gradient(180deg,rgba(232,200,118,.18),transparent 55%);
pointer-events:none;
}
.day.today .num{
color:var(--gold-2);
font-weight:800;
text-shadow:0 1px 0 rgba(0,0,0,.5);
}
.day.today .dot{
background:var(--gold-2);
box-shadow:0 0 0 2px rgba(255,255,255,.15),0 0 8px rgba(232,200,118,.7);

.legend{
display:flex;flex-wrap:wrap;
gap:.5rem 1rem;
padding:.9rem 1.15rem 1.1rem;
border-top:1px solid var(--line);
background:linear-gradient(180deg,#fbfcfe 0%,#f2f5fa 100%);
}
.legend span{
display:inline-flex;align-items:center;gap:.4rem;
font-size:.72rem;font-weight:600;
color:var(--muted);
letter-spacing:.01em;

.legend i{
width:9px;height:9px;border-radius:50%;

box-shadow:0 1px 2px rgba(10,28,51,.18);

.backdrop{
position:fixed;inset:0;
background:rgba(10,28,51,.55);

}
.backdrop.open{opacity:1;pointer-events:auto}

.sheet{

transition:transform .34s cubic-bezier(.22,.8,.22,1);
z-index:100;

0 -1px 0 rgba(232,200,118,.4) inset,
0 -14px 40px rgba(10,28,51,.35);

content:"";

}
.sheet.open{transform:translateY(0)}
.sheet-handle-wrap{
position:sticky;top:0;

.sheet-handle{

.sheet-content{padding:.5rem 1.35rem 1rem}
.sheet-eyebrow{

.sheet-title{

.sheet-tag.b{background:linear-gradient(180deg,#e0f0ea,#cbe55c4a}

.sheet-tag.p{background:linear-gradient(180deg,#eee0f5,#decce9);color:#4a1f6b}
.sheet-tag.bilan{background:linear-gradient(180deg,#f8dede,#efc9c9);color:#7a1f1f}

color:#fff;
border-color:var(--gold-3);
text-shadow:0 1px 0 rgba(0,0,0,.25);
box-shadow:0 2px 8px rgba(201,162,74,.35);
}

.block{
background:linear-gradient(180deg,#ffffff 0%,#f3f6fa 100%);
border-radius:12px;
padding:1rem 1.1rem;
margin-bottom:.7rem;
border:1px solid rgba(10,28,51,.06);
box-shadow:
0 1px 0 rgba(255,255,255,.9) inset,
0 2px 6px rgba(10,28,51,.05);
position:relative;
overflow:hidden;
}
.block::before{
content:"";

}
.block.briefing::before{background:linear-gradient(180deg,#8ea2bb,#4a5b73)}
.block.diag::before{background:linear-gradient(180deg,#e0a747,#8a6b1f)}
.block.support::before{background:linear-gradient(180deg,#1e9379,#0d5c4a)}
.block.bilan::before{background:linear-gradient(180deg,#b23a3a,#7a1f1f)}
.block.reunion::before{background:linear-gradient(180deg,#3a6ea8,#1f4a7d)}

.block .lbl{
font-size:.66rem;font-weight:800;letter-spacing:.14em;
text-transform:uppercase;margin-bottom:.4rem;
display:flex;align-items:center;gap:.45rem;
}
.block.briefing .lbl{color:#4a5b73}
.block.diag .lbl{color:#8a6b1f}
.block.support .lbl{color:#0d5c4a}
.block.bilan .lbl{color:#7a1f1f}
.block.reunion .lbl{color:#1f4a7d}
.block .lbl small{
font-weight:600;font-size:.68rem;letter-spacing:.04em;
color:var(--muted);text-transform:none;
margin-left:auto;
}
.block p{
font-size:.9rem;color:var(--text);
line-height:1.55;font-weight:500;
}
.block p strong{font-weight:700;color:var(--navy)}

.sheet-close{
margin-top:.75rem;width:100%;
padding:.9rem;
border-radius:12px;
background:linear-gradient(180deg,#1c4472,#0a1c33);
color:var(--gold-2);
font-size:.92rem;font-weight:800;
letter-spacing:.05em;
border:none;cursor:pointer;
transition:transform .12s ease,box-shadow .15s ease;
box-shadow:
0 1px 0 rgba(232,200,118,.25) inset,
0 4px 10px rgba(10,28,51,.28);
}
.sheet-close:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(232,200,118,.25) inset,0 6px 14px rgba(10,28,51,.35)}
.sheet-close:active{transform:translateY(0) scale(.98)}

@media (min-width:600px){
.app{padding:1.5rem 1rem 4rem}
.card-head h1{font-size:1.15rem}
.day .num{font-size:.95rem}
.sheet-title{font-size:1.55rem}
}
</style>
</head>

var info=data[iso];
if(info) cell.classList.add('has-event');
var inner='<span class="num">'+d+'</span>';
if(info) inner+='<span class="dot '+info.tag+'"></span>';
cell.innerHTML=inner;
if(iso===todayISO) cell.classList.add('today');
days.appendChild(cell);
}

var backdrop=document.getElementById('backdrop');
var sheet=document.getElementById('sheet');
var eyebrow=document.getElementById('sheet-eyebrow');
var title=document.getElementById('sheet-title');
var tagEl=document.getElementById('sheet-tag');
var bodyEl=document.getElementById('sheet-body');
var closeBtn=document.getElementById('sheet-close');

function openSheet(iso){
var info=data[iso];
if(!info) return;
eyebrow.textContent=info.tagLabel+(iso===todayISO?' · Aujourd\'hui':'');
title.textContent=info.t;
var cls='sheet-tag '+info.tag;
if(iso===todayISO) cls+=' today';
tagEl.innerHTML='<span class="'+cls+'">'+info.tagLabel+'</span>';
var html='';
if(info.tag==='reunion'){
html+='<div class="block reunion"><div class="lbl">Équipe Support &amp; Équipe Diagnostic<small>09h00 – 12h00</small></div><p><strong>Grande réunion hebdomadaire.</strong> Préparation de la semaine, coordination entre les deux équipes et définition des priorités.</p></div>';
}else if(info.tag==='bilan'){
html+='<div class="block bilan"><div class="lbl">Équipe Support &amp; Équipe Diagnostic<small>Journée bilan</small></div><p>Bilan mensuel et suivi des anomalies ouvertes : revue des dossiers, clôture des cas résolus et planification des actions restantes.</p></div>';
}else{
html+='<div class="block briefing"><div class="lbl">Briefing quotidien<small>08h30 – 09h30</small></div><p>'+briefing+'</p></div>';
html+='<div class="block diag"><div class="lbl">Équipe Diagnostic<small>09h30 – 11h30</small></div><p>'+info.diag+'</p></div>';
html+='<div class="block support"><div class="lbl">Équipe Support<small>09h30 – 16h00</small></div><p>'+info.support+'</p></div>';
}
bodyEl.innerHTML=html;
backdrop.classList.add('open');
sheet.classList.add('open');
document.body.style.overflow='hidden';
}

function closeSheet(){
backdrop.classList.remove('open');
sheet.classList.remove('open');
document.body.style.overflow='';
}

days.addEventListener('click',function(e){
var cell=e.target.closest('.day');
if(!cell||cell.classList.contains('empty')) return;
openSheet(cell.getAttribute('data-date'));
});

backdrop.addEventListener('click',closeSheet);
closeBtn.addEventListener('click',closeSheet);

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#0a1c33">
<title>NETUBEX · Octobre 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--navy:#0a1c33;
--navy-2:#122f52;
--navy-3:#1c4472;
--gold:#c9a24a;
--gold-2:#e8c876;
--gold-3:#8a6b1f;
--bg:#eef1f6;
--card:#ffffff;
--card-2:#fbfcfe;
--text:#0b1c33;
--muted:#68788c;
--line:#e2e7ef;
--accent:#1e7e6c;
--accent-2:#c47b1e;
--accent-3:#5e2a7a;
--danger:#8c2a2a;
}
html.dark{
--bg:#0a1320;
--card:#101d2f;
--card-2:#0d1828;
--text:#e7edf5;
--muted:#8b9ab0;
--line:#1e2d44;
}
html{scroll-behavior:smooth}
body{
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,Helvetica,Arial,sans-serif;
background:var(--bg);
color:var(--text);
-webkit-font-smoothing:antialiased;
font-size:15px;
line-height:1.4;
min-height:100vh;
padding:0 0 env(safe-area-inset-bottom);
transition:background .3s ease,color .3s ease;
}

.gate{
position:fixed;inset:0;
background:
radial-gradient(circle at 30% 20%,rgba(201,162,74,.18),transparent 55%),
linear-gradient(160deg,#0a1c33 0%,#0d2646 100%);
display:flex;align-items:center;justify-content:center;
padding:1.5rem;
z-index:1000;
transition:opacity .4s ease,visibility .4s ease;
}
.gate.hidden{opacity:0;visibility:hidden;pointer-events:none}
.gate-box{
width:100%;max-width:360px;
background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
border:1px solid rgba(201,162,74,.35);
border-radius:22px;
padding:2rem 1.5rem 1.75rem;
box-shadow:
0 1px 0 rgba(232,200,118,.2) inset,
0 20px 60px rgba(0,0,0,.55);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
text-align:center;
}
.gate-logo{
width:64px;height:64px;
margin:0 auto 1.25rem;
border-radius:18px;
background:linear-gradient(160deg,#1c4472,#0a1c33);
border:1px solid rgba(232,200,118,.5);
display:flex;align-items:center;justify-content:center;
font-size:1.6rem;font-weight:800;color:var(--gold-2);
letter-spacing:.02em;
box-shadow:
0 1px 0 rgba(232,200,118,.35) inset,
0 8px 20px rgba(0,0,0,.4);
text-shadow:0 1px 0 rgba(0,0,0,.4);
}
.gate h2{
font-size:1.15rem;font-weight:800;
color:#fff;letter-spacing:-.01em;margin-bottom:.35rem;
}
.gate p{
font-size:.82rem;color:#a8c8e8;
margin-bottom:1.5rem;line-height:1.5;
}
.gate-input{
width:100%;
padding:1rem;
font-size:1.4rem;font-weight:700;
letter-spacing:.6em;
text-align:center;
background:rgba(0,0,0,.35);
border:1px solid rgba(201,162,74,.4);
border-radius:14px;
color:var(--gold-2);
outline:none;
transition:border-color .2s ease,box-shadow .2s ease;
font-family:inherit;
}
.gate-input::placeholder{color:rgba(232,200,118,.25);letter-spacing:.4em}
.gate-input:focus{
border-color:var(--gold-2);
box-shadow:0 0 0 3px rgba(232,200,118,.18);
}
.gate-btn{
margin-top:1rem;width:100%;
padding:1rem;
border-radius:14px;
background:linear-gradient(180deg,var(--gold-2),var(--gold-3));
color:#1a1200;
font-weight:800;font-size:.95rem;
letter-spacing:.08em;text-transform:uppercase;
border:none;cursor:pointer;
box-shadow:
0 1px 0 rgba(255,255,255,.4) inset,
0 6px 16px rgba(201,162,74,.35);
transition:transform .12s ease,box-shadow .15s ease;
}
.gate-btn:hover{transform:translateY(-1px)}
.gate-btn:active{transform:translateY(0) scale(.98)}
.gate-err{
margin-top:.85rem;
font-size:.78rem;font-weight:600;
color:#ff8a8a;
min-height:1.1em;
}

.app{
max-width:520px;margin:0 auto;
padding:1.1rem .75rem 4rem;
display:none;
}
.app.show{display:block}

.toolbar{
display:flex;align-items:center;justify-content:space-between;
gap:.5rem;margin-bottom:.85rem;
padding:0 .15rem;
}
.view-tabs{
display:flex;gap:.25rem;
background:var(--card);
border:1px solid var(--line);
padding:.25rem;
border-radius:12px;
box-shadow:0 1px 2px rgba(10,28,51,.06);
}
.view-tabs button{
padding:.5rem .85rem;
font-size:.78rem;font-weight:700;
color:var(--muted);
background:transparent;
border:none;border-radius:9px;
cursor:pointer;
transition:all .15s ease;
font-family:inherit;
letter-spacing:.02em;
}
.view-tabs button.active{
background:linear-gradient(180deg,var(--navy-3),var(--navy));
color:var(--gold-2);
box-shadow:0 2px 6px rgba(10,28,51,.25);
}
.icon-btn{
width:38px;height:38px;
border-radius:10px;
background:var(--card);
border:1px solid var(--line);
display:flex;align-items:center;justify-content:center;
cursor:pointer;
color:var(--navy-3);
transition:all .15s ease;
box-shadow:0 1px 2px rgba(10,28,51,.06);
}
html.dark .icon-btn{color:var(--gold-2)}
.icon-btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(10,28,51,.12)}
.icon-btn:active{transform:translateY(0) scale(.96)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.banner{
background:linear-gradient(135deg,rgba(201,162,74,.12),rgba(10,28,51,.04));
border:1px solid rgba(201,162,74,.35);
border-radius:14px;
padding:.9rem 1rem;
margin-bottom:.85rem;
display:flex;align-items:center;gap:.75rem;
box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 3px 10px rgba(10,28,51,.06);
}
html.dark .banner{background:linear-gradient(135deg,rgba(201,162,74,.14),rgba(255,255,255,.02));box-shadow:0 1px 0 rgba(232,200,118,.15) inset,0 3px 10px rgba(0,0,0,.3)}
.banner-dot{
width:10px;height:10px;border-radius:50%;
background:var(--gold-2);
box-shadow:0 0 10px rgba(232,200,118,.8);
flex-shrink:0;
animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.85)}}
.banner-text{flex:1;min-width:0}
.banner-text .lbl{
font-size:.62rem;font-weight:800;letter-spacing:.15em;
color:var(--gold-3);text-transform:uppercase;
margin-bottom:.15rem;
}
html.dark .banner-text .lbl{color:var(--gold-2)}
.banner-text .val{
font-size:.88rem;font-weight:700;color:var(--navy);
line-height:1.3;
}
html.dark .banner-text .val{color:var(--text)}

.progress{
background:var(--card);
border:1px solid var(--line);
border-radius:14px;
padding:.85rem 1rem;
margin-bottom:1rem;
box-shadow:0 1px 2px rgba(10,28,51,.05);
}
.progress-head{
display:flex;justify-content:space-between;align-items:baseline;
margin-bottom:.5rem;
}
.progress-head .lbl{
font-size:.68rem;font-weight:800;letter-spacing:.12em;
color:var(--muted);text-transform:uppercase;
}
.progress-head .num{
font-size:.82rem;font-weight:800;color:var(--navy);
}
html.dark .progress-head .num{color:var(--gold-2)}
.progress-bar{
height:8px;border-radius:6px;
background:#e6ecf4;
overflow:hidden;
box-shadow:0 1px 2px rgba(10,28,51,.08) inset;
}
html.dark .progress-bar{background:#1a2b45}
.progress-fill{
height:100%;
background:linear-gradient(90deg,var(--navy-3),var(--gold));
border-radius:6px;
transition:width .6s cubic-bezier(.22,.8,.22,1);
box-shadow:0 0 8px rgba(201,162,74,.4);
}

.card{
background:linear-gradient(180deg,var(--card) 0%,var(--card-2) 100%);
border-radius:18px;
box-shadow:
0 1px 0 rgba(255,255,255,.9) inset,
0 -1px 0 rgba(10,28,51,.04) inset,
0 10px 30px rgba(10,28,51,.12),
0 3px 8px rgba(10,28,51,.06);
overflow:hidden;
border:1px solid rgba(10,28,51,.06);
position:relative;
}
html.dark .card{
box-shadow:
0 1px 0 rgba(232,200,118,.12) inset,
0 -1px 0 rgba(0,0,0,.4) inset,
0 10px 30px rgba(0,0,0,.5),
0 3px 8px rgba(0,0,0,.3);
border-color:rgba(201,162,74,.15);
}
.card::before{
content:"";position:absolute;inset:0;
border-radius:18px;padding:1px;
background:linear-gradient(140deg,rgba(201,162,74,.55),rgba(201,162,74,0) 30%,rgba(10,28,51,0) 70%,rgba(201,162,74,.35));
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
-webkit-mask-composite:xor;mask-composite:exclude;
pointer-events:none;
}

.card-head{
padding:1.15rem 1.15rem .85rem;
border-bottom:1px solid var(--line);
display:flex;align-items:center;justify-content:space-between;
background:linear-gradient(180deg,var(--card) 0%,var(--card-2) 100%);
}
.card-head h1{
font-size:1.08rem;font-weight:800;color:var(--navy);
letter-spacing:-.01em;display:flex;align-items:center;gap:.55rem;
}
html.dark .card-head h1{color:var(--gold-2)}
.card-head h1::before{
content:"";width:5px;height:18px;border-radius:3px;
background:linear-gradient(180deg,var(--gold-2),var(--gold-3));
box-shadow:0 0 0 1px rgba(138,107,31,.15) inset;
}
.card-head .year{
font-size:.68rem;font-weight:800;letter-spacing:.18em;
color:var(--navy-3);text-transform:uppercase;
background:linear-gradient(180deg,#f1f5fb,#e6edf6);
padding:.35rem .7rem;border-radius:30px;
border:1px solid rgba(10,28,51,.06);
box-shadow:0 1px 0 rgba(255,255,255,.9) inset;
}
html.dark .card-head .year{
background:linear-gradient(180deg,#152a47,#0f2138);
color:var(--gold-2);
border-color:rgba(201,162,74,.25);
box-shadow:0 1px 0 rgba(232,200,118,.15) inset;
}

.weekdays{
display:grid;grid-template-columns:repeat(7,1fr);
gap:4px;padding:.85rem .7rem .4rem;
}
.weekdays span{
text-align:center;font-size:.66rem;font-weight:800;
color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
}

.days{
display:grid;grid-template-columns:repeat(7,1fr);
gap:4px;padding:.25rem .7rem 1rem;
}

.day{
aspect-ratio:1/1;border-radius:10px;
background:linear-gradient(180deg,var(--card) 0%,#eef2f7 100%);
border:1px solid rgba(10,28,51,.08);
display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:.22rem;cursor:pointer;
transition:transform .14s cubic-bezier(.22,.8,.22,1),box-shadow .18s ease,background .18s ease;
position:relative;padding:2px;
box-shadow:
0 1px 0 rgba(255,255,255,.95) inset,
0 -2px 4px rgba(10,28,51,.05) inset,
0 2px 3px rgba(10,28,51,.06),
0 4px 8px rgba(10,28,51,.04);
}
html.dark .day{
background:linear-gradient(180deg,#152642 0%,#0f1e36 100%);
border-color:rgba(201,162,74,.12);
box-shadow:
0 1px 0 rgba(232,200,118,.10) inset,
0 -2px 4px rgba(0,0,0,.4) inset,
0 2px 3px rgba(0,0,0,.35),
0 4px 8px rgba(0,0,0,.25);
}
.day:hover{
background:linear-gradient(180deg,var(--card) 0%,#e5ebf3 100%);
box-shadow:
0 1px 0 rgba(255,255,255,.95) inset,
0 -2px 4px rgba(10,28,51,.06) inset,
0 4px 8px rgba(10,28,51,.10),
0 8px 18px rgba(10,28,51,.08);
transform:translateY(-2px);
}
html.dark .day:hover{
background:linear-gradient(180deg,#1a2d4d 0%,#132441 100%);
box-shadow:
0 1px 0 rgba(232,200,118,.15) inset,
0 -2px 4px rgba(0,0,0,.4) inset,
0 4px 8px rgba(0,0,0,.4),
0 8px 18px rgba(0,0,0,.3);
}
.day:active{transform:translateY(0) scale(.96)}
.day.empty{background:transparent;border:none;box-shadow:none;pointer-events:none}
.day.dimmed{opacity:.28;filter:grayscale(1)}
.day .num{
font-size:.86rem;font-weight:700;
color:var(--navy);line-height:1;
letter-spacing:-.01em;
text-shadow:0 1px 0 rgba(255,255,255,.9);
}
html.dark .day .num{color:var(--text);text-shadow:none}
.day.weekend .num{color:#96a3b5}
.day.has-event{
background:linear-gradient(180deg,var(--card) 0%,#e9eef6 100%);
border-color:rgba(10,28,51,.12);
}
html.dark .day.has-event{
background:linear-gradient(180deg,#1a2d4d 0%,#132441 100%);
border-color:rgba(201,162,74,.22);
}
.day .dot{
width:7px;height:7px;border-radius:50%;
background:var(--accent);
box-shadow:0 0 0 2px rgba(255,255,255,.9),0 2px 3px rgba(10,28,51,.18);
}
html.dark .day .dot{box-shadow:0 0 0 2px rgba(16,29,47,.9),0 2px 3px rgba(0,0,0,.5)}
.day .dot.reunion{background:linear-gradient(180deg,#3a6ea8,#1f4a7d)}
.day .dot.b{background:linear-gradient(180deg,#1e9379,#0d5c4a)}
.day .dot.g{background:linear-gradient(180deg,#e0a747,#9b5e0a)}
.day .dot.p{background:linear-gradient(180deg,#7d3fa0,#4a1f6b)}
.day .dot.bilan{background:linear-gradient(180deg,#b23a3a,#7a1f1f)}

.day.today{
background:linear-gradient(160deg,#1c4472 0%,#0a1c33 100%);
border-color:#8a6b1f;
box-shadow:
0 1px 0 rgba(232,200,118,.35) inset,
0 -2px 6px rgba(0,0,0,.4) inset,
0 6px 14px rgba(10,28,51,.35),
0 0 0 1px rgba(201,162,74,.55),
0 0 20px rgba(201,162,74,.25);
}
.day.today::after{
content:"";position:absolute;inset:1px;border-radius:9px;
background:linear-gradient(180deg,rgba(232,200,118,.18),transparent 55%);
pointer-events:none;
}
.day.today .num{color:var(--gold-2);font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.day.today .dot{background:var(--gold-2);box-shadow:0 0 0 2px rgba(255,255,255,.15),0 0 8px rgba(232,200,118,.7)}

.week-strip{
display:grid;grid-template-columns:repeat(7,1fr);
gap:6px;padding:1rem .7rem;
}
.week-col{
border-radius:12px;
background:linear-gradient(180deg,var(--card) 0%,#eef2f7 100%);
border:1px solid rgba(10,28,51,.08);
padding:.7rem .4rem;
text-align:center;
cursor:pointer;
transition:transform .14s ease,box-shadow .18s ease;
box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 3px 8px rgba(10,28,51,.06);
min-height:150px;
display:flex;flex-direction:column;gap:.4rem;
}
html.dark .week-col{
background:linear-gradient(180deg,#152642 0%,#0f1e36 100%);
border-color:rgba(201,162,74,.12);
box-shadow:0 1px 0 rgba(232,200,118,.10) inset,0 3px 8px rgba(0,0,0,.3);
}
.week-col:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(10,28,51,.12)}
.week-col.today{
background:linear-gradient(160deg,#1c4472,#0a1c33);
border-color:var(--gold-3);
box-shadow:0 0 0 1px rgba(201,162,74,.5),0 6px 14px rgba(10,28,51,.35);
}
.week-col .wd{
font-size:.62rem;font-weight:800;letter-spacing:.1em;
color:var(--muted);text-transform:uppercase;
}
.week-col.today .wd{color:var(--gold-2)}
.week-col .dn{
font-size:1.15rem;font-weight:800;color:var(--navy);line-height:1;
}
html.dark .week-col .dn{color:var(--text)}
.week-col.today .dn{color:var(--gold-2);text-shadow:0 1px 0 rgba(0,0,0,.5)}
.week-col .tag{
font-size:.6rem;font-weight:700;padding:.25rem .35rem;
border-radius:6px;line-height:1.15;
margin-top:auto;
}
.week-col .tag.reunion{background:rgba(44,91,145,.15);color:#2c5b91}
.week-col .tag.b{background:rgba(13,92,74,.15);color:#0d5c4a}
.week-col .tag.g{background:rgba(196,123,30,.18);color:#9b5e0a}
.week-col .tag.p{background:rgba(94,42,122,.15);color:var(--accent-3)}
.week-col .tag.bilan{background:rgba(140,42,42,.15);color:var(--danger)}
.week-col.today .tag{background:rgba(232,200,118,.2);color:var(--gold-2)}
.week-col .tag.none{background:transparent;color:transparent}

.day-view{padding:1.5rem 1.25rem}
.day-view .dv-eyebrow{
font-size:.66rem;font-weight:800;letter-spacing:.16em;
color:var(--muted);text-transform:uppercase;margin-bottom:.4rem;
}
.day-view .dv-title{
font-size:1.5rem;font-weight:800;color:var(--navy);
letter-spacing:-.02em;line-height:1.15;margin-bottom:1.25rem;
}
html.dark .day-view .dv-title{color:var(--text)}
.day-nav{
display:flex;justify-content:space-between;align-items:center;
margin-bottom:1rem;gap:.5rem;
}
.day-nav button{
flex:1;padding:.55rem;border-radius:10px;
background:var(--card);border:1px solid var(--line);
color:var(--navy);font-weight:700;font-size:.78rem;
cursor:pointer;font-family:inherit;
transition:all .15s ease;
box-shadow:0 1px 2px rgba(10,28,51,.05);
}
html.dark .day-nav button{color:var(--gold-2)}
.day-nav button:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(10,28,51,.1)}
.day-nav button:disabled{opacity:.35;cursor:not-allowed;transform:none}

.filters{
display:flex;flex-wrap:wrap;gap:.4rem;
padding:.9rem 1rem 1rem;
border-top:1px solid var(--line);
background:linear-gradient(180deg,var(--card-2) 0%,var(--card) 100%);
}
.filter{
display:inline-flex;align-items:center;gap:.4rem;
font-size:.72rem;font-weight:700;
padding:.45rem .8rem;border-radius:30px;
background:var(--card);border:1px solid var(--line);
color:var(--muted);cursor:pointer;
transition:all .15s ease;font-family:inherit;
box-shadow:0 1px 2px rgba(10,28,51,.04);
}
.filter:hover{transform:translateY(-1px)}
.filter.active{
background:linear-gradient(180deg,#1c4472,#0a1c33);
color:var(--gold-2);
border-color:rgba(201,162,74,.5);
box-shadow:0 0 0 1px rgba(201,162,74,.35),0 2px 6px rgba(10,28,51,.25);
}
.filter i{
width:7px;height:7px;border-radius:50%;display:inline-block;
font-style:normal;
}
.filter i.reunion{background:#2c5b91}
.filter i.b{background:#0d5c4a}
.filter i.g{background:var(--accent-2)}
.filter i.p{background:var(--accent-3)}
.filter i.bilan{background:var(--danger)}

.backdrop{
position:fixed;inset:0;
background:rgba(10,28,51,.55);
backdrop-filter:blur(3px);
-webkit-backdrop-filter:blur(3px);
opacity:0;pointer-events:none;
transition:opacity .25s ease;
z-index:90;
}
.backdrop.open{opacity:1;pointer-events:auto}

.sheet{
position:fixed;left:0;right:0;bottom:0;
background:linear-gradient(180deg,var(--card) 0%,var(--card-2) 100%);
border-radius:22px 22px 0 0;
padding:0 0 calc(1.35rem + env(safe-area-inset-bottom));
transform:translateY(100%);
transition:transform .34s cubic-bezier(.22,.8,.22,1);
z-index:100;max-width:520px;margin:0 auto;
box-shadow:
0 -1px 0 rgba(232,200,118,.4) inset,
0 -14px 40px rgba(10,28,51,.35);
max-height:85vh;overflow-y:auto;
-webkit-overflow-scrolling:touch;
}
.sheet::before{
content:"";display:block;height:3px;
background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold-2) 50%,var(--gold) 80%,transparent);
}
.sheet.open{transform:translateY(0)}
.sheet-handle-wrap{
position:sticky;top:0;
background:linear-gradient(180deg,var(--card) 0%,var(--card-2) 100%);
padding:.85rem 1.35rem .35rem;z-index:2;
}
.sheet-handle{
width:42px;height:4px;border-radius:4px;
background:linear-gradient(90deg,#c9d3e0,#8ea2bb);
margin:0 auto;
}
html.dark .sheet-handle{background:linear-gradient(90deg,#3a4f6e,#1e2d44)}
.sheet-content{padding:.5rem 1.35rem 1rem}
.sheet-eyebrow{
font-size:.66rem;font-weight:800;letter-spacing:.16em;
color:var(--muted);text-transform:uppercase;margin-bottom:.35rem;
}
.sheet-title{
font-size:1.4rem;font-weight:800;color:var(--navy);
letter-spacing:-.02em;line-height:1.2;margin-bottom:.9rem;
}
html.dark .sheet-title{color:var(--text)}
.sheet-tag{
display:inline-flex;align-items:center;gap:.4rem;
font-size:.68rem;font-weight:800;letter-spacing:.08em;
padding:.38rem .85rem;border-radius:30px;
text-transform:uppercase;margin-bottom:1.1rem;

}
}else{
html+='<div class="block briefing"><div class="lbl">Journée sans activité planifiée</div><p>Aucune descente, réunion ou bilan prévu ce jour.</p></div>';
}
dvBody.innerHTML=html;
}

var dayPrev=document.getElementById('dayPrev');
var dayNext=document.getElementById('dayNext');

function shiftDay(delta){
var dd=new Date(currentDayISO+'T12:00:00');
dd.setDate(dd.getDate()+delta);
if(dd.getMonth()===9&&dd.getFullYear()===2026&&dd.getDate()>=1&&dd.getDate()<=31){
currentDayISO=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
renderDayView();
}
}
dayPrev.addEventListener('click',function(){shiftDay(-1);});
dayNext.addEventListener('click',function(){shiftDay(1);});

var viewTabs=document.querySelectorAll('#viewTabs button');
var viewMonth=document.getElementById('viewMonth');
var viewWeek=document.getElementById('viewWeek');
var viewDay=document.getElementById('viewDay');

function setView(v){
currentView=v;
viewTabs.forEach(function(b){b.classList.toggle('active',b.getAttribute('data-view')===v);});
viewMonth.style.display=v==='month'?'block':'none';
viewWeek.style.display=v==='week'?'block':'none';
viewDay.style.display=v==='day'?'block':'none';
if(v==='week') renderWeek();
if(v==='day') renderDayView();
}
viewTabs.forEach(function(b){
b.addEventListener('click',function(){setView(this.getAttribute('data-view'));});
});

var filters=document.querySelectorAll('.filter');
filters.forEach(function(f){
f.addEventListener('click',function(){
filters.forEach(function(x){x.classList.remove('active');});
this.classList.add('active');
currentFilter=this.getAttribute('data-filter');
renderCalendar();
});
});

var backdrop=document.getElementById('backdrop');
var sheet=document.getElementById('sheet');
var eyebrow=document.getElementById('sheet-eyebrow');
var title=document.getElementById('sheet-title');
var tagEl=document.getElementById('sheet-tag');
var bodyEl=document.getElementById('sheet-body');
var closeBtn=document.getElementById('sheet-close');
var exportBtn=document.getElementById('exportBtn');
var toast=document.getElementById('toast');
var currentSheetISO=null;

function showToast(msg){
toast.textContent=msg;
toast.classList.add('show');
setTimeout(function(){toast.classList.remove('show');},2200);
}

function openSheet(iso){
var info=data[iso];
if(!info) return;
currentSheetISO=iso;
eyebrow.textContent=info.tagLabel+(iso===todayISO?' · Aujourd\'hui':'');
title.textContent=info.t;
var cls='sheet-tag '+info.tag;
if(iso===todayISO) cls+=' today';
tagEl.innerHTML='<span class="'+cls+'">'+info.tagLabel+'</span>';
var html='';
if(info.tag==='reunion'){
html+='<div class="block reunion"><div class="lbl">Équipe Support &amp; Équipe Diagnostic<small>09h00 – 12h00</small></div><p><strong>Grande réunion hebdomadaire.</strong> Préparation de la semaine, coordination entre les deux équipes et définition des priorités.</p></div>';
}else if(info.tag==='bilan'){
html+='<div class="block bilan"><div class="lbl">Équipe Support &amp; Équipe Diagnostic<small>Journée bilan</small></div><p>Bilan mensuel et suivi des anomalies ouvertes : revue des dossiers, clôture des cas résolus et planification des actions restantes.</p></div>';
}else{
html+='<div class="block briefing"><div class="lbl">Briefing quotidien<small>08h30 – 09h30</small></div><p>'+briefing+'</p></div>';
html+='<div class="block diag"><div class="lbl">Équipe Diagnostic<small>09h30 – 11h30</small></div><p>'+info.diag+'</p></div>';
html+='<div class="block support"><div class="lbl">Équipe Support<small>09h30 – 16h00</small></div><p>'+info.support+'</p></div>';
}
bodyEl.innerHTML=html;
backdrop.classList.add('open');
sheet.classList.add('open');
document.body.style.overflow='hidden';
}

function closeSheet(){
backdrop.classList.remove('open');
sheet.classList.remove('open');
document.body.style.overflow='';
currentSheetISO=null;
}

days.addEventListener('click',function(e){
var cell=e.target.closest('.day');
if(!cell||cell.classList.contains('empty')) return;
currentDayISO=cell.getAttribute('data-date');
openSheet(currentDayISO);
});

weekStrip.addEventListener('click',function(e){
var col=e.target.closest('.week-col');
if(!col) return;
currentDayISO=col.getAttribute('data-date');
openSheet(currentDayISO);
});

backdrop.addEventListener('click',closeSheet);
closeBtn.addEventListener('click',closeSheet);

function pad(n){return String(n).padStart(2,'0');}

function toICSDate(iso,h,m){
var d=new Date(iso+'T'+pad(h)+':'+pad(m)+':00');
return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';
}

function buildEvent(iso,info){
var uid='netubex-'+iso+'@netubex';
var dtstamp=new Date().toISOString().replace(/[-:.]/g,'').slice(0,15)+'Z';
var startH=8,startM=30,endH=16,endM=0;
if(info.tag==='reunion'){startH=9;startM=0;endH=12;endM=0;}
else if(info.tag==='bilan'){startH=8;startM=30;endH=16;endM=0;}
else{startH=8;startM=30;endH=16;endM=0;}
var summary='NETUBEX · '+info.tagLabel+' — '+info.t;
var desc='';
if(info.tag==='reunion'){
desc='Grande réunion hebdomadaire\\nParticipants : Équipe Support + Équipe Diagnostic\\n09h00 – 12h00';
}else if(info.tag==='bilan'){
desc='Bilan mensuel et suivi des anomalies ouvertes';
}else{
desc='Briefing 08h30–09h30\\nÉquipe Diagnostic : '+info.diag+'\\nÉquipe Support : '+info.support;
}
desc=desc.replace(/\n/g,'\\n');
var lines=[
'BEGIN:VEVENT',
'UID:'+uid,
'DTSTAMP:'+dtstamp,
'DTSTART:'+toICSDate(iso,startH,startM),
'DTEND:'+toICSDate(iso,endH,endM),
'SUMMARY:'+summary.replace(/,/g,'\\,'),
'DESCRIPTION:'+desc.replace(/,/g,'\\,'),
'LOCATION:NETUBEX',
'END:VEVENT'
];
return lines.join('\r\n');
}

function exportMonthICS(){
var lines=[
'BEGIN:VCALENDAR',
'VERSION:2.0',
'PRODID:-//NETUBEX//Feuille de route Octobre 2026//FR',
'CALSCALE:GREGORIAN',
'METHOD:PUBLISH'
];
Object.keys(data).sort().forEach(function(iso){
lines.push(buildEvent(iso,data[iso]));
});
lines.push('END:VCALENDAR');
var blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;
a.download='NETUBEX_Octobre_2026.ics';
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(url);},1000);
showToast('Fichier .ics exporté');
}

exportBtn.addEventListener('click',exportMonthICS);

function updateBanner(){
var nowD=new Date();
var upcoming=null;
var keys=Object.keys(data).sort();
for(var i=0;i<keys.length;i++){
var iso=keys[i];
var eventDate=new Date(iso+'T08:30:00');
if(eventDate>=nowD){
upcoming={iso:iso,info:data[iso],date:eventDate};
break;
}
}
var lbl=document.getElementById('bannerLbl');
var val=document.getElementById('bannerVal');
if(!upcoming){
lbl.textContent='Feuille de route';
val.textContent='Toutes les activités d\'octobre 2026 sont passées';
return;
}
var daysDiff=Math.ceil((upcoming.date-nowD)/(1000*60*60*24));
var when=daysDiff<=0?'Aujourd\'hui':daysDiff===1?'Demain':'Dans '+daysDiff+' jours';
lbl.textContent='Prochaine activité · '+when;
val.textContent=upcoming.info.tagLabel+' — '+upcoming.info.t;
}

function updateProgress(){
var keys=Object.keys(data).filter(function(iso){
var info=data[iso];
return info.tag==='b'||info.tag==='g'||info.tag==='p'||info.tag==='bilan';
});
var nowD=new Date();
var past=0;
Object.keys(data).forEach(function(iso){
if(data[iso].tag==='reunion') return;
var d=new Date(iso+'T23:59:59');
if(d<nowD) past++;
});
var total=keys.length;
var pct=Math.min(100,Math.round((past/total)*100));
document.getElementById('progNum').textContent=past+' / '+total;
document.getElementById('progFill').style.width=pct+'%';
}

function renderUpcoming(){
var list=document.getElementById('upcomingList');
var nowD=new Date();
var items=[];
Object.keys(data).sort().forEach(function(iso){
var d=new Date(iso+'T08:30:00');
if(d>=nowD) items.push({iso:iso,info:data[iso],date:d});
});
items=items.slice(0,5);
if(items.length===0){
list.innerHTML='<p style="font-size:.88rem;color:var(--muted);text-align:center;padding:1rem 0">Aucune activité à venir.</p>';
return;
}
var html='';
items.forEach(function(it){
var wdNames=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
var d=it.date;
var dateLabel=wdNames[d.getDay()]+' '+d.getDate()+' oct.';
html+='<div class="block" style="margin-bottom:.55rem;cursor:pointer" data-iso="'+it.iso+'">';
html+='<div class="lbl" style="color:var(--muted);font-size:.62rem">'+dateLabel+'</div>';
html+='<p style="font-size:.86rem"><strong>'+it.info.tagLabel+'</strong> — '+it.info.t.replace(/^(Lundi|Mardi|Mercredi|Jeudi|Vendredi)\s/,'')+'</p>';
html+='</div>';
});
list.innerHTML=html;
list.querySelectorAll('[data-iso]').forEach(function(el){
el.addEventListener('click',function(){openSheet(this.getAttribute('data-iso'));});
});
}

function initApp(){
setTheme(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);
renderCalendar();
updateBanner();
updateProgress();
renderUpcoming();
}

})();
</script>

</body>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

<title>NETUBEX · Octobre 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--fb-bg:#f0f2f5;
--fb-card:#ffffff;
--fb-text:#050505;
--fb-muted:#65676b;
--fb-border:#ced0d4;
--fb-blue:#1877f2;
--fb-hover:#f2f2f2;
--accent:#1e7e6c;
--accent-2:#c47b1e;
--accent-3:#5e2a7a;
--danger:#8c2a2a;
--navy:#0b2b4a;
}
html{scroll-behavior:smooth}
body{
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,Helvetica,Arial,sans-serif;
background:var(--fb-bg);
color:var(--fb-text);
-webkit-font-smoothing:antialiased;
font-size:15px;
line-height:1.4;
min-height:100vh;
padding:0 0 env(safe-area-inset-bottom);
}

.app{max-width:520px;margin:0 auto;padding:1rem .75rem 4rem}

.card{
background:var(--fb-card);
border-radius:12px;
box-shadow:0 1px 2px rgba(0,0,0,.10),0 2px 4px rgba(0,0,0,.04);
overflow:hidden;
}

.card-head{
padding:1rem 1rem .75rem;
border-bottom:1px solid #ebedf0;
display:flex;
align-items:center;
justify-content:space-between;
}
.card-head h1{
font-size:1.05rem;
font-weight:700;
color:var(--fb-text);
letter-spacing:-.01em;
}
.card-head .year{
font-size:.72rem;
font-weight:700;
letter-spacing:.12em;
color:var(--fb-muted);
text-transform:uppercase;
}

.weekdays{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:4px;
padding:.75rem .65rem .35rem;
}
.weekdays span{
text-align:center;
font-size:.68rem;
font-weight:700;
color:var(--fb-muted);
text-transform:uppercase;
letter-spacing:.04em;
}

.days{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:4px;
padding:.25rem .65rem .9rem;
}
.day{
aspect-ratio:1/1;
border-radius:8px;
background:#f7f8fa;
border:1px solid #e4e6eb;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:.22rem;
cursor:pointer;
transition:transform .12s ease,box-shadow .15s ease,background .15s ease;
position:relative;
padding:2px;
box-shadow:0 1px 0 rgba(0,0,0,.02) inset,0 -1px 0 rgba(0,0,0,.03) inset;
}
.day:hover{
background:#eef0f4;
box-shadow:0 2px 6px rgba(0,0,0,.08);
transform:translateY(-1px);
}
.day:active{transform:translateY(0) scale(.97)}
.day.empty{
background:transparent;
border:none;
box-shadow:none;
pointer-events:none;
}
.day .num{
font-size:.86rem;
font-weight:600;
color:var(--fb-text);
line-height:1;
letter-spacing:-.01em;
}
.day.weekend .num{color:var(--fb-muted)}
.day.has-event{
background:linear-gradient(180deg,#ffffff 0%,#f4f6f9 100%);
border-color:#dadde2;
}
.day .dot{
width:6px;height:6px;border-radius:50%;
background:var(--accent);
box-shadow:0 0 0 2px rgba(255,255,255,.9);
}
.day .dot.reunion{background:#2c5b91}
.day .dot.b{background:#0d5c4a}
.day .dot.g{background:var(--accent-2)}
.day .dot.p{background:var(--accent-3)}
.day .dot.bilan{background:var(--danger)}
.day.today{
background:linear-gradient(180deg,#1e7e6c 0%,#17634f 100%);
border-color:#155845;
box-shadow:0 4px 10px rgba(30,126,108,.35),0 1px 0 rgba(255,255,255,.15) inset;
}
.day.today .num{color:#fff;font-weight:800}
.day.today .dot{background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}

.legend{
display:flex;flex-wrap:wrap;
gap:.45rem .9rem;
padding:.85rem 1rem 1rem;
border-top:1px solid #ebedf0;
background:#fafbfc;
}
.legend span{
display:inline-flex;align-items:center;gap:.35rem;
font-size:.72rem;font-weight:600;
color:var(--fb-muted);
letter-spacing:.01em;
}
.legend i{
width:8px;height:8px;border-radius:50%;
display:inline-block;font-style:normal;
}
.legend i.reunion{background:#2c5b91}
.legend i.b{background:#0d5c4a}
.legend i.g{background:var(--accent-2)}
.legend i.p{background:var(--accent-3)}
.legend i.bilan{background:var(--danger)}
.legend i.today{background:var(--accent)}

.backdrop{
position:fixed;inset:0;
background:rgba(0,0,0,.5);
opacity:0;pointer-events:none;
transition:opacity .22s ease;
z-index:90;
}
.backdrop.open{opacity:1;pointer-events:auto}

.sheet{
position:fixed;
left:0;right:0;bottom:0;
background:var(--fb-card);
border-radius:16px 16px 0 0;
padding:0 0 calc(1.25rem + env(safe-area-inset-bottom));
transform:translateY(100%);
transition:transform .3s cubic-bezier(.22,.8,.22,1);
z-index:100;
max-width:520px;
margin:0 auto;
box-shadow:0 -8px 30px rgba(0,0,0,.22);
max-height:85vh;
overflow-y:auto;
-webkit-overflow-scrolling:touch;
}
.sheet.open{transform:translateY(0)}
.sheet-handle-wrap{
position:sticky;top:0;
background:var(--fb-card);
padding:.75rem 1.25rem .35rem;
z-index:2;
}
.sheet-handle{
width:40px;height:4px;border-radius:4px;
background:#ccd0d5;margin:0 auto;
}
.sheet-content{padding:.5rem 1.25rem 1rem}
.sheet-eyebrow{
font-size:.68rem;font-weight:700;letter-spacing:.15em;
color:var(--fb-muted);text-transform:uppercase;
margin-bottom:.35rem;
}
.sheet-title{
font-size:1.35rem;font-weight:800;color:var(--fb-text);
letter-spacing:-.02em;line-height:1.2;margin-bottom:.9rem;
}
.sheet-tag{
display:inline-flex;align-items:center;gap:.4rem;
font-size:.68rem;font-weight:700;letter-spacing:.06em;
padding:.35rem .8rem;border-radius:30px;
text-transform:uppercase;margin-bottom:1rem;
}
.sheet-tag.reunion{background:rgba(44,91,145,.10);color:#2c5b91}
.sheet-tag.b{background:rgba(13,92,74,.10);color:#0d5c4a}
.sheet-tag.g{background:rgba(196,123,30,.13);color:#9b5e0a}
.sheet-tag.p{background:rgba(94,42,122,.10);color:var(--accent-3)}
.sheet-tag.bilan{background:rgba(140,42,42,.10);color:var(--danger)}
.sheet-tag.today{background:var(--accent);color:#fff}

.block{
background:#f7f8fa;
border-radius:10px;
padding:.9rem 1rem;
margin-bottom:.65rem;
}
.block.support{background:rgba(30,126,108,.06);border-left:3px solid var(--accent)}
.block.diag{background:rgba(196,123,30,.07);border-left:3px solid var(--accent-2)}
.block.reunion{background:rgba(44,91,145,.06);border-left:3px solid #2c5b91}
.block.bilan{background:rgba(140,42,42,.06);border-left:3px solid var(--danger)}
.block .lbl{
font-size:.66rem;font-weight:800;letter-spacing:.12em;
text-transform:uppercase;color:var(--fb-muted);
margin-bottom:.3rem;
}
.block.support .lbl{color:var(--accent)}
.block.diag .lbl{color:var(--accent-2)}
.block.reunion .lbl{color:#2c5b91}
.block.bilan .lbl{color:var(--danger)}
.block p{
font-size:.9rem;color:var(--fb-text);
line-height:1.5;font-weight:500;
}
.block p strong{font-weight:700}

.sheet-close{
margin-top:.75rem;width:100%;
padding:.85rem;
border-radius:10px;
background:#e4e6eb;
color:var(--fb-text);
font-size:.92rem;font-weight:700;
border:none;cursor:pointer;
transition:background .15s ease;
}
.sheet-close:hover{background:#d8dadf}
.sheet-close:active{background:#ccced3}

@media (min-width:600px){
.app{padding:1.5rem 1rem 4rem}
.card-head h1{font-size:1.15rem}
.day .num{font-size:.95rem}
.sheet-title{font-size:1.5rem}
}
</style>
</head>
<body>

<div class="days" id="days"></div>

<div class="legend">

<span><i class="p"></i>Visite P</span>

</div>
</div>

<div class="sheet" id="sheet">

var todayISO=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');

var days=document.getElementById('days');
var offset=(new Date(2026,9,1).getDay()+6)%7;

for(var i=0;i<offset;i++){
var e=document.createElement('div');
e.className='day empty';
days.appendChild(e);
}

for(var d=1;d<=31;d++){
var iso='2026-10-'+String(d).padStart(2,'0');
var cell=document.createElement('div');
cell.className='day';
cell.setAttribute('data-date',iso);
var wd=new Date(2026,9,d).getDay();
if(wd===0||wd===6) cell.classList.add('weekend');
var info=data[iso];
if(info) cell.classList.add('has-event');
var inner='<span class="num">'+d+'</span>';
if(info) inner+='<span class="dot '+info.tag+'"></span>';

days.appendChild(cell);
}

var backdrop=document.getElementById('backdrop');
var sheet=document.getElementById('sheet');

var title=document.getElementById('sheet-title');
var tagEl=document.getElementById('sheet-tag');
var bodyEl=document.getElementById('sheet-body');
var closeBtn=document.getElementById('sheet-close');

function openSheet(iso){
var info=data[iso];
if(!info) return;
eyebrow.textContent=info.tagLabel+(iso===todayISO?' · Aujourd\'hui':'');
title.textContent=info.t;
var cls='sheet-tag '+info.tag;
if(iso===todayISO) cls+=' today';
tagEl.innerHTML='<span class="'+cls+'">'+info.tagLabel+'</span>';
var html='';
html+='<div class="block diag"><div class="lbl">Diagnostic</div><p>'+info.diag+'</p></div>';
html+='<div class="block support"><div class="lbl">Support</div><p>'+info.support+'</p></div>';
bodyEl.innerHTML=html;
backdrop.classList.add('open');
sheet.classList.add('open');
document.body.style.overflow='hidden';
}

function closeSheet(){
backdrop.classList.remove('open');
sheet.classList.remove('open');
document.body.style.overflow='';
}

days.addEventListener('click',function(e){
var cell=e.target.closest('.day');
if(!cell||cell.classList.contains('empty')) return;
openSheet(cell.getAttribute('data-date'));
});

backdrop.addEventListener('click',closeSheet);
closeBtn.addEventListener('click',closeSheet);

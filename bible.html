<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test API Bible - NeTubeX</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
  h1 { color: #60a5fa; text-align: center; }
  .grid { display: grid; gap: 16px; max-width: 900px; margin: 0 auto; }
  .card { background: #1e293b; border-radius: 12px; padding: 16px; border-left: 4px solid #475569; }
  .card.success { border-left-color: #10b981; }
  .card.error { border-left-color: #ef4444; }
  .card h2 { margin: 0 0 8px; font-size: 16px; color: #94a3b8; text-transform: uppercase; }
  .card .status { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .card.success .status { color: #10b981; }
  .card.error .status { color: #ef4444; }
  .card .verse { font-size: 15px; line-height: 1.6; font-style: italic; color: #f1f5f9; }
  .card .error-msg { font-size: 13px; color: #fca5a5; }
  .loader { text-align: center; color: #60a5fa; font-size: 14px; padding: 20px; }
</style>
</head>
<body>
<h1>🧪 Test des API Bible (LSG)</h1>
<div id="results" class="grid">
  <div class="loader">⏳ Interrogation des 4 API en cours...</div>
</div>

<script>
const REF = "Marc 11:24";
const resultsDiv = document.getElementById('results');

// Utilitaire pour normaliser la référence en différents formats
function parseRef(ref) {
  const m = ref.match(/^([1-3]?\s*[a-zA-ZÀ-ÿ]+)\s+(\d+)[:.](\d+)$/);
  if (!m) return null;
  const livreFr = m[1].toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '');
  return {
    livreFr: livreFr,        // "marc"
    livreEn: livreFr === 'marc' ? 'mark' : livreFr, // pour les API anglaises
    chapitre: m[2],
    verset: m[3],
    original: ref
  };
}

const refData = parseRef(REF);
if (!refData) {
  resultsDiv.innerHTML = '<div class="card error">Format de référence invalide.</div>';
} else {
  runTests();
}

async function runTests() {
  // Liste des 4 API à tester
  const apis = [
    {
      name: "1. Midvash (api.midvash.com)",
      url: `https://api.midvash.com/v1/lsg/${refData.livreFr}/${refData.chapitre}/${refData.verset}`,
      parse: (json) => json?.data?.text || null,
      note: "Supporte le français LSG. CORS ouvert."
    },
    {
      name: "2. Bible-API (bible-api.com)",
      url: `https://bible-api.com/${encodeURIComponent(refData.original)}?translation=lsg`,
      parse: (json) => json?.text || null,
      note: "Ne supporte PAS le LSG (uniquement anglais). Devrait échouer."
    },
    {
      name: "3. GetBible (getbible.net)",
      url: `https://api.getbible.net/v2/ls1910/${refData.chapitre}/${refData.verset}.json`,
      parse: (json) => json?.verses?.[0]?.text || null,
      note: "API alternative, nécessite de connaître l'ID du livre (test simplifié)."
    },
    {
      name: "4. Bolls (bolls.life)",
      url: `https://bolls.life/get-verse/LSG/${refData.chapitre}/${refData.verset}/`,
      parse: (json) => json?.[0]?.text || null,
      note: "API robuste mais nécessite l'ID numérique du livre (test simplifié)."
    }
  ];

  const htmlCards = [];

  for (const api of apis) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);
      
      const res = await fetch(api.url, { signal: controller.signal });
      clearTimeout(timeoutId);

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }

      const json = await res.json();
      const text = api.parse(json);

      if (text) {
        htmlCards.push(`
          <div class="card success">
            <h2>${api.name}</h2>
            <div class="status">✅ SUCCÈS</div>
            <div class="verse">« ${text.trim()} »</div>
            <div style="font-size:12px;color:#64748b;margin-top:8px;">${api.note}</div>
          </div>
        `);
      } else {
        throw new Error("Structure JSON inattendue");
      }
    } catch (err) {
      htmlCards.push(`
        <div class="card error">
          <h2>${api.name}</h2>
          <div class="status">❌ ÉCHEC</div>
          <div class="error-msg">${err.name === 'AbortError' ? 'Timeout (8s)' : err.message}</div>
          <div style="font-size:12px;color:#64748b;margin-top:8px;">${api.note}</div>
        </div>
      `);
    }
  }

  resultsDiv.innerHTML = htmlCards.join('');
}
</script>
</body>
</html>

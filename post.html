<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'JetBrains Mono','Courier New',monospace}
body{background:#0a0e14;color:#00ff88;min-height:100vh;padding:20px;font-size:13px;line-height:1.6}
.term{max-width:900px;margin:0 auto;background:#000;border:1px solid #00ff88;border-radius:8px;overflow:hidden;box-shadow:0 0 40px rgba(0,255,136,.15)}
.term-header{background:#0d1117;padding:10px 16px;border-bottom:1px solid #00ff88;display:flex;align-items:center;gap:8px;font-size:12px;color:#888}
.term-dot{width:12px;height:12px;border-radius:50%}
.term-dot.r{background:#ff5f56}.term-dot.y{background:#ffbd2e}.term-dot.g{background:#27c93f}
.term-title{margin-left:auto;color:#00ff88;font-weight:700;font-size:12px}
.term-body{padding:20px}
.header{margin-bottom:24px;padding-bottom:16px;border-bottom:1px dashed #00ff8844}
.header h1{font-size:16px;color:#00ff88;font-weight:700;margin-bottom:4px}
.header .sub{font-size:11px;color:#00ff8888}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px;font-size:11px}
.stat{background:#0d1117;border:1px solid #00ff8833;border-radius:4px;padding:10px}
.stat .lbl{color:#00ff8866;text-transform:uppercase;font-size:10px}
.stat .val{color:#00ff88;font-size:18px;font-weight:700;margin-top:2px}
.prompt{color:#00ff88;margin-bottom:12px;font-size:12px}
.prompt::before{content:'$ ';color:#00ff88aa}
.btn{width:100%;padding:16px;background:#000;border:1px solid #00ff88;color:#00ff88;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border-radius:4px;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;transition:all .15s}
.btn:hover:not(:disabled){background:#00ff88;color:#000}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-danger{border-color:#ff3366;color:#ff3366}
.btn-danger:hover:not(:disabled){background:#ff3366;color:#000}
.log{background:#000;border:1px solid #00ff8833;border-radius:4px;padding:12px;height:340px;overflow-y:auto;font-size:11px;line-height:1.7}
.log-entry{padding:1px 0}
.log-entry::before{content:'> ';color:#00ff8866}
.ok{color:#00ff88}.err{color:#ff3366}.info{color:#00c8ff}.warn{color:#ffbd2e}.title{color:#c084fc;font-weight:700}
.progress-bar{height:6px;background:#0d1117;border:1px solid #00ff8833;border-radius:3px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:#00ff88;width:0%;transition:width .3s;box-shadow:0 0 10px #00ff88}
.progress-info{display:flex;justify-content:space-between;font-size:11px;color:#00ff8888;margin-bottom:4px}
</style>
</head>
<body>
<div class="term">
  <div class="term-header">
    <span class="term-dot r"></span>
    <span class="term-dot y"></span>
    <span class="term-dot g"></span>
    <span class="term-title">netubex@terminal:~$</span>
  </div>
  <div class="term-body">

    <div class="header">
      <h1>◉ NeTubeX // ADMIN TERMINAL</h1>
      <div class="sub">// 10 netubers · 8 boutiques · 30 annonces · Kinshasa</div>
    </div>

    <div class="stats">
      <div class="stat"><div class="lbl">Netubers</div><div class="val" id="sUsers">—</div></div>
      <div class="stat"><div class="lbl">Commerces</div><div class="val" id="sCom">—</div></div>
      <div class="stat"><div class="lbl">Annonces</div><div class="val" id="sAnn">—</div></div>
    </div>

    <div class="prompt">Actions disponibles :</div>

    <button class="btn" id="btnPublier" disabled>▶ PUBLIER (netubers + boutiques + annonces)</button>
    <button class="btn btn-danger" id="btnTout" disabled>✕ SUPPRIMER TOUT</button>

    <div id="progressBox" style="display:none;margin:16px 0">
      <div class="progress-info">
        <span id="progressLabel">...</span>
        <span id="progressStats">0 / 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
    </div>

    <div class="prompt" style="margin-top:20px">Sortie :</div>
    <div class="log" id="log">
      <div class="log-entry info">Initialisation...</div>
    </div>

  </div>
</div>

const setProgress = (show, cur=0, total=0, label='') => {
  const box = document.getElementById('progressBox');
  box.style.display = show ? 'block' : 'none';
  if (!show) return;
  const pct = total > 0 ? Math.min(100, Math.round((cur / total) * 100)) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressStats').textContent = cur + ' / ' + total + ' (' + pct + '%)';
  document.getElementById('progressLabel').textContent = label;
};

  const delta = min*3600*1000 + Math.random()*(max*24*3600*1000 - min*3600*1000);
  return new Date(Date.now() - delta).toISOString();
};

const vuesVariees = (cat, dateISO) => {
  const age = (Date.now() - new Date(dateISO).getTime()) / 86400000;
  const min = {parcelle:15,location:25,hopital:8,ecole:10,entreprise:20,vehicule:30,electronique:35,autre:12}[cat]||10;
  const max = {parcelle:250,location:800,hopital:120,ecole:180,entreprise:400,vehicule:600,electronique:900,autre:220}[cat]||200;
  const mult = Math.min(3, 0.4 + age/10);
  return Math.floor((min + Math.random()*(max-min)) * mult);
};

  { nom:"KIN MARCHÉ SUPERMARCHÉ",  type:"Supermarché",       quartier:"Gombe",     tel:"+243810111201", wa:"+243810111201", desc:"Supermarché au coeur de la Gombe. Produits alimentaires, boissons, hygiène et produits ménagers. Livraison à Kinshasa.", img:U+"1578916171728-46686eac8d58"+Q },
  { nom:"KINSHASA FRESH MARKET",   type:"Supermarché",       quartier:"Kampemba",  tel:"+243810111202", wa:"+243810111202", desc:"Supermarché à Kampemba. Fruits, légumes frais, viandes, produits laitiers et épicerie fine. Ouvert 7j/7.", img:U+"1542838132-92c53300491e"+Q },
  { nom:"CHEZ MAMA NZUZI",         type:"Restaurant",        quartier:"Limete",    tel:"+243810111203", wa:"+243810111203", desc:"Restaurant congolais traditionnel à Limete. Poulet moambé, poisson braisé, fufu et spécialités locales.", img:U+"1555396273-367ea4eb4db5"+Q },
  { nom:"PHARMACIE DU CENTRE",     type:"Pharmacie",         quartier:"Kalamu",    tel:"+243810111204", wa:"+243810111204", desc:"Pharmacie agréée à Kalamu. Médicaments génériques et originaux. Garde de nuit. Conseil pharmaceutique gratuit.", img:U+"1587854692152-cbe660dbde88"+Q },
  { nom:"QUINCAILLERIE BOMOKO",    type:"Quincaillerie",     quartier:"Kasa-Vubu", tel:"+243810111205", wa:"+243810111205", desc:"Quincaillerie complète à Kasa-Vubu. Outils, peinture, plomberie, électricité et matériaux de construction.", img:U+"1504917595217-d4dc5ebe6122"+Q },
  { nom:"TECH KIN ÉLECTRONIQUE",   type:"Électronique",      quartier:"Gombe",     tel:"+243810111206", wa:"+243810111206", desc:"Boutique électronique à la Gombe. Smartphones, ordinateurs, accessoires, réparation et installation.", img:U+"1517336714731-489689fd1ca8"+Q },
  { nom:"BOULANGERIE MA CAMPAGNE", type:"Boulangerie",       quartier:"Ngaliema",  tel:"+243810111207", wa:"+243810111207", desc:"Boulangerie artisanale à Ngaliema. Pains frais, croissants, pâtisseries et viennoiseries. Fournées chaque matin.", img:U+"1509440159596-0249088772ff"+Q },
  { nom:"FRUITS & LÉGUMES KIN",    type:"Vivriers & Fruits", quartier:"Matonge",   tel:"+243810111208", wa:"+243810111208", desc:"Boutique de fruits et légumes frais à Matonge. Mangues, ananas, avocats, tomates et produits frais du jour.", img:U+"1610348725531-843dff563e2c"+Q }
];

let netubers = [], commerces = [], annonces = [];

async function charger() {
  log("Chargement des données depuis Firestore...", "info");
  netubers = []; commerces = []; annonces = [];
  const sn = await getDocs(collection(db, 'netubers'));
  sn.forEach(d => netubers.push({ id: d.id, ...d.data() }));
  const sc = await getDocs(collection(db, 'commerces'));
  sc.forEach(d => commerces.push({ id: d.id, ...d.data() }));
  const sa = await getDocs(collection(db, 'annonces'));
  sa.forEach(d => annonces.push({ id: d.id, ...d.data() }));

  document.getElementById('sUsers').textContent = netubers.length;
  document.getElementById('sCom').textContent = commerces.length;
  document.getElementById('sAnn').textContent = annonces.length;

  log(`✓ ${netubers.length} netubers · ${commerces.length} commerces · ${annonces.length} annonces`, "ok");
  document.getElementById('btnPublier').disabled = false;
  document.getElementById('btnTout').disabled = false;
  log("Système prêt. En attente de commande.", "ok");
}

async function publierTout() {
  log("═══ DÉMARRAGE PUBLICATION ═══", "title");

  // ÉTAPE 1 : Netubers
  const netubersACreer = NOUVEAUX.slice(0, MAX_NETUBERS);
  setProgress(true, 0, netubersACreer.length, 'Création netubers');
  log(`Création de ${netubersACreer.length} netubers...`, "info");
  const nouveauxCrees = [];
  let idxH = 0, idxF = 0;
  for (let i = 0; i < netubersACreer.length; i++) {
    const n = netubersACreer[i];
    const uid = "NTX-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    const emailGmail = genererEmail(n.nom, n.prenom, n.phone);
    let avatar;
    if (n.sexe === 'femme') { avatar = AVATARS_F[idxF % AVATARS_F.length]; idxF++; }
    else { avatar = AVATARS_H[idxH % AVATARS_H.length]; idxH++; }
    const data = {
      uid, nom: n.nom, prenom: n.prenom,
      nomComplet: n.prenom + " " + n.nom,
      sexe: n.sexe, phone: n.phone,
      emailAuth: emailGmail, code: n.code,
      ville: n.ville, role: "user", actif: true,
      boutique: null, avatarUrl: avatar,
      dateCreation: dateVariee(24, 90), creeParAdmin: true
    };
    await setDoc(doc(db, 'netubers', uid), data);
    nouveauxCrees.push({ id: uid, ...data });
    log(`+ ${data.nomComplet} (${n.ville})`, "ok");
    setProgress(true, i + 1, netubersACreer.length, `Netuber : ${data.nomComplet}`);
  }

  // ÉTAPE 2 : Boutiques
  setProgress(true, 0, BOUTIQUES_KIN.length, 'Création boutiques');
  log(`Création de ${BOUTIQUES_KIN.length} boutiques Kinshasa...`, "info");
  let nbBoutiques = 0;
  for (let i = 0; i < BOUTIQUES_KIN.length; i++) {
    const b = BOUTIQUES_KIN[i];
    const proprietaire = nouveauxCrees.find(n => !n.boutique);
    if (!proprietaire) { log(`! Plus de netuber libre pour ${b.nom}`, "warn"); continue; }
    const commerceId = "COM-KIN-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);
    const dateCreation = dateVariee(24, 60);
    const boutiqueData = {
      uid: proprietaire.id,
      nom: b.nom, nomCommerce: b.nom,
      type: b.type, ville: "Kinshasa", quartier: b.quartier,
      adresse: "Avenue " + b.quartier + ", Kinshasa",
      horaires: "08h - 20h",
      description: b.desc,
      telephone: b.tel, whatsapp: b.wa, whatsappCommercial: b.wa,
      img: b.img, emoji: "🏪", statut: "approuve",
      dateCreation, dateApprobation: dateCreation,
      vues: Math.floor(50 + Math.random() * 900),
      produits: PRODUITS.map((p) => ({
        nom: p.n, prix: p.p, prixLabel: p.l, img: p.img,
        categorie: p.c, statut: 'approuve', ajouteParAdmin: true,
        dateAjout: dateVariee(2, 25)
      }))
    };
    await setDoc(doc(db, 'commerces', commerceId), boutiqueData);
    await setDoc(doc(db, 'netubers', proprietaire.id), { boutique: boutiqueData }, { merge: true });
    proprietaire.boutique = boutiqueData;
    nbBoutiques++;
    log(`+ ${b.nom} [${b.type}]`, "ok");
    setProgress(true, i + 1, BOUTIQUES_KIN.length, `Boutique : ${b.nom}`);
  }

  // ÉTAPE 3 : Annonces
  setProgress(true, 0, MAX_ANNONCES, 'Publication annonces');
  log(`Publication de ${MAX_ANNONCES} annonces max...`, "info");

  const toutesAnnonces = [];
  for (const cat of Object.keys(ANNONCES)) {
    for (const a of ANNONCES[cat]) {
      toutesAnnonces.push({ ...a, cat, catInfo: CAT[cat] });
    }
  }
  toutesAnnonces.sort(() => Math.random() - 0.5);

  const nbAPublier = Math.min(MAX_ANNONCES, toutesAnnonces.length);
  let nbAnn = 0;

  for (let i = 0; i < nbAPublier; i++) {
    const a = toutesAnnonces[i];
    const user = nouveauxCrees[i % nouveauxCrees.length];
    const isCommerce = user.boutique && user.boutique.statut === 'approuve';
    const nomAffiche = isCommerce ? user.boutique.nom : (user.nomComplet || user.phone);

    const annonceId = "ANN-AUTO-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);
    const images = a.catInfo.imgs.slice(0, 5);
    const dateCreation = dateVariee(2, 30);

    await setDoc(doc(db, 'annonces', annonceId), {
      titre: a.t, desc: a.d,
      ville: a.v, quartier: a.q,
      prix: a.p,
      img: images[0], images: images,
      cat: a.cat, tag: a.catInfo.tag, tagClass: a.catInfo.cls,
      proprietaireUid: user.id,
      publieurNom: nomAffiche,
      publieurType: isCommerce ? 'commerce' : 'user',
      publieurBoutique: isCommerce ? nomAffiche : null,
      publieurPhone: user.phone || "",
      publieurVille: a.v,
      publieurSexe: user.sexe || "",
      ajouteParAdmin: true,
      dateCreation,
      actif: true, statut: "approuve",
      vues: vuesVariees(a.cat, dateCreation)
    });

    await setDoc(doc(db, 'annonces', annonceId, 'prive', 'contact'), {
      nom: nomAffiche,
      adresse: a.q + ", " + a.v,
      telephone: user.phone || "",
      email: user.emailAuth || ""
    });

    nbAnn++;
    log(`+ [${a.cat}] ${a.t}`, "ok");
    setProgress(true, nbAnn, nbAPublier, `Annonce ${nbAnn}/${nbAPublier} — ${a.cat}`);
  }

  log(`═══ TERMINÉ ═══`, "title");
  log(`✓ ${netubersACreer.length} netubers · ${nbBoutiques} boutiques · ${nbAnn} annonces`, "ok");
  setProgress(false);
  await charger();
}

async function supprimerTout() {
  if (!confirm("⚠ SUPPRIMER TOUT ? Cette action est IRRÉVERSIBLE.")) return;
  if (!confirm("⚠⚠ Confirmer une seconde fois ?")) return;

  log("═══ SUPPRESSION TOTALE ═══", "title");
  const totalGlobal = annonces.length + netubers.length + commerces.length;
  if (totalGlobal === 0) { log("Base déjà vide.", "warn"); return; }

  setProgress(true, 0, totalGlobal, 'Suppression');
  let total = 0;
  let batch = writeBatch(db);
  let count = 0;

  log(`Suppression de ${annonces.length} annonces...`, "info");
  for (let i = 0; i < annonces.length; i++) {
    const a = annonces[i];
    try {
      const priv = await getDocs(collection(db, 'annonces', a.id, 'prive'));
      for (const p of priv.docs) {
        batch.delete(doc(db, 'annonces', a.id, 'prive', p.id));
        count++;
        if (count >= 450) { await batch.commit(); batch = writeBatch(db); count = 0; }
      }
      batch.delete(doc(db, 'annonces', a.id));
      count++;
      if (count >= 450) { await batch.commit(); batch = writeBatch(db); count = 0; }
      total++;
      if (i % 5 === 0) setProgress(true, total, totalGlobal, `Annonces : ${total}/${totalGlobal}`);
    } catch(e) { log(`! Erreur annonce ${a.id}: ${e.message}`, "err"); }
  }
  if (count > 0) { await batch.commit(); batch = writeBatch(db); count = 0; }
  log(`✓ ${annonces.length} annonces supprimées`, "ok");

  log(`Suppression de ${netubers.length} netubers...`, "info");
  for (let i = 0; i < netubers.length; i++) {
    batch.delete(doc(db, 'netubers', netubers[i].id));
    count++;
    if (count >= 450) { await batch.commit(); batch = writeBatch(db); count = 0; }
    total++;
  }
  if (count > 0) { await batch.commit(); batch = writeBatch(db); count = 0; }
  log(`✓ ${netubers.length} netubers supprimés`, "ok");

  log(`Suppression de ${commerces.length} commerces...`, "info");
  for (const c of commerces) {
    batch.delete(doc(db, 'commerces', c.id));
    count++;
    if (count >= 450) { await batch.commit(); batch = writeBatch(db); count = 0; }
    total++;
  }
  if (count > 0) { await batch.commit(); }
  log(`✓ ${commerces.length} commerces supprimés`, "ok");

  log(`═══ SUPPRESSION TERMINÉE ═══`, "title");
  log(`✓ ${total} documents supprimés au total`, "ok");
  setProgress(false);
  await charger();
}

document.getElementById('btnPublier').onclick = async () => {
  const b = document.getElementById('btnPublier');
  b.disabled = true;
  b.textContent = '▶ PUBLICATION EN COURS...';
  try { await publierTout(); }
  catch(e) { log("✕ Erreur : " + e.message, "err"); }
  b.disabled = false;
  b.textContent = '▶ PUBLIER (netubers + boutiques + annonces)';
};

document.getElementById('btnTout').onclick = async () => {
  const b = document.getElementById('btnTout');
  b.disabled = true;
  b.textContent = '✕ SUPPRESSION EN COURS...';
  try { await supprimerTout(); }
  catch(e) { log("✕ Erreur : " + e.message, "err"); }
  b.disabled = false;
  b.textContent = '✕ SUPPRIMER TOUT';
};

charger().catch(e => log("✕ Erreur chargement : " + e.message, "err"));
</script>

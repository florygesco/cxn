const NOUVEAUX_NETUBERS = [

let tousNetubers = [];
let tousCommerces = [];

async function chargerDonnees() {
  log("Chargement des netubers...", "info");
  const snapN = await getDocs(collection(db, "netubers"));
  tousNetubers = [];
  snapN.forEach(d => tousNetubers.push({ id: d.id, ...d.data() }));

  log("Chargement des commerces...", "info");
  const snapC = await getDocs(collection(db, "commerces"));
  tousCommerces = [];
  snapC.forEach(d => tousCommerces.push({ id: d.id, ...d.data() }));

  const nbNetubers = tousNetubers.filter(n => !n.boutique || n.boutique.statut !== "approuve").length;
  const nbCommerces = tousCommerces.length;

  const totalAnnoncesPrevu = (tousNetubers.length + NOUVEAUX_NETUBERS.length) * 5 * 8;
  const totalProduitsPrevu = nbCommerces * 5;

  document.getElementById("statUsers").textContent = nbNetubers + " (+" + NOUVEAUX_NETUBERS.length + ")";
  document.getElementById("statCommerces").textContent = nbCommerces;
  document.getElementById("statProduits").textContent = totalProduitsPrevu;
  document.getElementById("statAnnonces").textContent = totalAnnoncesPrevu;

  log(`✅ ${tousNetubers.length} netubers existants · ${nbCommerces} commerces`, "ok");
  log(`🆕 ${NOUVEAUX_NETUBERS.length} nouveaux netubers seront créés`, "info");

  const btn = document.getElementById("btnGo");

}

// ============ CRÉATION DES 5 NETUBERS ============
async function creerNouveauxNetubers() {
  log("🆕 Création des 5 nouveaux netubers...", "title");
  const crees = [];
  for (const n of NOUVEAUX_NETUBERS) {
    const uid = "NTX-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    const netuberData = {
      uid: uid,
      nom: n.nom,
      prenom: n.prenom,
      nomComplet: n.prenom + " " + n.nom,
      sexe: n.sexe,
      phone: n.phone,
      emailAuth: n.email,
      code: n.code,
      ville: n.ville,
      role: "user",
      actif: true,
      boutique: null,
      dateCreation: new Date().toISOString(),
      creeParAdmin: true
    };
    await setDoc(doc(db, "netubers", uid), netuberData);
    crees.push({ id: uid, ...netuberData });
    log(`✅ ${n.prenom} ${n.nom} créé (${n.ville}) — UID: ${uid.slice(0, 20)}...`, "ok");
  }
  return crees;
}

// ============ PUBLICATION ANNONCES ============
async function publierAnnonces(listeNetubers) {
  let done = 0;
  const total = listeNetubers.length * 5 * 8;

  for (const user of listeNetubers) {
    const isCommerce = user.boutique && user.boutique.statut === "approuve";
    const nomAffiche = isCommerce
      ? user.boutique.nom
      : (user.nomComplet || user.nom || user.phone || "Utilisateur");

    log(`📢 ${nomAffiche} — début`, "title");

    for (const cat of Object.keys(ANNONCES)) {
      const annoncesCat = ANNONCES[cat];
      const imagesCat = IMG[cat];

      for (let i = 0; i < annoncesCat.length; i++) {
        const a = annoncesCat[i];
        const annonceId = "ANN-AUTO-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);

        const imagesRotation = [
          imagesCat[i % 5],
          imagesCat[(i + 1) % 5],
          imagesCat[(i + 2) % 5],
          imagesCat[(i + 3) % 5],
          imagesCat[(i + 4) % 5]
        ];

        await setDoc(doc(db, "annonces", annonceId), {
          titre: a.titre,
          desc: a.desc,
          ville: a.ville,
          quartier: a.quartier,
          prix: a.prix,
          img: imagesRotation[0],
          images: imagesRotation,
          cat: cat,
          tag: cat.charAt(0).toUpperCase() + cat.slice(1),
          tagClass: "post-tag-" + cat,
          proprietaireUid: user.id,
          publieurNom: nomAffiche,
          publieurType: isCommerce ? "commerce" : "user",
          publieurPhone: user.phone || "",
          publieurVille: a.ville,
          publieurSexe: user.sexe || "",
          ajouteParAdmin: true,
          dateCreation: new Date().toISOString(),
          actif: true,
          statut: "approuve",
          vues: 0
        });

        await setDoc(doc(db, "annonces", annonceId, "prive", "contact"), {
          nom: nomAffiche,
          adresse: a.quartier + ", " + a.ville,
          telephone: user.phone || "",
          email: user.emailAuth || ""
        });

        done++;
        const pct = Math.round((done / total) * 100);
        document.getElementById("progressBar").style.width = pct + "%";
        document.getElementById("progressTxt").textContent = `Annonces : ${done} / ${total} (${pct}%)`;
      }
      log(`  ✅ ${cat} — 5 annonces`, "ok");
    }
    log(`✅ ${nomAffiche} — terminé (40 annonces)`, "ok");
  }
  return done;
}

// ============ REMPLISSAGE CATALOGUES ============
async function remplirCatalogues() {
  let done = 0;
  const total = tousCommerces.length;

  for (const commerce of tousCommerces) {
    const nomBoutique = commerce.nom || commerce.nomCommerce || commerce.id;
    const produitsExistants = commerce.produits || [];
    const nouveauxProduits = [...produitsExistants];

    let ajoutes = 0;
    for (const p of PRODUITS_COMMERCE) {
      if (!nouveauxProduits.find(x => x.nom === p.nom)) {
        nouveauxProduits.push({
          nom: p.nom,
          prix: p.prix,
          prixLabel: p.prixLabel,
          img: p.img,
          categorie: p.categorie,
          statut: "approuve",
          ajouteParAdmin: true,
          dateAjout: new Date().toISOString()
        });
        ajoutes++;
      }
    }

    await setDoc(doc(db, "commerces", commerce.id), {
      produits: nouveauxProduits
    }, { merge: true });

    done++;
    log(`🏪 ${nomBoutique} — ${ajoutes} produits ajoutés (total ${nouveauxProduits.length})`, "ok");
    const pct = Math.round((done / total) * 100);
    document.getElementById("progressBar").style.width = pct + "%";
    document.getElementById("progressTxt").textContent = `Catalogues : ${done} / ${total} (${pct}%)`;
  }
  return done;
}

// ============ LANCEMENT ============
document.getElementById("btnGo").onclick = async () => {
  const btn = document.getElementById("btnGo");
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Publication en cours...';

  const start = Date.now();

  try {
    // 1. Créer les 5 nouveaux netubers
    const nouveaux = await creerNouveauxNetubers();

    // 2. Fusionner avec les existants
    const tousPourPublication = [...tousNetubers, ...nouveaux];

    // 3. Publier les annonces pour tout le monde
    log("🚀 Démarrage de la publication des annonces...", "title");
    const nbAnnonces = await publierAnnonces(tousPourPublication);
    log(`✅ ${nbAnnonces} annonces publiées`, "ok");

    // 4. Remplir les catalogues
    log("🏪 Démarrage du remplissage des catalogues...", "title");
    const nbCatalogues = await remplirCatalogues();
    log(`✅ ${nbCatalogues} catalogues remplis`, "ok");

    const duree = ((Date.now() - start) / 1000).toFixed(1);
    log(`🎉 TERMINÉ en ${duree}s !`, "ok");
    log(`🆕 5 netubers · 📢 ${nbAnnonces} annonces · 📦 ${nbCatalogues} catalogues`, "info");

    btn.innerHTML = '<i class="fas fa-check"></i> Terminé — Relancer ?';
    btn.disabled = false;

  } catch (e) {
    log("❌ Erreur : " + e.message, "err");
    console.error(e);
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-redo"></i> Réessayer';
  }
};

chargerDonnees().catch(e => {
  log("❌ Erreur de chargement : " + e.message, "err");
  console.error(e);
});

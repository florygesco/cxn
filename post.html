function dateVariee(minHeuresAgo = 2, maxJoursAgo = 30) {
  const maintenant = Date.now();
  const minMs = minHeuresAgo * 3600 * 1000;
  const maxMs = maxJoursAgo * 24 * 3600 * 1000;
  const delta = minMs + Math.random() * (maxMs - minMs);
  return new Date(maintenant - delta).toISOString();
}

function vuesVariees(cat, dateISO) {
  const age = (Date.now() - new Date(dateISO).getTime()) / (24 * 3600 * 1000);
  const baseMin = { parcelle:15, location:25, hopital:8, ecole:10, entreprise:20, vehicule:30, electronique:35, autre:12 }[cat] || 10;
  const baseMax = { parcelle:250, location:800, hopital:120, ecole:180, entreprise:400, vehicule:600, electronique:900, autre:220 }[cat] || 200;
  const multiplicateurAge = Math.min(3, 0.4 + age / 10);
  const base = baseMin + Math.random() * (baseMax - baseMin);
  return Math.floor(base * multiplicateurAge);
}

function genererEmailGmail(nom, prenom, phone) {
  const nomSansAccents = (nom + prenom)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9]/g, '')
    .toLowerCase();
  const phoneClean = String(phone).replace(/[^\d]/g, '');
  return nomSansAccents + phoneClean + '@gmail.com';
}

  { nom:"Boulangerie Ma Campagne", type:"Boulangerie",    quartier:"Ngaliema",  tel:"+243810111207", wa:"+243810111207", desc:"Boulangerie artisanale à Ngaliema. Pains frais, croissants, pâtisseries et viennoiseries. Fournées chaque matin.", img:U+"1509440159596-0249088772ff"+Q },
  { nom:"Auto Kinshasa Occasions", type:"Concessionnaire",quartier:"Masina",    tel:"+243810111208", wa:"+243810111208", desc:"Vente de véhicules d'occasion à Kinshasa. Toyota, Honda, Nissan, Mitsubishi. Papiers en règle, essai possible.", img:U+"1503376780353-7e6692767b70"+Q }
];

let netubers = [];
let commerces = [];
let annonces = [];

// ============ CHARGEMENT ============
async function charger() {
  log("Chargement des données...", "info");
  netubers = []; commerces = []; annonces = [];
  const sn = await getDocs(collection(db, 'netubers'));
  sn.forEach(d => netubers.push({ id: d.id, ...d.data() }));
  const sc = await getDocs(collection(db, 'commerces'));
  sc.forEach(d => commerces.push({ id: d.id, ...d.data() }));
  const sa = await getDocs(collection(db, 'annonces'));
  sa.forEach(d => annonces.push({ id: d.id, ...d.data() }));

  document.getElementById('sUsers').textContent = netubers.length;
  document.getElementById('sCom').textContent = commerces.length;
  document.getElementById('sAnn').textContent = annonces.length;
  document.getElementById('sKimono').textContent = annonces.filter(a => a.quartier === 'Kimono').length;

  log(`${netubers.length} netubers · ${commerces.length} commerces · ${annonces.length} annonces`, "ok");
}

// ============ CRÉER BOUTIQUES KINSHASA ============
async function creerBoutiques() {
  log("Création des boutiques Kinshasa...", "title");
  let nb = 0;
  for (const b of BOUTIQUES_KIN) {
    let proprietaire = netubers.find(n => !n.boutique && n.ville === "Kinshasa");
    if (!proprietaire) proprietaire = netubers.find(n => !n.boutique);
    if (!proprietaire) {
      log(`Aucun netuber disponible pour ${b.nom}`, "warn");
      continue;
    }
    const commerceId = "COM-KIN-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);
    const dateCreation = dateVariee(24, 60);
    const boutiqueData = {
      uid: proprietaire.id,
      nom: b.nom,
      nomCommerce: b.nom,
      type: b.type,
      ville: "Kinshasa",
      quartier: b.quartier,
      adresse: "Avenue " + b.quartier + ", Kinshasa",
      horaires: "08h - 20h",
      description: b.desc,
      telephone: b.tel,
      whatsapp: b.wa,
      whatsappCommercial: b.wa,
      img: b.img,
      emoji: "🏪",
      statut: "approuve",
      dateCreation: dateCreation,
      dateApprobation: dateCreation,
      vues: Math.floor(50 + Math.random() * 900),
      produits: PRODUITS.map((p) => ({
        nom: p.n, prix: p.p, prixLabel: p.l, img: p.img,
        categorie: p.c, statut: 'approuve',
        ajouteParAdmin: true,
        dateAjout: dateVariee(2, 25)
      }))
    };

    await setDoc(doc(db, 'commerces', commerceId), boutiqueData);
    await setDoc(doc(db, 'netubers', proprietaire.id), { boutique: boutiqueData }, { merge: true });
    proprietaire.boutique = boutiqueData;
    nb++;
    log(`Boutique créée : ${b.nom} (${b.type})`, "ok");
  }
  log(`${nb} boutiques Kinshasa créées`, "ok");
  await charger();
}

// ============ PUBLIER TOUT ============
async function publierTout() {
  log("Démarrage...", "title");

  // 1) Créer 5 nouveaux netubers avec emails gmail
  log("Création des 5 nouveaux netubers...", "info");
  const nouveauxCrees = [];
  for (const n of NOUVEAUX) {
    const uid = "NTX-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    const dateCreation = dateVariee(24, 90);
    const emailGmail = genererEmailGmail(n.nom, n.prenom, n.phone);
    const data = {
      uid,
      nom: n.nom,
      prenom: n.prenom,
      nomComplet: n.prenom + " " + n.nom,
      sexe: n.sexe,
      phone: n.phone,
      emailAuth: emailGmail,
      code: n.code,
      ville: n.ville,
      role: "user",
      actif: true,
      boutique: null,
      avatarUrl: AVATAR,
      dateCreation: dateCreation,
      creeParAdmin: true
    };
    await setDoc(doc(db, 'netubers', uid), data);
    nouveauxCrees.push({ id: uid, ...data });
    log(`Netuber : ${n.prenom} ${n.nom} — ${emailGmail}`, "ok");
  }

  // 2) Créer les boutiques Kinshasa
  log("Création des 8 boutiques Kinshasa...", "info");
  const tousNetubersTemp = [...netubers, ...nouveauxCrees];
  let nbBoutiques = 0;
  for (const b of BOUTIQUES_KIN) {
    let proprietaire = tousNetubersTemp.find(n => !n.boutique && n.ville === "Kinshasa" && n.creeParAdmin);
    if (!proprietaire) proprietaire = tousNetubersTemp.find(n => !n.boutique && n.ville === "Kinshasa");
    if (!proprietaire) proprietaire = tousNetubersTemp.find(n => !n.boutique);
    if (!proprietaire) {
      log(`Aucun netuber disponible pour ${b.nom}`, "warn");
      continue;
    }
    const commerceId = "COM-KIN-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);
    const dateCreation = dateVariee(24, 60);
    const boutiqueData = {
      uid: proprietaire.id,
      nom: b.nom, nomCommerce: b.nom,
      type: b.type,
      ville: "Kinshasa", quartier: b.quartier,
      adresse: "Avenue " + b.quartier + ", Kinshasa",
      horaires: "08h - 20h",
      description: b.desc,
      telephone: b.tel, whatsapp: b.wa, whatsappCommercial: b.wa,
      img: b.img, emoji: "🏪", statut: "approuve",
      dateCreation: dateCreation, dateApprobation: dateCreation,
      vues: Math.floor(50 + Math.random() * 900),
      produits: PRODUITS.map((p) => ({
        nom: p.n, prix: p.p, prixLabel: p.l, img: p.img,
        categorie: p.c, statut: 'approuve', ajouteParAdmin: true,
        dateAjout: dateVariee(2, 25)
      }))
    };
    await setDoc(doc(db, 'commerces', commerceId), boutiqueData);
    await setDoc(doc(db, 'netubers', proprietaire.id), { boutique: boutiqueData }, { merge: true });
    proprietaire.boutique = boutiqueData;
    nbBoutiques++;
    log(`Boutique : ${b.nom}`, "ok");
  }
  log(`${nbBoutiques} boutiques créées`, "ok");

  // 3) Publier annonces avec dates et vues variées
  log("Publication des annonces (dates + vues variées)...", "info");
  const tous = [...netubers, ...nouveauxCrees];
  let nbAnn = 0;
  for (const user of tous) {
    const isCommerce = user.boutique && user.boutique.statut === 'approuve';
    const nomAffiche = isCommerce ? user.boutique.nom : (user.nomComplet || user.phone || "Utilisateur");

    for (const cat of Object.keys(ANNONCES)) {
      const catInfo = CAT[cat];
      const items = ANNONCES[cat];
      for (let i = 0; i < items.length; i++) {
        const a = items[i];
        const annonceId = "ANN-AUTO-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);
        const images = [catInfo.imgs[i%5], catInfo.imgs[(i+1)%5], catInfo.imgs[(i+2)%5], catInfo.imgs[(i+3)%5], catInfo.imgs[(i+4)%5]];
        const dateCreation = dateVariee(2, 30);
        const vues = vuesVariees(cat, dateCreation);

        await setDoc(doc(db, 'annonces', annonceId), {
          titre: a.t, desc: a.d,
          ville: a.v, quartier: a.q,
          prix: a.p,
          img: images[0], images: images,
          cat: cat, tag: catInfo.tag, tagClass: catInfo.cls,
          proprietaireUid: user.id,
          publieurNom: nomAffiche,
          publieurType: isCommerce ? 'commerce' : 'user',
          publieurBoutique: isCommerce ? nomAffiche : null,
          publieurPhone: user.phone || "",
          publieurVille: a.v,
          publieurSexe: user.sexe || "",
          ajouteParAdmin: true,
          dateCreation: dateCreation,
          actif: true, statut: "approuve",
          vues: vues
        });

        await setDoc(doc(db, 'annonces', annonceId, 'prive', 'contact'), {
          nom: nomAffiche,
          adresse: a.q + ", " + a.v,
          telephone: user.phone || "",
          email: user.emailAuth || ""
        });
        nbAnn++;
      }
    }
  }
  log(`${nbAnn} annonces publiées`, "ok");
  log("Terminé.", "ok");
  await charger();
}

// ============ NETTOYER ============
async function nettoyer() {
  log("Recherche de Lynda Chris...", "info");
  let supprimes = 0;

  for (const n of netubers) {
    const nom = ((n.nomComplet || '') + ' ' + (n.nom || '') + ' ' + (n.prenom || '')).toLowerCase();
    if (nom.includes('lynda') || nom.includes('lunda chris') || nom.includes('linda')) {
      await deleteDoc(doc(db, 'netubers', n.id));
      log(`Netuber supprimé : ${n.nomComplet || n.id}`, "warn");
      supprimes++;
    }
  }

  const sa = await getDocs(collection(db, 'annonces'));
  for (const d of sa.docs) {
    if (d.id.startsWith('ANN-AUTO-') || d.id.startsWith('ANN-KIMONO-')) {
      await deleteDoc(doc(db, 'annonces', d.id));
      supprimes++;
    }
  }
  log(`${supprimes} éléments supprimés`, "ok");
  await charger();
}

// ============ SUPPRIMER TOUT ============
async function supprimerTout() {
  if (!confirm("Supprimer TOUTES les annonces, TOUS les netubers et TOUS les commerces ? Action IRRÉVERSIBLE.")) return;
  if (!confirm("Confirmer une seconde fois ?")) return;

  log("Suppression totale en cours...", "title");
  let total = 0;

  for (const a of annonces) {
    try {
      const priv = await getDocs(collection(db, 'annonces', a.id, 'prive'));
      for (const p of priv.docs) await deleteDoc(doc(db, 'annonces', a.id, 'prive', p.id));
      await deleteDoc(doc(db, 'annonces', a.id));
      total++;
    } catch(e) {}
  }

  for (const n of netubers) {
    try { await deleteDoc(doc(db, 'netubers', n.id)); total++; } catch(e) {}
  }

  for (const c of commerces) {
    try { await deleteDoc(doc(db, 'commerces', c.id)); total++; } catch(e) {}
  }

  log(`${total} documents supprimés`, "ok");
  await charger();
}

// ============ BOUTONS ============
document.getElementById('btnPublier').onclick = async () => {
  const b = document.getElementById('btnPublier');
  b.disabled = true;
  try { await publierTout(); } catch(e) { log("Erreur : " + e.message, "err"); }
  b.disabled = false;
};

  const b = document.getElementById('btnBoutiques');

  try { await creerBoutiques(); } catch(e) { log("Erreur : " + e.message, "err"); }
  b.disabled = false;
};

  const b = document.getElementById('btnNettoyer');
  b.disabled = true;
  try { await nettoyer(); } catch(e) { log("Erreur : " + e.message, "err"); }
  b.disabled = false;
};

document.getElementById('btnTout').onclick = async () => {
  const b = document.getElementById('btnTout');
  b.disabled = true;
  try { await supprimerTout(); } catch(e) { log("Erreur : " + e.message, "err"); }
  b.disabled = false;
};

charger().catch(e => log("Erreur chargement : " + e.message, "err"));

<style>

body{background:var(--wa-bg);color:var(--wa-text);font-size:14px;overflow:hidden}

.chat-bubble-patch{max-width:78%;align-self:flex-start;background:linear-gradient(135deg,#4a3a8a 0%,#5b4bb8 100%);border-radius:10px;border-top-left-radius:0;padding:12px 14px;color:#ffffff;box-shadow:0 2px 12px rgba(103,86,218,.3);animation:chatMsgIn .25s ease-out;position:relative;cursor:pointer;border:1px solid rgba(167,139,250,.4)}
.chat-bubble-patch::before{content:'';position:absolute;top:0;left:-8px;width:0;height:0;border-style:solid;border-width:0 8px 8px 0;border-color:transparent #4a3a8a transparent transparent}
.chat-patch-bubble-header{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:#e0d9ff;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(224,217,255,.25);text-transform:uppercase;letter-spacing:.5px}

.chat-patch-bubble-desc{font-size:13.5px;line-height:1.6;white-space:pre-wrap;color:#ffffff;margin-bottom:8px}

.chat-delete-actions{display:flex;justify-content:flex-end;gap:8px}
.chat-delete-cancel,.chat-delete-confirm{background:transparent;border:none;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.chat-delete-cancel{color:var(--wa-text-2)}
.chat-delete-confirm{color:var(--wa-danger)}
.chat-delete-confirm:hover{background:rgba(234,67,53,.1)}
.chat-patch-modal{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:300;opacity:0;visibility:hidden;transition:opacity .2s ease;padding:16px}
.chat-patch-modal.active{opacity:1;visibility:visible}
.chat-patch-box{background:#ffffff;border-radius:14px;width:100%;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:90vh}
.chat-patch-header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--wa-border)}
.chat-patch-icon{font-size:22px}
.chat-patch-title{flex:1;color:var(--wa-text);font-size:16px;font-weight:600}
.chat-patch-close{background:transparent;border:none;color:var(--wa-text-2);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:50%}
.chat-patch-body{padding:16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.chat-patch-field{display:flex;flex-direction:column;gap:6px}
.chat-patch-field label{color:var(--wa-text-2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.chat-patch-field input,.chat-patch-field textarea{width:100%;padding:11px 14px;background:#f0f2f5;border:1px solid #f0f2f5;border-radius:10px;color:var(--wa-text);font-size:14px;font-family:inherit;outline:none}
.chat-patch-field input:focus,.chat-patch-field textarea:focus{border-color:var(--wa-green);background:#ffffff}
.chat-patch-field textarea{resize:none;min-height:100px;line-height:1.5}
.chat-patch-footer{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--wa-border)}
.chat-patch-cancel,.chat-patch-send{background:transparent;border:none;padding:10px 20px;border-radius:22px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.chat-patch-cancel{color:var(--wa-text-2)}

.chat-patch-send:hover{background:var(--wa-green-hov)}
@media(max-width:480px){.chat-bubble{max-width:88%}.chat-messages{padding:12px 3% 8px}.chat-header{height:56px;padding:0 8px}.chat-contact-name{font-size:15px}.chat-input-bar{padding:6px 8px}}
</style>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, runTransaction } from "firebase/firestore";
import { getAuth, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword } from "firebase/auth";

const firebaseConfig = {
  apiKey: "AIzaSyBma80S0bc9uzSuO38qn7JLSwLrYniV5Fw",
  authDomain: "gesco-2.firebaseapp.com",
  projectId: "gesco-2",
  storageBucket: "gesco-2.firebasestorage.app",
  messagingSenderId: "36319988765",
  appId: "1:36319988765:web:e8cd823804596495248af4"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const CHAT_REF = () => doc(db, "communication", "chat_support_dsi");

const ADMIN_EMAIL_B64 = "Y2hhbmNlQGdtYWlsLmNvbQ==";
const ADMIN_PASSWORD = "chance020";

async function ensureAdminAccount() {
  const email = atob(ADMIN_EMAIL_B64);
  try {
    await createUserWithEmailAndPassword(auth, email, ADMIN_PASSWORD);
  } catch (e) {
    if (e.code !== 'auth/email-already-in-use') {
      console.warn('Compte:', e.code);
    }
  }
}

ensureAdminAccount();

let currentUser = null;
let chatUnsub = null;
let chatMsgs = [];
let msgToDelete = null;
let chatRenderedIds = new Set();

const loginOverlay = document.getElementById('loginOverlay');
const chatApp = document.getElementById('chatApp');
const loginPassword = document.getElementById('loginPassword');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const loginSuccess = document.getElementById('loginSuccess');

loginBtn.addEventListener('click', handleLogin);
loginPassword.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

async function handleLogin() {
  const password = loginPassword.value.trim();
  loginError.textContent = ''; loginSuccess.textContent = '';
  if (!password) { loginError.textContent = 'Veuillez entrer le mot de passe'; return; }
  const email = atob(ADMIN_EMAIL_B64);
  loginBtn.disabled = true;
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    currentUser = cred.user;
    loginSuccess.textContent = 'Connecté';
    setTimeout(() => {
      loginOverlay.classList.add('hidden');
      chatApp.classList.add('active');
      ouvrirChat();
    }, 400);
  } catch (e) {
    loginError.textContent = (
      e.code === 'auth/wrong-password' ? 'Mot de passe incorrect' :
      e.code === 'auth/user-not-found' ? 'Compte introuvable' :
      e.code === 'auth/invalid-credential' ? 'Identifiants invalides' :
      e.message
    );
  } finally {
    loginBtn.disabled = false;
  }
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  if (chatUnsub) { chatUnsub(); chatUnsub = null; }
  await signOut(auth);
  chatApp.classList.remove('active');
  loginOverlay.classList.remove('hidden');
  loginPassword.value = '';
});

function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function ouvrirChat() {
  if (chatUnsub) chatUnsub();
  chatRenderedIds = new Set();
  chatUnsub = onSnapshot(CHAT_REF(), snap => {
    const data = snap.exists() ? snap.data() : { messages: [] };
    chatMsgs = (data.messages || []).sort((a,b) => a.timestamp - b.timestamp);
    renderChat();
    const nonLus = chatMsgs.filter(m => m.expediteur === 'direction' && m.lu !== true).length;
    if (nonLus > 0) marquerLus();
  }, err => { console.error(err); });
}

function renderChat() {
  const area = document.getElementById('chatMessagesArea');
  if (!area) return;

  let html = `<div class="chat-welcome">
    <div class="chat-welcome-icon">🔒</div>
    <div class="chat-welcome-title">Vos messages sont sécurisés</div>
    <div class="chat-welcome-text">Les messages disparaissent après <strong>24 heures</strong>.</div>
  </div>`;

  let lastDate = '';
  chatMsgs.forEach(m => {
    const d = new Date(m.timestamp).toLocaleDateString('fr-FR', {day:'2-digit', month:'long', year:'numeric'});
    if (d !== lastDate) {
      const today = new Date().toLocaleDateString('fr-FR', {day:'2-digit', month:'long', year:'numeric'});
      html += `<div class="chat-date-separator">${d === today ? "Aujourd'hui" : d}</div>`;
      lastDate = d;
    }

    if (m.type === 'patch') {
      html += `<div class="chat-bubble-patch" data-id="${m.id}">
        <div class="chat-patch-bubble-header">📤 Patch envoyé</div>
        ${m.lien ? `<a class="chat-patch-bubble-link" href="${escapeHtml(m.lien)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 ${escapeHtml(m.lien)}</a>` : ''}
        ${m.texte ? `<div class="chat-patch-bubble-desc">${escapeHtml(m.texte)}</div>` : ''}
        <div class="chat-patch-bubble-meta"><span>${m.heure||''}</span><span class="chat-bubble-check ${m.lu?'read':''}">${m.lu?'✓✓':'✓'}</span></div>
      </div>`;
      return;
    }

    const out = m.expediteur === 'direction';
    html += `<div class="chat-bubble ${out?'chat-bubble-out':'chat-bubble-in'}" data-id="${m.id}">
      <div class="chat-bubble-text">${escapeHtml(m.texte||'')}</div>
      <div class="chat-bubble-meta"><span>${m.heure||''}</span>${out?`<span class="chat-bubble-check ${m.lu?'read':''}">${m.lu?'✓✓':'✓'}</span>`:''}</div>
    </div>`;
  });

  area.innerHTML = html;
  chatMsgs.forEach(m => chatRenderedIds.add(m.id));
  setTimeout(() => area.scrollTop = area.scrollHeight, 50);

  area.querySelectorAll('[data-id]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      msgToDelete = el.dataset.id;
      document.getElementById('chatDeleteModal')?.classList.add('active');
    });
  });
}

async function envoyerMsg() {
  const inp = document.getElementById('chatMessageInput');
  const txt = inp.value.trim();
  if (!txt) return;
  const btn = document.getElementById('chatSendBtn');
  btn.disabled = true;
  try {
    const now = Date.now();
    const heure = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    await runTransaction(db, async tx => {
      const ref = CHAT_REF();
      const snap = await tx.get(ref);
      const data = snap.exists() ? snap.data() : { messages: [] };
      let msgs = data.messages || [];
      msgs.push({
        id: crypto.randomUUID(),
        texte: txt,
        expediteur: 'support',
        auteur: currentUser?.email || 'support@netubex.com',
        timestamp: now,
        expireAt: now + 24*60*60*1000,
        heure,
        lu: false
      });
      tx.set(ref, {
        messages: msgs,
        nonLusSupport: 0,
        nonLusDirection: (data.nonLusDirection || 0) + 1,
        updatedAt: now
      });
    });
    inp.value = '';
    inp.style.height = 'auto';
  } catch (e) { alert('Erreur: ' + e.message); }
  btn.disabled = false;
}

async function marquerLus() {
  try {
    await runTransaction(db, async tx => {
      const ref = CHAT_REF();
      const snap = await tx.get(ref);
      if (!snap.exists()) return;
      const data = snap.data();
      const msgs = (data.messages || []).map(m => m.expediteur === 'direction' ? {...m, lu: true} : m);
      tx.update(ref, { messages: msgs, nonLusSupport: 0 });
    });
  } catch(e) {}
}

async function supprimerMsg() {
  document.getElementById('chatDeleteModal')?.classList.remove('active');
  if (!msgToDelete) return;
  const id = msgToDelete;
  msgToDelete = null;
  try {
    await runTransaction(db, async tx => {
      const ref = CHAT_REF();
      const snap = await tx.get(ref);
      if (!snap.exists()) return;
      const data = snap.data();
      const now = Date.now();
      const msgs = (data.messages || []).filter(m => m.id !== id).filter(m => !m.expireAt || m.expireAt > now);
      tx.set(ref, { messages: msgs, updatedAt: now });
    });
  } catch(e) { alert('Erreur: ' + e.message); }
}

document.getElementById('chatSendBtn')?.addEventListener('click', envoyerMsg);
document.getElementById('chatDeleteCancel')?.addEventListener('click', () => {
  document.getElementById('chatDeleteModal')?.classList.remove('active');
  msgToDelete = null;
});
document.getElementById('chatDeleteConfirm')?.addEventListener('click', supprimerMsg);

const chatInputEl = document.getElementById('chatMessageInput');
chatInputEl?.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); envoyerMsg(); }
});
chatInputEl?.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>👨‍🏫 Enseignant</title>
<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"}}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0A0A0A;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.container{max-width:460px;width:100%;}
.box{background:rgba(255,255,255,0.04);backdrop-filter:blur(60px);border-radius:32px;padding:36px 32px;border:1px solid rgba(255,255,255,0.06);box-shadow:0 40px 80px rgba(0,0,0,0.5);}
.box .logo{text-align:center;margin-bottom:16px;}
.box .logo .icon{background:linear-gradient(135deg,#3B82F6,#8B5CF6);width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:32px;font-weight:900;color:#fff;box-shadow:0 0 50px rgba(59,130,246,0.2);}
.box h1{font-size:20px;font-weight:800;text-align:center;margin-top:6px;}
.box .sub{text-align:center;color:rgba(255,255,255,0.35);font-size:12px;margin-bottom:18px;}
.box label{display:block;font-size:10px;font-weight:600;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:5px;}
.box select{width:100%;padding:14px;border-radius:12px;background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.06);color:#fff;font-size:16px;outline:none;transition:all 0.3s;margin-bottom:14px;appearance:auto;cursor:pointer;}
.box select:focus{border-color:#8B5CF6;background:rgba(255,255,255,0.06);box-shadow:0 0 0 4px rgba(139,92,246,0.06);}
.box select option{background:#1a1a2e;color:#fff;}
.box input{width:100%;padding:14px;border-radius:12px;background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.06);color:#fff;font-size:20px;outline:none;transition:all 0.3s;text-align:center;letter-spacing:8px;font-family:monospace;margin-bottom:14px;}
.box input:focus{border-color:#8B5CF6;background:rgba(255,255,255,0.06);box-shadow:0 0 0 4px rgba(139,92,246,0.06);}
.box input::placeholder{letter-spacing:4px;font-size:14px;color:rgba(255,255,255,0.12);}
.box .btn{width:100%;padding:16px;border:none;border-radius:12px;font-weight:700;font-size:16px;cursor:pointer;transition:all 0.3s;color:#fff;background:linear-gradient(135deg,#3B82F6,#8B5CF6);box-shadow:0 8px 30px rgba(59,130,246,0.2);}
.box .btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(59,130,246,0.3);}
.box .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.box .error{color:#EC4899;font-size:13px;text-align:center;margin-top:8px;min-height:20px;padding:4px;}
.box .info{text-align:center;color:rgba(255,255,255,0.08);font-size:10px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.03);}
.box .debug{background:rgba(255,255,255,0.02);border-radius:8px;padding:10px 12px;font-size:10px;color:rgba(255,255,255,0.3);margin-top:10px;font-family:monospace;word-break:break-all;max-height:80px;overflow-y:auto;border:1px solid rgba(255,255,255,0.03);}
.loader{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="container">
  <div class="box">
    <div class="logo"><div class="icon">👨‍🏫</div></div>
    <h1 id="schoolName">COMPLEXE SCOLAIRE</h1>
    <p class="sub">Connexion enseignant</p>
    
    <label>👤 Choisissez votre nom</label>
    <select id="enseignantSelect">
      <option value="">⏳ Chargement...</option>
    </select>
    
    <label>🔑 Code d'accès</label>
    <input type="password" id="codeInput" placeholder="••••••" maxlength="6" inputmode="numeric" />
    
    <button class="btn" id="loginBtn">🔓 SE CONNECTER</button>
    <div class="error" id="loginError"></div>
    <div class="info">💡 Votre code vous a été transmis par la direction</div>
    <div class="debug" id="debugInfo"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, getDocs, query, where } from "firebase/firestore";
import { getAuth, signInWithEmailAndPassword } from "firebase/auth";

const firebaseConfig = {
  apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
  authDomain: "gesco-67c43.firebaseapp.com",
  projectId: "gesco-67c43",
  storageBucket: "gesco-67c43.firebasestorage.app",
  messagingSenderId: "333004443566",
  appId: "1:333004443566:web:de41f60000e418dce9023f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const urlParams = new URLSearchParams(window.location.search);
const schoolId = urlParams.get('ecole') || 'test_ecole';
const ECOLET_ID = schoolId.replace(/[^a-zA-Z0-9]/g, '_');

document.getElementById('schoolName').textContent = 'COMPLEXE SCOLAIRE ' + schoolId.toUpperCase();

let enseignants = [];

async function chargerEnseignants() {
  const select = document.getElementById('enseignantSelect');
  const debug = document.getElementById('debugInfo');
  
  select.innerHTML = '<option value="">⏳ Chargement...</option>';
  debug.textContent = '🔍 ' + ECOLET_ID;
  
  try {
    const snapAll = await getDocs(collection(db, 'ecoles', ECOLET_ID, 'enseignants'));
    let countTotal = 0, countType = 0, countActif = 0;
    let noms = '';
    
    snapAll.forEach(ds => {
      const data = ds.data();
      countTotal++;
      if (data._type === 'enseignant') countType++;
      if (data.actif === true) countActif++;
      noms += '\n- ' + (data.nom || '?') + ' | _type:' + (data._type || '?') + ' | actif:' + data.actif;
    });
    
    debug.textContent = '📚 ' + countTotal + ' doc(s)\n_type:' + countType + ' | actif:' + countActif + noms;
    
    const snap = await getDocs(query(
      collection(db, 'ecoles', ECOLET_ID, 'enseignants'),
      where('_type', '==', 'enseignant'),
      where('actif', '==', true)
    ));
    
    enseignants = [];
    snap.forEach(ds => {
      const data = ds.data();
      enseignants.push({ id: ds.id, nom: data.nom, email: data.email, code: data.code });
    });
    
    enseignants.sort((a, b) => a.nom.localeCompare(b.nom));
    
    if (enseignants.length === 0) {
      select.innerHTML = '<option value="">📭 Aucun enseignant</option>';
      if (countTotal === 0) {
        document.getElementById('loginError').textContent = '⚠️ Aucun enseignant dans cette école';
      } else if (countType === 0) {
        document.getElementById('loginError').textContent = '⚠️ Pas de _type="enseignant"';
      } else if (countActif === 0) {
        document.getElementById('loginError').textContent = '⚠️ Enseignants existants mais inactifs';
      } else {
        document.getElementById('loginError').textContent = '⚠️ Aucun enseignant trouvé';
      }
      return;
    }
    
    select.innerHTML = '<option value="">-- Choisissez votre nom --</option>';
    enseignants.forEach(ens => {
      const opt = document.createElement('option');
      opt.value = ens.id;
      opt.textContent = ens.nom;
      select.appendChild(opt);
    });
    
    document.getElementById('loginError').textContent = '';
    
  } catch(e) {
    console.error('❌', e);
    select.innerHTML = '<option value="">❌ Erreur</option>';
    document.getElementById('loginError').textContent = '❌ ' + e.message;
    debug.textContent += '\n❌ ' + e.message;
  }
}

document.getElementById('loginBtn').addEventListener('click', async function() {
  const ensId = document.getElementById('enseignantSelect').value;
  const code = document.getElementById('codeInput').value.trim();
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  
  if (!ensId) {
    errorEl.textContent = '⚠️ Choisissez votre nom';
    return;
  }
  
  if (!code || code.length < 6) {
    errorEl.textContent = '⚠️ Code à 6 chiffres';
    return;
  }
  
  const enseignant = enseignants.find(e => e.id === ensId);
  if (!enseignant) {
    errorEl.textContent = '❌ Enseignant non trouvé';
    return;
  }
  
  if (enseignant.code !== code) {
    errorEl.textContent = '❌ Code incorrect';
    return;
  }
  
  this.disabled = true;
  this.innerHTML = '<span class="loader"></span> Connexion...';
  
  try {
    await signInWithEmailAndPassword(auth, enseignant.email, code);
    window.location.href = 'enseignant-dashboard.html?ecole=' + schoolId + '&id=' + enseignant.id;
  } catch(e) {
    errorEl.textContent = '❌ ' + e.message;
    this.disabled = false;
    this.innerHTML = '🔓 SE CONNECTER';
  }
});

document.getElementById('codeInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('codeInput').addEventListener('input', function() {
  this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
  document.getElementById('loginError').textContent = '';
});

document.getElementById('enseignantSelect').addEventListener('change', function() {
  document.getElementById('loginError').textContent = '';
  document.getElementById('codeInput').value = '';
  document.getElementById('codeInput').focus();
});

chargerEnseignants();
</script>
</body>
</html>

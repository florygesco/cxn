body{background:#0A0A0A;color:#fff;min-height:100vh;padding:16px;}

.box{background:rgba(255,255,255,0.04);backdrop-filter:blur(60px);border-radius:32px;padding:36px 32px;border:1px solid rgba(255,255,255,0.06);box-shadow:0 40px 80px rgba(0,0,0,0.5);margin-bottom:12px;}

.box .logo .icon{background:linear-gradient(135deg,#3B82F6,#8B5CF6);width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:32px;font-weight:900;color:#fff;box-shadow:0 0 50px rgba(59,130,246,0.2);}

.box .debug{background:rgba(255,255,255,0.02);border-radius:8px;padding:10px 12px;font-size:10px;color:rgba(255,255,255,0.3);margin-top:10px;font-family:monospace;word-break:break-all;max-height:80px;overflow-y:auto;border:1px solid rgba(255,255,255,0.03);}
.loader{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:8px;}

.topbar{background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.04);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-radius:12px 12px 0 0;}
.topbar .brand{display:flex;align-items:center;gap:12px;}
.topbar .brand .logo{background:linear-gradient(135deg,#3B82F6,#8B5CF6);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#fff;}

.btn-sm:hover{transform:scale(0.97);}

.tabs{display:flex;gap:4px;margin:12px 0;overflow-x:auto;padding:2px 0;}
.tab{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:6px 14px;border-radius:20px;font-size:10px;font-weight:600;cursor:pointer;color:rgba(255,255,255,0.4);transition:all 0.2s;white-space:nowrap;}
.tab:hover{background:rgba(255,255,255,0.03);color:#fff;}
.tab.active{background:rgba(139,92,246,0.12);border-color:#8B5CF6;color:#8B5CF6;}

.tab-content.active{display:block;}

.card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:12px;padding:14px;margin-bottom:12px;}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.card-header h3{font-size:13px;font-weight:600;color:rgba(255,255,255,0.8);display:flex;align-items:center;gap:6px;}

.form-group label{font-size:9px;font-weight:600;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.5px;}
.form-group input,.form-group select{padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);color:#fff;font-size:12px;outline:none;transition:all 0.2s;}
.form-group input:focus,.form-group select:focus{border-color:#8B5CF6;background:rgba(255,255,255,0.05);}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:10px;}
th{background:rgba(255,255,255,0.02);padding:5px 8px;text-align:left;color:rgba(255,255,255,0.3);font-weight:600;font-size:8px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid rgba(255,255,255,0.04);}
td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,0.02);color:rgba(255,255,255,0.7);}
.empty{text-align:center;padding:20px;color:rgba(255,255,255,0.2);font-size:12px;}
.toast{position:fixed;bottom:20px;right:20px;background:rgba(20,20,40,0.95);backdrop-filter:blur(20px);border-radius:10px;padding:10px 18px;border-left:3px solid #10B981;transform:translateY(100px);opacity:0;transition:all 0.3s;z-index:999;max-width:90%;font-size:13px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{border-left-color:#EC4899;}
.toast.warning{border-left-color:#FBBF24;}
@media(max-width:600px){.form-row{grid-template-columns:1fr;}.topbar{flex-direction:column;text-align:center;}.topbar .right{justify-content:center;}}
</style>

  <!-- ===== CONNEXION ===== -->
  <div id="loginSection">

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, updateDoc, query, where } from "firebase/firestore";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";

const firebaseConfig = {
  apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
  authDomain: "gesco-67c43.firebaseapp.com",
  projectId: "gesco-67c43",
  storageBucket: "gesco-67c43.firebasestorage.app",
  messagingSenderId: "333004443566",
  appId: "1:333004443566:web:de41f60000e418dce9023f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ECOLET_ID = "odari";
document.getElementById('schoolName').textContent = 'COMPLEXE SCOLAIRE ODARI';
document.getElementById('debugInfo').textContent = '📁 École: odari';

let enseignants = [];
let enseignantActuel = null;

function toast(msg, type='success'){
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  el.className = 'toast ' + type;
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ============================================
// CONNEXION
// ============================================

async function chargerEnseignants() {
  const select = document.getElementById('enseignantSelect');
  const debug = document.getElementById('debugInfo');
  select.innerHTML = '<option value="">⏳ Chargement...</option>';
  debug.textContent = '🔍 odari/enseignants';
  
  try {
    const snapAll = await getDocs(collection(db, 'ecoles', ECOLET_ID, 'enseignants'));
    let countTotal = 0, countType = 0, countActif = 0;
    let details = '';
    
    snapAll.forEach(ds => {
      const data = ds.data();
      countTotal++;
      if (data._type === 'enseignant') countType++;
      if (data.actif === true) countActif++;
      details += '\n- ' + (data.nom || '?') + ' | _type: ' + (data._type || '?') + ' | actif: ' + data.actif;
    });
    
    debug.textContent = '📚 ' + countTotal + ' doc(s)\n📌 _type: ' + countType + ' | actif: ' + countActif + details;
    
    const snap = await getDocs(query(
      collection(db, 'ecoles', ECOLET_ID, 'enseignants'),
      where('_type', '==', 'enseignant'),
      where('actif', '==', true)
    ));
    
    enseignants = [];
    snap.forEach(ds => {
      const data = ds.data();
      enseignants.push({ id: ds.id, nom: data.nom, email: data.email, code: data.code });
    });
    
    enseignants.sort((a, b) => a.nom.localeCompare(b.nom));
    
    if (enseignants.length === 0) {
      select.innerHTML = '<option value="">📭 Aucun enseignant</option>';
      if (countTotal === 0) {
        document.getElementById('loginError').textContent = '⚠️ Aucun enseignant dans odari';
      } else if (countType === 0) {
        document.getElementById('loginError').textContent = '⚠️ Pas de _type="enseignant"';
      } else if (countActif === 0) {
        document.getElementById('loginError').textContent = '⚠️ Enseignants inactifs';
      }
      return;
    }
    
    select.innerHTML = '<option value="">-- Choisissez votre nom --</option>';
    enseignants.forEach(ens => {
      const opt = document.createElement('option');
      opt.value = ens.id;
      opt.textContent = ens.nom;
      select.appendChild(opt);
    });
    
    document.getElementById('loginError').textContent = '';
    
  } catch(e) {
    console.error('❌', e);
    select.innerHTML = '<option value="">❌ Erreur</option>';
    document.getElementById('loginError').textContent = '❌ ' + e.message;
  }
}

document.getElementById('loginBtn').addEventListener('click', async function() {
  const ensId = document.getElementById('enseignantSelect').value;
  const code = document.getElementById('codeInput').value.trim();
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  
  if (!ensId) { errorEl.textContent = '⚠️ Choisissez votre nom'; return; }
  if (!code || code.length < 6) { errorEl.textContent = '⚠️ Code à 6 chiffres'; return; }
  
  const enseignant = enseignants.find(e => e.id === ensId);
  if (!enseignant) { errorEl.textContent = '❌ Enseignant non trouvé'; return; }
  if (enseignant.code !== code) { errorEl.textContent = '❌ Code incorrect'; return; }
  
  this.disabled = true;
  this.innerHTML = '<span class="loader"></span> Connexion...';
  
  try {
    await signInWithEmailAndPassword(auth, enseignant.email, code);
  } catch(e) {
    errorEl.textContent = '❌ ' + e.message;
    this.disabled = false;
    this.innerHTML = '🔓 SE CONNECTER';
  }
});

document.getElementById('codeInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

document.getElementById('codeInput').addEventListener('input', function() {
  this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
  document.getElementById('loginError').textContent = '';
});

document.getElementById('enseignantSelect').addEventListener('change', function() {
  document.getElementById('loginError').textContent = '';
  document.getElementById('codeInput').value = '';
  document.getElementById('codeInput').focus();
});

// ============================================
// AUTH STATE
// ============================================

onAuthStateChanged(auth, async (user) => {
  if(user){
    try {
      const snap = await getDocs(query(
        collection(db, 'ecoles', ECOLET_ID, 'enseignants'),
        where('_type', '==', 'enseignant'),
        where('email', '==', user.email)
      ));
      snap.forEach(ds => {
        enseignantActuel = { id: ds.id, ...ds.data() };
      });
      
      if(enseignantActuel){
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('ensNomDisplay').textContent = enseignantActuel.nom || 'Enseignant';
        document.getElementById('userDisplay').textContent = '👤 ' + (enseignantActuel.nom || 'Enseignant');
        chargerClassesPourCahier();
        chargerCahiers();
        chargerSelectCahiers();
      }
    } catch(e){ console.error(e); }
  }
});

window.deconnexion = function(){
  if(confirm('Se déconnecter ?')){
    signOut(auth);
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('codeInput').value = '';
    toast('👋 Déconnecté');
  }
};

// ============================================
// CAHIERS
// ============================================

async function chargerClassesPourCahier(){
  const select = document.getElementById('cahierClasse');
  try {
    const classes = new Set();
    if(enseignantActuel && enseignantActuel.classes){
      enseignantActuel.classes.forEach(c => classes.add(c));
    }
    select.innerHTML = '<option value="">-- Sélectionner --</option>';
    Array.from(classes).sort().forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      select.appendChild(opt);
    });
  } catch(e){ console.error(e); }
}

window.creerCahier = async function(){
  const classe = document.getElementById('cahierClasse').value;
  const matiere = document.getElementById('cahierMatiere').value.trim();
  if(!classe){ toast('⚠️ Sélectionnez une classe', 'error'); return; }
  if(!matiere){ toast('⚠️ Entrez une matière', 'error'); return; }
  
  try {
    const eleves = [];
    const snap = await getDocs(query(collection(db, 'ecoles', ECOLET_ID, 'prima_eleves'), where('classe','==',classe)));
    snap.forEach(ds => {
      const d = ds.data();
      eleves.push({id: ds.id, nom: d.nom||'', prenom: d.prenom||'', sexe: d.sexe||'M', notes: {}});
    });
    const snap2 = await getDocs(query(collection(db, 'ecoles', ECOLET_ID, 'mater_eleves'), where('classe','==',classe)));
    snap2.forEach(ds => {
      const d = ds.data();
      eleves.push({id: ds.id, nom: d.nom||'', prenom: d.prenom||'', sexe: d.sexe||'F', notes: {}});
    });
    
    if(eleves.length === 0){ toast('⚠️ Aucun élève dans cette classe', 'error'); return; }
    
    const cahierId = 'cahier_' + Date.now();
    await setDoc(doc(db, 'ecoles', ECOLET_ID, 'cahiers', cahierId), {
      classe, matiere, eleves, epreuves: {1:[],2:[],3:[],4:[]},
      enseignantId: enseignantActuel.id, enseignantNom: enseignantActuel.nom,
      createdAt: Date.now(), school: ECOLET_ID
    });
    
    toast('✅ Cahier créé avec ' + eleves.length + ' élèves');
    chargerCahiers();
    chargerSelectCahiers();
    document.getElementById('cahierMatiere').value = '';
  } catch(e){ toast('❌ ' + e.message, 'error'); }
};

async function chargerCahiers(){
  const container = document.getElementById('cahierListe');
  try {
    const snap = await getDocs(query(
      collection(db, 'ecoles', ECOLET_ID, 'cahiers'),
      where('enseignantId','==',enseignantActuel?.id || '')
    ));
    const cahiers = [];
    snap.forEach(ds => cahiers.push({id: ds.id, ...ds.data()}));
    document.getElementById('cahierCompteur').textContent = cahiers.length;
    
    if(cahiers.length === 0){
      container.innerHTML = '<div class="empty">📭 Aucun cahier créé</div>';
      return;
    }
    
    let html = '<div style="display:flex;flex-direction:column;gap:6px;">';
    cahiers.forEach(c => {
      html += `<div style="background:rgba(255,255,255,0.02);border-radius:10px;padding:10px 14px;border:1px solid rgba(255,255,255,0.04);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
        <div><strong style="color:#8B5CF6;">${c.matiere}</strong> <span style="color:rgba(255,255,255,0.4);font-size:11px;">${c.classe}</span></div>
        <div style="font-size:10px;color:rgba(255,255,255,0.3);">${(c.eleves||[]).length} élèves</div>
        <button class="btn-sm btn-sm-danger" onclick="supprimerCahier('${c.id}')" style="padding:2px 10px;">✕</button>
      </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
  } catch(e){ console.error(e); }
}

window.supprimerCahier = function(id){
  if(!confirm('Supprimer ce cahier ?')) return;
  deleteDoc(doc(db, 'ecoles', ECOLET_ID, 'cahiers', id))
    .then(() => { toast('🗑️ Cahier supprimé'); chargerCahiers(); chargerSelectCahiers(); })
    .catch(() => toast('❌ Erreur', 'error'));
};

// ============================================
// NOTES
// ============================================

async function chargerSelectCahiers(){
  const select = document.getElementById('notesCahier');
  try {
    const snap = await getDocs(query(
      collection(db, 'ecoles', ECOLET_ID, 'cahiers'),
      where('enseignantId','==',enseignantActuel?.id || '')
    ));
    select.innerHTML = '<option value="">-- Sélectionner --</option>';
    snap.forEach(ds => {
      const d = ds.data();
      const opt = document.createElement('option');
      opt.value = ds.id;
      opt.textContent = d.matiere + ' - ' + d.classe;
      select.appendChild(opt);
    });
  } catch(e){ console.error(e); }
}

window.chargerElevesNotes = async function(){
  const cahierId = document.getElementById('notesCahier').value;
  const periode = document.getElementById('notesPeriode').value;
  const container = document.getElementById('notesContainer');
  if(!cahierId){ container.innerHTML = ''; return; }
  
  try {
    const snap = await getDoc(doc(db, 'ecoles', ECOLET_ID, 'cahiers', cahierId));
    if(!snap.exists()){ container.innerHTML = ''; return; }
    const data = snap.data();
    const eleves = data.eleves || [];
    if(eleves.length === 0){ container.innerHTML = '<div class="empty">📭 Aucun élève</div>'; return; }
    
    let html = `<div style="margin-top:10px;max-height:450px;overflow-y:auto;">
      <div style="display:grid;grid-template-columns:35px 1fr 70px;gap:6px;padding:6px 0;font-weight:600;font-size:10px;color:rgba(255,255,255,0.3);border-bottom:1px solid rgba(255,255,255,0.04);">
        <span>#</span><span>Élève</span><span>Note</span>
      </div>`;
    
    eleves.forEach((e, i) => {
      const note = e.notes?.['p'+periode] || '';
      const nomComplet = (e.nom||'') + ' ' + (e.prenom||'');
      html += `<div style="display:grid;grid-template-columns:35px 1fr 70px;gap:6px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.02);align-items:center;">
        <span style="color:rgba(255,255,255,0.3);font-size:11px;">${i+1}</span>
        <span style="font-size:12px;">${nomComplet || 'Élève'}</span>
        <input type="number" step="0.5" min="0" max="20" value="${note}" 
          onchange="sauverNote('${cahierId}',${i},${periode},this.value)" 
          style="width:60px;padding:4px 6px;border-radius:6px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);color:#fff;text-align:center;">
      </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
  } catch(e){ container.innerHTML = '<div class="empty">❌ Erreur</div>'; }
};

window.sauverNote = async function(cahierId, index, periode, valeur){
  const val = parseFloat(valeur) || 0;
  try {
    const ref = doc(db, 'ecoles', ECOLET_ID, 'cahiers', cahierId);
    const snap = await getDoc(ref);
    if(!snap.exists()) return;
    const data = snap.data();
    if(!data.eleves[index]) return;
    if(!data.eleves[index].notes) data.eleves[index].notes = {};
    data.eleves[index].notes['p'+periode] = val;
    await updateDoc(ref, { eleves: data.eleves });
  } catch(e){ toast('❌ Erreur sauvegarde', 'error'); }
};

    document.getElementById(this.dataset.tab).classList.add('active');
    if(this.dataset.tab === 'tabNotes') chargerSelectCahiers();

});

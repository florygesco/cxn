<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>👨‍🏫 Enseignant - Cahier de cotation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"}}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0e1a;font-family:'Inter',sans-serif;color:#fff;min-height:100vh;}
.container{max-width:900px;margin:0 auto;padding:12px;}
.header{background:linear-gradient(135deg,#0f2b44,#071a2c);border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.header-left{display:flex;align-items:center;gap:10px;}
.header-left h1{font-size:18px;font-weight:700;}
.header-left p{font-size:10px;color:#94a3b8;}
.btn-sm{padding:5px 14px;border-radius:30px;border:none;font-weight:600;font-size:10px;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;}
.btn-sm:hover{transform:scale(0.97);}
.btn-outline{background:transparent;border:1px solid #334155;color:#94a3b8;}
.btn-outline:hover{background:rgba(255,255,255,0.05);}
.btn-danger{background:#7f1d1d;color:#fff;}
.btn-danger:hover{background:#991b1b;}
.btn-success{background:#14532d;color:#fff;}
.btn-success:hover{background:#166534;}
.btn-primary{background:#1e3a5f;color:#fff;}
.btn-primary:hover{background:#0f2b44;}
.tabs{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;padding:2px 0;}
.tab{background:transparent;border:1px solid #334155;padding:6px 14px;border-radius:30px;font-size:11px;font-weight:600;cursor:pointer;color:#94a3b8;transition:all 0.2s;white-space:nowrap;font-family:'Inter',sans-serif;}
.tab:hover{background:rgba(59,130,246,0.1);border-color:#3b82f6;}
.tab.active{background:#1e3a5f;color:#fff;border-color:transparent;}
.tab-content{display:none;animation:fadeIn 0.2s;}
.tab-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.card{background:rgba(18,18,31,0.95);border-radius:14px;padding:14px;border:1px solid rgba(59,130,246,0.1);margin-bottom:12px;}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.card-header h3{font-size:13px;font-weight:600;color:#60a5fa;display:flex;align-items:center;gap:6px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.form-group{display:flex;flex-direction:column;gap:3px;}
.form-group label{font-size:9px;font-weight:600;color:#94a3b8;}
.form-group input,.form-group select{padding:8px 12px;border-radius:8px;background:#1a2332;border:1px solid #334155;color:#fff;font-size:12px;outline:none;font-family:'Inter',sans-serif;}
.form-group input:focus,.form-group select:focus{border-color:#3b82f6;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:11px;}
th{background:#0f172a;padding:6px 8px;text-align:left;color:#94a3b8;font-weight:600;font-size:9px;border-bottom:1px solid #1a2332;}
td{padding:6px 8px;border-bottom:1px solid #1a2332;color:#e2e8f0;}
.empty{text-align:center;padding:20px;color:#4a5568;font-size:12px;}
.toast{position:fixed;bottom:20px;right:20px;background:rgba(18,25,45,0.95);border-radius:10px;padding:10px 18px;border-left:4px solid #10b981;transform:translateY(100px);opacity:0;transition:all 0.3s;z-index:999;max-width:90%;font-size:13px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{border-left-color:#ef4444;}
.toast.warning{border-left-color:#f59e0b;}
@media(max-width:600px){.form-row{grid-template-columns:1fr;}.header{flex-direction:column;text-align:center;}}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-left">
      <span style="font-size:24px;">👨‍🏫</span>
      <div>
        <h1 id="schoolName">COMPLEXE SCOLAIRE</h1>
        <p id="ensNomDisplay">Enseignant · Cahier de cotation</p>
      </div>
    </div>
    <button class="btn-sm btn-danger" onclick="deconnexion()">🚪 Déconnexion</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="tabCahier">📓 Cahiers</button>
    <button class="tab" data-tab="tabNotes">✏️ Notes</button>
  </div>

  <div id="tabCahier" class="tab-content active">
    <div class="card">
      <div class="card-header"><h3>📓 Créer un cahier</h3></div>
      <div class="form-row">
        <div class="form-group">
          <label>Classe</label>
          <select id="cahierClasse"><option value="">-- Sélectionner --</option></select>
        </div>
        <div class="form-group">
          <label>Matière</label>
          <input type="text" id="cahierMatiere" placeholder="Ex: Français">
        </div>
      </div>
      <button class="btn-sm btn-success" onclick="creerCahier()" style="width:100%;padding:10px;font-size:13px;">📓 CRÉER LE CAHIER</button>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>📋 Mes cahiers</h3>
        <span id="cahierCompteur" style="font-size:11px;color:#94a3b8;">0</span>
      </div>
      <div id="cahierListe"></div>
    </div>
  </div>

  <div id="tabNotes" class="tab-content">
    <div class="card">
      <div class="card-header"><h3>✏️ Saisie des notes</h3></div>
      <div class="form-row">
        <div class="form-group">
          <label>Cahier</label>
          <select id="notesCahier" onchange="chargerElevesNotes()"><option value="">-- Sélectionner --</option></select>
        </div>
        <div class="form-group">
          <label>Période</label>
          <select id="notesPeriode" onchange="chargerElevesNotes()">
            <option value="1">Période 1</option>
            <option value="2">Période 2</option>
            <option value="3">Période 3</option>
            <option value="4">Période 4</option>
          </select>
        </div>
      </div>
      <div id="notesContainer"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg">✅ Succès</span></div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, updateDoc, query, where } from "firebase/firestore";
import { getAuth, onAuthStateChanged } from "firebase/auth";

const firebaseConfig = {
  apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
  authDomain: "gesco-67c43.firebaseapp.com",
  projectId: "gesco-67c43",
  storageBucket: "gesco-67c43.firebasestorage.app",
  messagingSenderId: "333004443566",
  appId: "1:333004443566:web:de41f60000e418dce9023f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const urlParams = new URLSearchParams(window.location.search);
const schoolId = urlParams.get('ecole') || 'mon_ecole';
const ECOLET_ID = schoolId.replace(/[^a-zA-Z0-9]/g, '_');
document.getElementById('schoolName').textContent = 'COMPLEXE SCOLAIRE ' + schoolId.toUpperCase();

let enseignantActuel = null;

function toast(msg, type='success'){
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  el.className = 'toast ' + type;
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => el.classList.remove('show'), 3000);
}

onAuthStateChanged(auth, async (user) => {
  if(user){
    const snap = await getDocs(query(collection(db, 'ecoles', ECOLET_ID, 'enseignants'), where('email','==',user.email)));
    snap.forEach(ds => {
      enseignantActuel = {id: ds.id, ...ds.data()};
      document.getElementById('ensNomDisplay').textContent = '👨‍🏫 ' + enseignantActuel.nom + ' · ' + (enseignantActuel.cycle === 'primaire' ? '📚 Primaire' : '🧸 Maternelle');
    });
    chargerClassesPourCahier();
    chargerCahiers();
    chargerSelectCahiers();
  }
});

async function chargerClassesPourCahier(){
  const select = document.getElementById('cahierClasse');
  try {
    const classes = new Set();
    if(enseignantActuel && enseignantActuel.classes){
      enseignantActuel.classes.forEach(c => classes.add(c));
    }
    select.innerHTML = '<option value="">-- Sélectionner --</option>';
    Array.from(classes).sort().forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      select.appendChild(opt);
    });
  } catch(e){ console.error(e); }
}

async function creerCahier(){
  const classe = document.getElementById('cahierClasse').value;
  const matiere = document.getElementById('cahierMatiere').value.trim();
  if(!classe){ toast('⚠️ Sélectionnez une classe', 'error'); return; }
  if(!matiere){ toast('⚠️ Entrez une matière', 'error'); return; }
  try {
    const eleves = [];
    const snap = await getDocs(query(collection(db, 'ecoles', ECOLET_ID, 'prima_eleves'), where('classe','==',classe)));
    snap.forEach(ds => {
      const d = ds.data();
      eleves.push({id: ds.id, nom: d.nom||'', prenom: d.prenom||'', sexe: d.sexe||'M', notes: {}});
    });
    const snap2 = await getDocs(query(collection(db, 'ecoles', ECOLET_ID, 'mater_eleves'), where('classe','==',classe)));
    snap2.forEach(ds => {
      const d = ds.data();
      eleves.push({id: ds.id, nom: d.nom||'', prenom: d.prenom||'', sexe: d.sexe||'F', notes: {}});
    });
    if(eleves.length === 0){ toast('⚠️ Aucun élève', 'error'); return; }
    const cahierId = 'cahier_' + Date.now();
    await setDoc(doc(db, 'ecoles', ECOLET_ID, 'cahiers', cahierId), {
      classe, matiere, eleves, epreuves: {1:[],2:[],3:[],4:[]},
      enseignantId: enseignantActuel.id, enseignantNom: enseignantActuel.nom,
      createdAt: Date.now(), school: ECOLET_ID
    });
    toast('✅ Cahier créé avec ' + eleves.length + ' élèves');
    chargerCahiers();
    chargerSelectCahiers();
    document.getElementById('cahierMatiere').value = '';
  } catch(e){ toast('❌ ' + e.message, 'error'); }
}

async function chargerCahiers(){
  const container = document.getElementById('cahierListe');
  try {
    const snap = await getDocs(query(collection(db, 'ecoles', ECOLET_ID, 'cahiers'), where('enseignantId','==',enseignantActuel?.id || '')));
    const cahiers = [];
    snap.forEach(ds => cahiers.push({id: ds.id, ...ds.data()}));
    document.getElementById('cahierCompteur').textContent = cahiers.length;
    if(cahiers.length === 0){
      container.innerHTML = '<div class="empty">📭 Aucun cahier créé</div>';
      return;
    }
    let html = '<div style="display:flex;flex-direction:column;gap:6px;">';
    cahiers.forEach(c => {
      html += `<div style="background:#0f172a;border-radius:10px;padding:10px 14px;border:1px solid #1a2332;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
        <div><strong style="color:#60a5fa;">${c.matiere}</strong> <span style="color:#94a3b8;font-size:11px;">${c.classe}</span></div>
        <div style="font-size:10px;color:#94a3b8;">${(c.eleves||[]).length} élèves</div>
        <button class="btn-sm btn-danger" onclick="supprimerCahier('${c.id}')" style="padding:2px 10px;">✕</button>
      </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
  } catch(e){ console.error(e); }
}

async function chargerSelectCahiers(){
  const select = document.getElementById('notesCahier');
  try {
    const snap = await getDocs(query(collection(db, 'ecoles', ECOLET_ID, 'cahiers'), where('enseignantId','==',enseignantActuel?.id || '')));
    select.innerHTML = '<option value="">-- Sélectionner --</option>';
    snap.forEach(ds => {
      const d = ds.data();
      const opt = document.createElement('option');
      opt.value = ds.id;
      opt.textContent = d.matiere + ' - ' + d.classe;
      select.appendChild(opt);
    });
  } catch(e){ console.error(e); }
}

async function chargerElevesNotes(){
  const cahierId = document.getElementById('notesCahier').value;
  const periode = document.getElementById('notesPeriode').value;
  const container = document.getElementById('notesContainer');
  if(!cahierId){ container.innerHTML = ''; return; }
  try {
    const snap = await getDoc(doc(db, 'ecoles', ECOLET_ID, 'cahiers', cahierId));
    if(!snap.exists()){ container.innerHTML = ''; return; }
    const data = snap.data();
    const eleves = data.eleves || [];
    if(eleves.length === 0){ container.innerHTML = '<div class="empty">📭 Aucun élève</div>'; return; }
    let html = `<div style="margin-top:10px;max-height:450px;overflow-y:auto;">
      <div style="display:grid;grid-template-columns:35px 1fr 70px;gap:6px;padding:6px 0;font-weight:600;font-size:10px;color:#94a3b8;border-bottom:1px solid #1a2332;">
        <span>#</span><span>Élève</span><span>Note</span>
      </div>`;
    eleves.forEach((e, i) => {
      const note = e.notes?.['p'+periode] || '';
      const nomComplet = (e.nom||'') + ' ' + (e.prenom||'');
      html += `<div style="display:grid;grid-template-columns:35px 1fr 70px;gap:6px;padding:6px 0;border-bottom:1px solid #0f172a;align-items:center;">
        <span style="color:#4a5568;font-size:11px;">${i+1}</span>
        <span style="font-size:12px;">${nomComplet || 'Élève'}</span>
        <input type="number" step="0.5" min="0" max="20" value="${note}" 
          onchange="sauverNote('${cahierId}',${i},${periode},this.value)" 
          style="width:60px;padding:4px 6px;border-radius:6px;background:#1a2332;border:1px solid #334155;color:#fff;text-align:center;">
      </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
  } catch(e){ container.innerHTML = '<div class="empty">❌ Erreur</div>'; }
}

window.sauverNote = async function(cahierId, index, periode, valeur){
  const val = parseFloat(valeur) || 0;
  try {
    const ref = doc(db, 'ecoles', ECOLET_ID, 'cahiers', cahierId);
    const snap = await getDoc(ref);
    if(!snap.exists()) return;
    const data = snap.data();
    if(!data.eleves[index]) return;
    if(!data.eleves[index].notes) data.eleves[index].notes = {};
    data.eleves[index].notes['p'+periode] = val;
    await updateDoc(ref, { eleves: data.eleves });
    toast('✅ Note sauvegardée');
  } catch(e){ toast('❌ Erreur', 'error'); }
};

window.supprimerCahier = function(id){
  if(!confirm('Supprimer ce cahier ?')) return;
  deleteDoc(doc(db, 'ecoles', ECOLET_ID, 'cahiers', id))
    .then(() => { toast('🗑️ Cahier supprimé'); chargerCahiers(); chargerSelectCahiers(); })
    .catch(() => toast('❌ Erreur', 'error'));
};

function deconnexion(){
  if(confirm('Se déconnecter ?')){
    localStorage.clear();
    window.location.href = 'https://www.netubex.com/login.html?ecole=' + schoolId;
  }
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = function(){
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(this.dataset.tab).classList.add('active');
    if(this.dataset.tab === 'tabNotes') chargerSelectCahiers();
  };
});
</script>
</body>
</html>

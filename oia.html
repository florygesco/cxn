<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test IA NeTubeX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0e1a;color:#e8eef5;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}
.container{width:100%;max-width:600px;background:#111827;border-radius:20px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
h1{font-size:22px;margin-bottom:6px;background:linear-gradient(135deg,#7c3aed,#2563EB);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:13px;color:#94a3b8;margin-bottom:20px}
.messages{background:#0a0e1a;border-radius:14px;padding:16px;height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.msg{max-width:85%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#2563EB,#1D4ED8);color:#fff;border-radius:16px 16px 4px 16px}
.msg.bot{align-self:flex-start;background:#1a2233;border:1px solid rgba(148,163,184,.15);border-radius:16px 16px 16px 4px}
.msg.loading{color:#94a3b8;font-style:italic}
.input-row{display:flex;gap:8px}
input[type="text"]{flex:1;padding:14px 18px;border:2px solid #1a2233;border-radius:24px;background:#0a0e1a;color:#e8eef5;outline:none;font-size:15px;font-family:inherit}
input[type="text"]:focus{border-color:#7c3aed}
button{padding:14px 22px;border-radius:24px;background:linear-gradient(135deg,#7c3aed,#2563EB);color:#fff;border:none;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;white-space:nowrap}
button:disabled{opacity:0.5;cursor:not-allowed}
.info{margin-top:14px;font-size:12px;color:#64748b;text-align:center;line-height:1.5}
.info code{background:#1a2233;padding:2px 6px;border-radius:4px;color:#60A5FA}
</style>
</head>
<body>
<div class="container">
<h1>🤖 Test IA NeTubeX</h1>
<p class="subtitle">Via ton Worker Cloudflare sécurisé</p>
<div class="messages" id="messages">
<div class="msg bot">Bonjour 👋 Je suis l'assistant NeTubeX. Pose-moi une question.</div>
</div>
<div class="input-row">
<input type="text" id="input" placeholder="Posez votre question…" autocomplete="off">
<button id="sendBtn" onclick="envoyer()">Envoyer</button>
</div>
<div class="info">
Worker : <code>parent.netube-a97.workers.dev</code>
</div>
</div>
<script>
const WORKER_URL = "https://parent.netube-a97.workers.dev/";
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const historique = [];
let enCours = false;
inputEl.addEventListener('keypress', (e) => {
if (e.key === 'Enter' && !enCours) envoyer();
});
async function envoyer() {
const texte = inputEl.value.trim();
if (!texte || enCours) return;
ajouterMessage('user', texte);
inputEl.value = '';
enCours = true;
sendBtn.disabled = true;
const loadingId = ajouterMessage('bot', '⏳ Réflexion…', true);
try {
const response = await fetch(WORKER_URL, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({ message: texte, historique: historique })
});
const data = await response.json();
document.getElementById(loadingId)?.remove();
if (!data.reponse) {
ajouterMessage('bot', '❌ Réponse invalide : ' + JSON.stringify(data));
return;
}
ajouterMessage('bot', data.reponse);
historique.push({ role: "user", content: texte });
historique.push({ role: "assistant", content: data.reponse });
if (historique.length > 10) historique.splice(0, 2);
} catch (err) {
document.getElementById(loadingId)?.remove();
ajouterMessage('bot', '❌ Erreur réseau : ' + err.message);
console.error(err);
} finally {
enCours = false;
sendBtn.disabled = false;
inputEl.focus();
}
}
function ajouterMessage(role, texte, isLoading = false) {
const id = 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
const div = document.createElement('div');
div.id = id;
div.className = 'msg ' + role + (isLoading ? ' loading' : '');
div.textContent = texte;
messagesEl.appendChild(div);
messagesEl.scrollTop = messagesEl.scrollHeight;
return id;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1628">
<title>Connexion - Gestion de Scolarité</title>

</script>
<style>
/* ============================================================
   RESET & BASE
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
body{
  display:flex;align-items:center;justify-content:center;
  background:#050914;
  position:relative;
  overscroll-behavior:none;-webkit-overscroll-behavior:none;
  color:#fff;
}
body,.login-box,.login-wrapper,.logo-wrapper,.form-group,.login-box *{
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}

/* ============================================================
   ARRIÈRE-PLAN ANIMÉ PREMIUM
   ============================================================ */
.bg-canvas{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(37,99,235,0.25), transparent 60%),
    radial-gradient(ellipse 70% 70% at 85% 90%, rgba(139,92,246,0.20), transparent 60%),
    radial-gradient(ellipse 60% 50% at 50% 50%, rgba(59,130,246,0.10), transparent 70%),
    linear-gradient(160deg,#050914 0%,#0a1628 40%,#0d1f35 70%,#050914 100%);
}
.bg-grid{
  position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(96,165,250,0.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(96,165,250,0.035) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse 90% 80% at 50% 50%, #000 30%, transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 50%, #000 30%, transparent 75%);
  animation:gridPan 60s linear infinite;
}
@keyframes gridPan{
  0%{background-position:0 0,0 0}
  100%{background-position:52px 52px,52px 52px}
}

/* Bulles lumineuses */
.orb{
  position:fixed;border-radius:50%;filter:blur(80px);opacity:0.55;z-index:0;
  pointer-events:none;will-change:transform;
}
.orb.o1{width:520px;height:520px;top:-160px;right:-120px;background:radial-gradient(circle,#2563eb,transparent 70%);animation:orbFloat1 26s ease-in-out infinite alternate;}
.orb.o2{width:420px;height:420px;bottom:-140px;left:-100px;background:radial-gradient(circle,#7c3aed,transparent 70%);animation:orbFloat2 32s ease-in-out infinite alternate-reverse;}
.orb.o3{width:300px;height:300px;top:45%;left:50%;background:radial-gradient(circle,#06b6d4,transparent 70%);opacity:0.30;animation:orbFloat3 38s ease-in-out infinite alternate;}
@keyframes orbFloat1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-60px,80px) scale(1.15)}}
@keyframes orbFloat2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(70px,-50px) scale(0.9)}}
@keyframes orbFloat3{0%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-40%,-60%) scale(1.25)}}

/* Particules scintillantes */
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.star{
  position:absolute;width:2px;height:2px;background:#93bbfc;border-radius:50%;
  box-shadow:0 0 6px 2px rgba(147,187,252,0.6);
  animation:twinkle 4s ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0.1;transform:scale(0.8)}
  50%{opacity:0.9;transform:scale(1.3)}
}

/* ============================================================
   WRAPPER + LOGIN BOX
   ============================================================ */
.login-wrapper{
  position:relative;width:100%;max-width:480px;padding:15px;
  perspective:2000px;z-index:10;
  height:100vh;display:flex;align-items:center;justify-content:center;
}

.login-box{
  position:relative;width:100%;
  padding:20px 32px 22px;
  border-radius:38px;
  background:linear-gradient(145deg, rgba(255,255,255,0.11), rgba(255,255,255,0.04));
  backdrop-filter:blur(44px) saturate(180%);
  -webkit-backdrop-filter:blur(44px) saturate(180%);
  border:1px solid rgba(255,255,255,0.14);
  box-shadow:
    0 60px 120px -20px rgba(0,0,0,0.6),
    0 25px 50px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.16),
    inset 0 -1px 0 rgba(0,0,0,0.15);
  transform-style:preserve-3d;
  transform:rotateX(2deg) rotateY(-1deg);
  transition:transform 0.6s cubic-bezier(0.16,1,0.3,1), box-shadow 0.6s;
  animation:fadeIn 0.8s cubic-bezier(0.16,1,0.3,1);
  will-change:transform;
  overflow:hidden;
}
/* Bandeau dégradé en haut */
.login-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#1a56db,#60a5fa,#a78bfa,#60a5fa,#1a56db);
  background-size:300% 100%;
  animation:gradientMove 4s ease-in-out infinite;
  border-radius:38px 38px 0 0;
}
@keyframes gradientMove{
  0%{background-position:0% 0%}
  50%{background-position:100% 0%}
  100%{background-position:0% 0%}
}
/* Halo interne */
.login-box::after{
  content:'';position:absolute;inset:-1px;border-radius:38px;pointer-events:none;
  background:radial-gradient(circle at 30% 10%,rgba(96,165,250,0.10),transparent 50%),
             radial-gradient(circle at 70% 90%,rgba(167,139,250,0.08),transparent 50%);
}
.login-box:hover{
  transform:rotateX(0deg) rotateY(0deg) translateY(-4px) translateZ(30px);
  box-shadow:
    0 80px 160px -20px rgba(0,0,0,0.55),
    0 30px 60px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.20);
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(40px) scale(0.95) rotateX(3deg)}
  to{opacity:1;transform:translateY(0) scale(1) rotateX(2deg) rotateY(-1deg)}
}

/* ============================================================
   LOGO
   ============================================================ */
.logo-container{
  display:flex;align-items:center;justify-content:center;
  margin-bottom:6px;position:relative;z-index:1;
}
.logo-wrapper{
  position:relative;
  width:140px;height:140px;border-radius:50%;
  background:linear-gradient(145deg,#1a3a6a,#0d2a5a);
  border:3px solid rgba(96,165,250,0.35);
  padding:8px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:
    0 35px 90px rgba(59,130,246,0.25),
    0 0 0 1px rgba(96,165,250,0.10),
    inset 0 4px 0 rgba(255,255,255,0.12),
    inset 0 -4px 0 rgba(0,0,0,0.25);
  transition:transform 0.5s cubic-bezier(0.16,1,0.3,1), box-shadow 0.5s;
  transform:perspective(800px) rotateX(8deg) rotateY(3deg);
}
.logo-wrapper::before{
  content:'';position:absolute;inset:-8px;border-radius:50%;
  background:conic-gradient(from 0deg, rgba(96,165,250,0.6), transparent 30%, rgba(167,139,250,0.5), transparent 70%, rgba(96,165,250,0.6));
  filter:blur(14px);opacity:0.6;
  animation:spinSlow 8s linear infinite;
  z-index:-1;
}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.logo-wrapper:hover{
  transform:perspective(800px) rotateX(0deg) rotateY(0deg) scale(1.05);
  box-shadow:
    0 45px 110px rgba(59,130,246,0.35),
    0 0 0 1px rgba(96,165,250,0.2),
    inset 0 4px 0 rgba(255,255,255,0.18);
}
.logo-wrapper img{
  width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;
  transform:perspective(600px) rotateX(-5deg) rotateY(-2deg);
  transition:transform 0.5s ease;
}
.logo-wrapper img:hover{transform:perspective(600px) rotateX(0deg) rotateY(0deg);}
.logo-wrapper .placeholder{
  font-size:56px;
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
  filter:drop-shadow(0 4px 12px rgba(96,165,250,0.4));
}

/* ============================================================
   TITRES
   ============================================================ */
.login-box h1{
  text-align:center;font-size:20px;font-weight:900;color:#fff;
  letter-spacing:-0.3px;margin-bottom:2px;position:relative;z-index:1;
  text-shadow:0 4px 20px rgba(0,0,0,0.35);
  background:linear-gradient(135deg,#fff 0%,#c7d9f5 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.login-box .sub{
  text-align:center;color:rgba(255,255,255,0.45);font-size:12.5px;font-weight:500;
  margin-bottom:4px;position:relative;z-index:1;
  letter-spacing:0.5px;text-transform:uppercase;
}

/* ============================================================
   SALUTATION ANIMÉE
   ============================================================ */
.salutation-wrapper{
  text-align:center;margin:8px 0 12px;position:relative;z-index:1;
  min-height:44px;display:flex;align-items:center;justify-content:center;
}
.salutation{
  color:#93bbfc;font-size:17px;
  background:linear-gradient(135deg, rgba(96,165,250,0.12), rgba(167,139,250,0.08));
  padding:8px 22px;border-radius:30px;
  border:1px solid rgba(96,165,250,0.20);
  display:inline-block;font-weight:600;letter-spacing:0.3px;
  box-shadow:0 6px 20px rgba(96,165,250,0.10), inset 0 1px 0 rgba(255,255,255,0.06);
  min-width:220px;text-align:center;
}
.salutation .cursor{
  display:inline-block;width:2px;height:20px;background:#93bbfc;
  margin-left:3px;vertical-align:text-bottom;
  animation:blink 1s step-end infinite;
  box-shadow:0 0 8px rgba(147,187,252,0.8);
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ============================================================
   FORMULAIRE
   ============================================================ */
.form-group{margin-bottom:16px;position:relative;z-index:1}
.form-group label{
  display:block;color:rgba(255,255,255,0.42);font-size:10px;font-weight:700;
  margin-bottom:6px;text-align:center;letter-spacing:2px;text-transform:uppercase;
}
.form-group input{
  width:100%;padding:16px 20px;border-radius:16px;
  background:rgba(255,255,255,0.05);
  border:2px solid rgba(255,255,255,0.07);
  color:#fff;font-size:24px;text-align:center;letter-spacing:12px;
  font-family:'Inter',sans-serif;font-weight:600;
  outline:none;transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  box-shadow:inset 0 2px 10px rgba(0,0,0,0.20);
}
.form-group input:focus{
  border-color:#3b82f6;
  background:rgba(59,130,246,0.08);
  box-shadow:
    0 0 0 4px rgba(59,130,246,0.12),
    0 8px 24px rgba(59,130,246,0.15),
    inset 0 2px 10px rgba(0,0,0,0.20);
  transform:translateY(-1px);
}
.form-group input::placeholder{
  color:rgba(255,255,255,0.18);font-size:14px;letter-spacing:6px;font-weight:400;
}
.form-group input:disabled{opacity:0.4;cursor:not-allowed;}

/* ============================================================
   BOUTON LOGIN
   ============================================================ */
#loginBtn{
  width:100%;padding:16px;border-radius:16px;border:none;
  background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 50%,#1a56db 100%);
  color:#fff;font-size:15px;font-weight:800;
  cursor:pointer;letter-spacing:2px;
  transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
  position:relative;overflow:hidden;
  box-shadow:
    0 14px 40px rgba(37,99,235,0.40),
    0 0 0 1px rgba(96,165,250,0.15) inset,
    inset 0 -4px 0 rgba(0,0,0,0.20),
    inset 0 4px 0 rgba(255,255,255,0.15);
  z-index:1;
  text-shadow:0 2px 6px rgba(0,0,0,0.25);
  transform:perspective(400px) rotateX(2deg) translateY(-2px);
}
#loginBtn::before{
  content:'';position:absolute;top:4px;left:4px;right:4px;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,0.15),transparent);
  border-radius:14px 14px 0 0;pointer-events:none;
}
#loginBtn::after{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
  transition:left 0.7s;
}
#loginBtn:hover:not(:disabled){
  transform:perspective(400px) rotateX(0deg) translateY(-4px) translateZ(10px);
  box-shadow:
    0 22px 55px rgba(37,99,235,0.55),
    0 0 0 1px rgba(96,165,250,0.25) inset,
    inset 0 -4px 0 rgba(0,0,0,0.15),
    inset 0 4px 0 rgba(255,255,255,0.22);
}
#loginBtn:hover:not(:disabled)::after{left:100%}
#loginBtn:active:not(:disabled){
  transform:perspective(400px) rotateX(0deg) translateY(2px) translateZ(-5px);
  box-shadow:
    0 6px 18px rgba(37,99,235,0.30),
    inset 0 2px 0 rgba(0,0,0,0.25);
}
#loginBtn:disabled{
  opacity:0.65;transform:none;cursor:not-allowed;
  box-shadow:0 6px 18px rgba(37,99,235,0.15);
}
#loginBtn .btn-content{
  display:flex;align-items:center;justify-content:center;gap:10px;
}
#loginBtn .spinner{
  display:none;width:20px;height:20px;
  border:3px solid rgba(255,255,255,0.25);
  border-top-color:#fff;border-radius:50%;
  animation:spin 0.8s linear infinite;
}
#loginBtn.loading .spinner{display:inline-block}
#loginBtn.loading .btn-text{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   BOUTON RETOUR + FOOTER
   ============================================================ */
.back-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:transparent;border:none;
  color:rgba(255,255,255,0.35);font-size:11.5px;font-weight:500;
  cursor:pointer;transition:all 0.3s ease;
  padding:8px 16px;border-radius:30px;margin-top:4px;
  text-decoration:none;font-family:'Inter',sans-serif;
  width:100%;justify-content:center;
}
.back-btn:hover{
  color:#93bbfc;background:rgba(96,165,250,0.08);transform:translateX(-3px);
}
.back-btn .arrow{font-size:12px;transition:transform 0.3s}
.back-btn:hover .arrow{transform:translateX(-4px)}

.footer{
  text-align:center;margin-top:10px;padding-top:10px;
  border-top:1px solid rgba(255,255,255,0.06);
  position:relative;z-index:1;
}
.footer p{color:rgba(255,255,255,0.22);font-size:9.5px;letter-spacing:0.6px}
.footer .support{color:rgba(255,255,255,0.22);font-size:9.5px;margin-top:3px}
.footer .support a{
  color:#93bbfc;text-decoration:none;font-weight:600;transition:color 0.3s;
}
.footer .support a:hover{color:#c7d9f5;text-decoration:underline}

/* ============================================================
   TOASTS
   ============================================================ */
.toast-container{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  z-index:99999;display:flex;flex-direction:column;align-items:center;gap:10px;
  pointer-events:none;width:100%;max-width:540px;padding:0 20px;
}
.toast{
  background:linear-gradient(145deg, rgba(20,40,80,0.96), rgba(15,30,60,0.96));
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:20px;padding:16px 22px;
  min-width:300px;max-width:540px;width:100%;
  box-shadow:
    0 30px 80px rgba(0,0,0,0.5),
    0 10px 30px rgba(0,0,0,0.3),
    inset 0 1px 0 rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;gap:14px;
  transform:translateY(-120px);opacity:0;
  transition:all 0.6s cubic-bezier(0.16,1,0.3,1);
  pointer-events:auto;position:relative;
}
.toast.show{transform:translateY(0);opacity:1}
.toast.hide{transform:translateY(-60px);opacity:0}
.toast .toast-icon{
  font-size:20px;flex-shrink:0;width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.toast.success .toast-icon{background:rgba(16,185,129,0.15);color:#34d399}
.toast.error .toast-icon{background:rgba(239,68,68,0.15);color:#f87171}
.toast.warning .toast-icon{background:rgba(245,158,11,0.15);color:#fbbf24}
.toast.info .toast-icon{background:rgba(59,130,246,0.15);color:#60a5fa}
.toast .toast-content{flex:1}
.toast .toast-title{font-weight:700;font-size:13.5px;color:#fff;margin-bottom:1px}
.toast .toast-message{font-size:12.5px;color:rgba(255,255,255,0.60);line-height:1.5}
.toast .toast-close{
  background:transparent;border:none;color:rgba(255,255,255,0.30);
  cursor:pointer;font-size:14px;padding:4px;transition:all 0.3s;flex-shrink:0;
}
.toast .toast-close:hover{color:#fff;transform:rotate(90deg)}
.toast.success{border-left:3px solid #10b981}
.toast.error{border-left:3px solid #ef4444}
.toast.warning{border-left:3px solid #f59e0b}
.toast.info{border-left:3px solid #3b82f6}

/* ============================================================
   MODE HÔTE (iframe plein écran)
   ============================================================ */
#app-container{
  display:none;position:fixed;inset:0;
  width:100vw;height:100vh;height:100dvh;
  z-index:9999;background:#0a1628;overflow:hidden;
}
#app-iframe{
  position:absolute;inset:0;
  width:100%;height:100%;border:none;display:block;background:#fff;
}
#app-loader{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0a1628 0%,#0f2942 50%,#0a1628 100%);
  color:#fff;z-index:10;
  transition:opacity 0.4s ease;
}
#app-loader.hidden{opacity:0;pointer-events:none}
#app-loader .spinner-big{
  width:54px;height:54px;
  border:4px solid rgba(96,165,250,0.15);
  border-top-color:#3b82f6;border-radius:50%;
  animation:spin 0.9s linear infinite;
  margin-bottom:20px;
  box-shadow:0 0 30px rgba(59,130,246,0.30);
}
#app-loader .loader-text{
  font-size:13.5px;color:rgba(255,255,255,0.60);
  letter-spacing:0.5px;font-weight:500;
}
body.host-mode .login-wrapper,
body.host-mode .bg-canvas,
body.host-mode .bg-grid,
body.host-mode .orb,
body.host-mode .stars{display:none !important;}
body.host-mode{overflow:hidden;display:block;background:#0a1628}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:480px){
  .login-box{padding:16px 18px;border-radius:28px}
  .login-box h1{font-size:16px}
  .logo-wrapper{width:118px;height:118px}
  .logo-wrapper .placeholder{font-size:46px}
  .form-group input{font-size:18px;letter-spacing:8px;padding:13px}
  .salutation{font-size:14px;padding:6px 16px;min-width:180px}
  .toast{min-width:auto;padding:12px 14px}
  .login-wrapper{max-width:100%}
  .orb.o1{width:340px;height:340px}
  .orb.o2{width:280px;height:280px}
}
</style>
</head>
<body>

<!-- ===== ARRIÈRE-PLAN ===== -->
<div class="bg-canvas"></div>
<div class="bg-grid"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
<div class="stars" id="stars"></div>

<!-- ===== TOASTS ===== -->
<div class="toast-container" id="toastContainer"></div>

<!-- ===== ÉCRAN DE LOGIN ===== -->
<div class="login-wrapper">
  <div class="login-box">
    <div class="logo-container">
      <div class="logo-wrapper" id="logoWrapper">
        <div class="placeholder" id="logoPlaceholder">🏫</div>
        <img id="schoolLogo" style="display:none;" alt="Logo école">
      </div>
    </div>
    <h1 id="schoolNameTitle">GESTION SCOLAIRE</h1>
    <p class="sub" id="schoolSub">COMPLEXE SCOLAIRE</p>
    <div class="salutation-wrapper">
      <span class="salutation" id="salutationText">
        <span id="typedText"></span><span class="cursor"></span>
      </span>
    </div>
    <div class="form-group">
      <label>Code d'accès</label>
      <input type="password" id="loginPassword" placeholder="••••••••••" maxlength="6" inputmode="numeric" autofocus>
    </div>
    <button id="loginBtn">
      <span class="btn-content">
        <span class="spinner"></span>
        <span class="btn-text">SE CONNECTER</span>
      </span>
    </button>
    <button class="back-btn" onclick="window.location.href='https://www.netubex.com/schoolchoice'">
      <span class="arrow">◀</span> Retourner au sélecteur d'école
    </button>
    <div class="footer">
      <p>© 2026 NeTubeX SARL — Tous droits réservés</p>
      <p class="support">📞 Support : <a href="tel:+243845048412">+243 845 048 412</a></p>
    </div>
  </div>
</div>

<!-- ===== CONTENEUR HÔTE (iframe) ===== -->
<div id="app-container">
  <div id="app-loader">
    <div class="spinner-big"></div>
    <div class="loader-text">Chargement de l'application…</div>
  </div>
  <iframe id="app-iframe" src="about:blank" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
</div>

<script>
/* ============================================================
   SÉCURITÉ : blocage clic droit, devtools, etc.
   ============================================================ */
document.addEventListener('contextmenu', e => { e.preventDefault(); return false; });
document.addEventListener('selectstart', e => { e.preventDefault(); return false; });
document.addEventListener('keydown', function(e) {
  if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
  if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.keyCode === 73)) { e.preventDefault(); return false; }
  if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.keyCode === 67)) { e.preventDefault(); return false; }
  if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.keyCode === 74)) { e.preventDefault(); return false; }
  if (e.ctrlKey && (e.key === 'U' || e.keyCode === 85)) { e.preventDefault(); return false; }
  if (e.ctrlKey && (e.key === 'S' || e.keyCode === 83)) { e.preventDefault(); return false; }
  if (e.metaKey) { e.preventDefault(); return false; }
  return true;
});
document.addEventListener('dragover', e => { e.preventDefault(); return false; });
document.addEventListener('drop', e => { e.preventDefault(); return false; });

/* ============================================================
   GÉNÉRATION DES ÉTOILES SCINTILLANTES
   ============================================================ */
(function generateStars() {
  const container = document.getElementById('stars');
  if (!container) return;
  for (let i = 0; i < 40; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';

    star.style.animationDuration = (3 + Math.random() * 4) + 's';

<script type="module">
import{initializeApp}from"firebase/app";
import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,setPersistence,browserLocalPersistence}from"firebase/auth";
import{getFirestore,doc,getDoc}from"firebase/firestore";

/* ============================================================
   1. NETTOYAGE DE L'URL (récupérer ecoleId puis nettoyer)
   ============================================================ */
const urlParams = new URLSearchParams(window.location.search);
const ecoleIdFromUrl = urlParams.get("ecole");
const ecoleId = ecoleIdFromUrl || sessionStorage.getItem('_e') || "mon-ecole";

// Stocker puis nettoyer l'URL
sessionStorage.setItem('_e', ecoleId);
if (ecoleIdFromUrl) {
  window.history.replaceState({}, '', window.location.pathname);
}

/* ============================================================
   2. CHIFFREMENT AES-GCM
   ============================================================ */
const SECRET_KEY = "NeTubeX-2026-Premium-SecretKey-ChangeMe!!";

async function getCryptoKey() {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey(
    "raw", enc.encode(SECRET_KEY),
    { name: "PBKDF2" }, false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: enc.encode("netubex-salt-v1"),
      iterations: 100000, hash: "SHA-256" },
    km,
    { name: "AES-GCM", length: 256 },
    false, ["encrypt", "decrypt"]
  );
}

async function encryptData(data) {
  const key = await getCryptoKey();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encrypted = await crypto.subtle.encrypt(
    { name: "AES-GCM", iv }, key,
    new TextEncoder().encode(JSON.stringify(data))
  );
  const combined = new Uint8Array(iv.length + encrypted.byteLength);
  combined.set(iv);
  combined.set(new Uint8Array(encrypted), iv.length);
  return btoa(String.fromCharCode(...combined));
}

async function decryptData(b64) {
  try {
    const key = await getCryptoKey();
    const combined = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const iv = combined.slice(0, 12);
    const data = combined.slice(12);
    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv }, key, data
    );
    return JSON.parse(new TextDecoder().decode(decrypted));
  } catch (e) { return null; }
}

/* ============================================================
   3. FIREBASE
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBma80S0bc9uzSuO38qn7JLSwLrYniV5Fw",
  authDomain: "gesco-2.firebaseapp.com",
  projectId: "gesco-2",
  storageBucket: "gesco-2.firebasestorage.app",
  messagingSenderId: "36319988765",
  appId: "1:36319988765:web:e8cd823804596495248af4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

try { await setPersistence(auth, browserLocalPersistence); } catch(e){ console.warn('Persistence:', e); }

/* ============================================================
   4. AFFICHAGE DU NOM D'ÉCOLE
   ============================================================ */
const schoolDisplay = ecoleId.toUpperCase().replace(/-/g, " ");
document.getElementById("schoolSub").textContent = "COMPLEXE SCOLAIRE " + schoolDisplay;
document.getElementById("schoolNameTitle").textContent = "ÉCOLE " + schoolDisplay;
document.title = "Connexion - " + schoolDisplay;

/* ============================================================
   5. SALUTATION ANIMÉE
   ============================================================ */
let tentatives = 0;
let toastTimeout = null;

function getSalutation() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return "Bonjour, à vous !";
  if (h >= 12 && h < 18) return "Bon après-midi, à vous !";
  if (h >= 18 && h < 22) return "Bonsoir, à vous !";
  return "Content de vous revoir";
}

function typeWriter(element, text, speed = 80) {
  let i = 0;
  const target = element.querySelector('#typedText');
  target.textContent = '';
  function type() {
    if (i < text.length) {
      target.textContent += text.charAt(i);
      i++;
      setTimeout(type, speed);
    }
  }
  type();
}

const salutationEl = document.getElementById('salutationText');
salutationEl.innerHTML = '<span id="typedText"></span><span class="cursor"></span>';
setTimeout(() => { typeWriter(salutationEl, getSalutation(), 80); }, 600);

/* ============================================================
   6. TOASTS
   ============================================================ */
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  if (toastTimeout) { clearTimeout(toastTimeout); toastTimeout = null; }
  const existing = container.querySelector('.toast');
  if (existing) {
    existing.classList.remove('show');
    existing.classList.add('hide');
    setTimeout(() => { existing.remove(); createToast(message, type); }, 400);
  } else {
    createToast(message, type);
  }
}

function createToast(message, type) {
  const container = document.getElementById('toastContainer');
  const config = {
    success: { icon: '✅', title: 'Succès' },
    error:   { icon: '❌', title: 'Erreur' },
    warning: { icon: '⚠️', title: 'Attention' },
    info:    { icon: 'ℹ️', title: 'Information' }
  };
  const c = config[type] || config.info;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML =
    '<div class="toast-icon">' + c.icon + '</div>' +
    '<div class="toast-content">' +
      '<div class="toast-title">' + c.title + '</div>' +
      '<div class="toast-message">' + message + '</div>' +
    '</div>' +
    '<button class="toast-close">✕</button>';
  container.appendChild(el);
  setTimeout(() => el.classList.add('show'), 50);
  el.querySelector('.toast-close').addEventListener('click', () => {
    el.classList.remove('show');
    el.classList.add('hide');
    toastTimeout = setTimeout(() => el.remove(), 500);
  });
  toastTimeout = setTimeout(() => {
    if (el.parentNode) {
      el.classList.remove('show');
      el.classList.add('hide');
      setTimeout(() => { if (el.parentNode) el.remove(); }, 500);
    }
  }, 4000);
}

/* ============================================================
   7. FIRESTORE : logo + codes
   ============================================================ */
async function getSchoolLogo(id) {
  try {
    const ref = doc(db, "ecoles", id);
    const snap = await getDoc(ref);
    if (snap.exists()) return snap.data().logoUrl || null;
    return null;
  } catch (e) { return null; }
}

async function updateSchoolLogo(id) {
  const logoImg = document.getElementById('schoolLogo');
  const placeholder = document.getElementById('logoPlaceholder');
  const url = await getSchoolLogo(id);
  if (url) {
    logoImg.src = url;
    logoImg.style.display = 'block';
    placeholder.style.display = 'none';
    logoImg.onerror = () => {
      logoImg.style.display = 'none';
      placeholder.style.display = 'flex';
    };
  } else {
    logoImg.style.display = 'none';
    placeholder.style.display = 'flex';
  }
}

async function getSchoolCodes() {
  try {
    const ref = doc(db, "ecoles", ecoleId, "settings", "data");
    const snap = await getDoc(ref);
    if (snap.exists()) return snap.data();
    return null;
  } catch (e) { return null; }
}

/* ============================================================
   8. CONNEXION
   ============================================================ */
async function seConnecter() {
  const password = document.getElementById("loginPassword").value.trim();
  const btn = document.getElementById("loginBtn");

  if (!password || password.length < 4) {
    showToast("Code d'accès incorrect. Veuillez réessayer.", "error");
    tentatives++;
    if (tentatives >= 5) {
      showToast("Trop de tentatives. Veuillez contacter le support.", "error");
      document.getElementById("loginPassword").disabled = true;
    }
    return;
  }

  btn.disabled = true;
  btn.classList.add('loading');

  try {
    const codes = await getSchoolCodes();
    if (!codes) {
      showToast("École non reconnue. Veuillez contacter le support.", "error");
      btn.disabled = false;
      btn.classList.remove('loading');
      return;
    }

    let role = null;
    let email = null;
    const pwd = password.trim();

    const codeDir      = codes.codeDirection      ? codes.codeDirection.trim()      : '';
    const codeCompta   = codes.codeComptabilite   ? codes.codeComptabilite.trim()   : '';
    const codePromoteur= codes.codePromoteur      ? codes.codePromoteur.trim()      : '';

    if (codeDir === pwd) {
      role = 'direction';
      email = codes.emailDirection || ('direction.' + ecoleId + '@netubex.com');
    } else if (codeCompta === pwd) {
      role = 'comptabilite';
      email = codes.emailComptabilite || ('compta.' + ecoleId + '@netubex.com');
    } else if (codePromoteur === pwd) {
      role = 'promoteur';
      email = codes.emailPromoteur || ('promoteur.' + ecoleId + '@netubex.com');
    } else {
      showToast("Code d'accès incorrect. Veuillez réessayer.", "error");
      tentatives++;
      btn.disabled = false;
      btn.classList.remove('loading');
      if (tentatives >= 5) {
        showToast("Trop de tentatives. Veuillez contacter le support.", "error");
        document.getElementById("loginPassword").disabled = true;
      }
      return;
    }

    const roleLabels = { direction: 'Direction', comptabilite: 'Comptabilité', promoteur: 'Promoteur' };
    showToast('Vérification réussie. Connexion en tant que ' + roleLabels[role] + '…', "success");

    // Firebase Auth
    try {
      await createUserWithEmailAndPassword(auth, email, password);
    } catch (e) {
      if (e.code !== 'auth/email-already-in-use') console.warn('Create:', e.code);
    }
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (authError) {
      if (authError.code === 'auth/user-not-found') {
        await createUserWithEmailAndPassword(auth, email, password);
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        throw authError;
      }
    }

    /* ===== Sauvegarde CHIFFRÉE dans sessionStorage ===== */
    const sessionData = {
      ecoleId: ecoleId,
      role: role,
      code: password,
      email: email,
      isAuthenticated: true,
      loginTime: Date.now(),
      expiresAt: Date.now() + (30 * 60 * 1000)
    };
    const encrypted = await encryptData(sessionData);
    sessionStorage.setItem('sess', encrypted);

    showToast('✅ Connexion réussie en tant que ' + roleLabels[role] + ' !', "success");

    setTimeout(() => { activateHostMode(); }, 800);

  } catch (error) {
    console.error("Erreur:", error);
    showToast("Une erreur est survenue. Veuillez contacter le support.", "error");
    btn.disabled = false;
    btn.classList.remove('loading');
  }
}

/* ============================================================
   9. MODE HÔTE (charge l'iframe SANS paramètres)
   ============================================================ */
async function activateHostMode() {
  const encrypted = sessionStorage.getItem('sess');
  const sessionData = encrypted ? await decryptData(encrypted) : null;

  if (!sessionData || !sessionData.isAuthenticated || Date.now() > sessionData.expiresAt) {
    sessionStorage.clear();
    showToast("Session invalide. Redirection...", "error");
    setTimeout(() => {
      window.location.replace('https://www.netubex.com/schoolchoice');
    }, 1500);
    return;
  }

  let pageUrl = '';
  switch (sessionData.role) {
    case 'direction':    pageUrl = '/schooldirect.html';   break;
    case 'comptabilite': pageUrl = '/schoolcompte.html';   break;
    case 'promoteur':    pageUrl = '/schoolpromo.html';    break;
  }

  if (!pageUrl) {
    sessionStorage.clear();
    window.location.replace('https://www.netubex.com/schoolchoice');
    return;
  }

  // ✅ URL PROPRE, aucun paramètre
  const fullUrl = window.location.origin + pageUrl;

  document.body.classList.add('host-mode');
  document.getElementById('app-container').style.display = 'block';

  const iframe = document.getElementById('app-iframe');
  const loader = document.getElementById('app-loader');

  iframe.addEventListener('load', () => {
    loader.classList.add('hidden');
    setTimeout(() => { loader.style.display = 'none'; }, 400);
  });

  iframe.src = fullUrl;
}

/* ============================================================
   10. RÉPONDRE AUX DEMANDES DE SESSION DEPUIS L'IFRAME
   ============================================================ */
window.addEventListener('message', async (e) => {
  if (e.origin !== window.location.origin) return;
  if (!e.data || e.data.type !== 'GET_SESSION') return;

  const encrypted = sessionStorage.getItem('sess');
  const sessionData = encrypted ? await decryptData(encrypted) : null;

  const valid = sessionData
             && sessionData.isAuthenticated
             && Date.now() < sessionData.expiresAt;

  e.source.postMessage({
    type: 'SESSION_DATA',
    data: valid ? {
      ecoleId: sessionData.ecoleId,
      role: sessionData.role,
      code: sessionData.code,
      email: sessionData.email
    } : null
  }, window.location.origin);
});

/* ============================================================
   11. REPRISE AUTO DE SESSION AU CHARGEMENT (F5)
   ============================================================ */
(async function autoResume() {
  const encrypted = sessionStorage.getItem('sess');
  if (!encrypted) return;

  const sessionData = await decryptData(encrypted);
  if (!sessionData || !sessionData.isAuthenticated || Date.now() > sessionData.expiresAt) {
    sessionStorage.clear();
    return;
  }

  console.log('[Login] Session existante, reprise automatique');
  activateHostMode();
})();

/* ============================================================
   12. ÉVÉNEMENTS FORMULAIRE
   ============================================================ */
document.getElementById("loginBtn").addEventListener("click", seConnecter);
document.getElementById("loginPassword").addEventListener("keypress", e => {
  if (e.key === "Enter") seConnecter();
});
document.getElementById("loginPassword").addEventListener("input", function() {
  if (this.value.length > 6) this.value = this.value.slice(0, 6);
});
document.getElementById("loginPassword").focus();

updateSchoolLogo(ecoleId);
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test upload vidéo Publitio — NeTubeX</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px;
    min-height: 100vh;
  }
  .card {
    max-width: 520px; margin: 0 auto; background: #1e293b;
    border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  h1 { font-size: 20px; margin: 0 0 6px; color: #fbbf24; }
  .sub { font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5; }
  .zone {
    border: 2px dashed #475569; border-radius: 14px; padding: 24px 16px;
    text-align: center; cursor: pointer; background: #0f172a;
    transition: all .2s; margin-bottom: 16px;
  }
  .zone:hover { border-color: #fbbf24; background: #1a2333; }
  .zone.hasfile { border-color: #10b981; background: rgba(16,185,129,.08); }
  .emoji { font-size: 40px; margin-bottom: 8px; opacity: .8; }
  .label { font-size: 14px; font-weight: 700; color: #cbd5e1; }
  .info {
    margin-top: 10px; padding: 10px 12px; background: #0f172a;
    border: 1px solid #334155; border-radius: 10px; font-size: 12px;
    color: #cbd5e1; display: none;
  }
  .info.show { display: block; }
  .info div { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .info div:last-child { margin-bottom: 0; }
  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 900; cursor: pointer; font-family: inherit;
    background: linear-gradient(135deg, #f59e0b, #b45309); color: #fff;
    margin-top: 6px;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .progress {
    height: 10px; background: #0f172a; border-radius: 6px;
    overflow: hidden; margin: 14px 0 8px; display: none;
  }
  .progress.show { display: block; }
  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #f59e0b, #b45309);
    transition: width .3s;
  }
  .progress-text {
    font-size: 12px; font-weight: 800; color: #94a3b8;
    text-align: center; margin-bottom: 12px; display: none;
  }
  .progress-text.show { display: block; }
  .result {
    margin-top: 16px; padding: 14px; border-radius: 12px;
    font-size: 13px; line-height: 1.6; display: none;
  }
  .result.show { display: block; }
  .result.success {
    background: rgba(16,185,129,.1);
    border: 1.5px solid #10b981; color: #6ee7b7;
  }
  .result.error {
    background: rgba(239,68,68,.1);
    border: 1.5px solid #ef4444; color: #fca5a5;
    white-space: pre-wrap; word-break: break-word;
  }
  .result strong { color: #fff; }
  .result a {
    color: #60a5fa; word-break: break-all;
    display: block; margin-top: 6px;
  }
  video {
    width: 100%; border-radius: 12px; margin-top: 12px;
    background: #000; display: none;
  }
  video.show { display: block; }
  .config {
    font-size: 11px; color: #64748b; text-align: center;
    margin-top: 16px; padding-top: 12px; border-top: 1px solid #334155;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🎬 Test Upload Vidéo Publitio</h1>
  <p class="sub">Sélectionnez une vidéo pour tester si votre preset Publitio accepte bien les vidéos.</p>

  <div class="zone" id="dropZone" onclick="document.getElementById('videoInput').click()">
    <div class="emoji">🎬</div>
    <div class="label" id="zoneLabel">Choisir une vidéo</div>
    <input type="file" id="videoInput" accept="video/*" style="display:none" onchange="onVideoSelected(event)">
  </div>

  <div class="info" id="infoBox">
    <div><i>📁</i><span id="infoName">—</span></div>
    <div><i>⏱️</i><span id="infoDuration">—</span></div>
    <div><i>⚖️</i><span id="infoSize">—</span></div>
  </div>

  <button class="btn" id="uploadBtn" onclick="startUpload()" disabled>🚀 Envoyer la vidéo</button>

  <div class="progress" id="progWrap"><div class="progress-bar" id="progBar"></div></div>
  <div class="progress-text" id="progText">0 %</div>

  <div class="result" id="resultBox"></div>

  <video id="videoPreview" controls playsinline></video>

  <div class="config">
    Preset : <strong>cbnwpcbP</strong> · Domaine : <strong>FloryNgenda</strong>
  </div>
</div>

<script>
// ============================================================
// CONFIG — identique à votre app NeTubeX
// ============================================================
const PUBLITIO_PRESET = "cbnwpcbP";
const PUBLITIO_DOMAIN = "FloryNgenda";
const PUBLITIO_UPLOAD = "https://api.publit.io/v1/files/create/" + PUBLITIO_PRESET;
const MAX_SIZE_MB = 500;

let selectedFile = null;

// ============================================================
// Sélection du fichier
// ============================================================
function onVideoSelected(e) {
  const f = e.target.files && e.target.files[0];
  if (!f) return;

  const resultBox = document.getElementById('resultBox');
  resultBox.className = 'result';
  resultBox.style.display = 'none';

  if (!f.type.startsWith('video/')) {
    showError('Le fichier n\'est pas une vidéo (' + f.type + ')');
    e.target.value = '';
    return;
  }

  if (f.size > MAX_SIZE_MB * 1024 * 1024) {
    showError('Vidéo trop lourde : ' + (f.size / 1024 / 1024).toFixed(1) + ' Mo (max ' + MAX_SIZE_MB + ')');
    e.target.value = '';
    return;
  }

  selectedFile = f;

  document.getElementById('dropZone').classList.add('hasfile');
  document.getElementById('zoneLabel').textContent = '✅ ' + truncate(f.name, 30);
  document.getElementById('infoName').textContent = f.name;
  document.getElementById('infoSize').textContent = formatSize(f.size);
  document.getElementById('infoDuration').textContent = 'Lecture…';
  document.getElementById('infoBox').classList.add('show');
  document.getElementById('uploadBtn').disabled = false;

  // Lire la durée
  const url = URL.createObjectURL(f);
  const v = document.createElement('video');
  v.preload = 'metadata';
  v.onloadedmetadata = function() {
    const dur = v.duration || 0;
    document.getElementById('infoDuration').textContent = formatDuration(dur);
    URL.revokeObjectURL(url);
  };
  v.onerror = function() {
    document.getElementById('infoDuration').textContent = 'Durée inconnue';
    URL.revokeObjectURL(url);
  };
  v.src = url;
}

// ============================================================
// Upload
// ============================================================
function startUpload() {
  if (!selectedFile) return;

  const btn = document.getElementById('uploadBtn');
  const progWrap = document.getElementById('progWrap');
  const progBar = document.getElementById('progBar');
  const progText = document.getElementById('progText');
  const resultBox = document.getElementById('resultBox');
  const videoPreview = document.getElementById('videoPreview');

  btn.disabled = true;
  btn.textContent = '⏳ Envoi en cours…';
  progWrap.classList.add('show');
  progText.classList.add('show');
  progBar.style.width = '0%';
  progText.textContent = 'Démarrage…';
  resultBox.className = 'result';
  resultBox.style.display = 'none';
  videoPreview.classList.remove('show');

  const xhr = new XMLHttpRequest();
  const fd = new FormData();
  fd.append('file', selectedFile);

  // ⚠️ TIMEOUT CRUCIAL
  xhr.timeout = 5 * 60 * 1000;
  xhr.ontimeout = function() {
    showError('⏱️ Délai dépassé (5 min). Publitio n\'a pas répondu.\n\nCauses possibles :\n• Fichier trop lourd pour votre connexion\n• Preset Publitio ne accepte pas les vidéos\n• Problème réseau');
    resetUI();
  };

  xhr.upload.onprogress = function(ev) {
    if (ev.lengthComputable) {
      const pct = Math.round((ev.loaded / ev.total) * 100);
      progBar.style.width = pct + '%';
      progText.textContent = 'Envoi : ' + pct + ' %  (' +
        formatSize(ev.loaded) + ' / ' + formatSize(ev.total) + ')';
    }
  };

  xhr.onload = function() {
    console.log('[PUBLITIO] HTTP', xhr.status);
    console.log('[PUBLITIO] Réponse brute :', xhr.responseText);

    if (xhr.status < 200 || xhr.status >= 300) {
      showError('❌ HTTP ' + xhr.status + '\n\nRéponse serveur :\n' + xhr.responseText.slice(0, 800));
      resetUI();
      return;
    }

    let json;
    try {
      json = JSON.parse(xhr.responseText);
    } catch (e) {
      showError('❌ Réponse non-JSON :\n' + xhr.responseText.slice(0, 800));
      resetUI();
      return;
    }

    console.log('[PUBLITIO] JSON parsé :', json);

    if (json.success === false) {
      showError('❌ Publitio a refusé :\n' + (json.message || JSON.stringify(json)));
      resetUI();
      return;
    }

    const data = json.response || json;
    const pid = data.id || data.publitio_id || null;

    if (!pid) {
      showError('❌ Pas de publitio_id dans la réponse :\n' + JSON.stringify(data).slice(0, 800));
      resetUI();
      return;
    }

    // Construire les URLs
    const videoUrl = 'https://' + PUBLITIO_DOMAIN + '.publit.io/file/' + pid + '.mp4';
    const thumbUrl = data.thumbnail_url || data.url_thumbnail || null;

    progBar.style.width = '100%';
    progText.textContent = '✅ Upload terminé';

    // Succès
    resultBox.className = 'result success show';
    resultBox.innerHTML =
      '<strong>✅ Vidéo uploadée avec succès !</strong><br><br>' +
      '<strong>ID Publitio :</strong> ' + pid + '<br>' +
      '<strong>URL vidéo :</strong><a href="' + videoUrl + '" target="_blank">' + videoUrl + '</a>' +
      (thumbUrl ? '<strong>Miniature :</strong><a href="' + thumbUrl + '" target="_blank">' + thumbUrl + '</a>' : '');

    videoPreview.src = videoUrl;
    videoPreview.classList.add('show');

    resetUI(true);
    btn.textContent = '✅ Réessayer avec une autre vidéo';
  };

  xhr.onerror = function() {
    showError('❌ Erreur réseau ou CORS.\n\nVérifiez :\n• Votre connexion internet\n• Que api.publit.io autorise votre origine\n• La console du navigateur (F12) pour plus de détails');
    resetUI();
  };

  xhr.onabort = function() {
    showError('❌ Upload annulé');
    resetUI();
  };

  xhr.open('POST', PUBLITIO_UPLOAD);
  xhr.send(fd);

  function resetUI(keepButtonEnabled) {
    if (!keepButtonEnabled) {
      btn.disabled = false;
      btn.textContent = '🚀 Envoyer la vidéo';
    }
    // On garde la barre de progression visible si succès
  }
}

// ============================================================
// Helpers
// ============================================================
function showError(msg) {
  const box = document.getElementById('resultBox');
  box.className = 'result error show';
  box.textContent = msg;
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' o';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' Ko';
  return (bytes / 1024 / 1024).toFixed(1) + ' Mo';
}

function formatDuration(sec) {
  if (!sec || !isFinite(sec)) return '—';
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return m + ' min ' + String(s).padStart(2, '0') + ' s';
}

function truncate(str, n) {
  return str.length > n ? str.slice(0, n - 1) + '…' : str;
}
</script>

</body>
</html>

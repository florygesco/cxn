<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a15">
<title>Bienvenue — CS Tremplin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a15;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;min-height:100vh;padding:20px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 20%, rgba(212,175,55,0.15), transparent 50%),radial-gradient(circle at 80% 80%, rgba(37,99,235,0.10), transparent 50%),linear-gradient(135deg, #0a0a15 0%, #12122a 40%, #0f0f1e 100%);z-index:-2}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);background-size:50px 50px;mask-image:radial-gradient(ellipse at center, #000 20%, transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center, #000 20%, transparent 75%);z-index:-1;pointer-events:none}
.card{background:linear-gradient(145deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(212,175,55,0.25);border-radius:28px;padding:60px 50px 50px;max-width:620px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.03) inset,0 1px 0 rgba(255,255,255,0.08) inset;text-align:center;position:relative;overflow:hidden;animation:cardIn 0.9s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg, transparent, #d4af37, #f5b82e, #d4af37, transparent);background-size:200% 100%;animation:shimmerBar 3s linear infinite}
@keyframes shimmerBar{0%{background-position:200% 0}100%{background-position:-200% 0}}
.logo-mark{width:88px;height:88px;border-radius:22px;background:linear-gradient(135deg, #d4af37, #f5b82e);display:flex;align-items:center;justify-content:center;margin:0 auto 26px;font-size:40px;color:#0a0a15;box-shadow:0 12px 40px rgba(212,175,55,0.35),0 0 0 1px rgba(255,255,255,0.15) inset;animation:logoFloat 3.5s ease-in-out infinite;position:relative}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ornament{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px;color:#d4af37;font-size:11px;letter-spacing:4px;text-transform:uppercase;font-weight:600}
.ornament::before,.ornament::after{content:'';width:40px;height:1px;background:linear-gradient(90deg, transparent, rgba(212,175,55,0.6))}
.ornament::after{background:linear-gradient(90deg, rgba(212,175,55,0.6), transparent)}
.salutation{font-family:'Playfair Display', serif;font-size:32px;font-weight:700;color:#fff;margin-bottom:12px;letter-spacing:-0.5px;line-height:1.3}
.salutation .name{background:linear-gradient(135deg, #f5b82e, #d4af37, #f5b82e);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:goldShine 4s linear infinite;font-weight:800}
@keyframes goldShine{0%{background-position:0% center}100%{background-position:200% center}}
.subtitle{font-size:15px;color:rgba(255,255,255,0.55);line-height:1.7;margin-bottom:36px;max-width:460px;margin-left:auto;margin-right:auto;font-weight:400}
.subtitle strong{color:rgba(255,255,255,0.85);font-weight:600}
.btn-redirect{display:inline-flex;align-items:center;justify-content:center;gap:14px;padding:18px 44px;background:linear-gradient(135deg, #d4af37, #f5b82e);color:#0a0a15;font-size:15px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;border-radius:50px;border:none;cursor:pointer;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 12px 40px rgba(212,175,55,0.4),0 0 0 1px rgba(255,255,255,0.15) inset;position:relative;overflow:hidden;font-family:'Inter', sans-serif}
.btn-redirect::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);transition:left 0.7s}
.btn-redirect:hover{transform:translateY(-4px);box-shadow:0 20px 60px rgba(212,175,55,0.55),0 0 0 1px rgba(255,255,255,0.2) inset}
.btn-redirect:hover::before{left:100%}
.btn-redirect:active{transform:translateY(-1px) scale(0.98)}
.btn-redirect i{font-size:17px;transition:transform 0.4s}
.btn-redirect:hover i{transform:translateX(5px)}
.security-info{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:32px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.06);font-size:12px;color:rgba(255,255,255,0.4);font-weight:500;letter-spacing:0.5px}
.security-info i{color:#10b981;font-size:13px}
.footer{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,0.3);letter-spacing:0.5px;text-align:center;width:100%;padding:0 20px}
.footer strong{color:rgba(212,175,55,0.7);font-weight:600}
.time-info{position:fixed;top:24px;right:28px;font-size:11px;color:rgba(255,255,255,0.35);letter-spacing:1.5px;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:8px}
.time-info i{color:#d4af37;font-size:12px}
@media (max-width:640px){
.card{padding:44px 28px 40px;border-radius:22px}
.logo-mark{width:72px;height:72px;font-size:32px;border-radius:18px;margin-bottom:22px}
.salutation{font-size:24px}
.subtitle{font-size:14px;margin-bottom:28px}
.btn-redirect{padding:16px 32px;font-size:13px;letter-spacing:1.2px;gap:10px}
.btn-redirect i{font-size:15px}
.ornament{font-size:10px;letter-spacing:3px}
.ornament::before,.ornament::after{width:28px}
.time-info{top:16px;right:16px;font-size:10px;letter-spacing:1px}
.footer{bottom:14px;font-size:10px}
}
</style>
</head>
<body>
<div class="time-info"><i class="fas fa-clock"></i> <span id="currentDate"></span></div>

<div class="card">
  <div class="logo-mark"><i class="fas fa-graduation-cap"></i></div>
  <div class="ornament">Complexe Scolaire Tremplin</div>
  <div class="salutation" id="salutationText">Bonjour, <span class="name">Monsieur Oscar Kashiba</span></div>
  <p class="subtitle">
    Votre <strong>espace promoteur</strong> a été déplacé directement vers votre site internet.<br>
    Cliquez sur le bouton ci-dessous pour y accéder.
  </p>
  <a href="https://www.cstremplin.com/login2" class="btn-redirect">
    <i class="fas fa-arrow-right"></i>
    Accéder à mon espace
  </a>
  <div class="security-info">
    <i class="fas fa-shield-alt"></i>
    Connexion sécurisée · Accès privé
  </div>
</div>

<div class="footer">
  © 2026 — <strong>Complexe Scolaire Tremplin</strong> · Tous droits réservés
</div>

<script>
(function(){
  var h = new Date().getHours();
  var salut = "Bonjour";
  if(h >= 18 || h < 5) salut = "Bonsoir";
  else if(h >= 12 && h < 18) salut = "Bon après-midi";
  document.getElementById('salutationText').innerHTML = salut + ', <span class="name">Monsieur Oscar Kashiba</span>';
  var d = new Date();
  var jours = ['DIM','LUN','MAR','MER','JEU','VEN','SAM'];
  var mois = ['JANV','FÉVR','MARS','AVR','MAI','JUIN','JUIL','AOÛT','SEPT','OCT','NOV','DÉC'];
  document.getElementById('currentDate').textContent = jours[d.getDay()] + ' ' + d.getDate() + ' ' + mois[d.getMonth()] + ' ' + d.getFullYear();
})();
document.addEventListener('contextmenu', function(e){ e.preventDefault(); return false; });
document.addEventListener('selectstart', function(e){ e.preventDefault(); return false; });
document.addEventListener('dragstart', function(e){ e.preventDefault(); return false; });
document.addEventListener('keydown', function(e){
  if(e.key === 'F12' || e.keyCode === 123){ e.preventDefault(); return false; }
  if(e.ctrlKey && e.shiftKey && ['I','i','C','c','J','j'].indexOf(e.key) !== -1){ e.preventDefault(); return false; }
  if(e.ctrlKey && ['U','u','S','s'].indexOf(e.key) !== -1){ e.preventDefault(); return false; }
  return true;
});
</script>
</body>
</html>

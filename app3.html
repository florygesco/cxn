<script>
function haptic(ms){if(navigator.vibrate)navigator.vibrate(ms||15)}
var toastTimer=null;
function showToast(msg){var t=document.getElementById('toast');var txt=document.getElementById('toast-text');if(!t||!txt)return;txt.textContent=msg;t.style.transform='translateX(-50%) translateY(0)';t.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.style.transform='translateX(-50%) translateY(100px)';t.style.opacity='0';},2600);}
var CURRENT_ACCOUNT=null;
try{var saved=localStorage.getItem('netubex-account');if(saved)CURRENT_ACCOUNT=JSON.parse(saved);}catch(e){}
function isLoggedIn(){return CURRENT_ACCOUNT!==null;}
function requireLogin(action,callback){if(isLoggedIn()){if(callback)callback();return true;}showAccountModal('Vous devez créer votre compte pour continuer.',callback);return false;}
function showAccountModal(message,afterLogin){var modal=document.getElementById('account-modal');if(!modal){createAccountModal();modal=document.getElementById('account-modal');}document.getElementById('account-modal-msg').textContent=message;window._pendingCallback=afterLogin||null;modal.classList.add('active');}
function createAccountModal(){var html='<div id="account-modal" class="modal"><div class="modal-box" style="position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;border-radius:24px 24px 0 0;background:var(--bg-card);padding:24px"><button onclick="closeAccountModal()" style="position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;font-size:15px;color:var(--text-muted)"><i class="fa-solid fa-xmark"></i></button><div style="text-align:center;margin-bottom:18px"><div style="width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#7c3aed,#4c1d95);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;margin:0 auto 14px"><i class="fa-solid fa-user-plus"></i></div><h3 style="font-size:18px;font-weight:900;color:var(--text-primary)">Créer votre compte</h3><p id="account-modal-msg" style="font-size:12.5px;color:var(--text-muted);margin-top:6px">Vous devez créer un compte pour continuer.</p></div><form onsubmit="event.preventDefault();submitAccountModal();" style="display:flex;flex-direction:column;gap:14px"><input type="text" id="accName" required placeholder="Nom complet *" class="form-input-3d"><input type="tel" id="accPhone" required placeholder="Numéro WhatsApp *" class="form-input-3d"><button type="submit" class="btn-3d blue" style="width:100%;padding:16px"><i class="fa-solid fa-check"></i> Créer mon compte</button></form></div></div>';document.body.insertAdjacentHTML('beforeend',html);}
function closeAccountModal(){var m=document.getElementById('account-modal');if(m)m.classList.remove('active');window._pendingCallback=null;}
function generateCode6(){return String(Math.floor(100000+Math.random()*900000));}
function submitAccountModal(){var name=document.getElementById('accName').value.trim();var phone=document.getElementById('accPhone').value.trim();if(!name||!phone){showToast('Remplissez tous les champs');return;}var code=generateCode6();CURRENT_ACCOUNT={id:'user-'+Date.now(),name:name,phone:phone,code:code,dateCreation:new Date().toISOString()};try{localStorage.setItem('netubex-account',JSON.stringify(CURRENT_ACCOUNT));}catch(e){}haptic(30);closeAccountModal();showToast('Compte créé. Code : '+code);var cb=window._pendingCallback;window._pendingCallback=null;if(cb)setTimeout(cb,200);}
function doRegister(){var name=document.getElementById('regName').value.trim();var phone=document.getElementById('regPhone').value.trim();if(!name||!phone){showToast('Remplissez tous les champs');return;}var code=generateCode6();CURRENT_ACCOUNT={id:'user-'+Date.now(),name:name,phone:phone,code:code,dateCreation:new Date().toISOString()};try{localStorage.setItem('netubex-account',JSON.stringify(CURRENT_ACCOUNT));}catch(e){}haptic(30);document.getElementById('registerCodeValue').textContent=code;document.getElementById('registerCodeBox').style.display='block';showToast('Compte créé avec succès');}
function doLogin(){var phone=document.getElementById('loginPhone').value.trim();var code=document.getElementById('loginCode').value.trim();if(!phone||!code){showToast('Entrez votre numéro et votre code');return;}if(!/^\d{6}$/.test(code)){showToast('Le code doit contenir 6 chiffres');return;}var saved=null;try{saved=JSON.parse(localStorage.getItem('netubex-account')||'null');}catch(e){}if(saved&&saved.phone===phone&&saved.code===code){CURRENT_ACCOUNT=saved;haptic(30);showToast('Connexion réussie');go('index');}else{showToast('Numéro ou code incorrect');}}
function doCommerceLogin(){var phone=document.getElementById('commerceLoginPhone').value.trim();var code=document.getElementById('commerceLoginCode').value.trim();if(!phone||!code){showToast('Entrez votre numéro et votre code');return;}if(!/^\d{6}$/.test(code)){showToast('Le code doit contenir 6 chiffres');return;}var saved=null;try{saved=JSON.parse(localStorage.getItem('netubex-boutique')||'null');}catch(e){}if(saved&&saved.whatsapp===phone&&saved.code===code){haptic(30);showToast('Connexion réussie');go('dashboard');}else if(!saved){haptic(30);showToast('Connexion en mode démo');go('dashboard');}else{showToast('Numéro ou code incorrect');}}

var DETAIL_FS_COUNTDOWN=10;
var detailFsInterval=null;
var detailFsActive=false;
function openDetailFullscreen(src){if(!src||detailFsActive)return;detailFsActive=true;haptic(20);var overlay=document.getElementById('detailFullscreen');var img=document.getElementById('detailFsImg');var seconds=document.getElementById('detailFsSeconds');var bar=document.getElementById('detailFsProgressBar');if(!overlay||!img)return;img.src=src;if(seconds)seconds.textContent=DETAIL_FS_COUNTDOWN;if(bar){bar.style.transition='none';bar.style.width='100%';}overlay.classList.add('active');document.body.style.overflow='hidden';var remaining=DETAIL_FS_COUNTDOWN;setTimeout(function(){if(bar){bar.style.transition='width '+DETAIL_FS_COUNTDOWN+'s linear';bar.style.width='0%';}},50);detailFsInterval=setInterval(function(){remaining--;if(seconds)seconds.textContent=remaining;if(remaining<=0)closeDetailFullscreen();},1000);}
function closeDetailFullscreen(){if(!detailFsActive)return;detailFsActive=false;haptic(15);var overlay=document.getElementById('detailFullscreen');var bar=document.getElementById('detailFsProgressBar');if(overlay)overlay.classList.remove('active');if(bar){bar.style.transition='none';bar.style.width='100%';}clearInterval(detailFsInterval);detailFsInterval=null;document.body.style.overflow='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&detailFsActive)closeDetailFullscreen();});
function openDetail(offreData){CURRENT_OFFRE=offreData;try{localStorage.setItem('netubex-current-offre',JSON.stringify(offreData));}catch(e){}renderDetail(offreData);go('detail');}
var CURRENT_OFFRE=null;
function renderDetail(offre){if(!offre){try{offre=JSON.parse(localStorage.getItem('netubex-current-offre')||'null');}catch(e){}}if(!offre){showToast('Offre introuvable');go('index');return;}
var heroImg=document.getElementById('detailHeroImg');if(heroImg){if(offre.img){heroImg.src=offre.img;heroImg.style.display='block';heroImg.alt=offre.title||'';}else heroImg.style.display='none';}
var heroBadge=document.getElementById('detailHeroBadge');if(heroBadge){heroBadge.textContent=offre.tag||'—';heroBadge.className='feed-badge '+(offre.tagClass||'');}
var cityEl=document.getElementById('detailCity');if(cityEl)cityEl.textContent=offre.location||'Localisation inconnue';
var dateEl=document.getElementById('detailDate');if(dateEl)dateEl.textContent=offre.time?'Publiée '+offre.time:'Récemment';
var titleEl=document.getElementById('detailTitle');if(titleEl)titleEl.textContent=offre.title||'Sans titre';
var priceLabel=document.getElementById('detailPriceLabel');var priceValue=document.getElementById('detailPriceValue');var priceBox=document.getElementById('detailPriceBox');if(offre.price&&priceValue){var parts=String(offre.price).split(':');if(priceLabel)priceLabel.textContent=parts.length>1?parts[0].trim():'Prix';if(priceValue)priceValue.textContent=parts.length>1?parts[1].trim():offre.price;if(priceBox)priceBox.style.display='flex';}else if(priceBox)priceBox.style.display='none';
var descEl=document.getElementById('detailDescription');if(descEl)descEl.textContent=offre.desc||'Aucune description disponible.';
var orgSection=document.getElementById('detailOrganisationSection');var isOrg=offre.cat==='ecole'||offre.cat==='entreprise';if(orgSection&&isOrg){orgSection.style.display='block';var orgName=document.getElementById('detailOrgName');var orgLoc=document.getElementById('detailOrgLocation');var orgAvatar=document.getElementById('detailOrgAvatar');if(orgName)orgName.textContent=offre.name||'Établissement';if(orgLoc)orgLoc.textContent=offre.location||'';if(orgAvatar)orgAvatar.textContent=offre.cat==='ecole'?'🎓':'🏢';}else if(orgSection)orgSection.style.display='none';
var contactSection=document.getElementById('detailContactSection');var needsUnlock=offre.unlock||offre.cat==='location'||offre.cat==='parcelle'||offre.cat==='autre';if(contactSection)contactSection.style.display=needsUnlock?'block':'none';
var actionsEl=document.getElementById('detailActions');if(actionsEl){actionsEl.innerHTML='';if(isOrg){actionsEl.innerHTML='<button class="detail-primary-btn gold" onclick="postulerButtonClick(this)"><i class="fa-solid fa-paper-plane"></i> Postuler</button>';}else if(needsUnlock){actionsEl.innerHTML='<button class="detail-primary-btn gold" onclick="requireLogin(\'unlock\',()=>openUnlock())"><i class="fa-solid fa-key"></i> Débloquer les coordonnées</button>';}}
var refEl=document.getElementById('detailRefValue');if(refEl&&offre){var catCode='GEN';if(offre.cat==='ecole')catCode='ECOLE';else if(offre.cat==='location')catCode='LOC';else if(offre.cat==='parcelle')catCode='PARC';else if(offre.cat==='entreprise')catCode='ENT';else if(offre.cat==='autre')catCode='SRV';var str=String((offre.title||'')+(offre.name||''));var hash=0;for(var i=0;i<str.length;i++){hash=((hash<<5)-hash)+str.charCodeAt(i);hash|=0;}var num=String(Math.abs(hash)%10000).padStart(4,'0');refEl.textContent='NTX-'+catCode+'-'+num;}
var heroContainer=document.getElementById('detailHero');if(heroContainer&&offre){heroContainer.onclick=null;if(offre.img){heroContainer.style.cursor='pointer';heroContainer.onclick=function(e){e.stopPropagation();openDetailFullscreen(offre.img);};}else heroContainer.style.cursor='default';}
}

var POSTULER_COOLDOWN_MS=24*60*60*1000;
function postulerButtonClick(btn){requireLogin('postuler',function(){lancerPostulation(btn);});}
function lancerPostulation(btn){if(btn.classList.contains('postuler-bar'))return;if(btn.classList.contains('postuler-done'))return;
var offreId=btn.getAttribute('data-offre-id')||'default';var storageKey='netubex-postule-'+offreId;
var lastPostule=null;try{lastPostule=parseInt(localStorage.getItem(storageKey)||'0');}catch(e){}
var now=Date.now();if(lastPostule&&(now-lastPostule)<POSTULER_COOLDOWN_MS){var tempsRestant=POSTULER_COOLDOWN_MS-(now-lastPostule);var heures=Math.floor(tempsRestant/(60*60*1000));var minutes=Math.floor((tempsRestant%(60*60*1000))/(60*1000));showToast('Vous pourrez postuler à nouveau dans '+heures+'h '+minutes+'min');return;}
haptic(20);var originalHTML=btn.innerHTML;
btn.classList.remove('fb-action-postuler','fb-action-primary','postuler-done');btn.classList.add('postuler-bar');
btn.innerHTML='<span class="postuler-bar-bg"></span><span class="postuler-bar-content"><span>Envoi…</span><span class="postuler-bar-percent">0%</span></span>';
var barBg=btn.querySelector('.postuler-bar-bg');var percentEl=btn.querySelector('.postuler-bar-percent');var progress=0;
var interval=setInterval(function(){progress+=Math.floor(Math.random()*7)+3;if(progress>=100)progress=100;barBg.style.width=progress+'%';percentEl.textContent=progress+'%';if(progress>=100){clearInterval(interval);setTimeout(function(){try{localStorage.setItem(storageKey,String(Date.now()));}catch(e){}btn.classList.remove('postuler-bar');btn.classList.add('postuler-done','fb-action-postuler');btn.innerHTML='<i class="fa-solid fa-check"></i> Envoyé';afficherPostulerSuccess();},250);}},85);
}
function afficherPostulerSuccess(){haptic(40);var overlay=document.getElementById('postulerSuccessOverlay');var toast=document.getElementById('postulerSuccessToast');overlay.classList.add('active');toast.classList.add('active');}
function closePostulerSuccess(){var overlay=document.getElementById('postulerSuccessOverlay');var toast=document.getElementById('postulerSuccessToast');overlay.classList.remove('active');toast.classList.remove('active');}
function verifierBoutonsPostuler(){var btns=document.querySelectorAll('[data-offre-id]');var now=Date.now();btns.forEach(function(btn){var offreId=btn.getAttribute('data-offre-id');var storageKey='netubex-postule-'+offreId;var lastPostule=null;try{lastPostule=parseInt(localStorage.getItem(storageKey)||'0');}catch(e){}if(lastPostule&&(now-lastPostule)<POSTULER_COOLDOWN_MS){btn.classList.remove('fb-action-postuler','fb-action-primary','green');btn.classList.add('postuler-done','fb-action-postuler');btn.innerHTML='<i class="fa-solid fa-check"></i> Envoyé';}else{btn.classList.remove('postuler-done','postuler-bar');btn.classList.add('fb-action-postuler');btn.innerHTML='<i class="fa-solid fa-paper-plane"></i> Postuler';}});}

function switchDashTab(el,tab){haptic();document.querySelectorAll('#page-dashboard .category-btn').forEach(function(t){t.classList.remove('active');});el.classList.add('active');}
function openUnlock(){haptic(20);document.getElementById('unlock-modal').classList.add('active');}
function closeUnlock(){var modal=document.getElementById('unlock-modal');var box=modal.querySelector('.unlock-modal-box');if(box){box.style.transform='translateY(100%)';box.style.transition='transform .55s cubic-bezier(.55,.06,.68,.19)';}setTimeout(function(){modal.classList.remove('active');if(box){box.style.transform='';box.style.transition='';}},500);}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){haptic(20);showToast('Copié');}).catch(function(){});}else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast('Copié');}catch(e){}document.body.removeChild(ta);}}
function postulerAvecAnimation(btn){postulerButtonClick(btn);}
function extraireMots(texte){if(!texte)return[];return texte.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w\s]/g,' ').trim().split(/\s+/).filter(function(m){return m.length>=3||/^\d+$/.test(m);});}
function normaliser(texte){if(!texte)return'';return String(texte).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function extrairePrix(prixTexte){if(!prixTexte)return null;var m=String(prixTexte).replace(/[^\d]/g,'');if(!m)return null;var p=parseInt(m,10);return isNaN(p)?null:p;}
function detecterType(texte){var t=normaliser(texte||'');if(/appartement|maison|studio|villa|chambre|logement|loyer/.test(t))return'logement';if(/parcelle|terrain|concession/.test(t))return'parcelle';if(/emploi|travail|poste|recrutement|comptable|professeur|ingenieur|chauffeur/.test(t))return'emploi';if(/ecole|inscription|scolaire|universite/.test(t))return'ecole';if(/plombier|electricien|coiffeur|mecanicien|service/.test(t))return'service';return'autre';}
function typeSansBudget(type){return type==='emploi';}
var searchEnCours=false;
function executeSearch(){if(searchEnCours)return;var q=(document.getElementById('searchQuery')||{}).value?document.getElementById('searchQuery').value.trim():'';var c=(document.getElementById('searchCity')||{}).value?document.getElementById('searchCity').value.trim():'';var bMin=parseInt((document.getElementById('searchBudgetMin')||{}).value)||null;var bMax=parseInt((document.getElementById('searchBudgetMax')||{}).value)||null;if(!q&&!c&&!bMin&&!bMax){showToast('Saisissez un critère de recherche');return;}haptic(20);searchEnCours=true;openSearchResults();showSearchLoading();setTimeout(function(){var resultats=rechercherOffres(q,c,bMin,bMax);afficherResultats(resultats,q,c,bMin,bMax);searchEnCours=false;},450);}
function rechercherOffres(query,ville,bMin,bMax){var mots=extraireMots(query);var typeDetecte=query?detecterType(query):null;var budgetActif=!typeSansBudget(typeDetecte||'');return FEED_IMAGES.filter(function(offre){if(mots.length>0){var texte=normaliser(offre.title+' '+offre.desc+' '+offre.location);var trouve=mots.some(function(m){return texte.indexOf(m)!==-1;});if(!trouve)return false;}if(ville){if(normaliser(offre.location).indexOf(normaliser(ville))===-1)return false;}if((bMin||bMax)&&budgetActif){var p=extrairePrix(offre.price);if(p===null)return false;if(bMin&&p<bMin)return false;if(bMax&&p>bMax)return false;}return true;}).sort(function(a,b){if(mots.length===0)return 0;var ta=normaliser(a.title+' '+a.desc+' '+a.location);var tb=normaliser(b.title+' '+b.desc+' '+b.location);var ca=mots.filter(function(m){return ta.indexOf(m)!==-1;}).length;var cb=mots.filter(function(m){return tb.indexOf(m)!==-1;}).length;return cb-ca;});}
function openSearchResults(){document.getElementById('searchResultsOverlay').classList.add('active');document.getElementById('searchResultsPanel').classList.add('active');document.body.style.overflow='hidden';}
function closeSearchResults(){document.getElementById('searchResultsOverlay').classList.remove('active');document.getElementById('searchResultsPanel').classList.remove('active');document.body.style.overflow='';}
function showSearchLoading(){document.getElementById('searchResultsBody').innerHTML='<div class="search-loading"><div class="search-loading-spinner"></div><div class="search-loading-text">Recherche…</div></div>';document.getElementById('searchResultsFooter').style.display='none';document.getElementById('searchResultsTitle').textContent='Recherche en cours';document.getElementById('searchResultsSubtitle').textContent='Veuillez patienter…';}
function afficherResultats(resultats,query,ville,bMin,bMax){var body=document.getElementById('searchResultsBody');var footer=document.getElementById('searchResultsFooter');var title=document.getElementById('searchResultsTitle');var subtitle=document.getElementById('searchResultsSubtitle');var nb=resultats.length;if(nb===0){title.textContent='Aucun résultat';var filtres=[];if(ville)filtres.push('📍 '+ville);if(bMin||bMax)filtres.push('💰 '+(bMin||'…')+' – '+(bMax||'…')+'$');subtitle.textContent=filtres.length>0?filtres.join(' · '):'Essayez d\'autres mots';body.innerHTML='<div class="search-empty"><span class="search-empty-icon">🔍</span><h3>Rien ne correspond</h3><p>Aucune offre ne correspond à ces critères.</p><a href="#" onclick="event.preventDefault();closeSearchResults();requireLogin(\'demande\',()=>go(\'demande\'))" class="search-empty-btn"><i class="fa-solid fa-bullhorn"></i> Publier ma recherche</a></div>';footer.style.display='none';return;}title.textContent=nb+' offre'+(nb>1?'s':'')+' trouvée'+(nb>1?'s':'');var filtres=[];if(ville)filtres.push('📍 '+ville);if(bMin||bMax)filtres.push('💰 '+(bMin||'…')+' – '+(bMax||'…')+'$');subtitle.textContent=filtres.length>0?filtres.join(' · '):'Triées par pertinence';var html='';resultats.forEach(function(o){html+='<div class="search-result-card" onclick="closeSearchResults();openDetail('+JSON.stringify(o).replace(/'/g,"&#39;")+')"><div class="search-result-top"><div class="search-result-avatar" style="background:linear-gradient(135deg,#4c1d95,#6d28d9)">'+o.initials+'</div><div class="search-result-meta"><div class="search-result-name">'+o.name+' <i class="fa-solid fa-circle-check"></i></div><div class="search-result-location"><i class="fa-solid fa-location-dot" style="color:#ef4444"></i> '+o.location+'</div></div><span class="feed-badge '+o.tagClass+'">'+o.tag+'</span></div><div class="search-result-title">'+o.title+'</div><div class="search-result-desc">'+o.desc+'</div>'+(o.price?'<div class="search-result-price '+o.priceClass+'">'+o.price+'</div>':'')+'</div>';});body.innerHTML=html;footer.style.display='flex';document.getElementById('searchResultsSeeAll').onclick=function(e){e.preventDefault();closeSearchResults();go('category','all');};}
var feedPage=0;var FEED_PER_PAGE=5;
function getFeedItems(){var items=[];FEED_IMAGES.forEach(function(o,i){items.push({type:'offre',data:o,date:new Date(Date.now()-(FEED_IMAGES.length-i)*3600000)});});return items;}
function renderOffreCard(p){var actionBtn;if(p.unlock)actionBtn='<button class="fb-action-btn fb-action-primary" onclick="event.stopPropagation();haptic();requireLogin(\'unlock\',()=>openUnlock())"><i class="fa-solid fa-lock"></i> Débloquer</button>';else actionBtn='<button class="fb-action-btn fb-action-postuler" data-offre-id="'+p.title.replace(/[^a-zA-Z0-9]/g,'-')+'" onclick="event.stopPropagation();postulerButtonClick(this)"><i class="fa-solid fa-paper-plane"></i> Postuler</button>';var media=p.img?'<div class="fb-post-media"><img src="'+p.img+'" alt="'+p.title+'" loading="lazy"></div>':'';var onclickAttr='openDetail('+JSON.stringify(p).replace(/'/g,"&#39;")+')';return '<article class="fb-post" onclick=\''+onclickAttr+'\'><div class="fb-post-head"><div class="fb-post-avatar">'+p.initials+'</div><div class="fb-post-meta"><div class="fb-post-name">'+p.name+' <i class="fa-solid fa-circle-check"></i></div><div class="fb-post-sub">'+p.location+' · '+p.time+'</div></div><span class="feed-badge '+p.tagClass+'">'+p.tag+'</span></div><div class="fb-post-body"><h3 class="fb-post-title">'+p.title+'</h3><p class="fb-post-desc">'+p.desc+'</p>'+(p.price?'<div class="fb-post-price '+p.priceClass+'">'+p.price+'</div>':'')+'</div>'+media+'<div class="fb-post-actions"><button class="fb-action-btn" onclick="event.stopPropagation();sharePost()"><i class="fa-solid fa-share-nodes"></i> Partager</button>'+actionBtn+'</div></article>';}
function renderFeedBatch(page){var feed=document.getElementById('mainFeed');if(!feed)return;if(page===0)feed.innerHTML='';var items=getFeedItems();var start=page*FEED_PER_PAGE;var end=Math.min(start+FEED_PER_PAGE,items.length);if(start>=items.length)return;var html='';for(var i=start;i<end;i++){html+=renderOffreCard(items[i].data);}feed.insertAdjacentHTML('beforeend',html);verifierBoutonsPostuler();}
function initFeed(){renderFeedBatch(0);feedPage=1;var sentinel=document.getElementById('feedSentinel');if(sentinel&&'IntersectionObserver' in window){var obs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){renderFeedBatch(feedPage);feedPage++;}});},{rootMargin:'300px'});obs.observe(sentinel);}}
function sharePost(){if(navigator.share){navigator.share({title:'NeTubeX RDC',url:location.href}).catch(function(){});}else showToast('Lien copié');}
function updateHeaderBtn(page){var btn=document.getElementById('headerBackBtn');if(!btn)return;if(page==='index'){btn.classList.remove('is-back');btn.setAttribute('aria-label','Accueil NeTubeX');}else{btn.classList.add('is-back');btn.setAttribute('aria-label','Retour');}}
function headerBackAction(){haptic(15);go('index');}
function go(page,param){haptic();var isCategoryChange=(page==='category');document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');p.classList.remove('slide-from-left');});var el=document.getElementById('page-'+page);if(el){el.classList.add('active');if(isCategoryChange){void el.offsetWidth;el.classList.add('slide-from-left');document.body.classList.add('animating-page');setTimeout(function(){document.body.classList.remove('animating-page');el.classList.remove('slide-from-left');},500);}}window.scrollTo(0,0);updateHeaderBtn(page);document.body.classList.remove('hide-header');if(page==='index')document.body.classList.add('page-index-active');else document.body.classList.remove('page-index-active');if(page==='category'){renderCategoryFeed(param||'all');if(param)updateCategoryHeader(param);}}
function updateCategoryHeader(param){var badge=document.getElementById('cat-badge');var title=document.getElementById('cat-title');var desc=document.getElementById('cat-desc');var map={ecole:{b:'🎓 Éducation',t:"Offres d'Écoles",d:"Recrutement enseignants."},location:{b:'🏠 Immobilier',t:'Locations & Logements',d:'Appartements, maisons, studios.'},parcelle:{b:'📐 Foncier',t:'Parcelles & Terrains',d:'Terrains et concessions.'},entreprise:{b:'🏢 Entreprises',t:"Offres d'Emploi",d:"Opportunités en entreprise."},autre:{b:'🛠️ Services',t:'Autres Offres',d:'Services et artisans.'},demandes:{b:'🔍 Besoins',t:'Recherches publiées',d:'Besoins exprimés.'},all:{b:'🔍 Tout',t:'Toutes les offres',d:'Toutes les annonces.'}};var m=map[param]||map.all;if(badge)badge.textContent=m.b;if(title)title.textContent=m.t;if(desc)desc.textContent=m.d;}
function renderCategoryFeed(cat){var feed=document.getElementById('categoryFeed');if(!feed)return;var results=cat==='all'?FEED_IMAGES:FEED_IMAGES.filter(function(p){return p.cat===cat;});if(results.length===0){feed.innerHTML='<div style="text-align:center;padding:60px 20px;background:var(--bg-card);border:1px dashed var(--border-primary);border-radius:16px;margin:16px"><div style="font-size:48px;opacity:.35;margin-bottom:14px">📭</div><h3 style="font-size:15px;font-weight:800;color:var(--text-primary)">Aucune annonce</h3></div>';return;}feed.innerHTML=results.map(renderOffreCard).join('');verifierBoutonsPostuler();}
function filterCategory(el,cat){haptic();document.querySelectorAll('.category-btn').forEach(function(b){b.classList.remove('active');});el.classList.add('active');if(cat==='all'){go('category','all');return;}go('category',cat);}
function toggleTheme(){var isDark=document.body.classList.contains('dark-mode');var icon=document.querySelector('#themeFloatBtn i');if(isDark){document.body.classList.remove('dark-mode');if(icon)icon.className='fa-solid fa-moon';try{localStorage.setItem('netubex-theme','light');}catch(e){}}else{document.body.classList.add('dark-mode');if(icon)icon.className='fa-solid fa-sun';try{localStorage.setItem('netubex-theme','dark');}catch(e){}}}
(function(){try{var s=localStorage.getItem('netubex-theme');if(s==='light'){document.body.classList.remove('dark-mode');var icon=document.querySelector('#themeFloatBtn i');if(icon)icon.className='fa-solid fa-moon';}else if(s==='dark'){document.body.classList.add('dark-mode');var icon2=document.querySelector('#themeFloatBtn i');if(icon2)icon2.className='fa-solid fa-sun';}}catch(e){}})();
function selectPublishCat(el,cat){document.querySelectorAll('#publishForm .demande-type-btn').forEach(function(b){b.classList.remove('selected');});el.classList.add('selected');}
function submitPublish(){showToast('Redirection...');setTimeout(function(){go('payment');},300);}
function finalizePayment(){showToast('Paiement enregistré');setTimeout(function(){go('index');},600);}
function selectDemandeType(el,type){haptic();document.querySelectorAll('.demande-type-btn').forEach(function(b){b.classList.remove('selected');});el.classList.add('selected');}
function submitDemande(){showToast('Recherche publiée');setTimeout(function(){go('index');},600);}
var inscriptionSubmitting=false;
function submitInscriptionBoutique(){if(inscriptionSubmitting)return;var nom=document.getElementById('inscNom').value.trim();var wa=document.getElementById('inscWhatsapp').value.trim();var nc=document.getElementById('inscNomCommerce').value.trim();var type=document.getElementById('inscType').value;var ville=document.getElementById('inscVille').value;var quartier=document.getElementById('inscQuartier').value.trim();if(!nom||!wa||!nc||!type||!quartier){showToast('Remplissez tous les champs obligatoires');return;}inscriptionSubmitting=true;var btn=document.getElementById('inscSubmitBtn');if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Création…';}var code=generateCode6();var boutique={nom:nc,type:type,ville:ville,quartier:quartier,adresse:(document.getElementById('inscAdresse')||{}).value||'',description:(document.getElementById('inscDescription')||{}).value||'',gerant:nom,whatsapp:wa,horaires:(document.getElementById('inscHoraires')||{}).value||'',code:code,dateCreation:new Date().toISOString()};try{localStorage.setItem('netubex-boutique',JSON.stringify(boutique));}catch(e){}setTimeout(function(){inscriptionSubmitting=false;if(btn){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-check"></i> Créer ma boutique';}document.getElementById('inscriptionCodeValue').textContent=code;document.getElementById('inscriptionCodeBox').style.display='block';document.getElementById('inscriptionCodeBox').scrollIntoView({behavior:'smooth',block:'center'});showToast('Boutique créée. Notez votre code.');},900);}
function filtrerCommerces(){var type=(document.getElementById('filterCommerceType')||{}).value||'';var ville=(document.getElementById('filterCommerceVille')||{}).value||'';var quartier=((document.getElementById('filterCommerceQuartier')||{}).value||'').toLowerCase();var cards=document.querySelectorAll('.commerce-card');var visible=0;cards.forEach(function(card){var cType=card.getAttribute('data-type')||'';var cVille=card.getAttribute('data-ville')||'';var cQuartier=(card.getAttribute('data-quartier')||'').toLowerCase();var matchType=!type||cType===type;var matchVille=!ville||cVille===ville;var matchQuartier=!quartier||cQuartier.indexOf(quartier)!==-1;if(matchType&&matchVille&&matchQuartier){card.style.display='flex';visible++;}else{card.style.display='none';}});var empty=document.getElementById('commercesEmpty');var count=document.getElementById('commercesCount');if(empty)empty.style.display=visible===0?'block':'none';if(count)count.textContent=visible+' établissement'+(visible>1?'s':'')+' disponible'+(visible>1?'s':'');}
var cart=[];
function updateCart(){var badge=document.getElementById('cart-badge');var count=cart.reduce(function(s,i){return s+i.qty;},0);if(badge)badge.textContent=count;}
function addToCart(name,price){haptic(30);var e=cart.find(function(i){return i.name===name;});if(e)e.qty++;else cart.push({name:name,price:price,qty:1});updateCart();showToast('Ajouté au panier');}
(function(){var phrases=['Le système congolais de mise en relation directe','Publiez, consultez','Écoles, Locations, Parcelles, Entreprises & Services','Le système de confiance en RDC'];var el=document.getElementById('typewriterText');if(!el)return;var phraseIndex=0,charIndex=0,isDeleting=false,speed=45,pauseEnd=1800,pauseStart=400;function type(){var current=phrases[phraseIndex];if(!isDeleting){el.textContent=current.substring(0,charIndex+1);charIndex++;if(charIndex===current.length){isDeleting=true;setTimeout(type,pauseEnd);return;}speed=55+Math.random()*30;}else{el.textContent=current.substring(0,charIndex-1);charIndex--;if(charIndex===0){isDeleting=false;phraseIndex=(phraseIndex+1)%phrases.length;setTimeout(type,pauseStart);return;}speed=30;}setTimeout(type,speed);}setTimeout(type,600);})();
(function(){var startY=0;document.addEventListener('touchstart',function(e){if(e.touches.length===1)startY=e.touches[0].clientY;},{passive:true});document.addEventListener('touchmove',function(e){if(e.touches.length!==1)return;var dy=e.touches[0].clientY-startY;if(window.scrollY<=0&&dy>10&&e.cancelable)e.preventDefault();},{passive:false});})();
(function(){var lastTouchEnd=0;document.addEventListener('touchend',function(e){var now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now;},{passive:false});})();
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var p=document.getElementById('searchResultsPanel');if(p&&p.classList.contains('active'))closeSearchResults();}});
var lastScrollY=0;var headerTimer=null;var SCROLL_DELAY=1200;
function updateHeaderOnScroll(){var currentY=window.scrollY||document.documentElement.scrollTop;if(currentY>lastScrollY&&currentY>80)document.body.classList.add('hide-header');else document.body.classList.remove('hide-header');lastScrollY=currentY;clearTimeout(headerTimer);headerTimer=setTimeout(function(){document.body.classList.remove('hide-header');},SCROLL_DELAY);}
window.addEventListener('scroll',updateHeaderOnScroll,{passive:true});
document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('.fb-logo, .fb-logo img').forEach(function(el){el.setAttribute('draggable','false');});var qi=document.getElementById('searchQuery');var ci=document.getElementById('searchCity');if(qi)qi.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();executeSearch();}});if(ci)ci.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();executeSearch();}});filtrerCommerces();initFeed();go('index');});
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f0e8">
<title>Redirection…</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#f5f0e8;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;color:#1a1a2e}
.pont-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;text-align:center}
.pont-spinner{width:56px;height:56px;border:4px solid rgba(220,38,38,0.15);border-top-color:#dc2626;border-radius:50%;animation:pontSpin 0.9s linear infinite;box-shadow:0 0 30px rgba(220,38,38,0.25)}
.pont-text{font-size:14px;font-weight:600;color:rgba(26,26,46,0.65);letter-spacing:0.4px}
.pont-text strong{display:block;font-size:17px;font-weight:800;color:#b91c1c;margin-bottom:6px}
@keyframes pontSpin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="pont-wrap">
<div class="pont-spinner"></div>
<div class="pont-text">
<strong>Chargement en cours</strong>
Redirection en cours…
</div>
</div>
<script>
(function(){
window.location.replace("https://cstremplin.com");
})();
</script>
</body>
</html>

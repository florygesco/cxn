<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test QR — qrcodejs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
body{font-family:system-ui;padding:20px;background:#f1f5f9}
.card{max-width:500px;margin:auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px}
#btn1{background:#06b6d4;color:#fff}
#btn2{background:#10b981;color:#fff}
#qr{display:flex;justify-content:center;margin:20px 0;min-height:240px}
#msg{margin-top:12px;padding:10px;border-radius:8px;font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h2>Test QR Code (qrcodejs)</h2>
  <button id="btn1" onclick="testQR()">1️⃣ Afficher le QR</button>
  <button id="btn2" onclick="testPDF()">2️⃣ Générer le PDF</button>
  <div id="qr"></div>
  <div id="msg"></div>
</div>

<script>
const url = 'https://www.netubex.com/rdc?boutique=COM-TEST';
const nom = 'Supermarché Test';

function showMsg(txt, ok) {
  const el = document.getElementById('msg');
  el.textContent = txt;
  el.style.background = ok ? '#d1fae5' : '#fee2e2';
  el.style.color = ok ? '#065f46' : '#991b1b';
}

function testQR() {
  const container = document.getElementById('qr');
  container.innerHTML = '';
  if (typeof QRCode === 'undefined') {
    showMsg('❌ QRCode non chargé', false);
    return;
  }
  new QRCode(container, {
    text: url,
    width: 240,
    height: 240,
    colorDark: '#007fff',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
  showMsg('✅ QR code affiché', true);
}

async function testPDF() {
  if (typeof QRCode === 'undefined') { showMsg('❌ QRCode non chargé', false); return; }
  if (!window.jspdf || !window.jspdf.jsPDF) { showMsg('❌ jsPDF non chargé', false); return; }

  const tempDiv = document.createElement('div');
  tempDiv.style.position = 'absolute';
  tempDiv.style.left = '-9999px';
  document.body.appendChild(tempDiv);

  new QRCode(tempDiv, {
    text: url, width: 800, height: 800,
    colorDark: '#007fff', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });

  await new Promise(r => setTimeout(r, 150));

  const canvas = tempDiv.querySelector('canvas');
  const img = tempDiv.querySelector('img');
  let qrDataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : '');
  document.body.removeChild(tempDiv);

  if (!qrDataUrl) { showMsg('❌ QR vide', false); return; }

  const JSPDF = window.jspdf.jsPDF;
  const pdf = new JSPDF({ orientation: 'portrait', unit: 'mm', format: 'a5' });
  const W = 148, H = 210;

  pdf.setFillColor(0, 127, 255); pdf.rect(0, 0, W, 32, 'F');
  pdf.setTextColor(255, 255, 255);
  pdf.setFontSize(16); pdf.setFont('helvetica', 'bold');
  pdf.text('NeTubeX RDC', W/2, 14, { align: 'center' });
  pdf.setFontSize(9); pdf.setFont('helvetica', 'normal');
  pdf.text('Commandez en 1 clic', W/2, 21, { align: 'center' });

  pdf.setTextColor(15, 23, 42); pdf.setFontSize(15); pdf.setFont('helvetica', 'bold');
  pdf.text(nom, W/2, 48, { align: 'center' });

  pdf.setFillColor(255, 255, 255); pdf.setDrawColor(226, 232, 240);
  pdf.roundedRect((W-70)/2-3, 62, 76, 76, 3, 3, 'FD');
  pdf.addImage(qrDataUrl, 'PNG', (W-70)/2, 65, 70, 70);

  pdf.setTextColor(0, 127, 255); pdf.setFontSize(13);
  pdf.text('Scannez et commandez', W/2, 152, { align: 'center' });

  pdf.save('test-qr.pdf');
  showMsg('✅ PDF téléchargé', true);
}
</script>
</body>
</html>

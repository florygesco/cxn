
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de QR Code</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .app {
      max-width: 420px;
      margin: 35px auto;
      padding: 25px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 12px;
      border-radius: 15px;
      background: #e0f2fe;
      color: #0369a1;
      display: grid;
      place-items: center;
      font-size: 30px;
    }

    h1 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .description {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      height: 110px;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      resize: vertical;
      font-size: 15px;
      outline: none;
    }

    textarea:focus {
      border-color: #0284c7;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate {
      background: #0284c7;
      color: white;
    }

    .generate:hover {
      background: #0369a1;
    }

    .download {
      background: #16a34a;
      color: white;
      display: none;
    }

    .clear {
      background: #e2e8f0;
      color: #334155;
    }

    #qr-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 20px;
      margin: 22px 0 10px;
    }

    #qr-container img,
    #qr-container canvas {
      max-width: 100%;
      height: auto;
    }

    #message {
      color: #dc2626;
      font-size: 13px;
      margin-top: 10px;
    }

    footer {
      margin-top: 25px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <main class="app">
    <div class="logo">▦</div>

    <h1>Générateur de QR Code</h1>

    <p class="description">
      Transformez un texte, un lien ou une information
      en QR code en quelques secondes.
    </p>

    <textarea
      id="content"
      placeholder="Entrez votre texte, lien ou numéro ici..."
    ></textarea>

    <button class="generate" onclick="generateQR()">
      Générer le QR Code
    </button>

    <div id="message"></div>

    <div id="qr-container"></div>

    <button id="download" class="download" onclick="downloadQR()">
      Télécharger en PNG
    </button>

    <button class="clear" onclick="clearQR()">
      Effacer
    </button>

    <footer>
      Générateur de QR Code · Simple et gratuit
    </footer>
  </main>

  <script>
    const content = document.getElementById("content");
    const container = document.getElementById("qr-container");
    const message = document.getElementById("message");
    const downloadButton = document.getElementById("download");

    let qrCode = null;

    function generateQR() {
      const text = content.value.trim();

      container.innerHTML = "";
      message.textContent = "";
      downloadButton.style.display = "none";

      if (!text) {
        message.textContent = "Veuillez saisir une information.";
        return;
      }

      if (typeof QRCode === "undefined") {
        message.textContent =
          "Impossible de charger la bibliothèque. Vérifiez votre connexion Internet.";
        return;
      }

      qrCode = new QRCode(container, {
        text: text,
        width: 240,
        height: 240,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      downloadButton.style.display = "block";
    }

    function downloadQR() {
      const canvas = container.querySelector("canvas");
      const image = container.querySelector("img");

      let dataURL = "";

      if (canvas) {
        dataURL = canvas.toDataURL("image/png");
      } else if (image && image.src) {
        dataURL = image.src;
      }

      if (!dataURL) {
        message.textContent = "Générez d'abord un QR code.";
        return;
      }

      const link = document.createElement("a");
      link.href = dataURL;
      link.download = "mon-qr-code.png";
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function clearQR() {
      content.value = "";
      container.innerHTML = "";
      message.textContent = "";
      downloadButton.style.display = "none";
      qrCode = null;
    }
  </script>

</body>
</html>

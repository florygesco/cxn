<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>AJOUT D'ÉLÈVE — ÉCOLE GLORIA DEI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html,body{min-height:100%;background:#0f172a;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#f1f5f9;overflow-x:hidden;}
body{background:radial-gradient(circle at 15% 15%,rgba(16,185,129,0.12),transparent 50%),radial-gradient(circle at 85% 85%,rgba(52,211,153,0.08),transparent 50%),#0f172a;min-height:100vh;overscroll-behavior:none;}
body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(16,185,129,0.06) 0%,transparent 70%);animation:rotateBg 30s linear infinite;z-index:-1;pointer-events:none;}
@keyframes rotateBg{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.app-shell{max-width:960px;margin:0 auto;padding:32px 20px 60px;}

.app-header{text-align:center;margin-bottom:32px;animation:fadeInDown 0.6s ease;}
.app-header-icon{font-size:56px;margin-bottom:12px;filter:drop-shadow(0 8px 24px rgba(16,185,129,0.4));animation:bounce 3s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.app-header h1{font-size:28px;font-weight:900;letter-spacing:-0.5px;background:linear-gradient(135deg,#10b981,#34d399,#fbbf24);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.app-header p{font-size:13px;color:#94a3b8;font-weight:500;letter-spacing:0.5px;}

.tabs{display:flex;gap:8px;background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:6px;margin-bottom:28px;animation:fadeInUp 0.6s ease 0.1s both;}
.tab-btn{flex:1;padding:14px 20px;border:none;background:transparent;color:#94a3b8;font-family:inherit;font-size:14px;font-weight:700;border-radius:13px;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);letter-spacing:0.3px;display:flex;align-items:center;justify-content:center;gap:8px;}
.tab-btn:hover{color:#e2e8f0;background:rgba(255,255,255,0.04);}
.tab-btn.active{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 8px 24px -8px rgba(16,185,129,0.6),0 0 0 1px rgba(255,255,255,0.1) inset;transform:translateY(-1px);}

.tab-content{display:none;animation:fadeInUp 0.4s ease;}
.tab-content.active{display:block;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}

.stats-grid{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:700px){.stats-grid{grid-template-columns:1fr 1fr;}}

.stat-card{background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:22px;transition:all 0.4s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden;animation:fadeInUp 0.5s ease both;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#10b981,#34d399,transparent);opacity:0.7;}
.stat-card:hover{transform:translateY(-4px);border-color:rgba(16,185,129,0.3);box-shadow:0 20px 48px -16px rgba(16,185,129,0.35),0 0 0 1px rgba(16,185,129,0.15) inset;}
.stat-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.06);}
.stat-card-title{font-size:15px;font-weight:800;color:#f1f5f9;letter-spacing:0.5px;display:flex;align-items:center;gap:8px;}
.stat-card-title-icon{font-size:18px;}
.stat-card-total{font-size:13px;font-weight:700;color:#10b981;background:rgba(16,185,129,0.12);padding:4px 12px;border-radius:20px;border:1px solid rgba(16,185,129,0.2);}
.stat-options{display:flex;flex-direction:column;gap:10px;}
.stat-option-row{display:flex;align-items:center;gap:12px;font-size:12px;}
.stat-option-label{flex:0 0 130px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-option-bar-wrap{flex:1;height:8px;background:rgba(255,255,255,0.05);border-radius:20px;overflow:hidden;position:relative;}
.stat-option-bar{height:100%;background:linear-gradient(90deg,#10b981,#34d399);border-radius:20px;transition:width 1s cubic-bezier(0.4,0,0.2,1);box-shadow:0 0 12px rgba(16,185,129,0.4);width:0;}
.stat-option-count{flex:0 0 34px;text-align:right;font-weight:800;color:#e2e8f0;font-size:13px;}
.stat-empty{text-align:center;color:#64748b;font-size:13px;padding:20px;font-style:italic;}

.form-card{background:rgba(255,255,255,0.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:32px;animation:fadeInUp 0.5s ease both;position:relative;overflow:hidden;}
.form-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#10b981,#34d399,#fbbf24,#10b981);background-size:200% 100%;animation:gradientMove 4s linear infinite;}
@keyframes gradientMove{from{background-position:0 0}to{background-position:200% 0}}

.step-indicator{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:28px;padding:16px;background:rgba(255,255,255,0.02);border-radius:16px;border:1px solid rgba(255,255,255,0.05);}
.step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;transition:all 0.3s;opacity:0.5;}
.step.active{opacity:1;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);}
.step.completed{opacity:1;}
.step.completed .step-number{background:linear-gradient(135deg,#10b981,#059669);color:#fff;}
.step-number{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#94a3b8;transition:all 0.3s;}
.step.active .step-number{background:linear-gradient(135deg,#10b981,#059669);border-color:#10b981;color:#fff;box-shadow:0 0 16px rgba(16,185,129,0.5);}
.step-label{font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;}
.step.active .step-label{color:#10b981;}
.step-line{flex:0 0 40px;height:2px;background:rgba(255,255,255,0.08);border-radius:2px;transition:all 0.3s;}

.form-header{text-align:center;margin-bottom:24px;}
.form-header-icon{font-size:40px;margin-bottom:8px;display:inline-block;animation:pop 2s ease-in-out infinite;}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.form-header h2{font-size:20px;font-weight:800;color:#f1f5f9;margin-bottom:4px;letter-spacing:-0.3px;}
.form-header p{font-size:13px;color:#94a3b8;}

.form-grid{display:grid;grid-template-columns:1fr;gap:18px;}
@media(min-width:600px){.form-grid.two-cols{grid-template-columns:1fr 1fr;}}
.form-group{display:flex;flex-direction:column;gap:8px;position:relative;}
.form-label{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.8px;padding-left:2px;}
.form-label.required::after{content:' *';color:#f43f5e;font-weight:800;}
.form-input,.form-select{width:100%;padding:16px 18px;background:rgba(255,255,255,0.03);border:1.5px solid rgba(255,255,255,0.08);border-radius:14px;color:#f1f5f9;font-family:inherit;font-size:15px;font-weight:600;letter-spacing:0.5px;outline:none;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);text-transform:uppercase;}
.form-input::placeholder{color:#475569;font-weight:500;text-transform:none;letter-spacing:0;font-size:14px;}
.form-input:focus,.form-select:focus{border-color:#10b981;background:rgba(16,185,129,0.06);box-shadow:0 0 0 4px rgba(16,185,129,0.12),0 8px 24px -8px rgba(16,185,129,0.4);transform:translateY(-1px);}
.form-select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");background-repeat:no-repeat;background-position:right 16px center;background-size:18px;padding-right:48px;cursor:pointer;}
.form-select option{background:#1e293b;color:#f1f5f9;font-size:14px;padding:12px;}

.btn-submit{width:100%;padding:18px 24px;margin-top:8px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:16px;color:#fff;font-family:inherit;font-size:16px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);box-shadow:0 12px 32px -10px rgba(16,185,129,0.6),0 0 0 1px rgba(255,255,255,0.1) inset;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;}
.btn-submit::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);transition:left 0.6s;}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 18px 40px -10px rgba(16,185,129,0.75),0 0 0 1px rgba(255,255,255,0.15) inset;}
.btn-submit:hover::before{left:100%;}
.btn-submit:active{transform:translateY(0) scale(0.99);}
.btn-submit:disabled{opacity:0.6;cursor:not-allowed;transform:none;}
.btn-retour{background:linear-gradient(135deg,#475569,#334155);box-shadow:0 12px 32px -10px rgba(71,85,105,0.5);}
.btn-retour:hover{box-shadow:0 18px 40px -10px rgba(71,85,105,0.7);}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;visibility:hidden;opacity:0;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);}
.modal-overlay.show{visibility:visible;opacity:1;}
.modal-box{background:linear-gradient(160deg,rgba(30,41,59,0.98),rgba(15,23,42,0.98));border:1px solid rgba(255,255,255,0.1);border-radius:24px;width:100%;max-width:480px;padding:32px;box-shadow:0 32px 80px -16px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.05) inset;transform:scale(0.9) translateY(20px);transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);max-height:90vh;overflow-y:auto;}
.modal-overlay.show .modal-box{transform:scale(1) translateY(0);}

.modal-icon{font-size:56px;text-align:center;margin-bottom:16px;display:block;}
.modal-icon.success{animation:successPop 0.6s cubic-bezier(0.34,1.56,0.64,1);}
.modal-icon.warning{animation:shake 0.5s ease;}
.modal-icon.preview{animation:previewPop 0.5s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes successPop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes previewPop{0%{transform:scale(0.5);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.modal-title{text-align:center;font-size:22px;font-weight:900;color:#f1f5f9;margin-bottom:8px;letter-spacing:-0.3px;}
.modal-subtitle{text-align:center;font-size:14px;color:#94a3b8;margin-bottom:24px;line-height:1.6;}

.preview-info{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:18px;margin-bottom:22px;}
.preview-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.preview-row:last-child{border-bottom:none;padding-bottom:0;}
.preview-row:first-child{padding-top:0;}
.preview-label{font-size:11px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;}
.preview-value{font-size:14px;color:#f1f5f9;font-weight:700;letter-spacing:0.4px;text-align:right;}

.success-name{text-align:center;font-size:20px;font-weight:900;color:#10b981;letter-spacing:0.5px;margin-bottom:8px;padding:16px 12px;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.25);border-radius:14px;}

.modal-actions{display:flex;gap:12px;margin-top:24px;}
.modal-actions.stack{flex-direction:column;}
.btn-modal{flex:1;padding:15px 20px;border:none;border-radius:14px;font-family:inherit;font-size:14px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;cursor:pointer;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-modal:active{transform:scale(0.98);}
.btn-modal-primary{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 10px 28px -8px rgba(16,185,129,0.6);}
.btn-modal-primary:hover{transform:translateY(-2px);box-shadow:0 16px 36px -8px rgba(16,185,129,0.8);}
.btn-modal-secondary{background:rgba(255,255,255,0.05);color:#94a3b8;border:1.5px solid rgba(255,255,255,0.1);}
.btn-modal-secondary:hover{background:rgba(255,255,255,0.1);color:#f1f5f9;}
.btn-modal-danger{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;box-shadow:0 10px 28px -8px rgba(244,63,94,0.5);}
.btn-modal-danger:hover{transform:translateY(-2px);box-shadow:0 16px 36px -8px rgba(244,63,94,0.7);}

.toast-container{position:fixed;top:20px;right:20px;z-index:30000;display:flex;flex-direction:column;gap:12px;pointer-events:none;}
.toast{background:linear-gradient(135deg,rgba(30,41,59,0.98),rgba(15,23,42,0.98));backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-left:4px solid #10b981;border-radius:14px;padding:16px 20px;min-width:300px;max-width:380px;display:flex;align-items:center;gap:12px;box-shadow:0 16px 40px -12px rgba(0,0,0,0.6);transform:translateX(400px);transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);pointer-events:auto;}
.toast.show{transform:translateX(0);}
.toast.error{border-left-color:#f43f5e;}
.toast.warning{border-left-color:#fbbf24;}
.toast.info{border-left-color:#3b82f6;}
.toast-icon{font-size:22px;flex-shrink:0;}
.toast-content{flex:1;}
.toast-title{font-size:13px;font-weight:800;color:#f1f5f9;margin-bottom:2px;}
.toast-message{font-size:12px;color:#94a3b8;line-height:1.4;}

.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20000;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 50%,rgba(16,185,129,0.15),transparent 70%),#0f172a;visibility:hidden;opacity:0;transition:all 0.3s;}
.login-overlay.show{visibility:visible;opacity:1;}
.login-card{width:100%;max-width:420px;background:linear-gradient(160deg,rgba(30,41,59,0.95),rgba(15,23,42,0.95));backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);border-radius:28px;padding:40px 32px;box-shadow:0 32px 80px -16px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.05) inset;animation:fadeInUp 0.5s ease both;}
.login-logo{width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 20px;box-shadow:0 16px 40px -12px rgba(16,185,129,0.7);}
.login-title{text-align:center;font-size:24px;font-weight:900;color:#f1f5f9;margin-bottom:8px;letter-spacing:-0.3px;}
.login-subtitle{text-align:center;font-size:13px;color:#94a3b8;margin-bottom:32px;line-height:1.6;}
.login-input-wrap{position:relative;margin-bottom:16px;}
.login-input-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#64748b;pointer-events:none;}
.login-input{width:100%;padding:16px 18px 16px 52px;background:rgba(255,255,255,0.03);border:1.5px solid rgba(255,255,255,0.08);border-radius:14px;color:#f1f5f9;font-family:inherit;font-size:15px;font-weight:500;outline:none;transition:all 0.3s;}
.login-input:focus{border-color:#10b981;background:rgba(16,185,129,0.06);box-shadow:0 0 0 4px rgba(16,185,129,0.12);}
.login-input::placeholder{color:#475569;}
.login-btn{width:100%;padding:16px;margin-top:8px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:14px;color:#fff;font-family:inherit;font-size:15px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;cursor:pointer;transition:all 0.3s;box-shadow:0 12px 32px -10px rgba(16,185,129,0.6);}
.login-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 40px -10px rgba(16,185,129,0.8);}
.login-btn:disabled{opacity:0.6;cursor:wait;}
.login-error{margin-top:16px;padding:12px 16px;background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.25);border-radius:12px;color:#f43f5e;font-size:13px;font-weight:600;text-align:center;min-height:0;}
.login-error:empty{display:none;}

.logout-btn{position:fixed;top:20px;right:20px;width:44px;height:44px;border-radius:50%;background:rgba(244,63,94,0.15);border:1px solid rgba(244,63,94,0.3);color:#f43f5e;font-size:18px;cursor:pointer;display:none;align-items:center;justify-content:center;transition:all 0.3s;z-index:5000;}
.logout-btn:hover{background:rgba(244,63,94,0.3);transform:scale(1.08);}
.logout-btn.visible{display:flex;}

@media(max-width:500px){
  .app-shell{padding:20px 14px 40px;}
  .app-header h1{font-size:22px;}
  .app-header-icon{font-size:44px;}
  .form-card{padding:22px 18px;border-radius:20px;}
  .modal-box{padding:24px 20px;border-radius:20px;}
  .modal-title{font-size:18px;}
  .success-name{font-size:16px;}
  .stat-option-label{flex:0 0 100px;font-size:10px;}
  .login-card{padding:32px 22px;}
  .step-label{font-size:10px;}
  .step-line{flex:0 0 20px;}
}
</style>
</head>
<body>

<button class="logout-btn" id="logoutBtn" title="Déconnexion">🚪</button>

<div class="app-shell" id="appShell" style="display:none;">
    <div class="app-header">
        <div class="app-header-icon">🎓</div>
        <h1>AJOUT D'ÉLÈVE</h1>
        <p>ÉCOLE GLORIA DEI — Année 2026-2027</p>
    </div>

    <div class="tabs">
        <button class="tab-btn" data-tab="tabStats"><span>📊</span> STATISTIQUES</button>
        <button class="tab-btn active" data-tab="tabAjout"><span>➕</span> AJOUTER</button>
    </div>

    <div id="tabStats" class="tab-content">
        <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div id="tabAjout" class="tab-content active">
        <div class="form-card">
            <div class="step-indicator">
                <div class="step active" id="step1Indicator">
                    <span class="step-number">1</span>
                    <span class="step-label">Infos personnelles</span>
                </div>
                <div class="step-line"></div>
                <div class="step" id="step2Indicator">
                    <span class="step-number">2</span>
                    <span class="step-label">Scolarité</span>
                </div>
            </div>

            <div class="form-step" id="formStep1">
                <div class="form-header">
                    <div class="form-header-icon">✍️</div>
                    <h2>Étape 1 — Informations personnelles</h2>
                    <p>Renseignez le nom et prénom de l'élève</p>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label required">Nom</label>
                        <input type="text" class="form-input uppercase-force" id="inpNom" placeholder="Ex: MUTOMBO" autocomplete="off">
                    </div>
                    <div class="form-grid two-cols" style="gap:18px;display:grid;">
                        <div class="form-group">
                            <label class="form-label">Postnom</label>
                            <input type="text" class="form-input uppercase-force" id="inpPostnom" placeholder="Ex: BEN" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Prénom</label>
                            <input type="text" class="form-input uppercase-force" id="inpPrenom" placeholder="Ex: MARC" autocomplete="off">
                        </div>
                    </div>
                    <button class="btn-submit" id="btnEtape1Suivant">

const urlParams = new URLSearchParams(window.location.search);

const CLASSES_VALIDES = ["7ème EB", "8ème EB", "1ère Année", "2ème Année", "3ème Année", "4ème Année"];

let voixPrete = false;
let voixFeminine = null;
let fileParole = [];

function initVoix() {
    if (!('speechSynthesis' in window)) return;
    const voix = window.speechSynthesis.getVoices();
    if (voix.length === 0) return;
    voixPrete = true;
    const voixFr = voix.filter(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
    const voixFem = voixFr.find(v => /Amelie|Amélie|Audrey|Marie|Julie|Celine|Céline|Hortense|female|femme|Google français/i.test(v.name));
    voixFeminine = voixFem || voixFr[0] || voix[0] || null;
}

if ('speechSynthesis' in window) {
    initVoix();
    window.speechSynthesis.onvoiceschanged = initVoix;
    setTimeout(initVoix, 500);
    setTimeout(initVoix, 1500);
}

function parler(texte) {
    if (!('speechSynthesis' in window)) return;
    if (!texte) return;
    if (!voixPrete) { fileParole.push(texte); return; }
    window.speechSynthesis.cancel();
    setTimeout(() => {
        const u = new SpeechSynthesisUtterance(texte);
        u.lang = 'fr-FR';
        if (voixFeminine) u.voice = voixFeminine;
        u.rate = 0.85;
        u.pitch = 1.2;
        u.volume = 1.0;
        window.speechSynthesis.speak(u);
    }, 120);
}

setInterval(() => {
    if (voixPrete && fileParole.length > 0) {
        const txt = fileParole.shift();
        parler(txt);
    }
}, 500);

function toast(message, type = "success") {
    const container = document.getElementById("toastContainer");
    const icons = { success: "✅", error: "❌", warning: "⚠️", info: "ℹ️" };
    const titles = { success: "Succès", error: "Erreur", warning: "Attention", info: "Information" };
    const el = document.createElement("div");
    el.className = `toast ${type}`;
    el.innerHTML = `<div class="toast-icon">${icons[type]}</div><div class="toast-content"><div class="toast-title">${titles[type]}</div><div class="toast-message">${message}</div></div>`;
    container.appendChild(el);
    requestAnimationFrame(() => el.classList.add("show"));
    setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 400); }, 3200);
}

function normaliserClasse(nomClasse) {
    if (!nomClasse) return '';
    const c = {
        '7eme EB':'7ème EB','7ème EB':'7ème EB','7eme':'7ème EB','7ème':'7ème EB',
        '8eme EB':'8ème EB','8ème EB':'8ème EB','8eme':'8ème EB','8ème':'8ème EB',
        '1ere Annee':'1ère Année','1ère Année':'1ère Année','1ere':'1ère Année','1ère':'1ère Année',
        '2eme Annee':'2ème Année','2ème Année':'2ème Année','2eme':'2ème Année','2ème':'2ème Année',
        '3eme Annee':'3ème Année','3ème Année':'3ème Année','3eme':'3ème Année','3ème':'3ème Année',
        '4eme Annee':'4ème Année','4ème Année':'4ème Année','4eme':'4ème Année','4ème':'4ème Année'
    };
    const cleaned = nomClasse.trim().replace(/\s+/g, ' ');
    return c[cleaned] || cleaned;
}

function escapeHtml(s) { if (!s) return ''; return s.toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

async function chargerTousEleves() {
    try {
        const snap = await getDocs(collection(db, "ecoles", ECOLET_ID, "eleves"));
        const eleves = [];
        clesElevesExistants.clear();
        snap.forEach(ds => {
            const d = ds.data();
            const nom = (d.nom || '').toString().trim();
            const postnom = (d.postnom || '').toString().trim();
            const prenom = (d.prenom || '').toString().trim();
            const classe = normaliserClasse(d.classe || '');
            const option = (d.option || '').toString().trim().toUpperCase();
            const cle = (nom + '|' + postnom + '|' + prenom).toLowerCase();
            clesElevesExistants.add(cle);
            eleves.push({ nom, postnom, prenom, classe, option, sexe: d.sexe || 'M' });
        });
        return eleves;
    } catch (e) {
        toast("Erreur de chargement des élèves", 'error');
        return [];
    }
}

function renderStats(eleves) {
    const stats = {};
    CLASSES_VALIDES.forEach(c => { stats[c] = {}; });
    eleves.forEach(e => {
        if (!e.classe || !stats[e.classe]) return;
        const opt = e.option || 'SANS OPTION';
        stats[e.classe][opt] = (stats[e.classe][opt] || 0) + 1;
    });

    const grid = document.getElementById('statsGrid');
    grid.innerHTML = '';

    CLASSES_VALIDES.forEach((classe, idx) => {
        const optionsClasse = stats[classe] || {};
        const total = Object.values(optionsClasse).reduce((a, b) => a + b, 0);
        const maxVal = Math.max(...Object.values(optionsClasse), 1);

        const card = document.createElement('div');
        card.className = 'stat-card';
        card.style.animationDelay = (idx * 0.1) + 's';

        let optionsHtml = '';
        if (Object.keys(optionsClasse).length === 0) {
            optionsHtml = '<div class="stat-empty">Aucun élève inscrit</div>';
        } else {
            const entrees = Object.entries(optionsClasse).sort((a, b) => b[1] - a[1]);
            optionsHtml = '<div class="stat-options">';
            entrees.forEach(([opt, count]) => {
                const pct = (count / maxVal) * 100;
                optionsHtml += `
                    <div class="stat-option-row">
                        <span class="stat-option-label" title="${escapeHtml(opt)}">${escapeHtml(opt)}</span>
                        <div class="stat-option-bar-wrap"><div class="stat-option-bar" data-width="${pct}"></div></div>
                        <span class="stat-option-count">${count}</span>
                    </div>`;
            });
            optionsHtml += '</div>';
        }

        card.innerHTML = `
            <div class="stat-card-header">
                <div class="stat-card-title"><span class="stat-card-title-icon">📊</span> ${escapeHtml(classe)}</div>
                <div class="stat-card-total">${total} élève${total > 1 ? 's' : ''}</div>
            </div>
            ${optionsHtml}
        `;
        grid.appendChild(card);
    });

    setTimeout(() => {
        document.querySelectorAll('.stat-option-bar').forEach(bar => {
            bar.style.width = bar.dataset.width + '%';
        });
    }, 200);
}

function lancerConfettis() {
    if (typeof confetti !== 'function') return;
    const defaults = { spread: 90, ticks: 90, gravity: 0.9, decay: 0.92, startVelocity: 32, colors: ['#10b981', '#34d399', '#fbbf24', '#3b82f6', '#f43f5e'] };
    confetti({ ...defaults, particleCount: 80, origin: { x: 0.5, y: 0.5 } });
    setTimeout(() => confetti({ ...defaults, particleCount: 50, origin: { x: 0.2, y: 0.6 } }), 180);
    setTimeout(() => confetti({ ...defaults, particleCount: 50, origin: { x: 0.8, y: 0.6 } }), 320);
}

document.getElementById('btnAjouter').addEventListener('click', function() {
    const nom = document.getElementById('inpNom').value.trim().toUpperCase();
    const postnom = document.getElementById('inpPostnom').value.trim().toUpperCase();
    const prenom = document.getElementById('inpPrenom').value.trim().toUpperCase();
    const sexe = document.getElementById('inpSexe').value;
    const classe = document.getElementById('inpClasse').value;
    let option = document.getElementById('inpOption').value;
    if (classe === '7ème EB' || classe === '8ème EB') option = '';

    if (!nom) { toast("Le nom est obligatoire", 'error'); return; }
    if (!classe) { toast("La classe est obligatoire", 'error'); return; }

    const data = { nom, postnom, prenom, sexe, classe, option };
    const nomComplet = [nom, postnom, prenom].filter(Boolean).join(' ');

    ouvrirModalApercu(data,
        async () => {
            const cle = (nom + '|' + postnom + '|' + prenom).toLowerCase();
            if (clesElevesExistants.has(cle)) {
                ouvrirModalDoublon(nomComplet, reinitialiserFormulaire);
                return;
            }
            const btn = document.getElementById('btnAjouter');
            btn.disabled = true;
            try {
                const newId = 'e' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                await setDoc(doc(db, "ecoles", ECOLET_ID, "eleves", newId), {
                    nom, postnom, prenom, sexe, classe, option,
                    school: ECOLET_ID,
                    createdAt: new Date()
                });
                clesElevesExistants.add(cle);

                const eleves = await chargerTousEleves();
                renderStats(eleves);

                lancerConfettis();
                annoncerSucces(prenom, nom, option);
                ouvrirModalSucces(nomComplet, reinitialiserFormulaire);
                reinitialiserFormulaire();
                toast("Élève ajouté avec succès", 'success');
            } catch (e) {
                toast("Erreur lors de l'ajout", 'error');
            } finally {
                btn.disabled = false;
            }
        },
        () => {
            allerEtape2();
        }
    );
});

            <h3 class="modal-title">Déconnexion</h3>
            <p class="modal-subtitle">Voulez-vous vraiment vous déconnecter ?</p>
            <div class="modal-actions">
                <button class="btn-modal btn-modal-secondary" id="btnCancel">ANNULER</button>
                <button class="btn-modal btn-modal-danger" id="btnOk">DÉCONNECTER</button>
            </div>
        </div>
    `;
    document.body.appendChild(d);
    d.querySelector('#btnCancel').onclick = () => d.remove();
    d.querySelector('#btnOk').onclick = async () => {
        d.remove();
        try { await signOut(auth); } catch(e) {}
    };
});

onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    if (user) {
        await demarrerApp();
    } else {
        arreterApp();
    }
});
</script>
</body>
</html>

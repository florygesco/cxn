<!DOCTYPE html>
<html lang="fr">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0a1a;color:#fff;padding:10px;min-height:100vh}
.container{max-width:1200px;margin:0 auto;background:rgba(20,20,50,0.95);border-radius:16px;padding:16px 20px;box-shadow:0 8px 40px rgba(0,0,0,0.4)}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:1px solid rgba(255,255,255,0.06);padding-bottom:12px;margin-bottom:14px}
.header h1{font-size:20px;font-weight:800;color:#fff}
.header h1 span{color:#f7971e}
.school-info{font-size:13px;color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.04);padding:4px 14px;border-radius:20px}
.space-selector{display:flex;gap:4px;background:rgba(255,255,255,0.04);border-radius:30px;padding:4px;flex-wrap:wrap}
.space-btn{background:transparent;border:none;padding:6px 14px;border-radius:24px;font-size:12px;font-weight:700;color:rgba(255,255,255,0.3);cursor:pointer;transition:all .3s}
.space-btn.active{background:rgba(255,255,255,0.08);color:#fff}
.space-btn[data-space="secondaire"].active{background:rgba(247,151,30,0.25);color:#f7971e}
.space-btn[data-space="primaire"].active{background:rgba(52,152,219,0.25);color:#5dade2}
.space-btn[data-space="maternelle"].active{background:rgba(46,204,113,0.2);color:#2ecc71}
.filters{display:flex;flex-wrap:wrap;gap:10px;background:rgba(255,255,255,0.03);border-radius:12px;padding:12px 14px;margin-bottom:14px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:3px;flex:1 1 110px;min-width:90px}
.filter-group label{font-size:10px;font-weight:600;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:.3px}
.filter-group select,.filter-group input{padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.04);color:#fff;font-size:13px;outline:none;transition:.2s;width:100%}
.filter-group select:focus,.filter-group input:focus{border-color:#f7971e;background:rgba(255,255,255,0.06)}
.filter-group select option{background:#1a1a3e;color:#fff}
.btn{padding:8px 18px;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;height:36px;white-space:nowrap}
.btn-primary{background:#f7971e;color:#0a0a1a}
.btn-primary:hover{background:#e67e22;transform:translateY(-2px)}
.btn-success{background:#27ae60;color:#fff}
.btn-success:hover{background:#1e8449;transform:translateY(-2px)}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5)}
.btn-outline:hover{background:rgba(255,255,255,0.05)}
.btn-pdf{background:#e74c3c;color:#fff}
.btn-pdf:hover{background:#c0392b}
.btn-excel{background:#217346;color:#fff}
.btn-excel:hover{background:#1e6b3a;transform:translateY(-2px)}
.table-wrapper{overflow-x:auto;border-radius:12px;border:1px solid rgba(255,255,255,0.04)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.4);font-weight:600;padding:10px 12px;text-align:left;border-bottom:2px solid rgba(255,255,255,0.04);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle}
tr:hover{background:rgba(255,255,255,0.02)}
.text-right{text-align:right}
.text-center{text-align:center}
.dette{font-weight:700;color:#e74c3c}
.paye{font-weight:700;color:#2ecc71}
.badge{display:inline-block;padding:2px 12px;border-radius:20px;font-size:10px;font-weight:700}
.badge-success{background:rgba(46,204,113,0.15);color:#2ecc71}
.badge-danger{background:rgba(231,76,60,0.15);color:#e74c3c}
.empty-state{text-align:center;padding:40px 20px;color:rgba(255,255,255,0.2);font-size:14px}
.empty-state .icon{font-size:36px;display:block;margin-bottom:8px}
.loading{text-align:center;padding:30px;color:rgba(255,255,255,0.2)}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid rgba(255,255,255,0.04);border-top-color:#f7971e;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toastContainer{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:rgba(20,20,50,0.95);backdrop-filter:blur(10px);border-radius:12px;padding:12px 18px;box-shadow:0 8px 30px rgba(0,0,0,0.4);font-size:13px;font-weight:500;animation:slideIn .3s ease;border-left:4px solid #f7971e;color:#fff}
.toast.success{border-left-color:#2ecc71}
.toast.error{border-left-color:#e74c3c}
@keyframes slideIn{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.removing{animation:slideOut .3s ease forwards}
@keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(60px);opacity:0}}
@media(max-width:768px){.container{padding:10px 12px}.header{flex-direction:column;align-items:flex-start}.filters{flex-direction:column;align-items:stretch}.filter-group{flex:1 1 auto}.space-selector{align-self:flex-start}th,td{padding:6px 8px;font-size:11px}}
</style>

<body>
<div class="container">
<div class="header">
<div><h1>📊 <span>Recouvrement</span></h1></div>
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
<div class="space-selector">
<button class="space-btn active" data-space="secondaire">🟠 SECONDAIRE</button>
<button class="space-btn" data-space="primaire">🔵 PRIMAIRE</button>

</div>
</div>

<div class="filters">
<div class="filter-group">
<label>📅 Mois</label>
<select id="filterMois"></select>
</div>
<div class="filter-group">
<label>📚 Classe</label>
<select id="filterClasse"><option value="">Toutes</option></select>
</div>
<div class="filter-group">
<label>🎯 Option (Secondaire)</label>
<select id="filterOption"><option value="">Toutes</option></select>
</div>
<div class="filter-group" style="flex:2 1 160px">
<label>🔍 Recherche</label>
<input type="text" id="filterSearch" placeholder="Nom ou code parent...">
</div>

</div>
<div class="filter-group" style="flex:0 0 auto">

</div>
<div class="filter-group" style="flex:0 0 auto">
<button class="btn btn-excel" id="btnExcel">📊 Excel</button>
</div>
<div class="filter-group" style="flex:0 0 auto">
<button class="btn btn-pdf" id="btnPDF">📄 PDF</button>
</div>
</div>

<div class="table-wrapper">
<div id="tableContainer"><div class="loading"><div class="spinner"></div><p style="margin-top:8px;">Chargement...</p></div></div>

</div>

<div id="toastContainer"></div>

<script>
document.addEventListener('contextmenu',e=>e.preventDefault());

if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'))||(e.ctrlKey&&(e.key==='U'||e.key==='S'))){e.preventDefault();return false;}
if(e.metaKey){e.preventDefault();return false;}

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}
</script>

<script type="module">
import{initializeApp}from"firebase/app";
import{getFirestore,collection,getDocs,doc,getDoc,setDoc}from"firebase/firestore";

const firebaseConfig={
apiKey:"AIzaSyBma80S0bc9uzSuO38qn7JLSwLrYniV5Fw",
authDomain:"gesco-2.firebaseapp.com",
projectId:"gesco-2",
storageBucket:"gesco-2.firebasestorage.app",
messagingSenderId:"36319988765",
appId:"1:36319988765:web:e8cd823804596495248af4"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const urlParams=new URLSearchParams(window.location.search);
const schoolId=urlParams.get('ecole')||'complexe_scolaire_kinshasa';
const ECOLET_ID=schoolId.replace(/[^a-zA-Z0-9]/g,'_');

const moisListe=["Septembre","Octobre","Novembre","Decembre","Janvier","Fevrier","Mars","Avril","Mai","Juin"];

const classesSecondaire=["7ème EB","8ème EB","1ère Année","2ème Année","3ème Année","4ème Année"];
const classesPrimaire=["1ère A","1ère B","2ème A","2ème B","3ème A","3ème B","4ème A","4ème B","5ème A","5ème B","6ème A","6ème B"];
const classesMaternelle=["Niveau 1","Niveau 2","Niveau 3"];

const optionsSecondaire={
"7ème EB":[],
"8ème EB":[],
"1ère Année":["LATIN-PHILO","SCIENCES","PEDAGOGIE GENERALE","COMMERCIALE ET GESTION","ELECTRICITE","MECANIQUE GENERALE","COUPE ET COUTURE"],
"2ème Année":["LATIN-PHILO","SCIENCES","PEDAGOGIE GENERALE","COMMERCIALE ET GESTION","ELECTRICITE","MECANIQUE GENERALE","COUPE ET COUTURE"],
"3ème Année":["LATIN-PHILO","SCIENCES","PEDAGOGIE GENERALE","COMMERCIALE ET GESTION","ELECTRICITE","MECANIQUE GENERALE","COUPE ET COUTURE"],
"4ème Année":["LATIN-PHILO","SCIENCES","PEDAGOGIE GENERALE","COMMERCIALE ET GESTION","ELECTRICITE","MECANIQUE GENERALE","COUPE ET COUTURE"]
};

const dateRef=new Date();
const moisActuelNum=dateRef.getMonth();
let moisCourant="Septembre";
if(moisActuelNum>=8)moisCourant=moisListe[moisActuelNum-8];
else if(moisActuelNum>=0&&moisActuelNum<=5)moisCourant=moisListe[moisActuelNum+4];

let espaceActif='secondaire';
let tousLesEleves=[];
let elevesFiltres=[];
let moisSelectionne=moisCourant;

const filterMois=document.getElementById('filterMois');
const filterClasse=document.getElementById('filterClasse');
const filterOption=document.getElementById('filterOption');
const filterSearch=document.getElementById('filterSearch');
const btnAppliquer=document.getElementById('btnAppliquer');
const btnReset=document.getElementById('btnReset');
const btnPDF=document.getElementById('btnPDF');
const btnExcel=document.getElementById('btnExcel');
const tableContainer=document.getElementById('tableContainer');
const schoolName=document.getElementById('schoolName');

function toast(msg,type='info'){
const c=document.getElementById('toastContainer');
const el=document.createElement('div');
el.className=`toast ${type}`;
el.textContent=msg;
c.appendChild(el);
setTimeout(()=>{el.classList.add('removing');setTimeout(()=>el.remove(),400);},3500);
}

function formatNb(n){if(!n||n===0)return"0";return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");}

function getElevesCollection(){
const map={secondaire:"compta_eleves",primaire:"prima_eleves",maternelle:"mater_eleves"};
return collection(db,"ecoles",ECOLET_ID,map[espaceActif]||"compta_eleves");
}

function getClasses(){
const map={secondaire:classesSecondaire,primaire:classesPrimaire,maternelle:classesMaternelle};
return map[espaceActif]||classesSecondaire;
}

function getEspaceLabel(){
const map={secondaire:"SECONDAIRE",primaire:"PRIMAIRE",maternelle:"MATERNELLE"};
return map[espaceActif]||"SECONDAIRE";
}

function getDefaultMinerval(){
const map={secondaire:45000,primaire:30000,maternelle:30000};
return map[espaceActif]||45000;
}

function getOptionsForClasse(classe){
if(espaceActif!=='secondaire')return [];
return optionsSecondaire[classe]||[];
}

function remplirMois(){
let h='';
moisListe.forEach(m=>{const s=m===moisCourant?'selected':'';h+=`<option value="${m}" ${s}>${m}</option>`;});
filterMois.innerHTML=h;
}

function remplirClasses(){
const select=filterClasse;
select.innerHTML='<option value="">Toutes</option>';
const classes=getClasses();
const label=getEspaceLabel();
const opt=document.createElement('optgroup');
opt.label=label;
classes.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;opt.appendChild(o);});
select.appendChild(opt);
}

function remplirOptions(){
const select=filterOption;
select.innerHTML='<option value="">Toutes</option>';
if(espaceActif!=='secondaire')return;
const optsUniques=new Set();
for(const c of classesSecondaire){
const opts=optionsSecondaire[c]||[];
opts.forEach(o=>optsUniques.add(o));
}
[...optsUniques].sort().forEach(o=>{
const opt=document.createElement('option');
opt.value=o;
opt.textContent=o;
select.appendChild(opt);
});
}

async function chargerEleves(){
try{
tableContainer.innerHTML=`<div class="loading"><div class="spinner"></div><p style="margin-top:8px;">Chargement ${getEspaceLabel()}...</p></div>`;
const snap=await getDocs(getElevesCollection());
tousLesEleves=[];
snap.forEach(d=>{
const data=d.data();
if(!data.nom||data.abandon===true||data.exonere===true)return;
tousLesEleves.push({
id:d.id,
nom:data.nom||"",
postnom:data.postnom||"",
prenom:data.prenom||"",
classe:data.classe||"",
option:data.option||"",
minerval:data.minerval||getDefaultMinerval(),
phone:data.phone||"",
parentCode:data.parentCode||"",
paiements:data.paiements||{},
moisBlancs:data.moisBlancs||[],
dateInscription:data.dateInscription||new Date().toISOString()
});
});
remplirMois();
remplirClasses();
remplirOptions();
moisSelectionne=filterMois.value;
appliquerFiltres();
}catch(e){
console.error(e);
tableContainer.innerHTML=`<div class="empty-state"><span class="icon">❌</span>Erreur de chargement ${getEspaceLabel()}</div>`;
toast("Erreur de chargement","error");
}
}

function appliquerFiltres(){
const mois=filterMois.value;
const classe=filterClasse.value;
const option=filterOption.value;
const search=filterSearch.value.trim().toLowerCase();

moisSelectionne=mois;
let r=tousLesEleves;

if(classe)r=r.filter(e=>e.classe===classe);
if(option)r=r.filter(e=>e.option===option);

if(search){
r=r.filter(e=>{
const nom=(e.nom+' '+(e.postnom||'')+' '+(e.prenom||'')).toLowerCase();
const code=e.parentCode||'';
return nom.includes(search)||code.includes(search);
});
}

r.sort((a,b)=>a.nom.localeCompare(b.nom));
elevesFiltres=r;
afficherListe();
}

function afficherListe(){
if(elevesFiltres.length===0){
tableContainer.innerHTML=`<div class="empty-state"><span class="icon">📭</span>Aucun élève en ${getEspaceLabel()} pour ces critères</div>`;
return;
}
let h=`<table><thead><tr>
<th>👤 Élève</th>
<th>📚 Classe</th>
<th>🎯 Option</th>
<th class="text-right">💰 Minerval</th>
<th class="text-right">💳 Payé</th>
<th class="text-right">⚠️ Dette</th>
<th class="text-center">🔑 Code</th>
</tr></thead><tbody>`;

elevesFiltres.forEach(e=>{
const paiement=(e.paiements[moisSelectionne]||{}).montant||0;
const minerval=e.minerval||getDefaultMinerval();
const estBlanc=(e.moisBlancs||[]).includes(moisSelectionne);
const dette=estBlanc?0:Math.max(0,minerval-paiement);
const estPaye=estBlanc||paiement>=minerval;
const nom=(e.nom+' '+(e.postnom||'')+' '+(e.prenom||'')).trim().toUpperCase();
const badge=estPaye?`<span class="badge badge-success">✅ PAYÉ</span>`:`<span class="badge badge-danger">⚠️ IMPAYÉ</span>`;
const code=e.parentCode||'-';
const opt=e.option||'-';
h+=`<tr>
<td><strong>${nom}</strong></td>
<td>${e.classe}</td>
<td>${opt}</td>
<td class="text-right">${formatNb(minerval)} FC</td>
<td class="text-right ${estPaye?'paye':''}">${formatNb(paiement)} FC</td>
<td class="text-right ${!estPaye?'dette':''}">${formatNb(dette)} FC</td>
<td class="text-center" style="font-family:monospace;font-size:12px;">${code}</td>
</tr>`;
});
h+=`</tbody></table>`;
tableContainer.innerHTML=h;
}

// ----- EXPORT EXCEL (NOM DE FICHIER FIXE PAR SECTION) -----
function genererExcel(){
if(elevesFiltres.length===0){toast("Aucun élève à exporter","error");return;}

const XLSX = window.XLSX;
const nomEcole = "C.S. LE TREMPLIN";
const sousTitre = "MUSOSHI-SODIMICO";
const espaceLabel = getEspaceLabel();
const classeFiltre = filterClasse.value || "TOUTES";
const moisFiltre = moisSelectionne;

// Créer le tableau de données
const data = [];

// Ligne 1: Nom de l'école
data.push([nomEcole, "", "", "", "", "", "", "", "", "", "", ""]);

// Ligne 2: Sous-titre
data.push([sousTitre, "", "", "", "", "", "", "", "", "", "", ""]);

// Ligne 3: Classe
const classeDisplay = classeFiltre === "TOUTES" ? "TOUTES CLASSES" : classeFiltre;
data.push([`CLASSE: ${classeDisplay} - ${espaceLabel}`, "", "", "", "", "", "", "", "", "", "", ""]);

// Ligne 4: Vide
data.push([]);

// Ligne 5: Titre du tableau
data.push(["LISTE DE PERCEPTION DES FRAIS ADMINISTRATIFS", "", "", "", "", "", "", "", "", "", "", ""]);

// Ligne 6: En-tête des colonnes
data.push([
"N°",
"NOM ET POST NOM",
"",
"SEP",
"OCT",
"NOV",
"DEC",
"JANV",
"FEV",
"MARS",
"AVR",
"MAI"
]);

// Ligne 7: Sous-en-tête (trimestres)
data.push([
"",
"",
"",
"Premier Trimestre",
"",
"",
"Deuxième Trimestre",
"",
"",
"Troisième Trimestre",
"",
""
]);

// Ajouter les élèves
elevesFiltres.forEach((e, index) => {
const nomComplet = `${e.nom} ${e.postnom||''} ${e.prenom||''}`.trim();
const paiements = e.paiements || {};
const minerval = e.minerval || getDefaultMinerval();

// Pour chaque mois, récupérer le montant payé ou le minerval si non payé
const moisData = moisListe.map(m => {
const pay = paiements[m]?.montant || 0;
return pay > 0 ? `${formatNb(pay)}FC` : `${formatNb(minerval)}FC`;
});

// Ajouter la ligne de l'élève
data.push([
(index + 1).toString(),
nomComplet,
"",
moisData[0],
moisData[1],
moisData[2],
moisData[3],
moisData[4],
moisData[5],
moisData[6],
moisData[7],
moisData[8]
]);
});

// Ajouter quelques lignes vides à la fin (comme dans le modèle)
for(let i=0; i<5; i++){
data.push(["", "", "", "", "", "", "", "", "", "", "", ""]);
}

// Créer le workbook
const wb = XLSX.utils.book_new();
const ws = XLSX.utils.aoa_to_sheet(data);

// Définir la largeur des colonnes
ws['!cols'] = [
{wch: 6},   // N°
{wch: 30},  // NOM ET POST NOM
{wch: 5},   // (vide)
{wch: 12},  // SEP
{wch: 12},  // OCT
{wch: 12},  // NOV
{wch: 12},  // DEC
{wch: 12},  // JANV
{wch: 12},  // FEV
{wch: 12},  // MARS
{wch: 12},  // AVR
{wch: 12}   // MAI
];

// Fusionner les cellules d'en-tête
ws['!merges'] = [
{s: {r:0, c:0}, e: {r:0, c:11}}, // Nom école
{s: {r:1, c:0}, e: {r:1, c:11}}, // Sous-titre
{s: {r:2, c:0}, e: {r:2, c:11}}, // Classe
{s: {r:4, c:0}, e: {r:4, c:11}}, // Titre
{s: {r:6, c:3}, e: {r:6, c:5}}, // Premier Trimestre
{s: {r:6, c:6}, e: {r:6, c:8}}, // Deuxième Trimestre
{s: {r:6, c:9}, e: {r:6, c:11}} // Troisième Trimestre
];

// Ajouter la feuille au workbook
const sheetName = classeFiltre.replace(/\s/g, '_').substring(0, 31);
XLSX.utils.book_append_sheet(wb, ws, sheetName);

// NOM DE FICHIER FIXE PAR SECTION (écrase automatiquement l'ancien)
const nomFichier = `Recouvrement_${espaceActif.toUpperCase()}.xlsx`;

// Générer le fichier (écrase automatiquement s'il existe déjà)
XLSX.writeFile(wb, nomFichier);
toast(`✅ Excel ${espaceLabel} généré avec succès ! (fichier écrasé)`,`success`);
}

// ----- EXPORT PDF (NOM DE FICHIER FIXE PAR SECTION) -----
function genererPDF(){
if(elevesFiltres.length===0){toast("Aucun élève à exporter","error");return;}
const{jsPDF}=window.jspdf;
const doc=new jsPDF("portrait","mm","a4");
const pw=doc.internal.pageSize.getWidth();
const nomEcole=schoolId.toUpperCase();
const espaceLabel=getEspaceLabel();
const classeFiltre=filterClasse.value||"Toutes";

doc.setFillColor(255,255,255);
doc.rect(0,0,pw,50,"F");
doc.setDrawColor(espaceActif==='secondaire'?247:espaceActif==='primaire'?52:46,
espaceActif==='secondaire'?151:espaceActif==='primaire'?152:204,
espaceActif==='secondaire'?30:espaceActif==='primaire'?219:113);
doc.setLineWidth(1.5);
doc.line(15,48,pw-15,48);

doc.setFontSize(16);
doc.setFont("helvetica","bold");
doc.setTextColor(0,0,0);
doc.text(`RECOUVREMENT - ${espaceLabel}`,15,20);

doc.setFontSize(10);
doc.setFont("helvetica","normal");
doc.setTextColor(80,80,80);
const annee=new Date().getFullYear();
const cf=filterClasse.value||"Toutes";
const of=filterOption.value||"Toutes";
const search=filterSearch.value.trim()||'Aucun';
doc.text(`Mois: ${moisSelectionne} ${annee}  |  Classe: ${cf}  |  Option: ${of}  |  Recherche: ${search}`,15,30);
doc.text(`École: ${nomEcole}`,15,38);
doc.text(`Élèves: ${elevesFiltres.length}`,15,46);

const body=elevesFiltres.map(e=>{
const paiement=(e.paiements[moisSelectionne]||{}).montant||0;
const minerval=e.minerval||getDefaultMinerval();
const estBlanc=(e.moisBlancs||[]).includes(moisSelectionne);
const dette=estBlanc?0:Math.max(0,minerval-paiement);
const nom=(e.nom+' '+(e.postnom||'')+' '+(e.prenom||'')).trim().toUpperCase();
const statut=estBlanc?'BLANC':(paiement>=minerval?'PAYÉ':'IMPAYÉ');
const opt=e.option||'-';
return[nom,e.classe,opt,formatNb(minerval)+' FC',formatNb(paiement)+' FC',formatNb(dette)+' FC',statut,e.parentCode||'-'];
});

const colors=espaceActif==='secondaire'?[247,151,30]:espaceActif==='primaire'?[52,152,219]:[46,204,113];
doc.autoTable({
startY:55,
head:[["ÉLÈVE","CLASSE","OPTION","MINERVAL","PAYÉ","DETTE","STATUT","CODE"]],
body:body,
styles:{fontSize:8,cellPadding:3,textColor:[30,30,30]},
headStyles:{fillColor:colors,textColor:[255,255,255],fontSize:9,fontStyle:"bold"},
alternateRowStyles:{fillColor:[245,247,250]},
columnStyles:{
0:{cellWidth:35,fontStyle:"bold"},
1:{cellWidth:22},
2:{cellWidth:22},
3:{cellWidth:18,halign:"right"},
4:{cellWidth:18,halign:"right"},
5:{cellWidth:18,halign:"right"},
6:{cellWidth:16,halign:"center"},
7:{cellWidth:16,halign:"center"}
},
margin:{left:15,right:15},
didDrawPage:function(d){
const pn=doc.internal.getCurrentPageInfo().pageNumber;
const tp=doc.internal.getNumberOfPages();
doc.setFontSize(8);
doc.setTextColor(150,150,150);
doc.text(`Page ${pn}/${tp}`,pw/2,doc.internal.pageSize.height-10,{align:"center"});
doc.text(new Date().toLocaleString('fr-FR'),pw-15,doc.internal.pageSize.height-10,{align:"right"});
}
});

// NOM DE FICHIER PDF FIXE PAR SECTION
const nomFichierPDF = `Recouvrement_${espaceActif.toUpperCase()}.pdf`;
doc.save(nomFichierPDF);
toast(`✅ PDF ${espaceLabel} généré avec succès ! (fichier écrasé)`,`success`);
}

btnAppliquer.addEventListener('click',appliquerFiltres);
btnReset.addEventListener('click',()=>{
filterClasse.value='';
filterOption.value='';
filterSearch.value='';
filterMois.value=moisCourant;
appliquerFiltres();
});
btnPDF.addEventListener('click',genererPDF);
btnExcel.addEventListener('click',genererExcel);
filterMois.addEventListener('change',appliquerFiltres);
filterSearch.addEventListener('input',appliquerFiltres);

document.querySelectorAll('.space-btn').forEach(btn=>{
btn.onclick=async function(){
const newSpace=this.dataset.space;
if(newSpace===espaceActif)return;
document.querySelectorAll('.space-btn').forEach(b=>b.classList.remove('active'));
this.classList.add('active');
espaceActif=newSpace;
toast('🔄 Bascule vers '+(newSpace==='secondaire'?'SECONDAIRE':newSpace==='primaire'?'PRIMAIRE':'MATERNELLE'),'success');
await chargerEleves();
};
});

schoolName.textContent=`🏫 ${schoolId.toUpperCase()}`;
chargerEleves();
</script>
</body>
</html>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, doc, getDoc, collection, getDocs } from "firebase/firestore";

// ============ CONFIGURATION ============
const CODE_ACCES = "202020";
const firebaseConfig = {
  apiKey: "AIzaSyBma80S0bc9uzSuO38qn7JLSwLrYniV5Fw",
  authDomain: "gesco-2.firebaseapp.com",
  projectId: "gesco-2",
  storageBucket: "gesco-2.firebasestorage.app",
  messagingSenderId: "36319988765",
  appId: "1:36319988765:web:e8cd823804596495248af4"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const urlParams = new URLSearchParams(window.location.search);
const schoolId = urlParams.get('ecole') || 'demo';
const ECOLET_ID = schoolId.replace(/[^a-zA-Z0-9]/g, '_');
const SCHOOL_DISPLAY_NAME = schoolId.toUpperCase();

const anneeScolaire = "2026-2027";
const moisListe = ["Septembre","Octobre","Novembre","Decembre","Janvier","Fevrier","Mars","Avril","Mai","Juin"];

const classesSecondaire = ["7ème EB","8ème EB","1ère Année","2ème Année","3ème Année","4ème Année"];
const classesPrimaire = ["1ère A","1ère B","2ème A","2ème B","3ème A","3ème B","4ème A","4ème B","5ème A","5ème B","6ème A","6ème B"];
const classesMaternelle = ["Niveau 1","Niveau 2","Niveau 3"];

let currentSchoolConfig = null;
let schoolLogoUrl = null;
let logoBase64Cache = null;
let allEleves = [];
let currentSection = 'all';
let currentEleveForRecu = null;
let isGenerating = false;

// ============ UTILITAIRES ============
function getNomEcole(displayName){
  const nomEcole = displayName.toUpperCase().replace(/[^a-zA-Z]/g,'');
  if(nomEcole.startsWith('T')) return 'COMPLEXE SCOLAIRE LE ' + displayName;
  return 'COMPLEXE SCOLAIRE ' + displayName;
}

function sansAccent(texte){
  if(!texte) return "";
  const map = {'é':'e','è':'e','ê':'e','ë':'e','à':'a','â':'a','ä':'a','ô':'o','ö':'o','û':'u','ü':'u','î':'i','ï':'i','ç':'c','É':'E','È':'E','Ê':'E','Ë':'E','À':'A','Â':'A','Ä':'A','Ô':'O','Ö':'O','Û':'U','Ü':'U','Î':'I','Ï':'I','Ç':'C'};
  return texte.replace(/[éèêëàâäôöûüîïçÉÈÊËÀÂÄÔÖÛÜÎÏÇ]/g, m => map[m] || m);
}

function mettreEnMajuscules(t){ return t ? t.toUpperCase() : ""; }

function formaterNombre(n){
  if(n === 0) return "0";
  let resultat = "", nombre = Math.abs(n), strNombre = nombre.toString(), compteur = 0;
  for(let i = strNombre.length - 1; i >= 0; i--){
    compteur++;
    resultat = strNombre[i] + resultat;
    if(compteur % 3 === 0 && i !== 0) resultat = " " + resultat;
  }
  return n < 0 ? "-" + resultat : resultat;
}

function formatNbSimple(n){
  if(isNaN(n) || n === null || n === undefined) return "0";
  return formaterNombre(Math.floor(Number(n)));
}

function formatDateFr(date){
  if(!date) return "-";
  const d = new Date(date);
  if(isNaN(d.getTime())) return "-";
  return d.getDate().toString().padStart(2,"0") + '/' + (d.getMonth()+1).toString().padStart(2,"0") + '/' + d.getFullYear();
}

function formatDateYMD(date = new Date()){
  return date.toISOString().split('T')[0];
}

function getEspaceFromClasse(classe){
  if(classesSecondaire.includes(classe)) return 'secondaire';
  if(classesPrimaire.includes(classe)) return 'primaire';
  if(classesMaternelle.includes(classe)) return 'maternelle';
  return 'secondaire';
}

function getEspaceLabel(espace){
  if(espace === 'secondaire') return 'SECONDAIRE';
  if(espace === 'primaire') return 'PRIMAIRE';
  if(espace === 'maternelle') return 'MATERNELLE';
  return '';
}

function getEspaceBadgeClass(espace){
  if(espace === 'secondaire') return 'badge-sec';
  if(espace === 'primaire') return 'badge-prime';
  if(espace === 'maternelle') return 'badge-mater';
  return '';
}

// ============ TOAST ============
function toast(msg, type = "success"){
  const c = document.getElementById("toastContainer");
  if(!c) return;
  const icons = {success:"✓", error:"✕", warning:"⚠", info:"ℹ"};
  const titles = {success:"Succès", error:"Erreur", warning:"Attention", info:"Information"};
  const colors = {success:"#10b981", error:"#ef4444", warning:"#f59e0b", info:"#3b82f6"};
  const el = document.createElement("div");
  el.className = 'toast ' + type;
  el.innerHTML = '<div class="toast-icon" style="background:' + colors[type] + '22;color:' + colors[type] + '">' + icons[type] + '</div><div class="toast-content"><div class="toast-title">' + titles[type] + '</div><div class="toast-message">' + msg + '</div></div>';
  c.appendChild(el);
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 3500);
}

// ============ LOGIN ============
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginCode').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

function doLogin(){
  const code = document.getElementById('loginCode').value.trim();
  const err = document.getElementById('loginError');
  if(code === CODE_ACCES){
    err.textContent = "";
    sessionStorage.setItem('compta_auth', 'ok');
    showMainApp();
  } else {
    err.textContent = "❌ Code incorrect. Veuillez réessayer.";
    document.getElementById('loginCode').value = "";
    document.getElementById('loginCode').focus();
  }
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('compta_auth');
  location.reload();
});

document.getElementById('refreshBtn').addEventListener('click', async () => {
  toast('🔄 Rechargement...', 'info');
  await loadAllEleves();
  await renderListe();
  toast('✅ Données actualisées', 'success');
});

// ============ CHARGEMENT ============
async function loadSchoolConfig(){
  try {
    const ref = doc(db, "ecoles", ECOLET_ID, "settings", "data");
    const snap = await getDoc(ref);
    if(snap.exists()){
      currentSchoolConfig = snap.data();
    } else {
      currentSchoolConfig = { nom: getNomEcole(SCHOOL_DISPLAY_NAME), adresse: "" };
    }
  } catch(e){
    currentSchoolConfig = { nom: getNomEcole(SCHOOL_DISPLAY_NAME) };
  }
}

async function loadSchoolLogo(){
  try {
    const ref = doc(db, "ecoles", ECOLET_ID);
    const snap = await getDoc(ref);
    if(snap.exists()){
      const data = snap.data();
      schoolLogoUrl = data.logoUrl || null;
    }
  } catch(e){}
}

async function loadLogoBase64(){
  if(logoBase64Cache) return logoBase64Cache;
  if(!schoolLogoUrl) return null;
  try {
    const response = await fetch(schoolLogoUrl);
    const blob = await response.blob();
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => { logoBase64Cache = reader.result; resolve(logoBase64Cache); };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  } catch(e){ return null; }
}

async function loadCollection(collectionName, espace){
  try {
    const q = collection(db, "ecoles", ECOLET_ID, collectionName);
    const snap = await getDocs(q);
    const result = [];
    const idsVus = new Set();
    snap.forEach(d => {
      const data = d.data();
      if(data._type === 'config' || data._type === 'settings') return;
      if(!data.nom || !data.nom.trim()) return;
      const eleveId = data.eleveId || d.id;
      if(idsVus.has(eleveId)) return;
      idsVus.add(eleveId);
      result.push({
        id: eleveId,
        firestoreId: d.id,
        espace: espace,
        nom: data.nom || '',
        postnom: data.postnom || '',
        prenom: data.prenom || '',
        sexe: data.sexe || 'M',
        classe: data.classe || '',
        phone: data.phone || '',
        minerval: data.minerval || 0,
        fraisInscriptionTotal: data.fraisInscriptionTotal || 0,
        fraisInscriptionPaye: data.fraisInscriptionPaye || 0,
        exonere: data.exonere || false,
        abandon: data.abandon || false,
        parentCode: data.parentCode || '',
        paiements: data.paiements || {},
        dateInscription: data.dateInscription || formatDateYMD(new Date()),
        moisBlancs: data.moisBlancs || []
      });
    });
    return result;
  } catch(e){
    console.error('Erreur chargement ' + collectionName + ':', e);
    return [];
  }
}

async function loadAllEleves(){
  const [secondaire, primaire, maternelle] = await Promise.all([
    loadCollection('compta_eleves', 'secondaire'),
    loadCollection('prima_eleves', 'primaire'),
    loadCollection('mater_eleves', 'maternelle')
  ]);
  allEleves = [...secondaire, ...primaire, ...maternelle].filter(e => !e.abandon);
}

// ============ AFFICHAGE ============
function buildClasseFilterOptions(){
  const select = document.getElementById('filterClasse');
  select.innerHTML = '<option value="">Toutes les classes</option>';
  if(currentSection === 'all' || currentSection === 'secondaire'){
    const og = document.createElement('optgroup');
    og.label = 'SECONDAIRE';
    classesSecondaire.forEach(c => {
      const o = document.createElement('option'); o.value = c; o.textContent = c; og.appendChild(o);
    });
    select.appendChild(og);
  }
  if(currentSection === 'all' || currentSection === 'primaire'){
    const og = document.createElement('optgroup');
    og.label = 'PRIMAIRE';
    classesPrimaire.forEach(c => {
      const o = document.createElement('option'); o.value = c; o.textContent = c; og.appendChild(o);
    });
    select.appendChild(og);
  }
  if(currentSection === 'all' || currentSection === 'maternelle'){
    const og = document.createElement('optgroup');
    og.label = 'MATERNELLE';
    classesMaternelle.forEach(c => {
      const o = document.createElement('option'); o.value = c; o.textContent = c; og.appendChild(o);
    });
    select.appendChild(og);
  }
}

async function renderListe(){
  const search = document.getElementById('searchNom').value.trim().toLowerCase();
  const classe = document.getElementById('filterClasse').value;

  let eleves = allEleves;
  if(currentSection !== 'all'){
    eleves = eleves.filter(e => e.espace === currentSection);
  }
  if(classe){
    eleves = eleves.filter(e => e.classe === classe);
  }
  if(search){
    eleves = eleves.filter(e =>
      e.nom.toLowerCase().includes(search) ||
      (e.postnom && e.postnom.toLowerCase().includes(search)) ||
      (e.prenom && e.prenom.toLowerCase().includes(search))
    );
  }

  const cont = document.getElementById('elevesContainer');
  if(eleves.length === 0){
    cont.innerHTML = '<div class="empty-state">📭 Aucun élève trouvé</div>';
    return;
  }

  let html = '<div class="eleve-cards">';
  for(const e of eleves){
    const nomComplet = (e.nom + ' ' + (e.postnom || '') + ' ' + (e.prenom || '')).toUpperCase();
    const sexeBadge = e.sexe === 'F' ? '<span class="badge badge-fille">👩 Fille</span>' : '<span class="badge badge-garcon">👨 Garçon</span>';
    const exoBadge = e.exonere ? '<span class="badge badge-exonere">Exonéré</span>' : '';
    const espaceBadge = '<span class="badge ' + getEspaceBadgeClass(e.espace) + '">' + getEspaceLabel(e.espace) + '</span>';
    const codeBadge = e.parentCode ? '<span class="badge badge-code">🔑 ' + e.parentCode + '</span>' : '';

    const paiements = e.paiements || {};
    const moisPayes = moisListe.filter(m => paiements[m] && paiements[m].montant > 0);
    const nbMoisPayes = moisPayes.length;

    html += '<div class="eleve-card">';
    html += '<div class="eleve-header-row">';
    html += '<div><div class="eleve-nom">' + nomComplet + '</div>';
    html += '<div class="eleve-info">📚 ' + e.classe + ' &nbsp;|&nbsp; 💰 ' + (e.exonere ? 'EXONÉRÉ' : formatNbSimple(e.minerval) + ' FC/mois') + ' &nbsp;|&nbsp; 📅 ' + nbMoisPayes + ' mois payé(s)</div>';
    if(e.phone) html += '<div class="eleve-info">📞 ' + e.phone + '</div>';
    html += '</div>';
    html += '<div class="eleve-badges">' + espaceBadge + sexeBadge + exoBadge + codeBadge + '</div>';
    html += '</div>';
    html += '<div class="eleve-actions">';
    html += '<button class="btn btn-sm btn-pdf-pay" onclick="ouvrirChoixMoisRecu(\'' + e.id + '\',\'' + e.espace + '\')">🧾 REÇU PAIEMENT</button>';
    html += '<button class="btn btn-sm btn-pdf-insc" onclick="genererRecuInscription(\'' + e.id + '\',\'' + e.espace + '\')">📄 REÇU INSCRIPTION</button>';
    html += '</div>';
    html += '</div>';
  }
  html += '</div>';
  cont.innerHTML = html;
}

// ============ REÇU PAIEMENT : CHOIX DU MOIS ============
window.ouvrirChoixMoisRecu = function(eleveId, espace){
  const eleve = allEleves.find(e => e.id === eleveId && e.espace === espace);
  if(!eleve){
    toast("Élève introuvable", "error");
    return;
  }
  currentEleveForRecu = eleve;
  const paiements = eleve.paiements || {};
  const moisPayes = moisListe.filter(m => paiements[m] && paiements[m].montant > 0);

  document.getElementById('choixMoisInfo').innerHTML =
    '<div class="modal-info-line"><span>ÉLÈVE</span><span>' + eleve.nom + ' ' + (eleve.prenom || '') + '</span></div>' +
    '<div class="modal-info-line"><span>CLASSE</span><span>' + eleve.classe + '</span></div>' +
    '<div class="modal-info-line"><span>ESPACE</span><span>' + getEspaceLabel(eleve.espace) + '</span></div>' +
    '<div class="modal-info-line"><span>MOIS PAYÉS</span><span style="color:#10b981">' + moisPayes.length + '</span></div>';

  const container = document.getElementById('moisListContainer');
  if(moisPayes.length === 0){
    container.innerHTML = '<div class="empty-state">📭 Aucun mois payé pour cet élève</div>';
  } else {
    let html = '';
    for(const mois of moisPayes){
      const p = paiements[mois];
      const montant = p.montant || 0;
      const dateStr = p.date ? formatDateFr(p.date) : '-';
      html += '<div class="mois-item">';
      html += '<div><div class="mois-name">📅 ' + mois + '</div>';
      html += '<div class="mois-details">💰 <strong>' + formatNbSimple(montant) + ' FC</strong> &nbsp;|&nbsp; 📆 ' + dateStr + '</div></div>';
      html += '<button class="btn btn-sm btn-pdf-pay" onclick="genererRecuPaiement(\'' + eleve.id + '\',\'' + eleve.espace + '\',\'' + mois + '\')">🧾 REÇU</button>';
      html += '</div>';
    }
    container.innerHTML = html;
  }
  document.getElementById('choixMoisModal').classList.add('show');
};

document.getElementById('cancelChoixMois').addEventListener('click', () => {
  document.getElementById('choixMoisModal').classList.remove('show');
});

// ============ GÉNÉRATION REÇU PAIEMENT (MODÈLE COMPTABILITÉ 148x175mm) ============
window.genererRecuPaiement = async function(eleveId, espace, mois){
  if(isGenerating){ toast('⏳ Génération en cours...', 'warning'); return; }
  const eleve = allEleves.find(e => e.id === eleveId && e.espace === espace);
  if(!eleve){ toast('Élève introuvable', 'error'); return; }

  const paiements = eleve.paiements || {};
  const p = paiements[mois];
  if(!p || !p.montant){ toast('Aucun paiement pour ce mois', 'error'); return; }

  const montant = p.montant;
  const datePaiement = p.date || new Date().toISOString();

  isGenerating = true;
  document.getElementById('choixMoisModal').classList.remove('show');

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: [148, 175] });
    const pageWidth = doc.internal.pageSize.getWidth();

    let y = 6;

    const nomEcole = mettreEnMajuscules(sansAccent(currentSchoolConfig?.nom || getNomEcole(SCHOOL_DISPLAY_NAME)));

    doc.setFillColor(255, 255, 255);
    doc.rect(0, 0, pageWidth, 55, "F");

    const logoSize = 28;
    const logoX = (pageWidth - logoSize) / 2;
    const logoY = 4;
    let logoAdded = false;

    if(schoolLogoUrl){
      try {
        const logoBase64 = await loadLogoBase64();
        if(logoBase64){
          doc.addImage(logoBase64, 'JPEG', logoX, logoY, logoSize, logoSize);
          logoAdded = true;
        }
      } catch(e){}
    }

    const titreY = logoAdded ? (logoY + logoSize + 8) : 12;
    const texteLigne1 = mettreEnMajuscules(sansAccent(currentSchoolConfig?.nom || getNomEcole(SCHOOL_DISPLAY_NAME)));

    doc.setFontSize(18);
    doc.setFont("helvetica", "bold");
    doc.setTextColor(0, 0, 0);
    doc.text(texteLigne1, pageWidth / 2, titreY, { align: 'center' });

    const sectionTexte = 'SECTION ' + getEspaceLabel(eleve.espace);
    doc.setFontSize(18);
    doc.setFont("helvetica", "bold");
    doc.setTextColor(0, 0, 0);
    doc.text(sectionTexte, pageWidth / 2, titreY + 10, { align: 'center' });

    doc.setFontSize(18);
    doc.setFont("helvetica", "bold");
    doc.setTextColor(0, 0, 0);
    doc.text('2026-2027', pageWidth / 2, titreY + 20, { align: 'center' });

    y = titreY + 22;

    doc.setDrawColor(0, 0, 0);
    doc.setLineWidth(0.3);
    doc.setGState(new doc.GState({ opacity: 0.2 }));
    doc.line(5, y, pageWidth - 5, y);
    doc.setGState(new doc.GState({ opacity: 1 }));

    y += 2;

    const datePaiementFormatee = datePaiement ? formatDateFr(datePaiement) : formatDateFr(new Date());
    const chiffresId = (eleveId || '').replace(/\D/g, '');
    const suffixeRef = chiffresId.length >= 4 ? chiffresId.slice(-4) : chiffresId.padStart(4, '0');
    const reference = 'REC-' + (datePaiement ? formatDateYMD(new Date(datePaiement)) : formatDateYMD()) + '-' + suffixeRef;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.setTextColor(0, 0, 0);
    doc.text('Réf: ' + reference, 5, y + 6);
    y += 8;

    doc.setFontSize(22);
    doc.text('Date: ' + datePaiementFormatee, 5, y + 6);
    y += 10;

    doc.setDrawColor(0, 0, 0);
    doc.setLineWidth(0.5);
    doc.setGState(new doc.GState({ opacity: 0.2 }));
    doc.line(5, y, pageWidth - 5, y);
    doc.setGState(new doc.GState({ opacity: 1 }));
    y += 6;

    const nomComplet = (eleve.nom + ' ' + (eleve.postnom || '')).toUpperCase();
    const prenomComplet = (eleve.prenom || '').toUpperCase();

    doc.setFont("helvetica", "bold");
    doc.setFontSize(22);
    doc.text('Nom: ' + nomComplet, 5, y + 6);
    y += 8;

    doc.text('Prénom: ' + prenomComplet, 5, y + 6);
    y += 8;

    doc.text('Classe: ' + eleve.classe, 5, y + 6);
    y += 8;

    doc.text('Code Parent: ' + (eleve.parentCode || 'Non attribué'), 5, y + 6);
    y += 10;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(22);
    doc.text('MONTANT: ' + formatNbSimple(montant) + ' FC', 5, y + 6);
    y += 8;

    doc.text('PÉRIODE: ' + mois, 5, y + 6);
    y += 12;

    doc.setFontSize(20);
    doc.text('Moyen: Espèces', pageWidth / 2, y + 6, { align: 'center' });

    doc.save('Recu_Paiement_' + eleve.nom + '_' + mois + '_' + formatDateYMD() + '.pdf');
    toast('✅ Reçu de paiement généré', 'success');
  } catch(e){
    console.error(e);
    toast('Erreur: ' + e.message, 'error');
  } finally {
    isGenerating = false;
  }
};

    doc.setFont("helvetica", "bold");
    doc.setTextColor(0, 0, 0);

    doc.setFont("helvetica", "bold");
    doc.setTextColor(0, 0, 0);
    doc.text(sectionTexte, pageWidth / 2, titreY + 10, { align: 'center' });

    doc.setFontSize(18);
    doc.setFont("helvetica", "bold");
    doc.setTextColor(0, 0, 0);
    doc.text('2026-2027', pageWidth / 2, titreY + 20, { align: 'center' });

    y = titreY + 22;

    doc.setDrawColor(0, 0, 0);
    doc.setLineWidth(0.3);
    doc.setGState(new doc.GState({ opacity: 0.2 }));
    doc.line(5, y, pageWidth - 5, y);
    doc.setGState(new doc.GState({ opacity: 1 }));

    y += 2;

    const dateInscription = eleve.dateInscription || formatDateYMD(new Date());
    const chiffresId = (eleveId || '').replace(/\D/g, '');
    const suffixeRef = chiffresId.length >= 4 ? chiffresId.slice(-4) : chiffresId.padStart(4, '0');
    const reference = 'INS-' + formatDateYMD(new Date(dateInscription)) + '-' + suffixeRef;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.setTextColor(0, 0, 0);
    doc.text('Réf: ' + reference, 5, y + 6);
    y += 8;

    doc.setFontSize(22);
    doc.text('Date: ' + formatDateFr(new Date(dateInscription)), 5, y + 6);
    y += 10;

    doc.setDrawColor(0, 0, 0);
    doc.setLineWidth(0.5);
    doc.setGState(new doc.GState({ opacity: 0.2 }));
    doc.line(5, y, pageWidth - 5, y);
    doc.setGState(new doc.GState({ opacity: 1 }));
    y += 6;

    const nomComplet = (eleve.nom + ' ' + (eleve.postnom || '')).toUpperCase();

    doc.setFontSize(22);
    doc.text('Nom: ' + nomComplet, 5, y + 6);
    y += 8;

    doc.text('Prénom: ' + prenomComplet, 5, y + 6);
    y += 8;

    doc.text('Classe: ' + eleve.classe, 5, y + 6);
    y += 8;

    doc.text('Code Parent: ' + (eleve.parentCode || 'Non attribué'), 5, y + 6);
    y += 10;

    const fraisTotal = eleve.fraisInscriptionTotal || 0;
    const fraisPaye = eleve.fraisInscriptionPaye || 0;
    const fraisReste = Math.max(0, fraisTotal - fraisPaye);
    let statut = 'NON PAYÉ';
    if(fraisPaye >= fraisTotal && fraisTotal > 0) statut = 'COMPLET';
    else if(fraisPaye > 0) statut = 'PARTIEL';
    if(eleve.exonere) statut = 'EXONÉRÉ';

    doc.setFont("helvetica", "bold");
    doc.setFontSize(22);
    doc.text('FRAIS: ' + formatNbSimple(fraisTotal) + ' FC', 5, y + 6);
    y += 8;

    doc.text('PAYÉ: ' + formatNbSimple(fraisPaye) + ' FC', 5, y + 6);
    y += 8;

  } catch(e){
    console.error(e);
    toast('Erreur: ' + e.message, 'error');
  } finally {
    isGenerating = false;
  }
};

// ============ INITIALISATION ============
function showLoginPage(){
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
}

async function showMainApp(){
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('loadingOverlay').classList.remove('hidden');

  document.getElementById('anneeLabel').textContent = anneeScolaire;

  await loadSchoolConfig();
  await loadSchoolLogo();

  if(currentSchoolConfig?.nom){
    document.getElementById('schoolName').textContent = '🏫 ' + currentSchoolConfig.nom.toUpperCase();
  }

  await loadAllEleves();
  buildClasseFilterOptions();
  await renderListe();

  document.getElementById('loadingOverlay').classList.add('hidden');
}

// ============ ÉVÉNEMENTS ============
document.getElementById('searchNom').addEventListener('input', renderListe);
document.getElementById('filterClasse').addEventListener('change', renderListe);

document.getElementById('sectionTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.section-tab');
  if(!btn) return;
  document.querySelectorAll('.section-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentSection = btn.dataset.section;
  buildClasseFilterOptions();
  renderListe();
});

// ============ DÉMARRAGE ============
(async function init(){
  if(sessionStorage.getItem('compta_auth') === 'ok'){
    await showMainApp();
  } else {
    showLoginPage();
  }
})();
</script>

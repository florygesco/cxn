<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👨‍🏫 Enseignants</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"}}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0e1a;font-family:'Inter',sans-serif;padding:16px;color:#fff;}
.container{max-width:700px;margin:0 auto;}
.header{background:linear-gradient(135deg,#0f2b44,#071a2c);border-radius:16px;padding:16px 20px;text-align:center;margin-bottom:16px;}
.header h1{font-size:20px;font-weight:700;color:#fff;}
.header p{color:#94a3b8;font-size:12px;margin-top:2px;}
.card{background:rgba(18,18,31,0.95);border-radius:16px;padding:20px;border:1px solid rgba(59,130,246,0.15);margin-bottom:16px;}
label{display:block;font-size:11px;font-weight:600;color:#94a3b8;margin-bottom:4px;}
input,select{width:100%;padding:10px 14px;border-radius:10px;background:#1a2332;border:1px solid #334155;color:#fff;font-size:14px;outline:none;font-family:'Inter',sans-serif;margin-bottom:10px;}
input:focus,select:focus{border-color:#3b82f6;}
.cycle-group{display:flex;gap:8px;margin-bottom:10px;}
.cycle-btn{flex:1;padding:10px;border-radius:10px;border:2px solid #334155;background:transparent;color:#94a3b8;font-weight:600;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;}
.cycle-btn.active{background:rgba(59,130,246,0.15);border-color:#3b82f6;color:#60a5fa;}
.cycle-btn.mater.active{background:rgba(16,185,129,0.15);border-color:#10b981;color:#34d399;}
.classes-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-height:150px;overflow-y:auto;padding:6px;background:rgba(0,0,0,0.2);border-radius:10px;border:1px solid #1a2332;margin-bottom:10px;}
.class-item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer;}
.class-item:hover{background:rgba(59,130,246,0.06);}
.class-item input[type="checkbox"]{width:14px;height:14px;accent-color:#3b82f6;cursor:pointer;margin:0;}
.class-item label{font-size:11px;color:#cbd5e1;cursor:pointer;margin:0;}
.btn{width:100%;padding:12px;border:none;border-radius:40px;font-weight:700;font-size:15px;cursor:pointer;transition:all 0.2s;font-family:'Inter',sans-serif;}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;}
.btn-success:hover{transform:scale(0.98);opacity:0.9;}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;padding:6px 12px;font-size:11px;width:auto;}
.btn-outline{background:transparent;border:1px solid #334155;color:#94a3b8;padding:6px 12px;font-size:11px;width:auto;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:#0f172a;padding:8px 10px;text-align:left;color:#94a3b8;font-weight:600;font-size:10px;border-bottom:1px solid #1a2332;}
td{padding:8px 10px;border-bottom:1px solid #1a2332;color:#e2e8f0;}
.badge{display:inline-block;padding:1px 10px;border-radius:20px;font-size:9px;font-weight:600;}
.badge-p{background:rgba(59,130,246,0.2);color:#60a5fa;}
.badge-m{background:rgba(16,185,129,0.2);color:#34d399;}
.badge-actif{background:rgba(16,185,129,0.2);color:#34d399;}
.badge-inactif{background:rgba(239,68,68,0.2);color:#ef4444;}
.code{font-family:monospace;font-weight:700;color:#fbbf24;letter-spacing:1px;}
.empty{text-align:center;padding:30px;color:#4a5568;font-size:13px;}
.toast{position:fixed;bottom:20px;right:20px;background:rgba(18,25,45,0.95);border-radius:12px;padding:12px 20px;border-left:4px solid #10b981;transform:translateY(100px);opacity:0;transition:all 0.3s;z-index:999;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{border-left-color:#ef4444;}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:1000;visibility:hidden;opacity:0;transition:all 0.3s;}
.modal.show{visibility:visible;opacity:1;}
.modal-box{background:rgba(18,18,31,0.98);border-radius:20px;padding:24px;max-width:400px;width:90%;border:1px solid rgba(59,130,246,0.2);text-align:center;}
.modal-box .big{font-size:48px;margin-bottom:8px;}
.modal-box .code-display{background:#0a0e1a;border-radius:12px;padding:16px;margin:12px 0;border:2px solid #10b981;}
.modal-box .code-display .num{font-size:32px;font-weight:800;letter-spacing:6px;color:#10b981;font-family:monospace;}
.modal-box .btn{width:auto;padding:10px 30px;}
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>👨‍🏫 Gestion des Enseignants</h1>
    <p id="schoolDisplay">COMPLEXE SCOLAIRE</p>
  </div>

  <!-- Formulaire -->
  <div class="card">
    <label>👤 Nom complet</label>
    <input type="text" id="nom" placeholder="Ex: KASONGO Jean">

    <label>🏫 Cycle</label>
    <div class="cycle-group">
      <button class="cycle-btn active" data-cycle="primaire" onclick="setCycle('primaire')">📚 Primaire</button>
      <button class="cycle-btn" data-cycle="maternelle" onclick="setCycle('maternelle')">🧸 Maternelle</button>
    </div>

    <label>📚 Classes</label>
    <div class="classes-grid" id="classesGrid"></div>

    <label>🔑 Code (généré auto)</label>
    <input type="text" id="code" readonly style="font-family:monospace;font-size:18px;letter-spacing:4px;color:#fbbf24;">

    <button class="btn btn-success" onclick="ajouter()">➕ AJOUTER L'ENSEIGNANT</button>
  </div>

  <!-- Liste -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span style="font-weight:600;font-size:14px;color:#60a5fa;">📋 Enseignants</span>
      <span id="compteur" style="font-size:12px;color:#94a3b8;">0</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>Nom</th><th>Cycle</th><th>Classes</th><th>Code</th><th>Statut</th><th></th></tr></thead>
        <tbody id="liste"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"><span id="toastMsg">✅ Succès</span></div>

<!-- Modal succès -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="big">✅</div>
    <h3 id="modalNom" style="color:#60a5fa;font-size:18px;">Professeur</h3>
    <p style="color:#94a3b8;font-size:13px;margin:4px 0;">Code d'accès :</p>
    <div class="code-display"><div class="num" id="modalCode">123456</div></div>
    <p style="color:#94a3b8;font-size:11px;">⚠️ Transmettez ce code au professeur</p>
    <br>
    <button class="btn btn-success" onclick="fermerModal()">OK</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, query, where } from "firebase/firestore";
import { getAuth, createUserWithEmailAndPassword } from "firebase/auth";

// ============================================================
// CONFIG FIREBASE
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
  authDomain: "gesco-67c43.firebaseapp.com",
  projectId: "gesco-67c43",
  storageBucket: "gesco-67c43.firebasestorage.app",
  messagingSenderId: "333004443566",
  appId: "1:333004443566:web:de41f60000e418dce9023f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// ============================================================
// VARIABLES
// ============================================================
const urlParams = new URLSearchParams(window.location.search);
const schoolId = urlParams.get('ecole') || 'mon_ecole';
const ECOLET_ID = schoolId.replace(/[^a-zA-Z0-9]/g, '_');
document.getElementById('schoolDisplay').textContent = schoolId.toUpperCase();

let cycleActuel = 'primaire';

// ============================================================
// CLASSES
// ============================================================
const classesPrimaire = [
  '1ère A', '1ère B', '2ème A', '2ème B',
  '3ème A', '3ème B', '4ème A', '4ème B',
  '5ème A', '5ème B', '6ème A', '6ème B'
];

const classesMaternelle = ['Niveau 1', 'Niveau 2', 'Niveau 3'];

// ============================================================
// AFFICHAGE DES CLASSES
// ============================================================
function afficherClasses() {
  const grid = document.getElementById('classesGrid');
  const classes = cycleActuel === 'primaire' ? classesPrimaire : classesMaternelle;
  grid.innerHTML = '';
  classes.forEach(c => {
    const div = document.createElement('div');
    div.className = 'class-item';
    div.innerHTML = `
      <input type="checkbox" id="cls_${c}" value="${c}">
      <label for="cls_${c}">${c}</label>
    `;
    grid.appendChild(div);
  });
}

// ============================================================
// CYCLE
// ============================================================
window.setCycle = function(cycle) {
  cycleActuel = cycle;
  document.querySelectorAll('.cycle-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cycle === cycle);
    if (cycle === 'maternelle') b.classList.toggle('mater', b.dataset.cycle === cycle);
  });
  afficherClasses();
  genererCode();
};

// ============================================================
// CODE
// ============================================================
function genererCode() {
  const code = String(Math.floor(100000 + Math.random() * 900000));
  document.getElementById('code').value = code;
}
genererCode();

// ============================================================
// TOAST
// ============================================================
function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  const msgEl = document.getElementById('toastMsg');
  msgEl.textContent = msg;
  el.className = 'toast ' + type;
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => el.classList.remove('show'), 3500);
}

// ============================================================
// MODAL
// ============================================================
function ouvrirModal(nom, code) {
  document.getElementById('modalNom').textContent = nom;
  document.getElementById('modalCode').textContent = code;
  document.getElementById('modal').classList.add('show');
}
window.fermerModal = function() {
  document.getElementById('modal').classList.remove('show');
};

// ============================================================
// AJOUTER UN ENSEIGNANT
// ============================================================
window.ajouter = async function() {
  const nom = document.getElementById('nom').value.trim();
  const code = document.getElementById('code').value.trim();
  
  if (!nom) { toast('⚠️ Entrez un nom', 'error'); return; }
  if (!code || code.length < 6) { toast('⚠️ Code invalide', 'error'); return; }

  // Récupérer les classes cochées
  const classes = [];
  document.querySelectorAll('#classesGrid input[type="checkbox"]:checked').forEach(cb => {
    classes.push(cb.value);
  });
  if (classes.length === 0) { toast('⚠️ Sélectionnez au moins une classe', 'error'); return; }

  const email = 'prof.' + nom.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z\s]/g, '').replace(/\s+/g, '.') + '.' + ECOLET_ID + '@gmail.com';

  try {
    // 1. Créer le compte Firebase Auth
    let authCreated = false;
    try {
      await createUserWithEmailAndPassword(auth, email, code);
      authCreated = true;
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') {
        authCreated = true;
      } else {
        toast('❌ Erreur Auth: ' + e.message, 'error');
        return;
      }
    }

    // 2. Sauvegarder dans Firestore
    const profId = 'prof_' + Date.now();
    await setDoc(doc(db, 'ecoles', ECOLET_ID, 'professeurs', profId), {
      _type: 'prof',
      id: profId,
      profId: profId,
      nom: nom,
      cycle: cycleActuel,
      classes: classes,
      code: code,
      email: email,
      authCreated: authCreated,
      actif: true,
      createdAt: Date.now(),
      school: ECOLET_ID
    });

    // 3. Succès
    ouvrirModal(nom, code);
    document.getElementById('nom').value = '';
    genererCode();
    chargerListe();
    toast('✅ ' + nom + ' ajouté');

  } catch (e) {
    toast('❌ Erreur: ' + e.message, 'error');
  }
};

// ============================================================
// CHARGER LA LISTE
// ============================================================
async function chargerListe() {
  const tbody = document.getElementById('liste');
  try {
    const snap = await getDocs(query(
      collection(db, 'ecoles', ECOLET_ID, 'professeurs'),
      where('_type', '==', 'prof')
    ));
    
    const profs = [];
    snap.forEach(ds => profs.push({ id: ds.id, ...ds.data() }));
    profs.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

    document.getElementById('compteur').textContent = profs.length;

    if (profs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">📭 Aucun enseignant</td></tr>';
      return;
    }

    tbody.innerHTML = profs.map((p, i) => `
      <tr>
        <td>${i + 1}</td>
        <td><strong>${p.nom || '?'}</strong></td>
        <td><span class="badge ${p.cycle === 'maternelle' ? 'badge-m' : 'badge-p'}">${p.cycle === 'maternelle' ? '🧸 MAT' : '📚 PRIM'}</span></td>
        <td style="font-size:11px;">${(p.classes || []).join(', ')}</td>
        <td class="code">${p.code || '---'}</td>
        <td><span class="badge ${p.actif !== false ? 'badge-actif' : 'badge-inactif'}">${p.actif !== false ? 'ACTIF' : 'INACTIF'}</span></td>
        <td>
          <button class="btn btn-outline" onclick="basculerStatut('${p.id}')" style="padding:4px 10px;font-size:10px;">
            ${p.actif !== false ? '🔒' : '🔓'}
          </button>
          <button class="btn btn-danger" onclick="supprimer('${p.id}','${p.nom}')" style="padding:4px 10px;font-size:10px;">✕</button>
        </td>
      </tr>
    `).join('');

  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">❌ Erreur de chargement</td></tr>';
  }
}

// ============================================================
// BASCOLER STATUT
// ============================================================
window.basculerStatut = async function(id) {
  try {
    const ref = doc(db, 'ecoles', ECOLET_ID, 'professeurs', id);
    const snap = await getDoc(ref);
    if (!snap.exists()) return;
    const actuel = snap.data().actif !== false;
    await setDoc(ref, { actif: !actuel }, { merge: true });
    toast('✅ Statut modifié', 'success');
    chargerListe();
  } catch (e) {
    toast('❌ Erreur', 'error');
  }
};

// ============================================================
// SUPPRIMER
// ============================================================
window.supprimer = function(id, nom) {
  if (!confirm(`Supprimer ${nom} ?`)) return;
  deleteDoc(doc(db, 'ecoles', ECOLET_ID, 'professeurs', id))
    .then(() => { toast('🗑️ Supprimé', 'warning'); chargerListe(); })
    .catch(() => toast('❌ Erreur', 'error'));
};

// ============================================================
// INIT
// ============================================================
afficherClasses();
chargerListe();

// Rafraîchir toutes les 30s
setInterval(chargerListe, 30000);
</script>
</body>
</html>

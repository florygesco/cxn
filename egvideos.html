<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NeTubeX Vidéo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:#000;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;height:100%;height:100dvh;-webkit-font-smoothing:antialiased;margin:0}

/* CONTENEUR PRINCIPAL */
.page{display:none;width:100%;height:100%}
.page.active{display:block}
#page-feed{position:relative;width:100%;height:100%;height:100dvh;background:#000}

/* SCROLL FEED */
#feedListe{width:100%;height:100%;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:80px}
#feedListe::-webkit-scrollbar{display:none}

/* CARTE VIDÉO (100% PROPRE, PLEIN ÉCRAN) */
.video-card{position:relative;width:100%;height:calc(100dvh - 80px);scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
.video-frame{position:absolute;inset:0;width:100%;height:100%;background:#000}
.video-frame video{width:100%;height:100%;object-fit:contain;background:#000;display:block}

/* OVERLAY PLAY */
.play-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.3);cursor:pointer;z-index:5}
.play-overlay.visible{display:flex}
.play-overlay .play-btn{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;font-size:32px;color:#0f172a;box-shadow:0 8px 32px rgba(0,0,0,.6);padding-left:5px;transition:transform .2s}
.play-overlay:active .play-btn{transform:scale(.9)}

/* HUB SUPERPOSÉ (Badges & Texte) */
.video-overlay-ui{position:absolute;inset:0;pointer-events:none;z-index:4}
.video-overlay-ui > * { pointer-events: auto; }

/* BADGES DROITE (Avatar, Vues, Menu) */
.side-badges{position:absolute;right:12px;bottom:30px;display:flex;flex-direction:column;align-items:center;gap:20px}
.side-avatar{width:48px;height:48px;border-radius:50%;background:#1e293b;border:2px solid #fff;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.5);transition:transform .2s}
.side-avatar:active{transform:scale(.9)}
.side-avatar img{width:100%;height:100%;object-fit:cover}
.side-avatar span{font-size:16px;font-weight:900}

.side-badge{display:flex;flex-direction:column;align-items:center;justify-content:center}
.side-badge-icon{font-size:30px;color:#fff;margin-bottom:4px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.8))}
.side-badge-value{font-size:13px;font-weight:800;color:#fff;line-height:1.1;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.side-badge-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.85);margin-top:2px}

/* TEXTE BAS GAUCHE */
.video-bottom{position:absolute;left:0;right:70px;bottom:20px;padding:0 16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.church-name{font-size:18px;font-weight:800;color:#fff;display:flex;align-items:center;gap:6px;line-height:1.3;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.verified-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#38bdf8;color:#fff;font-size:10px;box-shadow:0 0 10px rgba(56,189,248,.6)}
.video-desc{font-size:14px;line-height:1.4;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.9);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:90%}
.tag-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:700;color:#fff;backdrop-filter:blur(8px);width:max-content;margin-top:4px}
.tag-pill::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#38bdf8}

/* BARRE DE PROGRESSION (FIXE EN BAS DE LA VIDÉO) */
.progress-bar-wrapper{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.15);z-index:5}
.progress-bar-fill{height:100%;width:0%;background:#38bdf8;box-shadow:0 0 10px rgba(56,189,248,.8);transition:width .1s linear}

/* FOOTER FIXE (TOUJOURS VISIBLE PENDANT LE SCROLL) */
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(10,14,26,.95);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom);padding-top:12px;box-shadow:0 -4px 20px rgba(0,0,0,.5);height:80px}
.tab-btn{padding:8px;background:transparent;border:none;cursor:pointer;color:#cbd5e1;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:inherit;transition:color .2s}
.tab-btn:active{color:#38bdf8}
.tab-btn i{font-size:24px;color:inherit}

/* AUTH & AUTRES */
.auth-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto;background:#0a0e1a}
.auth-logo{font-size:42px;font-weight:900;text-align:center;margin:0 0 8px;letter-spacing:-2px;color:#fff}
.auth-logo span{color:#38bdf8}
.auth-sub{text-align:center;color:#64748b;font-size:14px;margin:0 0 36px;font-weight:600}
.input{width:100%;padding:16px;border-radius:16px;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.08);color:#f1f5f9;font-size:16px;font-family:inherit;outline:none;margin-bottom:16px;box-shadow:inset 0 2px 6px rgba(0,0,0,.2);transition:all .2s}
.input:focus{border-color:#38bdf8;background:rgba(255,255,255,.08);box-shadow:inset 0 2px 6px rgba(0,0,0,.2),0 0 0 3px rgba(56,189,248,.15)}
.btn{padding:16px 20px;border-radius:16px;border:none;cursor:pointer;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;color:#fff;transition:transform .2s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn-blue{background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff;box-shadow:0 6px 20px rgba(56,189,248,.3)}
.btn-green{background:linear-gradient(135deg,#10b981,#059669);margin-top:14px;box-shadow:0 6px 20px rgba(16,185,129,.3)}
.error-box{padding:14px;background:rgba(239,68,68,.12);border:1.5px solid rgba(239,68,68,.4);border-radius:14px;color:#fca5a5;font-weight:700;font-size:13.5px;margin-bottom:16px;display:none}
.toast{position:fixed;top:80px;left:50%;transform:translate(-50%,-180%);background:#1e293b;color:#fff;padding:14px 22px;border-radius:16px;font-size:13.5px;font-weight:700;z-index:900;transition:transform .3s ease;max-width:85vw;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1)}
.toast.show{transform:translate(-50%,0)}
.empty-feed{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;gap:16px;padding:24px;text-align:center;background:#000}
</style>
</head>
<body>

<div id="page-auth" class="page active">
<div class="auth-screen">
<h1 class="auth-logo">NeTube<span>X</span></h1>
<p class="auth-sub">Chaque vidéo compte.</p>
<div id="authError" class="error-box"></div>
<input id="authEmail" type="email" class="input" placeholder="Email" autocomplete="email">
<input id="authPassword" type="password" class="input" placeholder="Mot de passe" autocomplete="current-password">
<button id="btnLogin" class="btn btn-blue" onclick="handleLogin()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Se connecter</button>
<button id="btnSignup" class="btn btn-green" onclick="handleSignup()"><i class="fa-solid fa-user-plus"></i> Créer un compte</button>
</div>
</div>

<div id="page-feed" class="page">
<div id="feedListe"></div>
</div>

<div class="tab-bar" id="tabBar" style="display:none">
<button class="tab-btn" onclick="ouvrirProfilParent()">
<i class="fa-regular fa-user"></i>
<span>Profil</span>
</button>
<button class="tab-btn" onclick="ouvrirTabsParent()">
<i class="fa-solid fa-bars"></i>
<span>Menu</span>
</button>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, updateDoc, getDoc, doc, query, orderBy, onSnapshot, where, limit, increment } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig={
apiKey:"AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
authDomain:"netubexmoney.firebaseapp.com",
projectId:"netubexmoney",
storageBucket:"netubexmoney.firebasestorage.app",
messagingSenderId:"856592608176",
appId:"1:856592608176:web:69f9df9cfd4f8c28630475"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let unsubFeed=null;
let videoObserver=null;
let currentPhase='concours';
let currentMonth='';
let userEglise=null;

function toast(msg){
var t=document.getElementById('toast');
t.textContent=msg;
t.classList.add('show');
clearTimeout(window._toastTimer);
window._toastTimer=setTimeout(function(){t.classList.remove('show');},3000);
}

function esc(s){if(!s)return'';return String(s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}

function getMonthKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

function showPage(name){
document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
var el=document.getElementById('page-'+name);
if(el)el.classList.add('active');
}

function traduireErreur(code){
var map={'auth/invalid-email':'Email invalide','auth/user-not-found':'Aucun compte','auth/wrong-password':'Mot de passe incorrect','auth/invalid-credential':'Identifiants incorrects','auth/email-already-in-use':'Email déjà utilisé','auth/weak-password':'Mot de passe trop faible'};
return map[code]||'Erreur : '+code;
}

window.handleLogin=async function(){
var email=document.getElementById('authEmail').value.trim();
var pwd=document.getElementById('authPassword').value;
var errBox=document.getElementById('authError');
errBox.style.display='none';
if(!email||!pwd){toast('Remplissez les champs');return;}
var btn=document.getElementById('btnLogin');
btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>';
try{await signInWithEmailAndPassword(auth,email,pwd);}
catch(e){errBox.textContent=traduireErreur(e.code||e.message);errBox.style.display='block';}
finally{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-arrow-right-to-bracket"></i> Se connecter';}
};

window.handleSignup=async function(){
var email=document.getElementById('authEmail').value.trim();
var pwd=document.getElementById('authPassword').value;
var errBox=document.getElementById('authError');
errBox.style.display='none';
if(!email||!pwd){toast('Remplissez les champs');return;}
var btn=document.getElementById('btnSignup');
btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>';
try{await createUserWithEmailAndPassword(auth,email,pwd);}
catch(e){errBox.textContent=traduireErreur(e.code||e.message);errBox.style.display='block';}
finally{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-user-plus"></i> Créer un compte';}
};

window.ouvrirProfilParent=function(){
if(window.parent&&window.parent!==window){window.parent.postMessage({type:'OPEN_PROFIL'},'*');}
else{toast('Profil NeTubeX RDC');}
};

window.ouvrirTabsParent=function(){
if(window.parent&&window.parent!==window){window.parent.postMessage({type:'OPEN_TABS'},'*');}
else{toast('Menu NeTubeX RDC');}
};

async function chargerEglise(uid){
try{
var snap=await getDoc(doc(db,'eglises',uid));
if(snap.exists())return snap.data();
return null;
}catch(e){return null;}
}

async function chargerPhase(){
try{
var snap=await getDoc(doc(db,'config','etat_mois'));
if(snap.exists())return snap.data();
return null;
}catch(e){return null;}
}

var _compteursVues={};

function demarrerCompteurVue(video,videoId){
if(!videoId)return;
if(currentPhase!=='concours')return;
if(dejaVuLocalement(videoId))return;
if(_compteursVues[videoId])return;
_compteursVues[videoId]=setTimeout(async function(){
try{
if(video&&!video.paused&&video.currentTime>4.5){
await updateDoc(doc(db,'videos',videoId),{validViews:increment(1)});
marquerVuLocalement(videoId);
}
}catch(e){}
delete _compteursVues[videoId];
},5000);
}

function arreterCompteurVue(videoId){
if(_compteursVues[videoId]){clearTimeout(_compteursVues[videoId]);delete _compteursVues[videoId];}
}

function dejaVuLocalement(videoId){
try{
var vues=JSON.parse(localStorage.getItem('ntx_vues')||'{}');
return vues[videoId]===new Date().toISOString().slice(0,10);
}catch(e){return false;}
}

function marquerVuLocalement(videoId){
try{
var vues=JSON.parse(localStorage.getItem('ntx_vues')||'{}');
vues[videoId]=new Date().toISOString().slice(0,10);
if(Object.keys(vues).length>300){
var keys=Object.keys(vues).slice(-200);
var n={};
keys.forEach(function(k){n[k]=vues[k];});
vues=n;
}
localStorage.setItem('ntx_vues',JSON.stringify(vues));
}catch(e){}
}

function renderVideo(v){
var posterAttr=v.thumbnailUrl?' poster="'+esc(v.thumbnailUrl)+'"':'';
var churchName=v.churchName||'Créateur';
var churchAvatar=v.churchAvatar||'';
var initials=churchName.slice(0,2).toUpperCase();
var isEglise=!!v.egliseId;
var viewsCount=v.validViews||0;
var avatarHtml=churchAvatar?'<img src="'+esc(churchAvatar)+'">':esc(initials);
var verifiedBadge=isEglise?'<span class="verified-badge"><i class="fa-solid fa-check"></i></span>':'';
var tagPill=isEglise?'<div class="tag-pill">Culte</div>':'';
var formatVues=viewsCount>=1000000?(viewsCount/1000000).toFixed(1)+'M':(viewsCount>=1000?(viewsCount/1000).toFixed(1)+'K':viewsCount);

return'<div class="video-card" data-vid="'+v.id+'">'+
'<div class="video-frame">'+
'<video src="'+esc(v.videoUrl)+'"'+posterAttr+' loop muted playsinline webkit-playsinline preload="metadata" data-vid="'+v.id+'"></video>'+
'<div class="play-overlay" data-overlay="'+v.id+'" onclick="demarrerLecture(this)"><div class="play-btn">▶</div></div>'+
'</div>'+
'<div class="video-overlay-ui">'+
'<div class="side-badges">'+
'<div class="side-avatar">'+avatarHtml+'</div>'+
'<div class="side-badge">'+
'<i class="fa-solid fa-eye side-badge-icon"></i>'+
'<div class="side-badge-value" data-views="'+v.id+'">'+formatVues+'</div>'+
'<div class="side-badge-label">vues</div>'+
'</div>'+
'</div>'+
'<div class="video-bottom">'+
'<div class="church-name">'+esc(churchName)+verifiedBadge+'</div>'+
(v.description?'<div class="video-desc">'+esc(v.description)+'</div>':'')+
tagPill+
'</div>'+
'</div>'+
'<div class="progress-bar-wrapper"><div class="progress-bar-fill" data-progress="'+v.id+'"></div></div>'+
'</div>';
}

window.demarrerLecture=function(overlay){
var vid=overlay.getAttribute('data-overlay');
var video=document.querySelector('video[data-vid="'+vid+'"]');
if(!video)return;
overlay.classList.remove('visible');
video.muted=false;
video.play().catch(function(){video.muted=true;video.play().catch(function(){overlay.classList.add('visible');});});
};

function attachVideoControls(video,videoId){
video.addEventListener('timeupdate',function(){
var progress=document.querySelector('[data-progress="'+videoId+'"]');
if(progress&&video.duration){
progress.style.width=((video.currentTime/video.duration)*100)+'%';
}
});
video.addEventListener('play',function(){demarrerCompteurVue(video,videoId);});
video.addEventListener('pause',function(){arreterCompteurVue(videoId);});
video.addEventListener('ended',function(){arreterCompteurVue(videoId);});
}

function attachPauseObserver(){
if(videoObserver)videoObserver.disconnect();
if(!('IntersectionObserver' in window))return;
videoObserver=new IntersectionObserver(function(entries){
entries.forEach(function(e){
var video=e.target;
var vid=video.getAttribute('data-vid');
var overlay=document.querySelector('.play-overlay[data-overlay="'+vid+'"]');
if(e.isIntersecting){
video.muted=true;
var p=video.play();
if(p&&p.then){p.then(function(){if(overlay)overlay.classList.remove('visible');}).catch(function(){if(overlay)overlay.classList.add('visible');});}
demarrerCompteurVue(video,vid);
}else{
if(!video.paused)video.pause();
arreterCompteurVue(vid);
}
});
},{threshold:0.6});

document.querySelectorAll('.video-card').forEach(function(card){
var video=card.querySelector('video');
if(!video)return;
videoObserver.observe(video);
var vid=video.getAttribute('data-vid');
if(vid)attachVideoControls(video,vid);
});
}

async function startFeed(){
var el=document.getElementById('feedListe');
el.innerHTML='<div class="empty-feed"><i class="fa-solid fa-spinner fa-spin" style="font-size:32px"></i><div style="font-size:14px;font-weight:700">Chargement…</div></div>';
if(unsubFeed){unsubFeed();unsubFeed=null;}

var q=query(collection(db,'videos'),orderBy('createdAt','desc'),limit(50));
unsubFeed=onSnapshot(q,function(snap){
var list=[];
snap.forEach(function(d){list.push(Object.assign({id:d.id},d.data()));});

if(currentPhase==='publication'){
list=list.filter(function(v){return v.ownerUid===currentUser.uid;});
}

if(list.length===0){
el.innerHTML='<div class="empty-feed"><div style="font-size:64px;opacity:.4">🎬</div><h3 style="color:#f1f5f9;font-size:17px;font-weight:800;margin:0">Aucune vidéo</h3></div>';
return;
}

el.innerHTML=list.map(function(v){return renderVideo(v);}).join('');
attachPauseObserver();
},function(err){
el.innerHTML='<div class="empty-feed"><div style="font-size:40px;color:#ef4444"><i class="fa-solid fa-circle-exclamation"></i></div><div style="font-size:14px;font-weight:700;color:#ef4444">Erreur</div></div>';
});
}

window.addEventListener('message',function(event){
if(!event.data||typeof event.data!=='object')return;
if(event.data.type==='PHASE_CHANGED'){currentPhase=event.data.phase||'concours';startFeed();}
if(event.data.type==='REFRESH_FEED'){startFeed();}
});

onAuthStateChanged(auth,async function(user){
currentUser=user;
if(user){
currentMonth=getMonthKey();
var phase=await chargerPhase();
currentPhase=phase&&phase.phase?phase.phase:'concours';
userEglise=await chargerEglise(user.uid);
document.getElementById('page-auth').classList.remove('active');
document.getElementById('tabBar').style.display='grid';
showPage('feed');
startFeed();
}else{
document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
document.getElementById('page-auth').classList.add('active');
document.getElementById('tabBar').style.display='none';
if(unsubFeed){unsubFeed();unsubFeed=null;}
}
});
</script>
</body>
</html>

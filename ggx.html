function calcMoy(p, notes, eleve) {
    let eps = currentFiche.epreuvesParPeriode?.[p] || [];
    if (!eps.length || !notes?.length) return 0;
    let sommeNotes = 0, sommeMax = 0;
    for (let i = 0; i < eps.length; i++) { sommeNotes += (notes[i] || 0); sommeMax += (eps[i].max || 1); }
    if (sommeMax === 0) return 0;
    let noteMaxPeriode = eleve ? getNotesMaxForEleve(eleve) : getPeriodeMax();
    return Math.round(Math.min(noteMaxPeriode, (sommeNotes / sommeMax) * noteMaxPeriode));
}
function getNoteClass(note, maxNote) {
    if (maxNote === 0) return '';

    if (ratio >= 0.5) return 'note-moyen';

}

window.updNote = function(eleveId, p, epi, v) {
    const eleve = trouverEleveParId(eleveId);

    ensureNotes(eleve);
    let va = parseFloat(v) || 0;
    let me = currentFiche.epreuvesParPeriode?.[p]?.[epi]?.max || 20;
    if (va > me) va = me;
    if (va < 0) va = 0;
    eleve.notes['p' + p][epi] = va;
    afficherCotation();
};
window.updExam = function(eleveId, s, v) {
    const eleve = trouverEleveParId(eleveId);
    if (!eleve) return;
    ensureNotes(eleve);
    let va = parseFloat(v) || 0;
    let me = getNotesMaxForEleve(eleve) * 2;

async function determinerRoleParEmail(email) {
    const emailLower = (email || '').toLowerCase();
    if (ADMIN_EMAILS_FALLBACK.includes(emailLower)) return { role: 'admin', nom: 'NGENDA FLORY' };
    if (emailLower.startsWith('direction.')) return { role: 'admin', nom: emailLower.split('@')[0].replace('direction.', '').replace(/\./g, ' ').toUpperCase() };
    if (emailLower.startsWith('prof.') || emailLower.startsWith('ens.')) {
        try {
            const profsSnap = await getDocs(collection(db, "ecoles", ECOLET_ID, SC.PROFESSEURS));
            const profDoc = profsSnap.docs.find(d => (d.data().email || '').toLowerCase() === emailLower);

        } catch (e) { return { role: 'professeur', nom: emailLower.split('@')[0] }; }
    }
    return { role: 'admin', nom: 'ADMIN' };
}

window.delProf = function(id) {
    showConfirm("Supprimer ce professeur ?", async function() {
        try { await deleteDoc(doc(db, "ecoles", ECOLET_ID, SC.PROFESSEURS, id)); toast("Professeur supprimé", 'success'); chargerProfsTable(); }
        catch (err) { toast("Erreur", 'error'); }
    });
};
async function creerCompteAuth(email, motDePasse) {
    const secAuth = getSecondaryAuth();
    try {
        const cred = await createUserWithEmailAndPassword(secAuth, email, motDePasse);
        await signOut(secAuth);
        return { ok: true, uid: cred.user.uid };
    } catch (e) {
        if (e.code === 'auth/email-already-in-use') return { ok: true, alreadyExists: true };
        return { ok: false, error: e.code || e.message };
    }
}
function showProfForm(prof = null) {
    const isEdit = !!prof;
    const d = document.createElement('div');
    d.className = 'modal-form-overlay show';
    d.innerHTML = `
    <div class="modal-form">
        <h3>${isEdit ? '✏️ Modifier un professeur' : '➕ Ajouter un professeur'}</h3>
        <div class="form-group"><label>Nom complet *</label><input type="text" id="pfNom" value="${escapeHtml(prof?.nom || '')}" placeholder="ex: Jean Dupont"></div>
        <div class="form-group"><label>Email (auto-généré)</label><input type="text" id="pfEmail" value="${escapeHtml(prof?.email || '')}" readonly><div style="font-size:11px;color:#94a3b8;margin-top:4px;">Format : prof.prenom.nom@gmail.com</div></div>
        <div class="form-group"><label>${isEdit ? 'Nouveau code (laisser vide pour ne pas changer)' : 'Code d\\'accès (6 chiffres) *'}</label><input type="text" id="pfCode" maxlength="6" inputmode="numeric" value="" placeholder="${isEdit ? 'Optionnel' : '123456'}"></div>
        <div class="form-group"><label><input type="checkbox" id="pfActif" ${prof?.actif !== false ? 'checked' : ''}> Compte actif</label></div>
        <div class="modal-form-actions">
            <button class="btn btn-secondary" id="pfCancel">Annuler</button>
            <button class="btn btn-success" id="pfSave">${isEdit ? 'Enregistrer' : 'Créer'}</button>
        </div>
    </div>`;
    document.body.appendChild(d);
    const nomInput = d.querySelector('#pfNom');
    const emailInput = d.querySelector('#pfEmail');
    const codeInput = d.querySelector('#pfCode');
    nomInput.addEventListener('input', function() { if (!isEdit) emailInput.value = genererEmailGmail(this.value); });
    codeInput.addEventListener('input', function() { this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6); });
    if (!isEdit) { d.querySelector('#pfCode').value = genererCode6Chiffres(); d.querySelector('#pfActif').checked = true; }
    d.querySelector('#pfCancel').onclick = () => d.remove();
    d.querySelector('#pfSave').onclick = async function() {
        const nom = nomInput.value.trim();
        const code = codeInput.value.trim();
        const actif = d.querySelector('#pfActif').checked;
        if (!nom) { toast("Le nom est requis", 'error'); return; }
        if (!isEdit && (!code || code.length !== 6)) { toast("Le code doit contenir 6 chiffres", 'error'); return; }
        this.disabled = true;
        this.textContent = 'Traitement...';
        try {
            let email = emailInput.value.trim();
            if (!isEdit) email = await trouverEmailUnique(nom);
            else if (!email) email = await trouverEmailUnique(nom);
            if (!isEdit) {
                const authResult = await creerCompteAuth(email, code);
                if (!authResult.ok) { toast("Erreur Auth : " + authResult.error, 'error'); this.disabled = false; this.textContent = 'Créer'; return; }
                if (authResult.alreadyExists) toast("Compte Auth existant pour " + email, 'warning');
            }
            const data = { nom, email, actif, school: ECOLET_ID };
            if (code) data.code = code;
            if (isEdit) {
                await setDoc(doc(db, "ecoles", ECOLET_ID, SC.PROFESSEURS, prof.id), data, { merge: true });
                toast("Professeur modifié", 'success');
            } else {
                const newId = 'p' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                await setDoc(doc(db, "ecoles", ECOLET_ID, SC.PROFESSEURS, newId), data);
                toast("Professeur créé ✓ Code : " + code, 'success');
            }
            d.remove();
            chargerProfsTable();
        } catch (err) { toast("Erreur : " + err.message, 'error'); this.disabled = false; this.textContent = isEdit ? 'Enregistrer' : 'Créer'; }
    };
}
document.getElementById('addProfBtn').onclick = () => showProfForm(null);
document.getElementById('profSearchInput')?.addEventListener('input', chargerProfsTable);
document.getElementById('addEleveBtn')?.addEventListener('click', () => {
    toast("Veuillez utiliser l'import JSON pour ajouter des élèves", 'info');
});
document.getElementById('importJsonBtn')?.addEventListener('click', () => {
    let d = document.createElement('div');
    d.className = 'modal-form-overlay show';
    d.innerHTML = `
    <div class="modal-form" style="max-width:600px;">
        <h3>📥 Importer des élèves depuis un fichier JSON</h3>
        <div class="import-zone" id="importZone">
            <div class="import-zone-icon">📄</div>
            <div class="import-zone-text">Déposez votre fichier .json ici</div>
            <div class="import-zone-sub">ou cliquez pour parcourir</div>
            <input type="file" id="importFile" accept=".json,application/json" style="display:none;">
        </div>
        <div id="importPreviewContainer"></div>
        <div class="modal-form-actions">
            <button class="btn btn-secondary" id="impCancel">Annuler</button>
            <button class="btn btn-success" id="impOk" disabled style="opacity:0.5;">Importer</button>
        </div>
    </div>`;
    document.body.appendChild(d);
    const zone = d.querySelector('#importZone');
    const fileInput = d.querySelector('#importFile');
    const previewContainer = d.querySelector('#importPreviewContainer');
    const impOk = d.querySelector('#impOk');
    const traiterFichier = (file) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                const elevesBruts = [];
                if (Array.isArray(data)) data.forEach(e => { if (e && typeof e === 'object') elevesBruts.push({ ...e, _c: null, _o: null }); });
                else if (data.options && typeof data.options === 'object') {
                    const cG = data.classe || null;
                    for (const opt in data.options) {
                        const arr = data.options[opt];
                        if (Array.isArray(arr)) arr.forEach(e => { if (e && typeof e === 'object') elevesBruts.push({ ...e, _c: cG, _o: opt }); });
                    }
                } else if (Array.isArray(data.eleves)) {
                    const cG = data.classe || null;
                    data.eleves.forEach(e => { if (e && typeof e === 'object') elevesBruts.push({ ...e, _c: cG, _o: null }); });
                } else { toast("Format JSON non reconnu", 'error'); return; }
                const valides = [];
                const erreurs = [];
                elevesBruts.forEach((e, idx) => {
                    const nom = (e.nom || '').toString().trim();
                    const classe = normaliserClasse(e.classe || e._c || '');
                    const option = (e.option || e._o || '').toString().trim().toUpperCase();
                    if (!nom) { erreurs.push({ ligne: idx + 1, raison: 'Nom manquant' }); return; }
                    if (!classe || !CLASSES_VALIDES.includes(classe)) { erreurs.push({ ligne: idx + 1, nom, raison: 'Classe invalide' }); return; }
                    valides.push({ nom, postnom: (e.postnom || '').toString().trim(), prenom: (e.prenom || '').toString().trim(), sexe: (e.sexe || 'M').toString().toUpperCase() === 'F' ? 'F' : 'M', classe, option: (classe === '7ème EB' || classe === '8ème EB') ? '' : option });
                });
                jsonImportData = { valides, erreurs };
                previewContainer.innerHTML = `<div style="margin-top:16px;padding:14px;background:#0f172a;border-radius:12px;"><div style="font-size:13px;color:#e2e8f0;">• <strong style="color:#10b981;">${valides.length}</strong> valide(s)<br>• <strong style="color:${erreurs.length > 0 ? '#ef4444' : '#94a3b8'};">${erreurs.length}</strong> erreur(s)</div></div>`;
                if (valides.length > 0) { impOk.disabled = false; impOk.style.opacity = '1'; impOk.textContent = `Importer ${valides.length} élève(s)`; }
                else { impOk.disabled = true; impOk.style.opacity = '0.5'; }
            } catch (err) { toast("Fichier JSON invalide", 'error'); }
        };
        reader.readAsText(file);
    };
    zone.onclick = () => fileInput.click();
    fileInput.onchange = (ev) => { if (ev.target.files[0]) traiterFichier(ev.target.files[0]); };
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('dragover'); if (e.dataTransfer.files[0]) traiterFichier(e.dataTransfer.files[0]); });
    d.querySelector('#impCancel').onclick = () => { jsonImportData = null; d.remove(); };
    impOk.onclick = async () => {
        if (!jsonImportData || !jsonImportData.valides.length) return;
        impOk.disabled = true; impOk.textContent = 'Importation...';
        try {
            const existing = new Set(localEleves.map(e => (e.nom + '|' + e.postnom + '|' + e.prenom).toLowerCase()));
            let countOk = 0, countSkip = 0;
            for (const eleve of jsonImportData.valides) {
                const key = (eleve.nom + '|' + eleve.postnom + '|' + eleve.prenom).toLowerCase();
                if (existing.has(key)) { countSkip++; continue; }
                const newId = 'e' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                await setDoc(doc(db, "ecoles", ECOLET_ID, SC.COMPTA_ELEVES, newId), { ...eleve, eleveId: newId, school: ECOLET_ID, createdAt: new Date() });
                existing.add(key); countOk++;
            }
            toast(`${countOk} importé(s)${countSkip > 0 ? ', ' + countSkip + ' doublon(s)' : ''}`, 'success');
            jsonImportData = null; d.remove(); chargerElevesTable();
        } catch (err) { toast("Erreur", 'error'); impOk.disabled = false; impOk.textContent = 'Réessayer'; }
    };
});
document.getElementById('replaceElevesBtn')?.addEventListener('click', () => {
    let d = document.createElement('div');
    d.className = 'modal-form-overlay show';
    d.innerHTML = `
    <div class="modal-form" style="max-width:650px;">
        <h3>🔄 Remplacer les élèves</h3>
        <div style="padding:14px;background:rgba(245,158,11,0.1);border:1px solid #f59e0b;border-radius:12px;margin-bottom:16px;color:#fbbf24;font-size:12px;">⚠️ Les élèves existants de la classe/option sélectionnée seront supprimés puis remplacés.</div>
        <div class="form-group"><label>Classe *</label><select id="repClasse"><option value="">-- Sélectionner --</option>${CLASSES_VALIDES.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div>
        <div class="form-group" id="repOptionGroup" style="display:none;"><label>Option</label><select id="repOption"><option value="">-- Toutes les options --</option>${OPTIONS_DISPONIBLES.map(o => `<option value="${o}">${o}</option>`).join('')}</select></div>
        <div id="repInfoBox" style="display:none;padding:14px;background:#0f172a;border-radius:12px;margin-bottom:16px;"><div style="font-size:12px;color:#94a3b8;">Élèves actuels</div><div id="repInfoCount" style="font-size:20px;font-weight:800;color:#ef4444;">0</div></div>
        <div class="import-zone" id="repImportZone" style="padding:20px;"><div class="import-zone-icon">📄</div><div class="import-zone-text">Déposez ou cliquez</div><input type="file" id="repImportFile" accept=".json" style="display:none;"></div>
        <div class="form-group" style="margin-top:12px;"><label>Ou coller JSON</label><textarea id="repJsonText" rows="5" placeholder='[{"nom":"KABILA","postnom":"MUTOMBO","prenom":"Jean","sexe":"M"}]' style="font-family:monospace;font-size:12px;"></textarea></div>
        <div id="repPreview" style="margin-top:12px;"></div>
        <div class="modal-form-actions"><button class="btn btn-secondary" id="repCancel">Annuler</button><button class="btn btn-danger" id="repConfirm" disabled style="opacity:0.5;">🔄 REMPLACER</button></div>
    </div>`;
    document.body.appendChild(d);
    const classeSelect = d.querySelector('#repClasse');
    const optionGroup = d.querySelector('#repOptionGroup');
    const optionSelect = d.querySelector('#repOption');
    const infoBox = d.querySelector('#repInfoBox');
    const infoCount = d.querySelector('#repInfoCount');
    const fileInput = d.querySelector('#repImportFile');
    const zone = d.querySelector('#repImportZone');
    const jsonText = d.querySelector('#repJsonText');
    const preview = d.querySelector('#repPreview');
    const confirmBtn = d.querySelector('#repConfirm');
    let elevesJsonValides = null;
    let elevesASupprimer = [];
    const calcSuppr = () => {
        const c = classeSelect.value, o = optionSelect.value;
        if (!c) return [];
        return localEleves.filter(e => { if (e.classe !== c) return false; if (c === '7ème EB' || c === '8ème EB') return true; if (o && e.option !== o) return false; return true; });
    };
    const actualiserInfo = () => {
        const c = classeSelect.value;
        if (!c) { infoBox.style.display = 'none'; elevesASupprimer = []; majBtn(); return; }
        if (c === '7ème EB' || c === '8ème EB') optionGroup.style.display = 'none';
        else optionGroup.style.display = 'block';
        elevesASupprimer = calcSuppr();
        infoBox.style.display = 'block';
        infoCount.textContent = elevesASupprimer.length;
        infoCount.style.color = elevesASupprimer.length > 0 ? '#ef4444' : '#10b981';
        majBtn();
    };
    const majBtn = () => {
        const c = classeSelect.value;
        if (!c || !elevesJsonValides || elevesJsonValides.length === 0) { confirmBtn.disabled = true; confirmBtn.style.opacity = '0.5'; return; }
        confirmBtn.disabled = false; confirmBtn.style.opacity = '1';
        confirmBtn.textContent = `🔄 REMPLACER (${elevesASupprimer.length} → ${elevesJsonValides.length})`;
    };
    const parserJson = (text) => {
        try {
            const data = JSON.parse(text);
            let bruts = [];
            if (Array.isArray(data)) bruts = data;
            else if (data && Array.isArray(data.eleves)) bruts = data.eleves;
            else if (data && data.options) for (const opt in data.options) if (Array.isArray(data.options[opt])) data.options[opt].forEach(e => bruts.push({ ...e, option: opt }));
            else return null;
            const valides = [];
            bruts.forEach((e, idx) => { if (e && typeof e === 'object' && (e.nom || '').toString().trim()) valides.push({ nom: e.nom.toString().trim(), postnom: (e.postnom || '').toString().trim(), prenom: (e.prenom || '').toString().trim(), sexe: (e.sexe || 'M').toString().toUpperCase() === 'F' ? 'F' : 'M', option: (e.option || '').toString().trim().toUpperCase() }); });
            return { valides };
        } catch (err) { return null; }
    };
    const traiterJson = (text) => {
        const result = parserJson(text);
        if (!result) { toast("JSON invalide", 'error'); return; }
        const c = classeSelect.value, o = optionSelect.value;
        elevesJsonValides = result.valides.map(e => ({ ...e, classe: c, option: (c === '7ème EB' || c === '8ème EB') ? '' : (o || e.option || '') }));
        preview.innerHTML = `<div style="padding:14px;background:#0f172a;border-radius:12px;color:#e2e8f0;font-size:13px;">✓ ${elevesJsonValides.length} élève(s) valide(s)</div>`;
        majBtn();
    };
    zone.onclick = () => fileInput.click();
    fileInput.onchange = (ev) => { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = (e) => { jsonText.value = e.target.result.substring(0, 5000); traiterJson(e.target.result); }; r.readAsText(f); };
    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', (e) => { e.preventDefault(); zone.classList.remove('dragover'); const f = e.dataTransfer.files[0]; if (!f) return; const r = new FileReader(); r.onload = (ev) => { jsonText.value = ev.target.result.substring(0, 5000); traiterJson(ev.target.result); }; r.readAsText(f); });
    let debounce; jsonText.oninput = function() { clearTimeout(debounce); debounce = setTimeout(() => { if (this.value.trim().length < 5) { elevesJsonValides = null; preview.innerHTML = ''; majBtn(); return; } traiterJson(this.value); }, 400); };
    classeSelect.onchange = actualiserInfo;
    optionSelect.onchange = actualiserInfo;
    d.querySelector('#repCancel').onclick = () => d.remove();
    confirmBtn.onclick = async () => {
        if (!elevesJsonValides || !elevesJsonValides.length) return;
        const c = classeSelect.value, o = optionSelect.value;
        const label = c + (o ? ' — ' + o : '');
        if (!confirm(`⚠️ SUPPRESSION DÉFINITIVE\n\n${label}\n\n• ${elevesASupprimer.length} supprimé(s)\n• ${elevesJsonValides.length} ajouté(s)\n\nIrrecevable. Confirmer ?`)) return;
        confirmBtn.disabled = true;
        try {
            let cS = 0;
            for (const e of elevesASupprimer) { try { await deleteDoc(doc(db, "ecoles", ECOLET_ID, SC.COMPTA_ELEVES, e.id)); } catch(err) {} cS++; }
            let cA = 0;
            for (const el of elevesJsonValides) {
                const nid = 'e' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                await setDoc(doc(db, "ecoles", ECOLET_ID, SC.COMPTA_ELEVES, nid), { ...el, eleveId: nid, school: ECOLET_ID, createdAt: new Date() });
                cA++;
            }
            toast(`🔄 ${cS} supprimé(s), ${cA} ajouté(s)`, 'success');
            d.remove(); await getAllEleves(); chargerElevesTable();
        } catch (err) { toast("Erreur : " + err.message, 'error'); confirmBtn.disabled = false; majBtn(); }
    };
    actualiserInfo();
});
const restored = await restaurerSession();
if (!restored) showLogin();

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0F2027" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Edge App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: #0F2027;
      height: 100%;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #0F2027 0%, #203A43 50%, #2C5364 100%);
      background-attachment: fixed;
      background-size: 100% 100dvh;
      color: #fff;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      padding-top: calc(24px + env(safe-area-inset-top));
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      padding-left: calc(24px + env(safe-area-inset-left));
      padding-right: calc(24px + env(safe-area-inset-right));
    }

    h1 {
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 700;
      margin-bottom: 12px;
    }

    p {
      font-size: clamp(14px, 4vw, 17px);
      opacity: 0.85;
      line-height: 1.5;
      margin-bottom: 32px;
      max-width: 340px;
    }

    button {
      padding: 16px 40px;
      border: none;
      border-radius: 999px;
      background: #fff;
      color: #0F2027;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    button:active {
      transform: scale(0.96);
    }

    @media (display-mode: standalone) {
      body {
        background-attachment: fixed;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Edge to Edge 🚀</h1>
    <p>Le fond s'étend jusqu'aux bords,<br>même sous la barre de batterie.</p>
    <button id="btn">Plein écran</button>
  </main>

  <script>
    async function goFullscreen() {
      const el = document.documentElement;
      try {
        if (el.requestFullscreen) {
          await el.requestFullscreen({ navigationUI: "hide" });
        } else if (el.webkitRequestFullscreen) {
          await el.webkitRequestFullscreen();
        }
      } catch (e) {}
    }

    document.getElementById("btn").addEventListener("click", goFullscreen);
  </script>
</body>
</html>

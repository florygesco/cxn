<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f0f4ff">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="bingbot" content="noindex, nofollow">
<meta name="slurp" content="noindex, nofollow">
<meta name="revisit-after" content="never">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
html,body{height:auto;min-height:100vh;width:100%;margin:0;padding:0;background:#f0f4ff;overflow:auto;position:relative}
canvas#particles{display:none}
.bg-fixed{display:none}
.bg-overlay{display:none}
.header-fixed{position:sticky;top:0;z-index:200;background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1.5px solid rgba(200,200,200,0.3);padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:12px}
.header{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.search-wrap{position:relative;flex:1;max-width:600px}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:15px;color:#6b7280}
.search-input{width:100%;padding:10px 16px 10px 44px;border-radius:50px;border:1.5px solid #e5e7eb;background:#ffffff;font-size:15px;color:#0a0a1a;outline:none;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.search-input:focus{border-color:#6366f1;box-shadow:0 4px 16px rgba(99,102,241,0.1)}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.05);border:none;font-size:11px;color:#9ca3af;cursor:pointer;padding:3px 10px;border-radius:30px;display:none}
.btn-home{background:#ffffff;border:1.5px solid #e5e7eb;padding:8px 20px;border-radius:50px;font-size:13px;font-weight:600;color:#4b5563;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:all 0.2s}
.btn-home:hover{background:#f3f4f6;transform:translateY(-2px)}
.main-container{position:relative;top:auto;left:auto;right:auto;bottom:auto;padding:20px 20px 40px;min-height:100vh;height:auto;overflow:visible;width:100%;background:#f0f4ff}
.schools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:32px 24px;max-width:1200px;margin:0 auto;padding-top:4px}
.school-card{position:relative;background:#ffffff;border-radius:40px;padding:0 24px 24px;cursor:pointer;transition:all 0.3s ease;box-shadow:0 4px 20px rgba(0,0,0,0.06);border:1px solid rgba(200,200,200,0.2)}
.school-card:hover{transform:translateY(-8px);box-shadow:0 20px 40px rgba(99,102,241,0.12)}
.school-card:active{transform:scale(0.97)}
.school-card.hidden{display:none}
.school-card .card-gradient{position:absolute;top:0;left:0;right:0;height:190px;border-radius:40px 40px 0 0;z-index:0;opacity:0.3}
.school-card .card-glow{display:none}
.school-logo-area{position:relative;width:220px;height:220px;margin:0 auto;margin-top:24px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#f8fafc;border:4px solid #ffffff;box-shadow:0 8px 32px rgba(0,0,0,0.06);z-index:2}
.school-logo-area .school-logo-img{width:100%;height:100%;object-fit:cover}
.school-logo-area .logo-placeholder{font-size:64px;color:#d1d5db}
.school-info{position:relative;z-index:2;text-align:center;padding-top:20px}
.school-name{font-size:22px;font-weight:800;color:#1a1a2e;letter-spacing:-0.5px;line-height:1.3;text-transform:uppercase}
.school-name .prefix{font-weight:500;color:#4a4a6a;font-size:14px;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
.school-location{font-size:16px;color:#4a4a6a;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px;font-weight:500}
.school-percentage{font-size:20px;font-weight:800;margin-top:8px;display:inline-block}
.progress-bar{width:100%;height:6px;background:rgba(0,0,0,0.06);border-radius:10px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:10px;transition:width 1s ease}
.school-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:16px;border-top:1.5px solid rgba(0,0,0,0.05)}
.school-rating{font-size:14px;display:flex;align-items:center;gap:6px}
.school-rating .stars{color:#f59e0b;letter-spacing:1px}
.school-code{font-size:11px;color:#9ca3af;font-family:monospace;background:#f3f4f6;padding:3px 14px;border-radius:30px;font-weight:500}
.btn-access{background:linear-gradient(135deg,#6366f1,#7c3aed);border:none;padding:8px 24px;border-radius:50px;font-size:14px;font-weight:700;color:#ffffff;cursor:pointer;transition:all 0.3s ease;display:flex;align-items:center;gap:6px;flex-shrink:0;box-shadow:0 4px 16px rgba(99,102,241,0.25)}
.btn-access:after{content:"→";transition:transform 0.3s ease}
.school-card:hover .btn-access{box-shadow:0 6px 24px rgba(99,102,241,0.35);transform:translateY(-2px)}
.school-card:hover .btn-access:after{transform:translateX(6px)}
.btn-access:active{transform:scale(0.92)}
.stats{position:sticky;bottom:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px 24px;border-radius:30px 30px 0 0;border-top:1px solid rgba(200,200,200,0.2);display:flex;gap:30px;font-size:14px;font-weight:500;color:#4b5563;margin-top:40px;justify-content:center;max-width:1200px;margin-left:auto;margin-right:auto}
.bottom-nav{display:none}
@media(max-width:768px){.schools-grid{grid-template-columns:1fr 1fr;gap:20px}.school-logo-area{width:160px;height:160px}.school-name{font-size:18px}.main-container{padding:16px}}
@media(max-width:480px){.schools-grid{grid-template-columns:1fr;gap:16px}.school-logo-area{width:180px;height:180px}.school-card{padding:0 16px 16px;border-radius:30px}.school-card .card-gradient{height:150px;border-radius:30px 30px 0 0}.school-name{font-size:17px}.btn-access{width:100%;justify-content:center}.school-bottom{flex-wrap:wrap;gap:8px}.stats{flex-direction:column;gap:8px;align-items:center;padding:12px 16px;font-size:13px}}
</style>
</head>
<body>
<div class="header-fixed">
<div class="header">
<div class="search-wrap">
<span class="search-icon">⌕</span>
<input class="search-input" id="searchInput" type="text" placeholder="Rechercher un établissement…" autocomplete="off">
<button class="search-clear" id="searchClear" aria-label="Effacer">✕</button>
</div>
<a href="https://www.netubex.com/index" class="btn-home" target="_blank">🏠 Accueil</a>
</div>
</div>
<div class="main-container" id="mainContainer">
<div class="schools-grid" id="schoolsList"></div>
<div class="stats">
<span>🏫 <span id="schoolCount">0</span> écoles</span>
<span>📈 Moyenne: <span id="avgScore">0%</span></span>
</div>
</div>
<script>
const SCHOOLS=[
{id:"tremplin",name:"Tremplin",city:"Kasumbalesa",logo:"tremplin.png",percentage:68},
{id:"excellence",name:"Excellence",city:"Lubumbashi",logo:"excellence.png",percentage:66},
{id:"bwacha",name:"Bwacha",city:"Kasumbalesa",logo:"bwacha.png",percentage:0},
{id:"amour",name:"Amour",city:"Lubumbashi",logo:"amour.png",percentage:44},
{id:"perseverance",name:"Persévérance",city:"Lubumbashi",logo:"perseverance.png",percentage:38}
];
const COLORS=[
{primary:'#2563eb',secondary:'#1e40af'},
{primary:'#7c3aed',secondary:'#5b21b6'},
{primary:'#8b5cf6',secondary:'#6d28d9'},
{primary:'#059669',secondary:'#047857'},
{primary:'#d97706',secondary:'#b45309'}
];
const PLACEHOLDERS=['⌘','✦','◈','◆','▣'];
let allCards=[];

function getStars(p){const s=Math.round(p/20);return '★'.repeat(Math.min(s,5))+'☆'.repeat(Math.max(0,5-s));}
function getPercentageColor(p){if(p>=80)return '#10b981';if(p>=60)return '#f59e0b';if(p>=40)return '#f97316';return '#ef4444';}

function generateCard(school,index){
const safeName=school.name.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]||m));
const safeCity=school.city.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]||m));
const stars=getStars(school.percentage);
const phIndex=index%PLACEHOLDERS.length;
const colorIndex=index%COLORS.length;
const color=COLORS[colorIndex];
const pctColor=getPercentageColor(school.percentage);
const logoHtml=school.logo?'<img class="school-logo-img" src="'+school.logo+'" alt="'+safeName+'" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">':'<div class="logo-placeholder">'+PLACEHOLDERS[phIndex]+'</div>';
return {
html:'<div class="school-card" data-prefixe="'+school.id+'" style="--primary-color:'+color.primary+';--secondary-color:'+color.secondary+'"><div class="card-gradient" style="background:linear-gradient(145deg,'+color.primary+','+color.secondary+');"></div><div class="school-logo-area">'+logoHtml+'</div><div class="school-info"><div class="school-name"><span class="prefix">COMPLEXE SCOLAIRE</span> '+safeName+'</div><div class="school-location">📍 '+safeCity+'</div><div class="school-percentage" style="background:linear-gradient(135deg,'+color.primary+','+color.secondary+');-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">'+school.percentage+'%</div><div class="progress-bar"><div class="progress-fill" style="width:'+school.percentage+'%;background:'+pctColor+'"></div></div><div class="school-bottom"><div class="school-rating"><span class="stars">'+stars+'</span></div><span class="school-code">'+school.id+'</span><div class="btn-access">Accéder</div></div></div></div>',
id:school.id,
name:school.name.toLowerCase(),
city:school.city.toLowerCase()
};
}

function loadSchools(){
const container=document.getElementById('schoolsList');
const sorted=[...SCHOOLS].sort((a,b)=>{
if(a.id==='tremplin')return -1;
if(b.id==='tremplin')return 1;
return 0;
});
allCards=sorted.map((school,index)=>generateCard(school,index));
renderCards(allCards);
setupClicks();
updateStats();
}

function renderCards(cards){
const container=document.getElementById('schoolsList');
if(cards.length===0){
container.innerHTML='<div class="no-result">Aucun établissement trouvé</div>';
return;
}
container.innerHTML=cards.map(c=>c.html).join('');
}

function setupSearch(){
const input=document.getElementById('searchInput');
const clear=document.getElementById('searchClear');
input.addEventListener('input',function(){
const q=this.value.trim().toLowerCase();
clear.style.display=q.length>0?'block':'none';
const filtered=allCards.filter(c=>c.name.includes(q)||c.city.includes(q));
renderCards(filtered);
setupClicks();
});
clear.addEventListener('click',function(){
document.getElementById('searchInput').value='';
this.style.display='none';
renderCards(allCards);
setupClicks();
document.getElementById('searchInput').focus();
});
}

function setupClicks(){
document.querySelectorAll('.school-card').forEach(card=>{
card.addEventListener('click',function(e){
e.stopPropagation();
const prefixe=this.getAttribute('data-prefixe');
if(prefixe&&prefixe!=='null'&&prefixe!=='undefined'){
localStorage.setItem('pwa_school_id',prefixe);
localStorage.setItem('lastSchoolId',prefixe);
if(prefixe!=='tremplin'&&prefixe!=='bwacha'){
window.location.href='https://www.netubex.com/accesrefus';
return;
}
const isPWA=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
let targetUrl;
if(isPWA){
const baseUrl=new URL('/',window.location.origin);
baseUrl.searchParams.set('ecole',prefixe);
baseUrl.searchParams.set('from','pwa');
baseUrl.searchParams.set('t',Date.now());
targetUrl=baseUrl.toString();
}else{
if(prefixe==='bwacha'){
targetUrl='/espace_parental2?ecole='+encodeURIComponent(prefixe);
}else{
targetUrl='/schooling?ecole='+encodeURIComponent(prefixe);
}
}
window.location.href=targetUrl;
}
});
});
}

function updateStats(){
const total=SCHOOLS.length;
const avg=Math.round(SCHOOLS.reduce((sum,s)=>sum+s.percentage,0)/total);
document.getElementById('schoolCount').textContent=total;
document.getElementById('avgScore').textContent=avg+'%';
}

loadSchools();
setupSearch();

if(window.self!==window.top){
window.addEventListener('load',function(){
setTimeout(function(){
try{
const height=document.documentElement.scrollHeight;
window.parent.postMessage({type:'resize',height:height},'*');
}catch(e){}
},500);
});
if(window.ResizeObserver){
const observer=new ResizeObserver(function(){
try{
const height=document.documentElement.scrollHeight;
window.parent.postMessage({type:'resize',height:height},'*');
}catch(e){}
});
observer.observe(document.body);
}
}
</script>
</body>
</html>

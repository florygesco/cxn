<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif}
body{display:flex;align-items:center;justify-content:center;background:#060912;position:relative;overscroll-behavior:none;-webkit-overscroll-behavior:none}
body,.login-box,.login-wrapper,.logo-wrapper,.form-group,.login-box *{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}

.bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;overflow:hidden;background:radial-gradient(ellipse at 20% 20%,#0a1530 0%,#060912 50%,#050710 100%)}
.bg-canvas::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(0,229,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,0.03) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%)}
.bg-canvas::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 80%,rgba(139,92,246,0.15),transparent 50%),radial-gradient(circle at 10% 90%,rgba(0,229,255,0.10),transparent 50%);pointer-events:none}

.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.5;pointer-events:none;z-index:1}
.orb-1{width:500px;height:500px;background:radial-gradient(circle,#00e5ff,transparent 70%);top:-150px;left:-150px;animation:orb1 22s ease-in-out infinite alternate}
.orb-2{width:600px;height:600px;background:radial-gradient(circle,#8b5cf6,transparent 70%);bottom:-200px;right:-200px;animation:orb2 26s ease-in-out infinite alternate}
.orb-3{width:300px;height:300px;background:radial-gradient(circle,#ec4899,transparent 70%);top:40%;right:20%;opacity:0.25;animation:orb3 30s ease-in-out infinite alternate}
@keyframes orb1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(120px,80px) scale(1.2)}}
@keyframes orb2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-100px,-80px) scale(1.15)}}
@keyframes orb3{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-60px,60px) scale(0.85)}}

.login-wrapper{position:relative;width:100%;max-width:460px;padding:18px;z-index:10;height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{position:relative;width:100%;background:rgba(15,20,35,0.75);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-radius:28px;padding:32px 28px 24px;border:1px solid rgba(0,229,255,0.15);box-shadow:0 40px 100px rgba(0,0,0,0.6),0 0 80px rgba(0,229,255,0.05),inset 0 1px 0 rgba(255,255,255,0.08);animation:boxEnter 0.7s cubic-bezier(0.16,1,0.3,1)}
.login-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#00e5ff,#8b5cf6,transparent);opacity:0.8}
.login-box::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,229,255,0.4),transparent);opacity:0.5}
@keyframes boxEnter{from{opacity:0;transform:translateY(30px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}

.corner{position:absolute;width:24px;height:24px;border-color:#00e5ff;opacity:0.5;pointer-events:none}
.corner-tl{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid;border-top-left-radius:28px}
.corner-tr{top:-1px;right:-1px;border-top:2px solid;border-right:2px solid;border-top-right-radius:28px}
.corner-bl{bottom:-1px;left:-1px;border-bottom:2px solid;border-left:2px solid;border-bottom-left-radius:28px}
.corner-br{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid;border-bottom-right-radius:28px}

.logo-container{display:flex;align-items:center;justify-content:center;margin-bottom:16px;position:relative;z-index:2}

.logo-wrapper::before{content:'';position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0%,#00e5ff 25%,transparent 50%,#8b5cf6 75%,transparent 100%);animation:rotateRing 4s linear infinite;opacity:0.6;z-index:-1}
.logo-wrapper::after{content:'';position:absolute;inset:-4px;border-radius:50%;background:#060912;z-index:-1}
@keyframes rotateRing{to{transform:rotate(360deg)}}
.logo-wrapper:hover{transform:scale(1.05);box-shadow:0 0 0 1px rgba(0,229,255,0.4),0 0 60px rgba(0,229,255,0.3),inset 0 0 20px rgba(0,229,255,0.1)}

.login-box h1{text-align:center;font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px;position:relative;z-index:2;background:linear-gradient(135deg,#ffffff,#a0d8ff 50%,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}

const app=initializeApp(firebaseConfig);

let tentatives=0;
let toastTimeout=null;

function getSalutation(){
const now=new Date();
const hour=now.getHours();
let message="";
if(hour>=5&&hour<12)message="Bonjour, à vous ";
else if(hour>=12&&hour<18)message="Bon après-midi, à vous !";
else if(hour>=18&&hour<22)message="Bonsoir, à vous !";
else message="Content de vous revoir";
return message;
}

function typeWriter(element,text,speed=90){
let i=0;
const targetSpan=element.querySelector('#typedText');
if(targetSpan)targetSpan.textContent='';
function type(){
if(i<text.length&&targetSpan){
targetSpan.textContent+=text.charAt(i);
i++;
setTimeout(type,speed);
}
}
type();
}

const salutationEl=document.getElementById('salutationText');
const salutationMsg=getSalutation();
salutationEl.innerHTML=`<span id="typedText"></span><span class="cursor"></span>`;
setTimeout(()=>{typeWriter(salutationEl,salutationMsg,90)},500);

function genererEmailPromoteur(ecoleId){return`promoteur.${ecoleId}@gmail.com`}
function genererEmailDirection(ecoleId){return`direction.${ecoleId}@gmail.com`}
function genererEmailCompta(ecoleId){return`compta.${ecoleId}@gmail.com`}

function showToast(message,type='info'){
const container=document.getElementById('toastContainer');
if(!container)return;
if(toastTimeout){clearTimeout(toastTimeout);toastTimeout=null}
const existingToast=container.querySelector('.toast');
if(existingToast){
existingToast.classList.remove('show');
existingToast.classList.add('hide');
setTimeout(()=>{existingToast.remove();createToast(message,type)},400);
}else{createToast(message,type)}
}

function createToast(message,type){
const container=document.getElementById('toastContainer');
const config={
success:{icon:'✅',title:'Succès'},
error:{icon:'❌',title:'Erreur'},
warning:{icon:'⚠️',title:'Attention'},
info:{icon:'ℹ️',title:'Information'}
};
const c=config[type]||config.info;
const el=document.createElement('div');
el.className=`toast ${type}`;
el.innerHTML=`
<div class="toast-icon">${c.icon}</div>
<div class="toast-content">
<div class="toast-title">${c.title}</div>
<div class="toast-message">${message}</div>
</div>
<button class="toast-close">✕</button>
`;
container.appendChild(el);
setTimeout(()=>el.classList.add('show'),50);
el.querySelector('.toast-close').addEventListener('click',()=>{
el.classList.remove('show');
el.classList.add('hide');
toastTimeout=setTimeout(()=>el.remove(),500);
});
toastTimeout=setTimeout(()=>{
if(el.parentNode){
el.classList.remove('show');
el.classList.add('hide');
setTimeout(()=>{if(el.parentNode)el.remove()},500);
}
},4000);
}

const docSnap=await getDoc(docRef);
if(docSnap.exists()){
const data=docSnap.data();
return data.logoUrl||null;
}
return null;
}catch(error){
console.error("Erreur chargement logo:",error);
return null;
}
}

async function updateSchoolLogo(ecoleId){
const logoImg=document.getElementById('schoolLogo');
const placeholder=document.getElementById('logoPlaceholder');
const logoUrl=await getSchoolLogo(ecoleId);
if(logoUrl){
logoImg.src=logoUrl;
logoImg.style.display='block';
placeholder.style.display='none';
logoImg.onerror=function(){
logoImg.style.display='none';
placeholder.style.display='flex';
};
}else{
logoImg.style.display='none';
placeholder.style.display='flex';
}
}

async function getSchoolCodes(){
try{
const ref=doc(db,"ecoles",ecoleId,"settings","data");
let snap=await getDoc(ref);
if(snap.exists()){
const data=snap.data();
if(!data.codeDirection){
const schoolRef=doc(db,"ecoles",ecoleId);
const schoolSnap=await getDoc(schoolRef);
if(schoolSnap.exists()){
const schoolData=schoolSnap.data();
if(schoolData.codeDirection){
data.codeDirection=schoolData.codeDirection;
}
}
}
return data;
}else{
return null;
}
}catch(e){
console.error("Erreur chargement codes:",e);
return null;
}
}

function chargerAppEnIframe(role,ecoleId,code){
let pageUrl='';
switch(role){
case 'direction':
pageUrl='https://www.netubex.com/schooldirection.html';
break;
case 'comptabilite':
pageUrl='https://www.netubex.com/schoolcompta.html';
break;
case 'promoteur':
pageUrl='https://www.netubex.com/schoolpromo.html';
break;
default:
pageUrl='https://www.netubex.com/schooldirection.html';
}
const fullUrl=pageUrl+'?ecole='+encodeURIComponent(ecoleId)+'&code='+encodeURIComponent(code)+'&role='+encodeURIComponent(role);
document.body.classList.add('iframe-active');
const iframe=document.getElementById('app-iframe');
iframe.src=fullUrl;
}

async function seConnecter(){
const password=document.getElementById("loginPassword").value.trim();
const btn=document.getElementById("loginBtn");

if(!password||password.length<4){
showToast("Code d'accès incorrect. Veuillez réessayer.","error");
tentatives++;
if(tentatives>=5){
showToast("Trop de tentatives. Veuillez contacter le support.","error");
document.getElementById("loginPassword").disabled=true;
}
return;
}

btn.disabled=true;
btn.classList.add('loading');

try{
const codes=await getSchoolCodes();

if(!codes){
showToast("École non reconnue. Veuillez contacter le support.","error");
btn.disabled=false;
btn.classList.remove('loading');
return;
}

let role=null;
let email=null;

const codeDir=codes.codeDirection?codes.codeDirection.trim():'';
const codeCompta=codes.codeComptabilite?codes.codeComptabilite.trim():'';
const codePromoteur=codes.codePromoteur?codes.codePromoteur.trim():'';
const passwordClean=password.trim();

if(codeDir===passwordClean){
role='direction';
email=codes.emailDirection||genererEmailDirection(ecoleId);
}else if(codeCompta===passwordClean){
role='comptabilite';
email=codes.emailComptabilite||genererEmailCompta(ecoleId);
}else if(codePromoteur===passwordClean){
role='promoteur';
email=codes.emailPromoteur||genererEmailPromoteur(ecoleId);
}else{
showToast("Code d'accès incorrect. Veuillez réessayer.","error");
tentatives++;
btn.disabled=false;
btn.classList.remove('loading');
if(tentatives>=5){
showToast("Trop de tentatives. Veuillez contacter le support.","error");
document.getElementById("loginPassword").disabled=true;
}
return;
}

const roleLabels={direction:'Direction',comptabilite:'Comptabilité',promoteur:'Promoteur'};
showToast(`Vérification réussie. Connexion en tant que ${roleLabels[role]}...`,"success");

try{await createUserWithEmailAndPassword(auth,email,password)}
catch(e){if(e.code!=='auth/email-already-in-use'){console.error("Erreur création compte:",e)}}

try{await signInWithEmailAndPassword(auth,email,password)}
catch(authError){
if(authError.code==='auth/user-not-found'){
await createUserWithEmailAndPassword(auth,email,password);
await signInWithEmailAndPassword(auth,email,password);
}else{throw authError}
}

sessionStorage.setItem('ecoleId',ecoleId);
sessionStorage.setItem('role',role);
sessionStorage.setItem('code',password);
sessionStorage.setItem('isAuthenticated','true');
sessionStorage.setItem('loginTime',Date.now().toString());

showToast(`Connexion réussie ! Chargement de l'espace...`,"success");

setTimeout(()=>{
chargerAppEnIframe(role,ecoleId,password);
},800);

}catch(error){
console.error("Erreur:",error);
showToast("Une erreur est survenue. Veuillez contacter le support.","error");
btn.disabled=false;
btn.classList.remove('loading');
}
}

document.getElementById("loginBtn").addEventListener("click",seConnecter);
document.getElementById("loginPassword").addEventListener("keypress",function(e){
if(e.key==="Enter")seConnecter();
});
document.getElementById("loginPassword").addEventListener("input",function(){
if(this.value.length>6)this.value=this.value.slice(0,6);
});
document.getElementById("loginPassword").focus();

updateSchoolLogo(ecoleId);

function setVh(){
let vh=window.innerHeight*0.01;
document.documentElement.style.setProperty('--vh',vh+'px');
}
setVh();
window.addEventListener('resize',setVh);

(function verifierSessionActive(){
var ecoleId=sessionStorage.getItem('ecoleId');
var role=sessionStorage.getItem('role');
var isAuthenticated=sessionStorage.getItem('isAuthenticated');
var code=sessionStorage.getItem('code');
var loginTime=parseInt(sessionStorage.getItem('loginTime')||'0');
var now=Date.now();
var sessionAge=now-loginTime;
var maxAge=30*60*1000;

if(isAuthenticated&&ecoleId&&role&&code&&sessionAge<maxAge){
chargerAppEnIframe(role,ecoleId,code);
}else{
sessionStorage.clear();
}
})();
</script>

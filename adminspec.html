<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Gestion des écoles</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
    body{background:#0b1120;min-height:100vh;padding:20px}
    .container{max-width:900px;margin:0 auto}
    .card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:32px 38px;margin-bottom:20px;box-shadow:0 30px 80px rgba(0,0,0,0.4)}
    .card h1{font-size:26px;font-weight:800;color:#fff;display:flex;align-items:center;gap:12px}
    .card h1 i{color:#EC4899}
    .sub{color:rgba(255,255,255,0.5);font-size:14px;margin-bottom:24px}
    .form-group{margin-bottom:18px}
    .form-group label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;color:rgba(255,255,255,0.4);letter-spacing:0.5px;margin-bottom:5px}
    .form-group input{width:100%;padding:13px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:#fff;font-size:15px;outline:none;transition:0.2s}
    .form-group input:focus{border-color:#EC4899;box-shadow:0 0 0 4px rgba(236,72,153,0.1)}
    .form-group input::placeholder{color:rgba(255,255,255,0.2)}
    .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;transition:0.25s}
    .btn-primary{background:linear-gradient(135deg,#EC4899,#8B5CF6);color:#fff;box-shadow:0 6px 25px rgba(236,72,153,0.25)}
    .btn-primary:hover{transform:scale(1.02);box-shadow:0 10px 35px rgba(236,72,153,0.35)}
    .btn-success{background:linear-gradient(135deg,#10B981,#059669);color:#fff;box-shadow:0 6px 25px rgba(16,185,129,0.2)}
    .btn-success:hover{transform:scale(1.02);box-shadow:0 10px 35px rgba(16,185,129,0.3)}
    .btn-danger{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff}
    .btn-danger:hover{transform:scale(1.02)}
    .btn-outline{background:transparent;border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.6)}
    .btn-outline:hover{background:rgba(255,255,255,0.05)}
    .btn-sm{padding:8px 16px;font-size:13px}
    .btn-block{width:100%;justify-content:center}
    .user-bar{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:20px}
    .user-bar .email{color:rgba(255,255,255,0.5);font-size:14px}
    .user-bar .logout{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);padding:6px 18px;border-radius:30px;font-size:13px;cursor:pointer;transition:0.2s}
    .user-bar .logout:hover{background:rgba(239,68,68,0.15);color:#EF4444;border-color:rgba(239,68,68,0.2)}
    .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid rgba(255,255,255,0.06);margin-top:16px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th{text-align:left;padding:12px 16px;background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.4);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:2px solid rgba(255,255,255,0.06)}
    td{padding:12px 16px;color:rgba(255,255,255,0.8);border-bottom:1px solid rgba(255,255,255,0.04)}
    tr:hover td{background:rgba(255,255,255,0.02)}
    .badge{display:inline-block;padding:3px 12px;border-radius:30px;font-size:11px;font-weight:700}
    .badge-green{background:rgba(16,185,129,0.15);color:#10B981}
    .badge-blue{background:rgba(59,130,246,0.15);color:#3B82F6}
    .empty{text-align:center;padding:30px;color:rgba(255,255,255,0.3);font-size:14px}
    .toast{position:fixed;top:24px;right:24px;background:#1e293b;border-left:4px solid #10B981;padding:14px 22px;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,0.5);color:#fff;font-weight:500;display:flex;align-items:center;gap:12px;z-index:999;animation:slideIn 0.35s ease;border:1px solid rgba(255,255,255,0.05)}
    .toast.error{border-left-color:#EF4444}
    .toast i{font-size:18px}
    @keyframes slideIn{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
    .spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.2);border-radius:50%;border-top-color:#fff;animation:spin 0.7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .login-form{display:block}
    .dashboard{display:none}
    .flex{display:flex;gap:10px;flex-wrap:wrap}
    .mt-12{margin-top:12px}
    .mb-8{margin-bottom:8px}
    .text-muted{color:rgba(255,255,255,0.3);font-size:13px}
  </style>
</head>
<body>

<div class="container">

  <!-- Login -->
  <div id="loginForm" class="card login-form">
    <h1><i class="fas fa-lock"></i> Connexion Admin</h1>
    <p class="sub">Authentifiez-vous pour gérer les écoles</p>
    
    <div class="form-group">
      <label><i class="fas fa-envelope"></i> Email</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com">
    </div>
    <div class="form-group">
      <label><i class="fas fa-lock"></i> Mot de passe</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    
    <button class="btn btn-primary btn-block" id="loginBtn">
      <i class="fas fa-sign-in-alt"></i> SE CONNECTER
    </button>
    
    <div id="loginError" style="color:#EF4444;font-size:14px;margin-top:12px;text-align:center;display:none"></div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="dashboard">
    <div class="card">
      <div class="user-bar">
        <span class="email" id="userEmail">user@email.com</span>
        <button class="logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
      </div>

      <h1><i class="fas fa-school"></i> Gestion des écoles</h1>
      <p class="sub">Collection Firestore : <strong style="color:#EC4899">school</strong></p>

      <!-- Ajouter une école -->
      <div style="background:rgba(255,255,255,0.02);border-radius:16px;padding:20px;margin-bottom:20px;border:1px solid rgba(255,255,255,0.04)">
        <h3 style="color:#fff;font-size:16px;margin-bottom:14px;"><i class="fas fa-plus-circle" style="color:#10B981"></i> Ajouter une école</h3>
        <div class="flex">
          <div class="form-group" style="flex:2;margin-bottom:0">
            <label>Nom de l'école</label>
            <input type="text" id="schoolNameInput" placeholder="Ex: Complexe Saint-Joseph">
          </div>
          <div class="form-group" style="flex:1;margin-bottom:0">
            <label>ID unique (slug)</label>
            <input type="text" id="schoolIdInput" placeholder="saint-joseph">
          </div>
          <div style="display:flex;align-items:flex-end;padding-bottom:2px">
            <button class="btn btn-success" id="addBtn">
              <i class="fas fa-plus"></i> AJOUTER
            </button>
          </div>
        </div>
        <div style="font-size:12px;color:rgba(255,255,255,0.25);margin-top:8px">
          <i class="fas fa-info-circle"></i> L'ID sera utilisé dans l'URL : <code>?school=mon-id</code>
        </div>
      </div>

      <!-- Liste des écoles -->
      <h3 style="color:#fff;font-size:16px;margin-bottom:8px;"><i class="fas fa-list" style="color:#3B82F6"></i> Écoles existantes</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Nom</th>
              <th>ID</th>
              <th>Année scolaire</th>
              <th style="text-align:center;">Élèves</th>
              <th style="text-align:center;">Actions</th>
            </tr>
          </thead>
          <tbody id="schoolsTableBody">
            <tr><td colspan="6" class="empty"><i class="fas fa-spinner fa-spin"></i> Chargement...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="mt-12 text-muted" id="totalSchools">Total : 0 école(s)</div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
  }
}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";
import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, query, orderBy } from "firebase/firestore";

// Configuration Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBma80S0bc9uzSuO38qn7JLSwLrYniV5Fw",
  authDomain: "gesco-2.firebaseapp.com",
  projectId: "gesco-2",
  storageBucket: "gesco-2.firebasestorage.app",
  messagingSenderId: "36319988765",
  appId: "1:36319988765:web:e8cd823804596495248af4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// DOM Elements
const loginForm = document.getElementById('loginForm');
const dashboard = document.getElementById('dashboard');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const logoutBtn = document.getElementById('logoutBtn');
const userEmail = document.getElementById('userEmail');
const schoolNameInput = document.getElementById('schoolNameInput');
const schoolIdInput = document.getElementById('schoolIdInput');
const addBtn = document.getElementById('addBtn');
const schoolsTableBody = document.getElementById('schoolsTableBody');
const totalSchools = document.getElementById('totalSchools');

// Toast
function showToast(message, type = 'success') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  
  const toast = document.createElement('div');
  toast.className = `toast ${type === 'error' ? 'error' : ''}`;
  toast.innerHTML = `
    <i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i>
    <span>${message}</span>
  `;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 4000);
}

// Charger les écoles
async function loadSchools() {
  try {
    const q = query(collection(db, "school"), orderBy("nom"));
    const snapshot = await getDocs(q);
    
    if (snapshot.empty) {
      schoolsTableBody.innerHTML = '<tr><td colspan="6" class="empty"><i class="fas fa-school"></i> Aucune école enregistrée</td></tr>';
      totalSchools.textContent = 'Total : 0 école(s)';
      return;
    }
    
    let html = '';
    let count = 0;
    snapshot.forEach((doc) => {
      count++;
      const data = doc.data();
      const elevesCount = data.eleves ? Object.keys(data.eleves).length : 0;
      html += `
        <tr>
          <td>${count}</td>
          <td><strong style="color:#fff">${data.nom || 'Sans nom'}</strong></td>
          <td><code style="color:rgba(255,255,255,0.5);font-size:12px">${doc.id}</code></td>
          <td>${data.annee_scolaire || '—'}</td>
          <td style="text-align:center;"><span class="badge badge-blue">${elevesCount}</span></td>
          <td style="text-align:center;">
            <button class="btn btn-danger btn-sm" onclick="deleteSchool('${doc.id}')">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
      `;
    });
    
    schoolsTableBody.innerHTML = html;
    totalSchools.textContent = `Total : ${count} école(s)`;
  } catch (error) {
    schoolsTableBody.innerHTML = `<tr><td colspan="6" class="empty">Erreur : ${error.message}</td></tr>`;
  }
}

// Ajouter une école
addBtn.addEventListener('click', async () => {
  const nom = schoolNameInput.value.trim();
  let id = schoolIdInput.value.trim();
  
  if (!nom) {
    showToast('Le nom de l\'école est requis', 'error');
    return;
  }
  
  if (!id) {
    // Générer un ID à partir du nom
    id = nom.toLowerCase()
      .replace(/[^a-z0-9]/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '');
  }
  
  // Vérifier si l'ID existe déjà
  try {
    const docRef = doc(db, "school", id);
    const docSnap = await getDocs(collection(db, "school"));
    let exists = false;
    docSnap.forEach((d) => {
      if (d.id === id) exists = true;
    });
    
    if (exists) {
      showToast(`L'ID "${id}" existe déjà`, 'error');
      return;
    }
    
    // Créer l'école
    await setDoc(docRef, {
      nom: nom,
      id: id,
      annee_scolaire: "2026-2027",
      frais: {
        etat: 5000,
        bulletin: 3000,
        technique: 4000
      },
      eleves: {},
      created_at: new Date().toISOString()
    });
    
    showToast(`✅ École "${nom}" ajoutée avec succès !`);
    schoolNameInput.value = '';
    schoolIdInput.value = '';
    loadSchools();
  } catch (error) {
    showToast(`Erreur : ${error.message}`, 'error');
  }
});

// Supprimer une école (fonction globale pour l'appel inline)
window.deleteSchool = async function(schoolId) {
  if (!confirm(`Supprimer définitivement cette école ?`)) return;
  
  try {
    await deleteDoc(doc(db, "school", schoolId));
    showToast(`✅ École supprimée`);
    loadSchools();
  } catch (error) {
    showToast(`Erreur : ${error.message}`, 'error');
  }
};

// Auth
onAuthStateChanged(auth, (user) => {
  if (user) {
    loginForm.style.display = 'none';
    dashboard.style.display = 'block';
    userEmail.textContent = user.email;
    loginBtn.disabled = false;
    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> SE CONNECTER';
    loadSchools();
  } else {
    loginForm.style.display = 'block';
    dashboard.style.display = 'none';
    loginBtn.disabled = false;
    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> SE CONNECTER';
  }
});

// Connexion
loginBtn.addEventListener('click', async () => {
  const email = loginEmail.value.trim();
  const password = loginPassword.value.trim();
  
  if (!email || !password) {
    loginError.textContent = 'Veuillez remplir tous les champs';
    loginError.style.display = 'block';
    return;
  }
  
  loginBtn.disabled = true;
  loginBtn.innerHTML = '<span class="spinner"></span> Connexion...';
  loginError.style.display = 'none';
  
  try {
    await signInWithEmailAndPassword(auth, email, password);
    showToast('✅ Connexion réussie');
  } catch (error) {
    loginError.textContent = error.code === 'auth/user-not-found' 
      ? 'Utilisateur non trouvé' 
      : error.code === 'auth/wrong-password' 
        ? 'Mot de passe incorrect' 
        : 'Erreur de connexion';
    loginError.style.display = 'block';
    loginBtn.disabled = false;
    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> SE CONNECTER';
  }
});

// Déconnexion
logoutBtn.addEventListener('click', () => {
  signOut(auth);
  showToast('Déconnecté');
});

// Enter key pour connexion
loginPassword.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loginBtn.click();
});
</script>

</body>
</html>

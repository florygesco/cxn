<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:#000;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;height:100%;height:100dvh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.page{display:none;width:100%;height:100%}
.page.active{display:block}
#page-feed{position:relative;width:100%;height:100%;height:100dvh;background:#000}
#feedListe{width:100%;height:100%;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}

.video-card{position:relative;width:100%;height:100%;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;background:#000;overflow:hidden;flex-shrink:0}
.video-frame{position:absolute;inset:0;width:100%;height:100%;background:#000}

.play-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.2);cursor:pointer;z-index:5}
.play-overlay.visible{display:flex}
.play-overlay .play-btn{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;font-size:34px;color:#0f172a;box-shadow:0 8px 32px rgba(0,0,0,.6);transition:transform .15s;padding-left:6px}
.play-overlay:active .play-btn{transform:scale(.9)}
.side-badges{position:absolute;right:12px;bottom:180px;display:flex;flex-direction:column;gap:14px;z-index:4;pointer-events:none}
.side-badge{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;padding:10px 8px;border-radius:16px;background:rgba(15,23,42,.75);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);border:1.5px solid rgba(255,255,255,.15);box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:auto}
.side-badge-icon{font-size:18px;margin-bottom:4px;line-height:1}
.side-badge-icon.views{color:#60A5FA}
.side-badge-icon.rank{color:#fbbf24}
.side-badge-value{font-size:13px;font-weight:900;color:#fff;line-height:1.1;text-align:center;word-break:break-word;max-width:56px}

.church-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.church-name{font-size:15px;font-weight:800;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.9);display:flex;align-items:center;gap:6px;line-height:1.3}
.church-verified{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#3B82F6;color:#fff;font-size:8px;flex-shrink:0;border:1.5px solid #fff;box-shadow:0 2px 6px rgba(59,130,246,.5)}

.progress-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#3B82F6,#60A5FA);box-shadow:0 0 8px rgba(59,130,246,.6);transition:width .1s linear}
.tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(10,14,26,.96);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom)}
.tab-btn{padding:12px 8px 10px;background:transparent;border:none;cursor:pointer;color:#64748b;font-size:10.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit;transition:color .15s;position:relative}

.info-panel-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.08)}
.info-panel-avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#2563EB,#1D4ED8);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;flex-shrink:0;border:2px solid rgba(255,255,255,.3);overflow:hidden}
.info-panel-avatar img{width:100%;height:100%;object-fit:cover}
.info-panel-meta{flex:1;min-width:0}
.info-panel-name{font-size:16px;font-weight:900;color:#fff;display:flex;align-items:center;gap:6px;line-height:1.3}
.info-panel-city{font-size:12.5px;color:#94a3b8;margin-top:4px;display:flex;align-items:center;gap:5px}
.info-panel-city i{color:#ef4444;font-size:11px}
.info-panel-desc{font-size:14.5px;line-height:1.6;color:#e2e8f0;white-space:pre-wrap;word-wrap:break-word;padding-bottom:10px}
.info-panel-actions{display:flex;gap:10px;margin-top:16px}
.info-action-btn{flex:1;padding:13px;border-radius:12px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.35);color:#60A5FA;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .15s}

.toast{position:fixed;top:80px;left:50%;transform:translate(-50%,-180%);background:#1e293b;color:#fff;padding:14px 22px;border-radius:14px;font-size:13.5px;font-weight:700;z-index:900;transition:transform .3s ease;max-width:85vw;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1)}
.toast.show{transform:translate(-50%,0)}
.btn{padding:14px 20px;border-radius:14px;border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s;width:100%}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-blue{background:linear-gradient(135deg,#2563EB,#1D4ED8);color:#fff;box-shadow:0 4px 20px rgba(37,99,235,.4)}
.btn-green{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 20px rgba(16,185,129,.4)}
.input{width:100%;padding:15px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);color:#f1f5f9;font-size:16px;font-family:inherit;outline:none;transition:border-color .15s,background .15s}
.input:focus{border-color:#3B82F6;background:rgba(255,255,255,.1)}
.input::placeholder{color:#64748b}
.auth-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto;background:radial-gradient(circle at 50% 0%,rgba(37,99,235,.15) 0%,transparent 60%),#0a0e1a}
.auth-logo{font-size:42px;font-weight:900;text-align:center;margin:0 0 8px;letter-spacing:-2px;color:#fff;text-shadow:0 4px 20px rgba(37,99,235,.4)}
.auth-logo span{background:linear-gradient(135deg,#3B82F6,#60A5FA);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.empty-feed{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;gap:16px;padding:24px;text-align:center;background:#000}
.empty-feed-icon{font-size:64px;opacity:.4}
.empty-feed-title{color:#f1f5f9;font-size:17px;font-weight:800;margin:0}
.empty-feed-sub{color:#64748b;font-size:13.5px;margin:0;font-weight:600;max-width:280px;line-height:1.5}
</style>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, updateDoc, getDoc, doc, query, orderBy, onSnapshot, where, limit, increment } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig={
apiKey:"AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
authDomain:"netubexmoney.firebaseapp.com",
projectId:"netubexmoney",
storageBucket:"netubexmoney.firebasestorage.app",
messagingSenderId:"856592608176",
appId:"1:856592608176:web:69f9df9cfd4f8c28630475"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let unsubFeed=null;
let videoObserver=null;
let currentPhase='concours';
let currentMonth='';
let userEglise=null;
let userRank=null;

function toast(msg){
var t=document.getElementById('toast');
t.textContent=msg;
t.classList.add('show');
clearTimeout(window._toastTimer);
window._toastTimer=setTimeout(function(){t.classList.remove('show');},3000);
}

function esc(s){if(!s)return'';return String(s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}

function getMonthKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}

function getDateStr(ts){
if(!ts)return'Récemment';
var d=ts.seconds?new Date(ts.seconds*1000):new Date(ts);
var diff=Date.now()-d.getTime();
var m=Math.floor(diff/60000);
var h=Math.floor(m/60);
var j=Math.floor(h/24);
if(m<1)return'À l\'instant';
if(m<60)return'Il y a '+m+' min';
if(h<24)return'Il y a '+h+'h';
if(j<7)return'Il y a '+j+'j';
return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
}

function showPage(name){
document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
var el=document.getElementById('page-'+name);
if(el)el.classList.add('active');
}

function traduireErreur(code){
var map={
'auth/invalid-email':'Email invalide',
'auth/user-not-found':'Aucun compte avec cet email',
'auth/wrong-password':'Mot de passe incorrect',
'auth/invalid-credential':'Email ou mot de passe incorrect',
'auth/too-many-requests':'Trop de tentatives',
'auth/network-request-failed':'Erreur réseau'
};
return map[code]||'Erreur : '+code;
}

window.handleLogin=async function(){
var email=document.getElementById('authEmail').value.trim();
var pwd=document.getElementById('authPassword').value;
var errBox=document.getElementById('authError');
errBox.style.display='none';
if(!email||!pwd){toast('Remplissez tous les champs');return;}
var btn=document.getElementById('btnLogin');
btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Connexion…';
try{await signInWithEmailAndPassword(auth,email,pwd);}
catch(e){errBox.textContent=traduireErreur(e.code||e.message);errBox.style.display='block';}
finally{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-arrow-right-to-bracket"></i> Se connecter';}
};

try{
if(window.parent&&window.parent!==window){
window.parent.postMessage({type:'OPEN_PROFIL'},'*');
}else{
toast('Profil NeTubeX RDC');
}
}catch(e){toast('Profil NeTubeX RDC');}
};

window.ouvrirTabsParent=function(){
try{
if(window.parent&&window.parent!==window){
window.parent.postMessage({type:'OPEN_TABS'},'*');
}else{
toast('Menu NeTubeX RDC');
}
}catch(e){toast('Menu NeTubeX RDC');}
};

async function chargerEglise(uid){
try{
var snap=await getDoc(doc(db,'eglises',uid));
if(snap.exists())return snap.data();
return null;
}catch(e){return null;}
}

async function chargerPhase(){
try{
var snap=await getDoc(doc(db,'config','etat_mois'));
if(snap.exists())return snap.data();
return null;
}catch(e){return null;}
}

async function chargerMonRang(uid){
if(!userEglise||!userEglise.actif)return null;
try{
var q=query(collection(db,'videos'),where('egliseMois','==',currentMonth));
var snap=await new Promise(function(resolve,reject){
var unsub=onSnapshot(q,function(s){unsub();resolve(s);},function(e){unsub();reject(e);});
});
var parEglise={};
snap.forEach(function(d){
var data=d.data();
if(!data.egliseId)return;
if(!parEglise[data.egliseId])parEglise[data.egliseId]=0;
parEglise[data.egliseId]+=(data.validViews||0);
});
var arr=Object.keys(parEglise).map(function(id){return{id:id,vues:parEglise[id]};});
arr.sort(function(a,b){return b.vues-a.vues;});
var idx=arr.findIndex(function(e){return e.id===uid;});
if(idx===-1)return null;
return{rang:idx+1,total:arr.length,vues:arr[idx].vues};
}catch(e){return null;}
}

var _compteursVues={};

function demarrerCompteurVue(video,videoId){
if(!videoId)return;
if(currentPhase!=='concours')return;
if(dejaVuLocalement(videoId))return;
if(_compteursVues[videoId])return;
_compteursVues[videoId]=setTimeout(async function(){
try{
if(video&&!video.paused&&video.currentTime>4.5){
await updateDoc(doc(db,'videos',videoId),{validViews:increment(1)});
marquerVuLocalement(videoId);
}
}catch(e){}
delete _compteursVues[videoId];
},5000);
}

function arreterCompteurVue(videoId){
if(_compteursVues[videoId]){clearTimeout(_compteursVues[videoId]);delete _compteursVues[videoId];}
}

function dejaVuLocalement(videoId){
try{
var vues=JSON.parse(localStorage.getItem('ntx_vues')||'{}');
return vues[videoId]===new Date().toISOString().slice(0,10);
}catch(e){return false;}
}

function marquerVuLocalement(videoId){
try{
var vues=JSON.parse(localStorage.getItem('ntx_vues')||'{}');
vues[videoId]=new Date().toISOString().slice(0,10);
if(Object.keys(vues).length>300){
var keys=Object.keys(vues).slice(-200);
var n={};
keys.forEach(function(k){n[k]=vues[k];});
vues=n;
}
localStorage.setItem('ntx_vues',JSON.stringify(vues));
}catch(e){}
}

var initials=churchName.slice(0,2).toUpperCase();
var isEglise=!!v.egliseId;
var dateStr=getDateStr(v.createdAt);
var viewsCount=v.validViews||0;
var avatarHtml=churchAvatar?'<img src="'+esc(churchAvatar)+'">':esc(initials);
var verifiedBadge=isEglise?'<span class="church-verified"><i class="fa-solid fa-check"></i></span>':'';
var rankHtml='';
if(isEglise&&userRank&&userRank.total>0){
rankHtml='<div class="side-badge"><div class="side-badge-icon rank"><i class="fa-solid fa-trophy"></i></div><div class="side-badge-value">#'+userRank.rang+'</div><div class="side-badge-label">rang</div></div>';
}else if(isEglise){
rankHtml='<div class="side-badge"><div class="side-badge-icon rank"><i class="fa-solid fa-trophy"></i></div><div class="side-badge-value">—</div><div class="side-badge-label">rang</div></div>';
}

return'<div class="video-card" data-vid="'+v.id+'">'+
'<div class="video-frame">'+
'<video src="'+esc(v.videoUrl)+'"'+posterAttr+' loop muted playsinline webkit-playsinline preload="metadata" data-vid="'+v.id+'"></video>'+
'<div class="play-overlay" data-overlay="'+v.id+'" onclick="demarrerLecture(this)"><div class="play-btn">▶</div></div>'+
'</div>'+
'<div class="side-badges">'+
'<div class="side-badge"><div class="side-badge-icon views"><i class="fa-solid fa-eye"></i></div><div class="side-badge-value" data-views="'+v.id+'">'+viewsCount+'</div><div class="side-badge-label">vues</div></div>'+
rankHtml+
'</div>'+
'<div class="video-bottom">'+
'<div class="church-info">'+
'<div class="church-avatar">'+avatarHtml+'</div>'+
'<div>'+
'<div class="church-name">'+esc(churchName)+verifiedBadge+'</div>'+
'<div class="church-date">'+dateStr+'</div>'+
'</div>'+
'</div>'+
'</div>'+
'<div class="progress-bar-wrapper"><div class="progress-bar-fill" data-progress="'+v.id+'"></div></div>'+
'<div class="info-panel" data-panel="'+v.id+'">'+
'<div class="info-panel-handle"></div>'+
'<div class="info-panel-header">'+
'<div class="info-panel-avatar">'+avatarHtml+'</div>'+
'<div class="info-panel-meta">'+
'<div class="info-panel-name">'+esc(churchName)+verifiedBadge+'</div>'+
(v.churchVille?'<div class="info-panel-city"><i class="fa-solid fa-location-dot"></i> '+esc(v.churchVille)+'</div>':'')+
'</div>'+
'</div>'+
(v.description?'<div class="info-panel-desc">'+esc(v.description)+'</div>':'')+
'<div class="info-panel-actions">'+
'<button class="info-action-btn" onclick="event.stopPropagation();partagerVideo(\''+esc(v.videoUrl)+'\',\''+esc(churchName)+'\')"><i class="fa-solid fa-share-nodes"></i> Partager</button>'+
'</div>'+
'</div>'+
'</div>';
}

window.demarrerLecture=function(overlay){
var vid=overlay.getAttribute('data-overlay');
var video=document.querySelector('video[data-vid="'+vid+'"]');
if(!video)return;
overlay.classList.remove('visible');
video.muted=false;
video.play().catch(function(){video.muted=true;video.play().catch(function(){overlay.classList.add('visible');});});
};

window.partagerVideo=function(url,name){
var msg='Regardez la vidéo de '+name+' sur NeTubeX :\n'+url;
if(navigator.share){navigator.share({title:name,text:msg}).catch(function(){});}
else{window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');}
};

function toggleInfoPanel(videoId){
var panel=document.querySelector('[data-panel="'+videoId+'"]');
if(!panel)return;
var isVisible=panel.classList.contains('visible');
document.querySelectorAll('.info-panel').forEach(function(p){p.classList.remove('visible');});
if(!isVisible)panel.classList.add('visible');
}

function attachVideoControls(video,videoId){
var lastTap=0;
var tapTimer=null;

video.addEventListener('click',function(e){
var now=Date.now();
if(now-lastTap<300){
clearTimeout(tapTimer);
toggleInfoPanel(videoId);
lastTap=0;
}else{
lastTap=now;
tapTimer=setTimeout(function(){
if(lastTap===now){
if(video.paused){video.muted=false;video.play().catch(function(){});}
else{video.pause();}
}
},300);
}
});

video.addEventListener('timeupdate',function(){
var progress=document.querySelector('[data-progress="'+videoId+'"]');
if(progress&&video.duration){
progress.style.width=((video.currentTime/video.duration)*100)+'%';
}
});

video.addEventListener('play',function(){demarrerCompteurVue(video,videoId);});
video.addEventListener('pause',function(){arreterCompteurVue(videoId);});
video.addEventListener('ended',function(){arreterCompteurVue(videoId);});
}

function attachPauseObserver(){
if(videoObserver)videoObserver.disconnect();
if(!('IntersectionObserver' in window))return;
videoObserver=new IntersectionObserver(function(entries){
entries.forEach(function(e){
var video=e.target;
var vid=video.getAttribute('data-vid');
var overlay=document.querySelector('.play-overlay[data-overlay="'+vid+'"]');
if(e.isIntersecting){
video.muted=true;
var p=video.play();
if(p&&p.then){
p.then(function(){if(overlay)overlay.classList.remove('visible');}).catch(function(){if(overlay)overlay.classList.add('visible');});
}
demarrerCompteurVue(video,vid);
}else{
if(!video.paused)video.pause();
arreterCompteurVue(vid);
var panel=document.querySelector('[data-panel="'+vid+'"]');
if(panel)panel.classList.remove('visible');
}
});
},{threshold:0.6});

document.querySelectorAll('.video-card').forEach(function(card){
var video=card.querySelector('video');
if(!video)return;
videoObserver.observe(video);
var vid=video.getAttribute('data-vid');
if(vid)attachVideoControls(video,vid);
});
}

async function startFeed(){
var el=document.getElementById('feedListe');
el.innerHTML='<div class="empty-feed"><i class="fa-solid fa-spinner fa-spin" style="font-size:32px"></i><div style="font-size:14px;font-weight:700">Chargement…</div></div>';
if(unsubFeed){unsubFeed();unsubFeed=null;}

if(userEglise&&userEglise.actif){
userRank=await chargerMonRang(currentUser.uid);
}

var q=query(collection(db,'videos'),orderBy('createdAt','desc'),limit(50));
unsubFeed=onSnapshot(q,function(snap){
var list=[];
snap.forEach(function(d){list.push(Object.assign({id:d.id},d.data()));});

if(currentPhase==='publication'){
list=list.filter(function(v){return v.ownerUid===currentUser.uid;});
}

if(list.length===0){
var msg=currentPhase==='publication'?'Aucune vidéo publiée ce mois':'Aucune vidéo pour le moment';
var sub=currentPhase==='publication'?'Publiez votre vidéo du mois depuis votre profil NeTubeX RDC':'Revenez bientôt';
el.innerHTML='<div class="empty-feed"><div class="empty-feed-icon">🎬</div><h3 class="empty-feed-title">'+esc(msg)+'</h3><p class="empty-feed-sub">'+esc(sub)+'</p></div>';
return;
}

el.innerHTML=list.map(function(v){return renderVideo(v);}).join('');
attachPauseObserver();
},function(err){
el.innerHTML='<div class="empty-feed"><i class="fa-solid fa-circle-exclamation" style="font-size:40px;color:#ef4444"></i><div style="font-size:14px;font-weight:700;color:#ef4444">Erreur de chargement</div></div>';
});
}

window.addEventListener('message',function(event){
if(!event.data||typeof event.data!=='object')return;
if(event.data.type==='PHASE_CHANGED'){
currentPhase=event.data.phase||'concours';
startFeed();
}
if(event.data.type==='REFRESH_FEED'){
startFeed();
}
});

onAuthStateChanged(auth,async function(user){
currentUser=user;
if(user){
currentMonth=getMonthKey();
var phase=await chargerPhase();
currentPhase=phase&&phase.phase?phase.phase:'concours';
userEglise=await chargerEglise(user.uid);
document.getElementById('page-auth').classList.remove('active');
document.getElementById('tabBar').style.display='grid';
showPage('feed');
startFeed();
}else{
document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
document.getElementById('page-auth').classList.add('active');
document.getElementById('tabBar').style.display='none';
if(unsubFeed){unsubFeed();unsubFeed=null;}
}
});
</script>

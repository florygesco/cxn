<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Seed - 5 publications en attente</title>
<style>
body{font-family:system-ui;background:#0f172a;color:#fff;padding:24px;max-width:800px;margin:0 auto;}
h1{font-size:22px;margin-bottom:8px;}
p{color:#94a3b8;font-size:13px;margin-bottom:20px;}
button{padding:14px 28px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(59,130,246,.35);}
button:disabled{opacity:.5;cursor:not-allowed;}
button:hover:not(:disabled){transform:translateY(-1px);}
pre{margin-top:20px;padding:16px;background:#1e293b;border:1px solid #334155;border-radius:12px;white-space:pre-wrap;font-size:12.5px;line-height:1.6;max-height:500px;overflow-y:auto;}
.ok{color:#10b981;}
.err{color:#ef4444;}
.warn{color:#f59e0b;}
</style>
</head>
<body>
<h1>📢 Créer 5 publications en attente</h1>
<p>Ce script va créer 5 publications avec <strong>statut = "en_attente"</strong>. Vous pourrez ensuite les approuver une à une depuis l'admin.</p>
<button id="btn">🚀 Lancer la création</button>
<pre id="log"></pre>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
  authDomain: "netubexmoney.firebaseapp.com",
  projectId: "netubexmoney",
  storageBucket: "netubexmoney.firebasestorage.app",
  messagingSenderId: "856592608176",
  appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const PUBLICATIONS_A_CREER = [
  {
    type: "Supermarché",
    categorie: "Alimentation",
    titre: "Riz Parfumé Super Lion 25kg",
    prix: 75000,
    prixLabel: "/ sac",
    desc: "Riz parfumé de qualité supérieure, sac de 25kg. Livraison possible.",
    img: "https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=1400&q=80"
  },
  {
    type: "Restaurant",
    categorie: "Plats",
    titre: "Poulet Moambé + Riz",
    prix: 25000,
    prixLabel: "/ plat",
    desc: "Poulet moambé traditionnel accompagné de riz parfumé. Cuisine congolaise authentique.",
    img: "https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&w=1400&q=80"
  },
  {
    type: "Pharmacie",
    categorie: "Médicaments",
    titre: "Paracétamol 500mg (Boîte 20)",
    prix: 3500,
    prixLabel: "/ boîte",
    desc: "Paracétamol 500mg, boîte de 20 comprimés. Médicament certifié.",
    img: "https://images.unsplash.com/photo-1587854692152-cbe660dbde88?auto=format&fit=crop&w=1400&q=80"
  },
  {
    type: "Mode, Vêtements & Beauté",
    categorie: "Vêtements",
    titre: "Robe Wax Élégante",
    prix: 45000,
    prixLabel: "/ pièce",
    desc: "Robe en tissu wax de haute qualité, coupe élégante. Tailles disponibles S à XL.",
    img: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=1400&q=80"
  },
  {
    type: "Électronique",
    categorie: "Smartphones",
    titre: "iPhone 15 Pro 256GB",
    prix: 1450000,
    prixLabel: "/ pièce",
    desc: "iPhone 15 Pro 256GB, neuf scellé avec garantie. Toutes couleurs disponibles.",
    img: "https://images.unsplash.com/photo-1592750475338-74b7b21085ab?auto=format&fit=crop&w=1400&q=80"
  }
];

const logEl = document.getElementById('log');
const btn = document.getElementById('btn');

function log(msg, cls){
  const time = new Date().toLocaleTimeString('fr-FR');
  logEl.innerHTML += `<span class="${cls||''}">[${time}] ${msg}</span>\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

btn.onclick = async ()=>{
  btn.disabled = true;
  logEl.textContent = '';
  log('🚀 Démarrage du seed...\n');

  try{
    // 1) Récupérer les commerces existants
    log('📋 Chargement des commerces...');
    const commSnap = await getDocs(collection(db,'commerces'));
    const commerces = [];
    commSnap.forEach(d=>{
      const data = d.data();
      if(data.statut === 'approuve'){
        commerces.push({ id: d.id, nom: data.nom, type: data.type });
      }
    });

    if(commerces.length === 0){
      log('❌ Aucun commerce approuvé trouvé.', 'err');
      log('   → Allez dans Admin → Boutiques → Approuvez au moins 1 boutique.', 'warn');
      btn.disabled = false;
      return;
    }

    log(`✅ ${commerces.length} commerce(s) trouvé(s) :`);
    commerces.forEach(c=>log(`   • ${c.nom} (${c.type})`));
    log('');

    // 2) Créer les 5 publications en attente
    log('📢 Création des 5 publications en attente...\n');
    let cree = 0;

    for(let i = 0; i < PUBLICATIONS_A_CREER.length; i++){
      const p = PUBLICATIONS_A_CREER[i];
      
      // Choisir un commerce compatible ou le premier
      let commerceChoisi = commerces.find(c => 
        c.type && c.type.toLowerCase().includes(p.type.toLowerCase().split(',')[0])
      ) || commerces[i % commerces.length];

      const pubId = 'PUB-SEED-' + Date.now() + '-' + i;
      
      await setDoc(doc(db,'publications',pubId),{
        commerce: commerceChoisi.nom,
        uidCommerce: null,
        type: p.type,
        categorie: p.categorie,
        titre: p.titre,
        prix: p.prix,
        prixLabel: p.prixLabel,
        desc: p.desc,
        img: p.img,
        statut: 'en_attente',                    // ✅ EN ATTENTE
        dateCreation: new Date().toISOString(),
        publieParAdmin: true,
        seedTest: true                            // Marqueur pour identifier
      });

      cree++;
      log(`✅ [${cree}/5] "${p.titre}" → ${commerceChoisi.nom} (${p.prix.toLocaleString('fr-FR')} FC ${p.prixLabel})`);
    }

    log('');
    log(`🎉 Succès : ${cree} publications créées en attente`, 'ok');
    log('');
    log('➡️ Étapes suivantes :');
    log('   1. Ouvrez le panneau Admin');
    log('   2. Allez dans l\'onglet "Publications"');
    log('   3. Vous verrez les 5 publications');
    log('   4. Cliquez ✅ pour approuver une par une');
    log('');
    log('💡 Chaque approbation ajoutera le produit au catalogue du commerce correspondant.', 'warn');

  }catch(e){
    log('❌ Erreur : ' + e.message, 'err');
    console.error(e);
  }finally{
    btn.disabled = false;
  }
};
</script>
</body>
</html>

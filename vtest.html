<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e1a">
<title>GESTION DE SCOLARITÉ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
html,body{height:100%;background:#0a0e1a;font-family:'Inter',sans-serif;overflow-x:hidden;}
body{overscroll-behavior:none;}
.container{max-width:1400px;margin:0 auto;padding:20px;}
.card{background:rgba(18,18,31,0.9);backdrop-filter:blur(10px);border-radius:20px;margin-bottom:20px;overflow:hidden;border:1px solid rgba(59,130,246,0.2);}
.card-header{padding:14px 20px;background:linear-gradient(135deg,#0f2b44,#071a2c);color:#fff;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
.card-header .header-left{display:flex;align-items:center;gap:12px;}
.school-header{background:linear-gradient(135deg,#0f2b44,#071a2c);border-radius:20px;padding:20px;text-align:center;margin-bottom:20px;transition:all 0.35s ease;}
.school-name{font-size:22px;font-weight:700;background:linear-gradient(135deg,#fff,#94a3b8);-webkit-background-clip:text;background-clip:text;color:transparent;transition:all 0.35s ease;}
.school-sub{font-size:11px;opacity:0.8;margin-top:4px;color:#cbd5e1;transition:all 0.35s ease;}
.tabs-container{overflow-x:auto;margin-bottom:20px;white-space:nowrap;-webkit-overflow-scrolling:touch;}
.tabs{display:inline-flex;gap:6px;}
.tab{background:transparent;border:1px solid #334155;padding:9px 20px;border-radius:40px;font-size:13px;cursor:pointer;color:#cbd5e1;transition:all 0.2s;}
.tab:hover{background:rgba(59,130,246,0.2);border-color:#3b82f6;}
.tab.active{background:#1e3a5f;color:#fff;border-color:transparent;}
.tab-content{display:none;animation:fadeIn 0.25s;}
.tab-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.form-grid{display:grid;grid-template-columns:1fr;gap:14px;padding:20px;}
@media(min-width:768px){.form-grid{grid-template-columns:repeat(3,1fr)}}
.form-field{display:flex;flex-direction:column;gap:6px;}
.form-field label{font-size:11px;font-weight:600;color:#cbd5e1;}
.form-field input,.form-field select{background:#2d3748;border:1px solid #334155;border-radius:12px;padding:10px 14px;color:#fff;}
.form-field input:focus,.form-field select:focus{outline:none;border-color:#3b82f6;}
.btn{background:#1e3a5f;color:#fff;border:none;padding:10px 20px;border-radius:40px;font-weight:500;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:8px;transition:all 0.2s;}
.btn:hover{opacity:0.9;transform:scale(0.98);}
.btn-sm{padding:6px 14px;font-size:12px;}
.btn-outline{background:transparent;border:1.5px solid #3b82f6;color:#3b82f6;}
.btn-outline:hover{background:#3b82f6;color:#fff;}
.btn-danger{background:#7f1d1d;}
.btn-danger:hover{background:#991b1b;}
.btn-success{background:#14532d;}
.btn-success:hover{background:#166534;}
.btn-primary{background:#1e3a5f;}
.btn-primary:hover{background:#0f2b44;}
.btn-secondary{background:#334155;}
.btn-secondary:hover{background:#475569;}
.table-wrapper{overflow-x:auto;touch-action:pan-x pan-y;}
.student-table{width:100%;border-collapse:collapse;font-size:12px;min-width:900px;}
.student-table th{background:#0f172a;padding:12px 6px;border-bottom:2px solid #334155;font-size:11px;color:#fff;white-space:nowrap;}
.student-table td{border-bottom:1px solid #334155;padding:8px 4px;color:#e2e8f0;text-align:center;}
.student-table input{width:55px;padding:6px;border-radius:8px;background:#2d3748;border:1px solid #334155;color:#fff;text-align:center;font-size:13px;font-weight:600;caret-color:#60a5fa;cursor:text;}
.student-table input:focus{outline:none;border-color:#60a5fa;background:#1e293b;box-shadow:0 0 0 2px rgba(96,165,250,0.35);}
.student-table input.note-insuffisant{color:#ef4444;}
.student-table input.note-moyen{color:#f59e0b;}
.student-table input.note-bien,.student-table input.note-excellent{color:#22c55e;}
.footer-note{text-align:center;padding:12px;font-size:11px;color:#4a5568;}
.fiche-selector{background:rgba(18,18,31,0.9);margin:0;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid rgba(59,130,246,0.2);transition:all 0.35s ease;}
.fiche-selector label{color:#fff;font-size:12px;}
.fiche-selector select{flex:1;min-width:180px;padding:8px 12px;border-radius:14px;background:#2d3748;border:1px solid #334155;color:#fff;}
.modal-fullscreen{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(20px);z-index:20000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:all 0.2s;}
.modal-fullscreen.show{visibility:visible;opacity:1;}
.modal-content{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:32px;width:90%;max-width:95vw;padding:24px;border:1px solid rgba(59,130,246,0.3);max-height:90vh;overflow-y:auto;}
.toast-container{position:fixed;top:20px;right:20px;z-index:30000;display:flex;flex-direction:column;gap:12px;pointer-events:none;}
.toast-notification{background:rgba(18,25,45,0.95);backdrop-filter:blur(12px);border-radius:16px;padding:18px 24px;min-width:340px;max-width:380px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,0.3);border-left:4px solid #10b981;transform:translateX(400px);transition:transform 0.3s ease;pointer-events:auto;}
.toast-notification.show{transform:translateX(0);}
.toast-notification.error{border-left-color:#ef4444;}
.toast-notification.warning{border-left-color:#f59e0b;}
.toast-icon{font-size:18px;}
.toast-content{flex:1;}
.toast-title{font-weight:700;font-size:16px;color:#fff;margin-bottom:4px;}
.toast-message{font-size:14px;color:#cbd5e1;line-height:1.4;}
.empty-state{text-align:center;padding:40px;color:#94a3b8;}
.eleve-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.eleve-row input{flex:2;padding:8px;border-radius:12px;background:#2d3748;border:1px solid #334155;color:#fff;}
.eleve-row select{padding:8px;border-radius:12px;background:#2d3748;border:1px solid #334155;color:#fff;}
.eleve-importe{color:#10b981;font-size:11px;font-weight:600;background:rgba(16,185,129,0.15);padding:2px 10px;border-radius:30px;}
.eleve-importe-lock{color:#64748b;font-size:14px;cursor:default;margin-left:4px;}
.epreuve-box{background:rgba(45,55,72,0.6);border-radius:16px;padding:12px;margin-bottom:12px;}
.epreuve-list{display:flex;flex-wrap:wrap;gap:8px;}
.epreuve-item{display:flex;align-items:center;gap:8px;background:#2d3748;padding:6px 12px;border-radius:40px;}
.epreuve-item input{background:#1e293b;border:1px solid #334155;color:#fff;padding:4px 8px;border-radius:20px;}
.prof-config{background:rgba(45,55,72,0.4);border-radius:16px;padding:16px;margin:16px 20px;border:1px solid #334155;}
.prof-config h3{font-size:13px;margin-bottom:12px;color:#fff;}
.prof-config .note-max-row{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:15px;}
.prof-config .note-max-row label{color:#cbd5e1;font-size:12px;}
.prof-config .note-max-row input{width:100px;padding:8px;border-radius:12px;background:#2d3748;color:#fff;border:1px solid #334155;}
.prof-config .btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}
.prof-desactiver-msg{background:rgba(239,68,68,0.15);border:2px solid #ef4444;border-radius:20px;padding:30px;text-align:center;max-width:500px;margin:40px auto;}
.prof-desactiver-msg .icon{font-size:64px;margin-bottom:16px;}
.prof-desactiver-msg h2{color:#ef4444;font-size:22px;margin-bottom:12px;}
.prof-desactiver-msg p{color:#cbd5e1;font-size:14px;line-height:1.8;}
.floating-actions{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:15000;display:flex;flex-direction:column;gap:12px;pointer-events:none;}
.floating-btn{width:52px;height:52px;border-radius:50%;border:1px solid rgba(96,165,250,0.3);background:linear-gradient(135deg,rgba(30,41,59,0.95),rgba(15,23,42,0.95));backdrop-filter:blur(12px);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -8px rgba(0,0,0,0.6);transition:all 0.25s;pointer-events:auto;font-family:'Inter',sans-serif;}
.floating-btn:hover{transform:scale(1.08);box-shadow:0 12px 32px -8px rgba(59,130,246,0.5);}
.floating-btn:active{transform:scale(0.95);}
.floating-btn.logout{background:linear-gradient(135deg,rgba(127,29,29,0.95),rgba(80,15,15,0.95));border-color:rgba(239,68,68,0.4);}
.floating-btn.logout:hover{box-shadow:0 12px 32px -8px rgba(239,68,68,0.5);}
@media(max-width:480px){.floating-actions{right:10px;gap:10px;}.floating-btn{width:46px;height:46px;font-size:19px;}}
.resume-band{background:linear-gradient(135deg,rgba(30,58,95,0.7),rgba(15,43,68,0.7));border-radius:16px;padding:14px 20px;margin-bottom:16px;display:flex;justify-content:space-around;align-items:center;flex-wrap:wrap;gap:12px;border:1px solid rgba(96,165,250,0.25);transition:all 0.35s ease;}
.resume-item{text-align:center;flex:1;min-width:80px;}
.resume-value{font-size:20px;font-weight:800;color:#60a5fa;letter-spacing:-0.5px;transition:all 0.35s ease;}
.resume-label{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-top:2px;font-weight:600;}
.accordion-header{background:linear-gradient(135deg,#0f2b44,#071a2c);border-radius:16px;padding:14px 20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border:1px solid rgba(59,130,246,0.2);transition:all 0.25s;}
.accordion-header:hover{border-color:#3b82f6;background:linear-gradient(135deg,#1e3a5f,#0f2b44);}
.accordion-title{color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;}
.accordion-icon{color:#60a5fa;font-size:18px;transition:transform 0.3s;}
.accordion-header.open .accordion-icon{transform:rotate(180deg);}
.accordion-body{max-height:0;overflow:hidden;transition:max-height 0.35s ease;background:rgba(18,25,45,0.6);border-radius:16px;border:1px solid rgba(59,130,246,0.15);}
.accordion-body.open{max-height:900px;}
.login-overlay-mix{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 15% 20%,rgba(245,158,11,0.15) 0%,transparent 40%),radial-gradient(circle at 85% 80%,rgba(16,185,129,0.15) 0%,transparent 40%),radial-gradient(circle at 50% 50%,#1e3a5f 0%,#0a0e1a 60%,#000 100%);overflow:hidden;padding:12px;}
.login-overlay-mix::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background-image:radial-gradient(2px 2px at 20px 30px,rgba(255,255,255,0.25),transparent),radial-gradient(2px 2px at 40px 70px,rgba(245,158,11,0.3),transparent),radial-gradient(1px 1px at 90px 40px,rgba(16,185,129,0.35),transparent),radial-gradient(1px 1px at 130px 80px,rgba(255,255,255,0.2),transparent),radial-gradient(2px 2px at 160px 120px,rgba(52,211,153,0.25),transparent),radial-gradient(2px 2px at 200px 180px,rgba(251,191,36,0.25),transparent);background-size:250px 250px;background-repeat:repeat;opacity:0.6;pointer-events:none;animation:starTwinkle 6s ease-in-out infinite;}
@keyframes starTwinkle{0%,100%{opacity:0.4;}50%{opacity:0.8;}}
.login-card-mix{background:rgba(18,18,31,0.95);backdrop-filter:blur(20px);border-radius:24px;padding:22px 18px;width:100%;max-width:290px;aspect-ratio:1 / 1.15;text-align:center;position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;animation:loginFadeIn 0.6s cubic-bezier(0.2,0.9,0.4,1);border:2px solid transparent;background-clip:padding-box;box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 100px rgba(59,130,246,0.12);margin:0 auto;}
.login-card-mix::before{content:'';position:absolute;inset:-2px;border-radius:26px;padding:2px;background:linear-gradient(135deg,#f59e0b 0%,#d97706 25%,#3b82f6 50%,#10b981 75%,#34d399 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:-1;}
@keyframes loginFadeIn{from{opacity:0;transform:translateY(20px) scale(0.95);}to{opacity:1;transform:translateY(0) scale(1);}}
.login-logo-mix{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#f59e0b 0%,#d97706 30%,#059669 70%,#34d399 100%);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;border:2px solid rgba(255,255,255,0.15);box-shadow:0 6px 20px rgba(245,158,11,0.3),0 6px 20px rgba(16,185,129,0.2);animation:pulseLogoMix 2.5s ease-in-out infinite;position:relative;}
.login-logo-mix::after{content:'';position:absolute;inset:-4px;border-radius:18px;background:linear-gradient(135deg,#f59e0b,#34d399);opacity:0.15;filter:blur(10px);z-index:-1;}
@keyframes pulseLogoMix{0%,100%{box-shadow:0 6px 20px rgba(245,158,11,0.3),0 6px 20px rgba(16,185,129,0.2);}50%{box-shadow:0 6px 26px rgba(245,158,11,0.5),0 6px 26px rgba(16,185,129,0.4);}}
.login-logo-mix svg{width:28px;height:28px;}
.login-school-mix{font-size:13px;font-weight:800;color:#fff;margin-bottom:2px;letter-spacing:0.3px;background:linear-gradient(90deg,#fbbf24 0%,#fff 50%,#34d399 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.login-school-sub-mix{font-size:8px;color:#94a3b8;margin-bottom:12px;letter-spacing:1px;text-transform:uppercase;}
.login-divider-mix{width:44px;height:2px;background:linear-gradient(90deg,transparent,#f59e0b 30%,#10b981 70%,transparent);margin:0 auto 12px;border-radius:3px;}
.login-title-mix{font-size:11px;font-weight:700;color:#fff;margin-bottom:2px;letter-spacing:1.5px;text-transform:uppercase;background:linear-gradient(90deg,#fbbf24,#34d399);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.login-subtitle-mix{font-size:8px;color:#64748b;margin-bottom:10px;letter-spacing:1px;text-transform:uppercase;font-weight:600;}
.login-badges-mix{display:flex;justify-content:center;gap:6px;margin-bottom:14px;}
.login-badge-mix{padding:3px 9px;border-radius:30px;font-size:8px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
.login-badge-mix.primaire{background:rgba(245,158,11,0.15);color:#fbbf24;border:1px solid rgba(245,158,11,0.3);}
.login-badge-mix.maternelle{background:rgba(16,185,129,0.15);color:#34d399;border:1px solid rgba(16,185,129,0.3);}
.login-input-mix{width:100%;padding:12px 14px;border-radius:12px;background:rgba(45,55,72,0.7);border:2px solid rgba(59,130,246,0.25);color:#fff;font-size:15px;font-weight:700;letter-spacing:5px;text-align:center;outline:none;font-family:'Inter',sans-serif;transition:all 0.25s ease;margin-bottom:12px;}
.login-input-mix:focus{border-color:#fbbf24;background:rgba(30,58,95,0.8);box-shadow:0 0 0 3px rgba(245,158,11,0.15),0 0 0 5px rgba(16,185,129,0.1);}
.login-input-mix::placeholder{color:#64748b;letter-spacing:1px;font-weight:400;font-size:11px;}
.login-btn-mix{width:100%;padding:12px;border-radius:12px;background:linear-gradient(135deg,#f59e0b 0%,#d97706 40%,#059669 60%,#34d399 100%);background-size:200% 200%;color:#fff;font-weight:800;font-size:11px;letter-spacing:1.2px;border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.3s ease;box-shadow:0 6px 18px rgba(245,158,11,0.35),0 6px 18px rgba(16,185,129,0.25);text-transform:uppercase;animation:gradientShift 4s ease infinite;}
@keyframes gradientShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.login-btn-mix:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 28px rgba(245,158,11,0.5),0 10px 28px rgba(16,185,129,0.4);}
.login-btn-mix:disabled{opacity:0.6;cursor:wait;animation:none;}
.login-refresh-mix{margin-top:8px;width:100%;padding:10px;border-radius:11px;background:rgba(59,130,246,0.08);color:#94a3b8;font-weight:600;font-size:10px;border:1px solid rgba(59,130,246,0.2);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;}
.login-refresh-mix:hover{background:rgba(59,130,246,0.15);color:#fff;}
.login-error-mix{margin-top:10px;font-size:10px;color:#fca5a5;font-weight:500;padding:8px 10px;border-radius:10px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);display:none;}
.login-error-mix:not(:empty){display:block;}
.login-footer-mix{margin-top:14px;padding-top:10px;border-top:1px solid rgba(59,130,246,0.15);font-size:8px;color:#64748b;letter-spacing:0.5px;}
.login-footer-mix strong{background:linear-gradient(90deg,#fbbf24,#34d399);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;}
@media(max-width:480px){.login-card-mix{max-width:270px;padding:20px 16px;}.login-logo-mix{width:44px;height:44px;}.login-logo-mix svg{width:26px;height:26px;}.login-school-mix{font-size:12px;}.login-input-mix{font-size:14px;letter-spacing:4px;}}
body.light-mode{--bg-primary:#b8bcc4;--bg-card:#c8ccd4;--text-primary:#000;--border-color:rgba(0,0,0,0.15);--gradient-header:linear-gradient(135deg,#1a365d,#0f2440);}
body.light-mode,body.light-mode html{background:var(--bg-primary) !important;}
body.light-mode .card,body.light-mode .school-header,body.light-mode .fiche-selector,body.light-mode .modal-content,body.light-mode .prof-config,body.light-mode .accordion-body{background:var(--bg-card) !important;border-color:var(--border-color) !important;}
body.light-mode .form-field input,body.light-mode .form-field select,body.light-mode .fiche-selector select,body.light-mode .eleve-row input,body.light-mode .eleve-row select,body.light-mode .epreuve-item input,body.light-mode .prof-config .note-max-row input,body.light-mode .student-table input,body.light-mode .modal-content input,body.light-mode .modal-content select{background:#b0b5c0 !important;border-color:#7a8495 !important;color:#000 !important;}
body.light-mode .student-table th{background:#a0a5b0 !important;color:#000 !important;}
body.light-mode .student-table td{color:#000 !important;border-bottom-color:var(--border-color) !important;}
body.light-mode .toast-notification{background:rgba(245,247,250,0.95) !important;}
body.light-mode .toast-title,body.light-mode .toast-message{color:#000 !important;}
body.light-mode .tab{color:#334155;}
body.light-mode .tab.active{background:#1a365d;color:#fff;}
body.light-mode .accordion-header{background:linear-gradient(135deg,#1a365d,#0f2440);}
body.light-mode .resume-band{background:linear-gradient(135deg,rgba(26,54,93,0.15),rgba(15,36,64,0.15));}
body.light-mode .resume-value{color:#1a365d;}
body.light-mode .resume-label{color:#333;}
body.cycle-primaire .school-header{background:linear-gradient(135deg,#0f2b44,#071a2c);border:1px solid rgba(59,130,246,0.3);box-shadow:0 8px 32px -12px rgba(59,130,246,0.4);}
body.cycle-primaire .school-name{background:linear-gradient(135deg,#fff,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent;}
body.cycle-primaire .school-sub{color:#93c5fd;}
body.cycle-primaire .school-header > div:last-child{color:#93c5fd;}
body.cycle-maternelle .school-header{background:linear-gradient(135deg,#166534,#065f46 50%,#84cc16);border:1px solid rgba(163,230,53,0.4);box-shadow:0 8px 32px -12px rgba(132,204,22,0.5);}
body.cycle-maternelle .school-name{background:linear-gradient(135deg,#ecfccb,#a3e635 60%,#22c55e);-webkit-background-clip:text;background-clip:text;color:transparent;}
body.cycle-maternelle .school-sub{color:#d9f99d;}
body.cycle-maternelle .school-header > div:last-child{color:#d9f99d;}
body.cycle-maternelle .card{border-color:rgba(163,230,53,0.2);}

async function getAllEleves() {
try {
const cycle = detecterCycle();
const collectionPrincipale = getCollectionEleves(cycle);
const collectionSecondaire = cycle === 'maternelle' ? 'prima_eleves' : 'mater_eleves';
let snap = await getDocs(collection(db, "ecoles", ECOLET_ID, collectionPrincipale));
let elevesTrouves = extraireEleves(snap, cycle);
if (elevesTrouves.length === 0) {
snap = await getDocs(collection(db, "ecoles", ECOLET_ID, collectionSecondaire));
elevesTrouves = extraireEleves(snap, cycle);
}
localEleves = elevesTrouves;
return localEleves;
} catch (error) { return []; }
}
function extraireEleves(snap, cycle) {
const eleves = [];
const typeAttendu = cycle === 'maternelle' ? 'mater_eleve' : 'prima_eleve';
for (const ds of snap.docs) {
const d = ds.data();
if (d._type === 'config' || d._type === 'settings' || d._type === 'inscription') continue;
if (!d.nom || d.nom.trim() === '') continue;
if (d.abandon === true || d.abandonne === true) continue;
if (d._type && d._type !== typeAttendu) {
if (d._type === 'prima_eleve' || d._type === 'mater_eleve') continue;
}
eleves.push({
id: d.eleveId || ds.id,
nom: d.nom || '',
postnom: d.postnom || '',
prenom: d.prenom || '',
sexe: d.sexe || "M",
classe: d.classe || '',
parentCode: d.parentCode || "",
abandon: d.abandon || false,
dateInscription: d.dateInscription || new Date().toISOString()
});
}
return eleves;
}

const data = ds.data();
if (!data._type && data.enseignantId === currentEnseignant.id) {
fiches.push({

numeroRef: data.numeroRef || null,
nbEleves: (data.eleves || []).length,
epreuvesParPeriode: data.epreuvesParPeriode || {}
});
}
}
fiches.sort((a, b) => (a.numeroRef || 999) - (b.numeroRef || 999));
return fiches;
} catch (e) { return []; }
}

/* =========================================================
   verifPlafond : NE REMET PLUS 0 QUAND LE CHAMP EST VIDE
   → c'était la cause du "0 qui revient"
   ========================================================= */
window.verifPlafond = function(input, maxVal) {
    // Si l'utilisateur efface → on ne touche à rien, il peut continuer à effacer
    if (input.value === '' || input.value === null || input.value === undefined) return;
    let va = parseFloat(input.value);
    if (isNaN(va)) return;
    if (va > maxVal) {
        input.value = Math.round(maxVal);
        input.style.borderColor = '#ef4444';
        input.style.backgroundColor = 'rgba(239,68,68,0.15)';
        setTimeout(() => { input.style.borderColor = ''; input.style.backgroundColor = ''; }, 800);
        toast(`⚠️ Note maximale autorisée : ${Math.round(maxVal)}`, 'warning');
    }
    if (va < 0) input.value = 0;
};

/* =========================================================
   HANDLERS DE SAISIE DE NOTES
   - Acceptent le vide sans forcer 0
   - Le 0 reviendra au focusout si la cellule est vide
   ========================================================= */
window.updNoteMater = function(i, t, ei, v, inputEl) {
    // Champ vide → on stocke 0 en mémoire, l'input reste vide
    if (v === '' || v === null || v === undefined) {
        if (!currentFiche.eleves[i].notes) currentFiche.eleves[i].notes = { p1:[],p2:[],p3:[],p4:[],p5:[],p6:[],exam1:0,exam2:0,exam3:0 };
        if (!currentFiche.eleves[i].notes['p' + t]) currentFiche.eleves[i].notes['p' + t] = [];
        currentFiche.eleves[i].notes['p' + t][ei] = 0;
        if (inputEl) inputEl.className = '';
        saveCurrentFicheDebounced();
        mettreAJourMoyenneLigne(i);
        return;
    }
    let va = parseInt(v) || 0;
    let eps = currentFiche.epreuvesParPeriode?.[t] || [];
    let me = eps[ei]?.max || 4;
    if (va > me) { va = Math.round(me); if (inputEl) inputEl.value = va; toast(`⚠️ Note maximale : ${me}`, 'warning'); }
    if (va < 0) { va = 0; if (inputEl) inputEl.value = va; }
    if (!currentFiche.eleves[i].notes) currentFiche.eleves[i].notes = { p1:[],p2:[],p3:[],p4:[],p5:[],p6:[],exam1:0,exam2:0,exam3:0 };
    if (!currentFiche.eleves[i].notes['p' + t]) currentFiche.eleves[i].notes['p' + t] = [];
    currentFiche.eleves[i].notes['p' + t][ei] = va;
    if (inputEl) inputEl.className = getNoteClass(va, me);
    saveCurrentFicheDebounced();
    mettreAJourMoyenneLigne(i);
};

window.updNotePrimaire = function(i, p, ei, v, inputEl) {
    if (v === '' || v === null || v === undefined) {
        if (!currentFiche.eleves[i].notes) currentFiche.eleves[i].notes = { p1:[],p2:[],p3:[],p4:[],p5:[],p6:[],exam1:0,exam2:0,exam3:0 };
        if (!currentFiche.eleves[i].notes['p' + p]) currentFiche.eleves[i].notes['p' + p] = [];
        currentFiche.eleves[i].notes['p' + p][ei] = 0;
        if (inputEl) inputEl.className = '';
        saveCurrentFicheDebounced();
        mettreAJourMoyenneLigne(i);
        return;
    }
    let va = parseInt(v) || 0;
    let eps = currentFiche.epreuvesParPeriode?.[p] || [];
    let me = eps[ei]?.max || 20;
    if (va > me) { va = Math.round(me); if (inputEl) inputEl.value = va; toast(`⚠️ Note maximale : ${me}`, 'warning'); }
    if (va < 0) { va = 0; if (inputEl) inputEl.value = va; }
    if (!currentFiche.eleves[i].notes) {
        currentFiche.eleves[i].notes = { p1:[],p2:[],p3:[],p4:[],p5:[],p6:[],exam1:0,exam2:0,exam3:0 };
    }
    if (!currentFiche.eleves[i].notes['p' + p]) {
        currentFiche.eleves[i].notes['p' + p] = [];
    }
    currentFiche.eleves[i].notes['p' + p][ei] = va;
    if (inputEl) inputEl.className = getNoteClass(va, me);
    saveCurrentFicheDebounced();
    mettreAJourMoyenneLigne(i);
};

window.updExam = function(i, t, v, inputEl) {
    if (v === '' || v === null || v === undefined) {
        if (!currentFiche.eleves[i].notes) currentFiche.eleves[i].notes = { p1:[],p2:[],p3:[],p4:[],p5:[],p6:[],exam1:0,exam2:0,exam3:0 };

    if (!currentFiche.eleves[i].notes) currentFiche.eleves[i].notes = { p1:[],p2:[],p3:[],p4:[],p5:[],p6:[],exam1:0,exam2:0,exam3:0 };

    if (inputEl) inputEl.className = getNoteClass(va, me);

setChampsModifiables(false); mettreAJourBoutons();
document.getElementById('accordionNewHeader').classList.remove('open');
document.getElementById('accordionNewBody').classList.remove('open');
toast(`✅ ${mat ? 'Activité' : 'Cahier'} "${cours}" - ${classe} créé${mat ? 'e' : ''} avec ${eleves.length} élève(s)`, 'success');
} catch (error) {
let msg = 'Erreur lors de la création';
if (error.code === 'permission-denied') msg = "Permission refusée.";
else if (error.code === 'unavailable' || error.message === 'offline') msg = "Mauvaise connexion. Réessayez.";

document.getElementById('rechargerElevesBtn').onclick = async function() {
if (!currentFiche) { toast("Aucune activité sélectionnée", 'error'); return; }
const btn = this;
btn.disabled = true;
btn.innerHTML = '⏳ SYNCHRONISATION...';
try {
const classe = currentFiche.classe;
if (!classe) { toast("Veuillez d'abord configurer la classe", 'error'); btn.disabled = false; btn.innerHTML = '🔄 RECHARGER'; return; }
try { await getAllEleves(); }
catch (e) {
btn.disabled = false; btn.innerHTML = '🔄 RECHARGER';
toast("Vous avez une mauvaise connexion. Veuillez réessayer.", 'error');
return;
}
const elevesCompta = localEleves || [];
const classeNorm = normaliserTexte(classe);
let elevesFiltres = elevesCompta.filter(e => {
if (e.abandon) return false;
if (normaliserTexte(e.classe) !== classeNorm) return false;
return true;
});
if (elevesFiltres.length === 0 && (currentFiche.eleves || []).length > 0) {
btn.disabled = false; btn.innerHTML = '🔄 RECHARGER';
toast("Vous avez une mauvaise connexion. Veuillez réessayer.", 'error');
return;
}
const notesExistantes = {};
if (currentFiche.eleves) currentFiche.eleves.forEach(e => { if (e.id && e.notes) notesExistantes[e.id] = e.notes; });
const anciensIds = new Set(currentFiche.eleves.map(e => e.id));
const nouveauxIds = new Set(elevesFiltres.map(e => e.id));
const ajoutes = elevesFiltres.filter(e => !anciensIds.has(e.id));
const supprimes = currentFiche.eleves.filter(e => !nouveauxIds.has(e.id));
const anciensEleves = JSON.parse(JSON.stringify(currentFiche.eleves || []));
currentFiche.eleves = elevesFiltres.map(e => ({
id: e.id || Date.now() + Math.random(),
nom: e.nom || '', postnom: e.postnom || '', prenom: e.prenom || '',
nomComplet: [e.nom||'', e.postnom||'', e.prenom||''].filter(p => p.trim() !== '').join(' '),
sexe: e.sexe || 'M',
notes: notesExistantes[e.id] || { p1:[],p2:[],p3:[],p4:[],p5:[],p6:[],exam1:0,exam2:0,exam3:0 },
eleveId: e.id,
importeLe: new Date().toISOString(),
source: "reload"
}));
const sauvegardeOk = await saveCurrentFiche();
if (!sauvegardeOk) {
currentFiche.eleves = anciensEleves;
afficherEleves(); afficherCotation();
btn.disabled = false; btn.innerHTML = '🔄 RECHARGER';
toast("Vous avez une mauvaise connexion. Veuillez réessayer.", 'error');
return;
}
afficherEleves(); afficherCotation();
mettreAJourStatsFiche(); mettreAJourBandeauResume();
let message = [];
if (ajoutes.length > 0) message.push(`${ajoutes.length} ajouté(s)`);
if (supprimes.length > 0) message.push(`${supprimes.length} supprimé(s)`);
if (message.length > 0) toast(`✅ ${message.join(' et ')}`, 'success');
else toast("✅ Aucun changement", 'info');
btn.disabled = false;
btn.innerHTML = '🔄 RECHARGER';
} catch (error) {
btn.disabled = false;
btn.innerHTML = '🔄 RECHARGER';
toast("Vous avez une mauvaise connexion. Veuillez réessayer.", 'error');
}
};
document.getElementById('exportCurrentBtn').onclick = async function() {
if (!currentFiche) { toast("Aucun cahier sélectionné", 'error'); return; }
if (!currentFiche.eleves || currentFiche.eleves.length === 0) { toast("Aucun élève à exporter", 'error'); return; }
try {
const { jsPDF } = window.jspdf;
const pdf = new jsPDF('landscape', 'mm', 'a4');
const rn = currentFiche.numeroRef ? formatNumero(currentFiche.numeroRef) : '???';
pdf.setFillColor(255,255,255);
pdf.rect(0, 0, 297, 210, 'F');
pdf.setFont('helvetica', 'bold');
pdf.setFontSize(14);
pdf.setTextColor(0,51,102);
pdf.text(prefix + schoolNameDisplay, 148, 20, { align: 'center' });
pdf.setFont('helvetica', 'normal');
pdf.setFontSize(10);
pdf.setTextColor(80,80,80);
pdf.text('GESTION SCOLAIRE', 148, 27, { align: 'center' });
pdf.setFont('helvetica', 'bold');
pdf.setFontSize(12);
pdf.setTextColor(0,51,102);
pdf.text('CAHIER DE COTATION', 148, 37, { align: 'center' });
pdf.setFont('helvetica', 'normal');
pdf.setFontSize(9);
pdf.setTextColor(0,0,0);
pdf.text("Année scolaire : 2026-2027", 14, 50);
pdf.text("Référence : " + rn, 14, 57);
pdf.text("Cours : " + (currentFiche.cours || ''), 14, 64);
pdf.text("Classe : " + (currentFiche.classe || ''), 14, 71);
pdf.text("Enseignant : " + (currentEnseignant ? currentEnseignant.nom : ''), 14, 78);
const mat = isMaternelle();
const pMax = getPeriodeMax();
const examMax = pMax * 2;
let hd, bd;
if (mat) {
hd = [['N','NOMS COMPLETS','SEXE']];
const libellesT = ['1er TRIMESTRE','2ème TRIMESTRE','3ème TRIMESTRE'];
for (let t = 1; t <= 3; t++) {
hd[0].push(libellesT[t-1] + ' /' + fmtInt(pMax));
}
hd[0].push('MOYENNE /' + fmtInt(pMax));
bd = [];
for (let i = 0; i < currentFiche.eleves.length; i++) {
const e = currentFiche.eleves[i];
const row = [(i+1).toString(), getNomComplet(e).toUpperCase(), e.sexe === 'F' ? 'F' : 'M'];
let sommeMoy = 0;
let nbTrim = 0;
for (let t = 1; t <= 3; t++) {
let moy = calcMoy(t, e.notes?.['p' + t] || []);
row.push(fmtInt(moy));
sommeMoy += moy;
nbTrim++;
}
let moyGen = nbTrim > 0 ? Math.round(sommeMoy / nbTrim) : 0;
row.push(fmtInt(moyGen));
bd.push(row);
}
} else {
hd = [['N','NOMS COMPLETS','SEXE']];
hd[0].push('1ere PERIODE /' + fmtInt(pMax));
hd[0].push('2eme PERIODE /' + fmtInt(pMax));
hd[0].push('EXAMEN /' + fmtInt(examMax));
hd[0].push('TOTAL 1er TRIM /' + fmtInt(pMax + pMax + examMax));
hd[0].push('3eme PERIODE /' + fmtInt(pMax));
hd[0].push('4eme PERIODE /' + fmtInt(pMax));
hd[0].push('EXAMEN /' + fmtInt(examMax));
hd[0].push('TOTAL 2eme TRIM /' + fmtInt(pMax + pMax + examMax));
hd[0].push('5eme PERIODE /' + fmtInt(pMax));
hd[0].push('6eme PERIODE /' + fmtInt(pMax));
hd[0].push('EXAMEN /' + fmtInt(examMax));
hd[0].push('TOTAL 3eme TRIM /' + fmtInt(pMax + pMax + examMax));
hd[0].push('TOTAL ANNEE /' + fmtInt(pMax * 6 + examMax * 3));
bd = [];
for (let i = 0; i < currentFiche.eleves.length; i++) {
const e = currentFiche.eleves[i];
const row = [(i+1).toString(), getNomComplet(e).toUpperCase(), e.sexe === 'F' ? 'F' : 'M'];
let totalAnnuel = 0;
for (let t = 1; t <= 3; t++) {
let p1 = (t - 1) * 2 + 1;
let p2 = (t - 1) * 2 + 2;
let totalTrim = 0;
let p1m = calcMoy(p1, e.notes?.['p' + p1] || []);
row.push(fmtInt(p1m)); totalTrim += p1m;
let p2m = calcMoy(p2, e.notes?.['p' + p2] || []);
row.push(fmtInt(p2m)); totalTrim += p2m;
let ex = e.notes?.['exam' + t] || 0;
row.push(fmtInt(ex)); totalTrim += ex;
row.push(fmtInt(totalTrim));
totalAnnuel += totalTrim;
}
row.push(fmtInt(totalAnnuel));
bd.push(row);
}
}
const allData = [];
let maxRow = ['MAX','',''];
if (!mat) {
for (let t = 1; t <= 3; t++) {
maxRow.push(fmtInt(pMax));
maxRow.push(fmtInt(pMax));
maxRow.push(fmtInt(examMax));
maxRow.push(fmtInt(pMax + pMax + examMax));
}
maxRow.push(fmtInt(pMax * 6 + examMax * 3));
} else {
for (let t = 1; t <= 3; t++) {
maxRow.push(fmtInt(pMax));
}
maxRow.push(fmtInt(pMax));
}
allData.push(maxRow);
bd.forEach(row => allData.push(row));
pdf.autoTable({
head: hd, body: allData, startY: 85, theme: 'grid',
styles: { fontSize: 7, cellPadding: 2, halign: 'center' },
headStyles: { fillColor: mat ? [16,185,129] : [0,51,102], textColor: [255,255,255], fontStyle: 'bold' },
rowStyles: !mat ? { 0: { fillColor: [255,200,200], textColor: [255,0,0], fontStyle: 'bold', fontSize: 8 } } : { 0: { fillColor: [220,252,231], textColor: [22,101,52], fontStyle: 'bold', fontSize: 8 } },
alternateRowStyles: { fillColor: [245,245,245] }
});
pdf.save("Cahier_" + rn + "_" + (currentFiche.cours || 'cours') + ".pdf");
toast("PDF exporté", 'success');
} catch (e) { toast("Erreur génération PDF", 'error'); }
};
async function showLogin() {
document.querySelector('.floating-actions').style.display = 'none';
let d = document.createElement('div');
d.className = 'login-overlay-mix';
d.id = 'loginOverlay';
d.innerHTML = `<div class="login-card-mix"><div class="login-logo-mix"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L3 7V12C3 17.55 6.84 22.74 12 24C17.16 22.74 21 17.55 21 12V7L12 2Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12L11 14L15 10" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="login-school-mix" id="loginSchoolName">COMPLEXE SCOLAIRE</div><div class="login-school-sub-mix">Année scolaire 2026-2027</div><div class="login-divider-mix"></div><div class="login-title-mix">Espace Enseignant</div><div class="login-subtitle-mix">Primaire & Maternelle</div><div class="login-badges-mix"><span class="login-badge-mix primaire">🟠 Primaire</span><span class="login-badge-mix maternelle">🟢 Maternelle</span></div><input type="password" id="loginCode" class="login-input-mix" placeholder="CODE D'ACCÈS" autocomplete="off" inputmode="numeric" maxlength="6"><button id="loginBtn" class="login-btn-mix">Se Connecter</button><button id="refreshPageBtn" class="login-refresh-mix">🔄 Rafraîchir</button><div id="loginError" class="login-error-mix"></div><div class="login-footer-mix">Propulsé par <strong>NeTubeX SARL</strong></div></div>`;
document.body.appendChild(d);
const schoolNameDisplayLogin = ECOLET_ID.toUpperCase().replace(/_/g, ' ');
let prefixLogin = 'COMPLEXE SCOLAIRE ';
const firstLetterLogin = schoolNameDisplayLogin.charAt(0).toUpperCase();
if (['A','E','I','O','U','T'].includes(firstLetterLogin)) prefixLogin = 'COMPLEXE SCOLAIRE LE ';
document.getElementById('loginSchoolName').textContent = prefixLogin + schoolNameDisplayLogin;
const codeInput = document.getElementById('loginCode');
if (codeInput) {
codeInput.addEventListener('input', function() {
this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
});
setTimeout(() => codeInput.focus(), 100);
}
document.getElementById('loginBtn').onclick = async function() {
const btn = this;
btn.disabled = true;
btn.innerHTML = 'CONNEXION...';
let c = document.getElementById('loginCode').value.trim();
if (!c) {
document.getElementById('loginError').innerHTML = "Veuillez entrer votre code d'accès";
btn.disabled = false;
btn.innerHTML = 'Se Connecter';
return;
}
let ens = null;
if (navigator.onLine) {
try {
const snap = await getDocs(collection(db, "ecoles", ECOLET_ID, "enseignants"));
snap.forEach(ds => {
const data = ds.data();
if (data._type === "enseignant" && String(data.code) === String(c)) {
ens = { id: data.id, nom: data.nom, code: data.code, email: data.email, cycle: data.cycle, classes: data.classes };
}
});
} catch (e) { console.error(e); }
}
if (!ens) {
document.getElementById('loginError').innerHTML = "Code d'accès incorrect";
toast("Code d'accès incorrect", 'error');
btn.disabled = false;
btn.innerHTML = 'Se Connecter';
return;
}
if (!ens.email || ens.email.trim() === '') {
document.getElementById('loginError').innerHTML = "Compte incomplet. Contactez la direction.";
toast("Compte incomplet", 'error');
btn.disabled = false;
btn.innerHTML = 'Se Connecter';
return;
}
const actif = await verifierCompteActif(ens.id);
if (!actif) {
document.getElementById('loginOverlay').innerHTML = '<div class="prof-desactiver-msg"><div class="icon">🚫</div><h2>COMPTE DÉSACTIVÉ</h2><p>Contactez la Direction de votre école.</p><div style="margin-top:20px;"><button onclick="window.location.reload()" style="background:#3b82f6;color:#fff;border:none;padding:10px 30px;border-radius:40px;cursor:pointer;font-size:14px;">Réessayer</button></div></div>';
return;
}
try {
await signInWithEmailAndPassword(auth, ens.email, c);
currentEnseignant = { id: ens.id, nom: ens.nom, code: c, cycle: ens.cycle, classes: ens.classes };
sauvegarderSession(currentEnseignant);
document.getElementById('loginOverlay').remove();
document.getElementById('mainApp').style.display = 'block';
document.querySelector('.floating-actions').style.display = 'flex';
appliquerThemeCycle(ens.cycle);
remplirClasseSelect();
toutesFiches = await loadAllFiches();
if (toutesFiches.length) await selectFiche(toutesFiches[0].id);
await refreshSelectors();
await getAllEleves();
mettreAJourBandeauResume();
initTheme();
toast("Bienvenue " + currentEnseignant.nom, 'success');
} catch (authError) {
document.getElementById('loginError').innerHTML = "Code d'accès incorrect. Réessayez.";
toast("Code incorrect", 'error');
btn.disabled = false;
btn.innerHTML = 'Se Connecter';
}
};

}

function toggleLightMode() {
document.body.classList.toggle('light-mode');
const isLight = document.body.classList.contains('light-mode');
const themeBtn = document.getElementById('floatingThemeBtn');
if (themeBtn) themeBtn.innerHTML = isLight ? '🌙' : '☀️';
localStorage.setItem('theme-preference', isLight ? 'light' : 'dark');
}
function initTheme() {
const savedTheme = localStorage.getItem('theme-preference');
if (savedTheme === 'light') {
document.body.classList.add('light-mode');
const themeBtn = document.getElementById('floatingThemeBtn');
if (themeBtn) themeBtn.innerHTML = '🌙';
}
}
document.getElementById('floatingThemeBtn')?.addEventListener('click', toggleLightMode);
document.getElementById('floatingLogoutBtn')?.addEventListener('click', function() {

async function() {

localStorage.removeItem('theme-preference');
document.getElementById('mainApp').style.display = 'none';
document.querySelector('.floating-actions').style.display = 'none';
showLogin();
toast("Vous êtes déconnecté", 'success');

);

else {

document.getElementById('loadingScreen').style.display = 'none';

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>GESTION DE SCOLARITÉ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}
html,body{height:100%;background:#0a0e1a;font-family:'Inter',sans-serif;overflow-x:hidden;}
body{overscroll-behavior:none;}
.container{max-width:1400px;margin:0 auto;padding:20px;}
.card{background:rgba(18,18,31,0.9);backdrop-filter:blur(10px);border-radius:20px;margin-bottom:20px;overflow:hidden;border:1px solid rgba(59,130,246,0.2);}
.card-header{padding:14px 20px;background:linear-gradient(135deg,#0f2b44,#071a2c);color:#fff;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
.school-header{background:linear-gradient(135deg,#0f2b44,#071a2c);border-radius:20px;padding:20px;text-align:center;margin-bottom:20px;}
.school-name{font-size:22px;font-weight:700;background:linear-gradient(135deg,#fff,#94a3b8);-webkit-background-clip:text;background-clip:text;color:transparent;}
.school-sub{font-size:11px;opacity:0.8;margin-top:4px;color:#cbd5e1;}
.prof-card{background:linear-gradient(135deg,rgba(30,58,95,0.95),rgba(15,43,68,0.95));border-radius:16px;padding:12px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;border:1px solid rgba(96,165,250,0.3);box-shadow:0 4px 20px -8px rgba(59,130,246,0.4);transition:opacity 0.4s ease,transform 0.4s ease,max-height 0.4s ease,margin 0.4s ease,padding 0.4s ease;}
.prof-card.cachee{opacity:0;transform:translateY(-10px) scale(0.98);pointer-events:none;margin-bottom:0;max-height:0;padding-top:0;padding-bottom:0;overflow:hidden;border-width:0;}
.prof-avatar{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#60a5fa,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.prof-info{flex:1;text-align:left;min-width:0;}
.prof-role{font-size:10px;font-weight:700;color:#60a5fa;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:1px;}
.prof-name{font-size:15px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tabs-container{overflow-x:auto;margin-bottom:20px;white-space:nowrap;-webkit-overflow-scrolling:touch;}
.tabs{display:inline-flex;gap:6px;}
.tab{background:transparent;border:1px solid #334155;padding:9px 20px;border-radius:40px;font-size:13px;cursor:pointer;color:#cbd5e1;transition:all 0.2s;}
.tab:hover{background:rgba(59,130,246,0.2);border-color:#3b82f6;}
.tab.active{background:#1e3a5f;color:#fff;border-color:transparent;}
.tab-content{display:none;animation:fadeIn 0.25s;}
.tab-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.main-nav{display:flex;gap:12px;margin-bottom:20px;background:rgba(18,18,31,0.9);border-radius:20px;padding:8px;border:1px solid rgba(59,130,246,0.2);overflow:hidden;}
.main-nav-btn{flex:1;padding:14px 20px;border-radius:16px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.3s ease;background:transparent;color:#94a3b8;font-family:'Inter',sans-serif;text-align:center;}
.main-nav-btn:hover{background:rgba(59,130,246,0.1);}
.main-nav-btn.active{background:linear-gradient(135deg,#1e3a5f,#0f2b44);color:#fff;box-shadow:0 4px 15px rgba(59,130,246,0.3);}
.main-nav-btn[data-space="titulaire"].active{background:linear-gradient(135deg,#1a3a2a,#0f2b1a);box-shadow:0 4px 15px rgba(16,185,129,0.3);}
.space-content{display:none;}
.space-content.active{display:block;animation:fadeIn 0.3s ease;}
.form-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:768px){.form-grid{grid-template-columns:repeat(3,1fr)}}
.form-field{display:flex;flex-direction:column;gap:6px;}
.form-field label{font-size:11px;font-weight:600;color:#cbd5e1;}
.form-field input,.form-field select{background:#2d3748;border:1px solid #334155;border-radius:12px;padding:10px 14px;color:#fff;}
.form-field input:focus,.form-field select:focus{outline:none;border-color:#3b82f6;}
.hidden-field{display:none !important;}
.field-required label::after{content:" *";color:#ef4444;}
.btn{background:#1e3a5f;color:#fff;border:none;padding:10px 20px;border-radius:40px;font-weight:500;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:8px;transition:all 0.2s;}
.btn:hover{opacity:0.9;transform:scale(0.98);}
.btn-sm{padding:6px 14px;font-size:12px;}
.btn-outline{background:transparent;border:1.5px solid #3b82f6;color:#3b82f6;}
.btn-outline:hover{background:#3b82f6;color:#fff;}
.btn-danger{background:#7f1d1d;}
.btn-danger:hover{background:#991b1b;}
.btn-success{background:#14532d;}
.btn-success:hover{background:#166534;}
.btn-secondary{background:#334155;}
.btn-secondary:hover{background:#475569;}
.btn-primary{background:#1e3a5f;}
.btn-primary:hover{background:#0f2b44;}
.table-wrapper{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior-x:contain;display:block;}
.student-table{width:100%;border-collapse:collapse;font-size:12px;min-width:1400px;}
.student-table th{background:#0f172a;padding:12px 6px;border-bottom:2px solid #334155;font-size:11px;color:#fff;}
.student-table td{border-bottom:1px solid #334155;padding:8px 4px;color:#e2e8f0;}
.student-table input{width:55px;padding:6px;border-radius:8px;background:#2d3748;border:1px solid #334155;color:#fff;text-align:center;}
.student-table input.note-insuffisant{color:#ef4444;}
.student-table input.note-moyen{color:#f59e0b;}
.student-table input.note-bien{color:#22c55e;}
.student-table input.note-excellent{color:#22c55e;}
.footer-note{text-align:center;padding:12px;font-size:11px;color:#4a5568;}
.fiche-selector{background:rgba(18,18,31,0.9);margin:0;padding:16px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid rgba(59,130,246,0.15);}
.fiche-selector label{color:#94a3b8;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;}
#ficheSelect,#epreuveFicheSelector,#cotationFicheSelector{width:100%;padding:14px 44px 14px 18px;border-radius:14px;background:linear-gradient(135deg,rgba(30,41,59,0.95),rgba(15,23,42,0.95));border:1px solid rgba(96,165,250,0.25);color:#e2e8f0;font-size:14px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;outline:none;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);box-shadow:0 4px 14px -6px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.02) inset;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%2360a5fa' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");background-repeat:no-repeat;background-position:right 16px center;background-size:16px;}
#ficheSelect:hover,#epreuveFicheSelector:hover,#cotationFicheSelector:hover{border-color:rgba(96,165,250,0.55);background:linear-gradient(135deg,rgba(37,50,72,0.98),rgba(20,30,52,0.98));transform:translateY(-1px);box-shadow:0 8px 22px -8px rgba(59,130,246,0.45),0 0 0 1px rgba(96,165,250,0.15) inset;}
#ficheSelect:focus,#epreuveFicheSelector:focus,#cotationFicheSelector:focus{border-color:#3b82f6;box-shadow:0 0 0 4px rgba(59,130,246,0.18),0 8px 22px -8px rgba(59,130,246,0.6);}
#ficheSelect option,#epreuveFicheSelector option,#cotationFicheSelector option{background:#0f172a;color:#e2e8f0;padding:10px;font-size:13px;}
body.light-mode #ficheSelect,body.light-mode #epreuveFicheSelector,body.light-mode #cotationFicheSelector{background:linear-gradient(135deg,#d5d9e2,#c0c5ce) !important;border-color:rgba(26,54,93,0.35) !important;color:#0d1117 !important;box-shadow:0 4px 14px -6px rgba(0,0,0,0.2);}
body.light-mode #ficheSelect:hover,body.light-mode #epreuveFicheSelector:hover,body.light-mode #cotationFicheSelector:hover{border-color:rgba(26,54,93,0.6) !important;background:linear-gradient(135deg,#e0e4ec,#cdd2da) !important;}
body.light-mode #ficheSelect option,body.light-mode #epreuveFicheSelector option,body.light-mode #cotationFicheSelector option{background:#e8ecf2;color:#0d1117;}
body.light-mode .fiche-selector label{color:#2d3748;}
.modal-fullscreen{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(20px);z-index:20000;display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0;transition:all 0.2s;}
.modal-fullscreen.show{visibility:visible;opacity:1;}
.modal-content{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:32px;width:90%;max-width:95vw;padding:24px;border:1px solid rgba(59,130,246,0.3);max-height:90vh;overflow-y:auto;}
.modal-content h3{font-size:18px;margin-bottom:16px;color:#fff;font-weight:600;}
.toast-container{position:fixed;top:20px;right:20px;z-index:30000;display:flex;flex-direction:column;gap:12px;pointer-events:none;}
.toast-notification{background:rgba(18,25,45,0.95);backdrop-filter:blur(12px);border-radius:16px;padding:18px 24px;min-width:340px;max-width:380px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,0.3);border-left:4px solid #10b981;transform:translateX(400px);transition:transform 0.3s ease;pointer-events:auto;}
.toast-notification.show{transform:translateX(0);}
.toast-notification.error{border-left-color:#ef4444;}
.toast-notification.warning{border-left-color:#f59e0b;}
.toast-icon{font-size:18px;}
.toast-content{flex:1;}
.toast-title{font-weight:700;font-size:16px;color:#fff;margin-bottom:4px;}
.toast-message{font-size:14px;color:#cbd5e1;line-height:1.4;}
.empty-state{text-align:center;padding:40px;color:#94a3b8;}
.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 20% 30%,rgba(59,130,246,0.18),transparent 55%),radial-gradient(circle at 80% 70%,rgba(168,85,247,0.15),transparent 55%),radial-gradient(circle at 50% 100%,rgba(16,185,129,0.1),transparent 50%),linear-gradient(135deg,#050810,#0a0e1a 50%,#0f172a);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;}
.login-overlay::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 40%,rgba(59,130,246,0.08),transparent 40%),radial-gradient(circle at 70% 60%,rgba(168,85,247,0.06),transparent 40%);animation:slowRotate 40s linear infinite;pointer-events:none;}
@keyframes slowRotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1);opacity:0.5;}50%{transform:translate(30px,-40px) scale(1.2);opacity:0.8;}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1);opacity:0.4;}50%{transform:translate(-40px,30px) scale(1.1);opacity:0.7;}}
@keyframes float3{0%,100%{transform:translate(0,0);opacity:0.3;}50%{transform:translate(20px,20px);opacity:0.6;}}
.particle{position:absolute;border-radius:50%;pointer-events:none;}
.particle.p1{width:8px;height:8px;background:rgba(96,165,250,0.4);top:15%;left:20%;animation:float1 8s ease-in-out infinite;box-shadow:0 0 20px rgba(96,165,250,0.6);}
.particle.p2{width:6px;height:6px;background:rgba(168,85,247,0.5);top:70%;left:75%;animation:float2 10s ease-in-out infinite;box-shadow:0 0 20px rgba(168,85,247,0.6);}
.particle.p3{width:10px;height:10px;background:rgba(16,185,129,0.4);top:40%;left:85%;animation:float3 12s ease-in-out infinite;box-shadow:0 0 20px rgba(16,185,129,0.5);}
.particle.p4{width:5px;height:5px;background:rgba(96,165,250,0.5);top:80%;left:15%;animation:float1 9s ease-in-out infinite reverse;box-shadow:0 0 20px rgba(96,165,250,0.6);}
.particle.p5{width:7px;height:7px;background:rgba(168,85,247,0.4);top:25%;left:60%;animation:float2 11s ease-in-out infinite;box-shadow:0 0 20px rgba(168,85,247,0.5);}
.login-card{background:linear-gradient(160deg,rgba(22,28,48,0.92),rgba(12,16,30,0.95));backdrop-filter:blur(30px);border-radius:32px;padding:48px 40px 40px;width:100%;max-width:440px;text-align:center;border:1px solid rgba(96,165,250,0.2);box-shadow:0 30px 80px -20px rgba(0,0,0,0.9),0 0 60px -10px rgba(59,130,246,0.15),0 0 0 1px rgba(255,255,255,0.03) inset,0 1px 0 rgba(255,255,255,0.08) inset;position:relative;overflow:hidden;animation:cardAppear 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards;opacity:0;transform:translateY(20px) scale(0.96);}
@keyframes cardAppear{to{opacity:1;transform:translateY(0) scale(1);}}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(96,165,250,0.8),rgba(168,85,247,0.8),transparent);animation:topBar 3s ease-in-out infinite;background-size:200% 100%;}
@keyframes topBar{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.login-card::after{content:'';position:absolute;top:-50%;right:-50%;width:200px;height:200px;background:radial-gradient(circle,rgba(96,165,250,0.08),transparent 70%);border-radius:50%;pointer-events:none;}
.login-logo-wrap{width:96px;height:96px;margin:0 auto 26px;border-radius:26px;background:linear-gradient(135deg,#1e3a5f,#0f2b44);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 40px -8px rgba(59,130,246,0.6),0 0 0 1px rgba(96,165,250,0.25) inset,0 0 30px rgba(96,165,250,0.3);position:relative;animation:logoPulse 3s ease-in-out infinite;}
@keyframes logoPulse{0%,100%{box-shadow:0 12px 40px -8px rgba(59,130,246,0.6),0 0 0 1px rgba(96,165,250,0.25) inset,0 0 30px rgba(96,165,250,0.3);}50%{box-shadow:0 12px 50px -8px rgba(59,130,246,0.8),0 0 0 1px rgba(96,165,250,0.4) inset,0 0 45px rgba(96,165,250,0.5);}}
.login-logo-wrap::before{content:'';position:absolute;inset:-4px;border-radius:30px;background:linear-gradient(135deg,#60a5fa,#a78bfa,#60a5fa);opacity:0.3;filter:blur(12px);z-index:-1;animation:logoGlow 3s ease-in-out infinite;}
@keyframes logoGlow{0%,100%{opacity:0.2;}50%{opacity:0.45;}}
.login-logo-wrap svg{width:52px;height:52px;filter:drop-shadow(0 2px 12px rgba(96,165,250,0.7));}
.login-card h2{font-size:26px;font-weight:800;background:linear-gradient(135deg,#60a5fa,#a78bfa,#60a5fa);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px;letter-spacing:-0.5px;animation:titleShine 4s ease-in-out infinite;}
@keyframes titleShine{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.login-card .subtitle{color:#64748b;font-size:11px;margin-bottom:36px;font-weight:600;letter-spacing:2px;text-transform:uppercase;position:relative;display:inline-block;}
.login-card .subtitle::before,.login-card .subtitle::after{content:'';position:absolute;top:50%;width:30px;height:1px;background:linear-gradient(90deg,transparent,rgba(100,116,139,0.5),transparent);}
.login-card .subtitle::before{right:calc(100% + 10px);}
.login-card .subtitle::after{left:calc(100% + 10px);}
.login-input-wrap{position:relative;margin-bottom:18px;}
.login-input-wrap .lock-icon{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:#64748b;pointer-events:none;display:flex;align-items:center;transition:all 0.3s ease;}
.login-input-wrap input{width:100%;padding:18px 20px 18px 56px;border-radius:18px;background:rgba(15,20,35,0.7);border:1.5px solid rgba(96,165,250,0.18);color:#fff;font-size:16px;outline:none;font-family:'Inter',sans-serif;letter-spacing:3px;font-weight:600;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);}
.login-input-wrap input:focus{border-color:#3b82f6;background:rgba(15,20,35,0.95);box-shadow:0 0 0 4px rgba(59,130,246,0.15),0 8px 30px -8px rgba(59,130,246,0.6),0 0 30px -5px rgba(59,130,246,0.3);transform:translateY(-1px);}
.login-input-wrap input:focus ~ .lock-icon{color:#60a5fa;transform:translateY(-50%) scale(1.1);filter:drop-shadow(0 0 8px rgba(96,165,250,0.6));}
.login-input-wrap input::placeholder{color:#475569;letter-spacing:1px;font-weight:400;font-size:14px;}
.login-btn-row{display:flex;gap:12px;margin-top:28px;width:100%;}
.login-btn{flex:2;padding:17px;border-radius:18px;background:linear-gradient(135deg,#3b82f6,#2563eb,#3b82f6);background-size:200% 200%;color:#fff;font-weight:700;border:none;cursor:pointer;font-size:15px;font-family:'Inter',sans-serif;letter-spacing:0.5px;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);box-shadow:0 10px 30px -8px rgba(59,130,246,0.6),0 0 0 1px rgba(96,165,250,0.3) inset;position:relative;overflow:hidden;}
.login-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);transition:left 0.6s ease;}
.login-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 15px 40px -8px rgba(59,130,246,0.8),0 0 0 1px rgba(96,165,250,0.5) inset;background-position:100% 50%;}
.login-btn:hover:not(:disabled)::before{left:100%;}
.login-btn:active:not(:disabled){transform:translateY(0) scale(0.98);}
.login-btn:disabled{opacity:0.7;cursor:wait;}
.login-refresh-btn{flex:1;padding:17px;border-radius:18px;background:rgba(59,130,246,0.08);color:#94a3b8;font-weight:600;border:1.5px solid rgba(96,165,250,0.2);cursor:pointer;font-size:16px;font-family:'Inter',sans-serif;transition:all 0.3s cubic-bezier(0.4,0,0.2,1);display:flex;align-items:center;justify-content:center;gap:6px;}
.login-refresh-btn:hover{background:rgba(59,130,246,0.18);color:#60a5fa;border-color:rgba(96,165,250,0.5);transform:translateY(-2px) rotate(180deg);box-shadow:0 8px 20px -8px rgba(59,130,246,0.4);}
.login-error{margin-top:18px;font-size:13px;color:#f87171;font-weight:500;min-height:18px;padding:12px 18px;border-radius:14px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);transition:all 0.3s ease;animation:errorShake 0.4s ease;}
@keyframes errorShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.login-error:empty{background:transparent;border-color:transparent;padding:0;min-height:0;animation:none;}
.login-footer{margin-top:28px;font-size:11px;color:#475569;letter-spacing:0.5px;position:relative;padding-top:20px;}
.login-footer::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60px;height:1px;background:linear-gradient(90deg,transparent,rgba(96,165,250,0.3),transparent);}
.login-footer .brand-mini{background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;}
.eleve-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.eleve-row input{flex:2;padding:8px;border-radius:12px;background:#2d3748;border:1px solid #334155;color:#fff;}
.eleve-row select{padding:8px;border-radius:12px;background:#2d3748;border:1px solid #334155;color:#fff;}
.eleve-importe{color:#10b981;font-size:11px;font-weight:600;background:rgba(16,185,129,0.15);padding:2px 10px;border-radius:30px;}
.eleve-importe-lock{color:#64748b;font-size:14px;cursor:default;margin-left:4px;}
.epreuve-box{background:rgba(45,55,72,0.6);border-radius:16px;padding:12px;margin-bottom:12px;}
.epreuve-list{display:flex;flex-wrap:wrap;gap:8px;}
.epreuve-item{display:flex;align-items:center;gap:8px;background:#2d3748;padding:6px 12px;border-radius:40px;}
.epreuve-item input{background:#1e293b;border:1px solid #334155;color:#fff;padding:4px 8px;border-radius:20px;}
.prof-config{background:rgba(45,55,72,0.4);border-radius:16px;padding:16px;margin-top:16px;border:1px solid #334155;}

function toast(message, type = "success") {
    const container = document.getElementById("toastContainer");
    if (!container) return;
    const icons = { success: "✅", error: "❌", warning: "⚠️", info: "ℹ️" };
    const titles = { success: "Succès", error: "Erreur", warning: "Attention", info: "Information" };
    const colors = { success: "#10b981", error: "#ef4444", warning: "#f59e0b", info: "#3b82f6" };
    const el = document.createElement("div");
    el.className = `toast-notification ${type}`;
    el.innerHTML = `<div class="toast-icon">${icons[type] || "ℹ️"}</div><div class="toast-content"><div class="toast-title" style="color:${colors[type]}">${titles[type] || "Information"}</div><div class="toast-message">${message}</div></div>`;
    container.appendChild(el);
    requestAnimationFrame(() => { el.classList.add("show"); });
    setTimeout(() => { el.classList.remove("show"); setTimeout(() => { if (el.parentNode) el.remove(); }, 400); }, 3500);
}

function clearAllToasts() {
    const container = document.getElementById("toastContainer");
    if (!container) return;
    const toasts = container.querySelectorAll('.toast-notification');
    toasts.forEach((el, index) => {
        setTimeout(() => {
            el.classList.remove('show');
            setTimeout(() => { if (el.parentNode) el.remove(); }, 300);
        }, index * 80);
    });
}

async function getAllComptaEleves() {
    try {
        const snap = await getDocs(collection(db, "ecoles", ECOLET_ID, SC.COMPTA_ELEVES));
        localEleves = [];
        for (const ds of snap.docs) {
            const d = ds.data();
            if (d._type === 'config' || d._type === 'settings' || d._type === 'inscription') continue;
            if (!d.nom) continue;
            const classeNormalisee = normaliserClasse(d.classe);
            localEleves.push({
                id: d.eleveId || ds.id,
                nom: d.nom || '',
                postnom: d.postnom || '',
                prenom: d.prenom || '',
                nomComplet: [d.nom || '', d.postnom || '', d.prenom || ''].filter(p => p.trim() !== '').join(' '),
                sexe: d.sexe || "M",
                classe: classeNormalisee,
                option: d.option || "",
                parentCode: d.parentCode || "",
                abandon: d.abandon || false
            });
        }
        return localEleves;
    } catch (error) { return []; }
}

function getNomComplet(eleve) {
    const nom = eleve.nomOrigine || eleve.nom || '';
    const postnom = eleve.postnomOrigine || eleve.postnom || '';
    const prenom = eleve.prenomOrigine || eleve.prenom || '';
    if (!nom && !postnom && !prenom) return eleve.nom || 'Élève';
    let result = [];
    if (nom) result.push(nom);
    if (postnom) result.push(postnom);
    if (prenom) result.push(prenom);
    return result.join(' ');
}

function normaliserClasse(nomClasse) {
    if (!nomClasse) return '';
    const c = {
        '7eme EB':'7ème EB','7ème EB':'7ème EB','7eme':'7ème EB','7ème':'7ème EB',
        '8eme EB':'8ème EB','8ème EB':'8ème EB','8eme':'8ème EB','8ème':'8ème EB',
        '1ere Annee':'1ère Année','1ère Année':'1ère Année','1ere':'1ère Année','1ère':'1ère Année',
        '1ere annee':'1ère Année','1ère année':'1ère Année',
        '2eme Annee':'2ème Année','2ème Année':'2ème Année','2eme':'2ème Année','2ème':'2ème Année',
        '2eme annee':'2ème Année','2ème année':'2ème Année',
        '3eme Annee':'3ème Année','3ème Année':'3ème Année','3eme':'3ème Année','3ème':'3ème Année',
        '3eme annee':'3ème Année','3ème année':'3ème Année',
        '4eme Annee':'4ème Année','4ème Année':'4ème Année','4eme':'4ème Année','4ème':'4ème Année',
        '4eme annee':'4ème Année','4ème année':'4ème Année'
    };
    const cleaned = nomClasse.trim().replace(/\s+/g, ' ');
    return c[cleaned] || cleaned;
}

async function loadAllFiches() {
    if (!currentProf) return [];
    try {
        const snap = await getDocs(collection(db, "ecoles", ECOLET_ID, SC.FICHES));
        const fiches = [];
        for (const ds of snap.docs) {
            const data = ds.data();
            if (!data._type && data.profId === currentProf.id) {
                fiches.push({ id: ds.id, cours: data.cours || '', classe: data.classe || '', option: data.option || '', numeroRef: data.numeroRef || null });
            }
        }
        fiches.sort((a, b) => (a.numeroRef || 999) - (b.numeroRef || 999));
        return fiches;
    } catch (e) { return []; }
}

function getNextNumeroLocal() {

    toutesFiches.forEach(f => {
        if (f.numeroRef && typeof f.numeroRef === 'number' && f.numeroRef > maxNum && f.numeroRef < 999999) {
            maxNum = f.numeroRef;

    });

async function refreshSelectors(selectedId = null) {
    if (isUpdatingSelectors) return;
    isUpdatingSelectors = true;
    try {
        toutesFiches = await loadAllFiches();
        const selectorIds = ['ficheSelect', 'epreuveFicheSelector', 'cotationFicheSelector'];
        for (const s of selectorIds) {
            const sel = document.getElementById(s);
            if (!sel) continue;
            const currentValue = sel.value;
            sel.innerHTML = '';
            const defaultOpt = document.createElement('option');
            defaultOpt.value = '';
            defaultOpt.textContent = '-- Choisir --';
            sel.appendChild(defaultOpt);
            for (const f of toutesFiches) {
                const opt = document.createElement('option');
                opt.value = f.id;
                const refa = f.numeroRef ? formatNumero(f.numeroRef) : 'Nouvelle';
                const optText = f.option ? ' (' + f.option + ')' : '';
                opt.textContent = refa + ' - ' + (f.cours || '?') + ' - ' + (f.classe || '?') + optText;
                sel.appendChild(opt);
            }
            if (selectedId && toutesFiches.some(f => f.id === selectedId)) sel.value = selectedId;
            else if (currentValue && toutesFiches.some(f => f.id === currentValue)) sel.value = currentValue;
            else if (currentFicheId && toutesFiches.some(f => f.id === currentFicheId)) sel.value = currentFicheId;
            sel.onchange = function() { if (isUpdatingSelectors || isCreatingFiche) return; if (this.value) selectFiche(this.value); };
        }
    } finally {
        setTimeout(() => { isUpdatingSelectors = false; }, 50);
    }
}

async function selectFiche(id) {
    if (!id || isCreatingFiche) return;
    currentFicheId = id;
    try {
        const docRef = doc(db, "ecoles", ECOLET_ID, SC.FICHES, id);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
            const data = docSnap.data();
            if (!data._type) {
                currentFiche = data;
                if (currentProf) currentFiche.titulaire = currentProf.nom;
                document.getElementById('coursInput').value = currentFiche.cours || '';

                afficherEpreuves();

                setChampsModifiables(false);

function mettreAJourSelectOptions(c) {
    let s = document.getElementById('optionSelect');

window.updEleve = function(i, f, v) {
    let eleve = currentFiche.eleves[i];
    if (!eleve) return;
    const estImporte = eleve.source === 'auto' || eleve.source === 'reload' || eleve.source === 'auto_refresh' || eleve.source === 'comptabilite';
    if (estImporte) { toast("🔒 Impossible de modifier un élève importé", 'error'); return; }
    if (f === 'nom' && (!v || v.trim() === '')) { toast("Le nom ne peut pas être vide", 'error'); return; }
    currentFiche.eleves[i][f] = v;
    afficherEleves();
    afficherCotation();
    toast("Élève modifié", 'success');
};

window.delEleve = function(i) {
    let eleve = currentFiche.eleves[i];
    if (!eleve) return;
    const estImporte = eleve.source === 'auto' || eleve.source === 'reload' || eleve.source === 'auto_refresh' || eleve.source === 'comptabilite';
    if (estImporte) { toast("🔒 Impossible de supprimer un élève importé", 'error'); return; }
    let n = eleve.nom || 'Élève';
    showConfirm("Supprimer " + n + " de la liste ?", function() {
        currentFiche.eleves.splice(i, 1);
        afficherEleves();
        afficherCotation();
        toast(n + " a été supprimé", 'warning');
    });
};

function getPeriodeMax() { return currentFiche.p1Max || 20; }
function getExamMax(s) { return getPeriodeMax() + getPeriodeMax(); }
function getTotalSemestreMax(s) { return getPeriodeMax() + getPeriodeMax() + getExamMax(s); }
function getTotalAnnuelMax() { return getTotalSemestreMax(1) + getTotalSemestreMax(2); }

function calcMoy(p, notes) {
    let eps = currentFiche.epreuvesParPeriode?.[p] || [];
    if (!eps.length || !notes?.length) return 0;
    let sommeNotes = 0, sommeMax = 0;
    for (let i = 0; i < eps.length; i++) { sommeNotes += (notes[i] || 0); sommeMax += (eps[i].max || 1); }
    if (sommeMax === 0) return 0;
    let noteMaxPeriode = currentFiche.p1Max || 20;
    return Math.round(Math.min(noteMaxPeriode, (sommeNotes / sommeMax) * noteMaxPeriode));
}

function getNoteClass(note, maxNote) {
    if (maxNote === 0) return '';
    const ratio = note / maxNote;
    if (ratio >= 0.8) return 'note-excellent';
    if (ratio >= 0.7) return 'note-bien';
    if (ratio >= 0.5) return 'note-moyen';
    return 'note-insuffisant';
}

function getAppreciation(note, maxNote) {
    if (maxNote === 0) return { text: 'Non évalué' };
    const ratio = note / maxNote;
    if (ratio >= 0.8) return { text: 'Excellent' };
    if (ratio >= 0.7) return { text: 'Très Bien' };
    if (ratio >= 0.6) return { text: 'Bien' };
    if (ratio >= 0.5) return { text: 'Assez Bien' };
    if (ratio >= 0.4) return { text: 'Passable' };
    return { text: 'Insuffisant' };
}

function getMoyenneGenerale(eleve) {
    let p1 = calcMoy(1, eleve.notes?.p1 || []), p2 = calcMoy(2, eleve.notes?.p2 || []), p3 = calcMoy(3, eleve.notes?.p3 || []), p4 = calcMoy(4, eleve.notes?.p4 || []);
    let ex1 = eleve.notes?.exam1 || 0, ex2 = eleve.notes?.exam2 || 0;
    let total = p1 + p2 + p3 + p4 + ex1 + ex2;
    return { moyenne: Math.round(total / 6 * 20), total: total };
}

function getGreetingTitu() { const h = new Date().getHours(); if (h < 12) return "Bonjour"; if (h < 18) return "Bon après-midi"; return "Bonsoir"; }

function getNotesForEleveTitu(eleve, fiche) {
    const pMax = fiche.p1Max || 20;
    function calcMoyNormalise(periode, notes, eps) {
        let epsList = eps[periode] || [];
        if (!epsList.length || !notes || !notes.length) return 0;
        let sumN = 0, sumM = 0;
        for (let i = 0; i < epsList.length; i++) { sumN += (notes[i] || 0); sumM += (epsList[i].max || 1); }
        if (sumM === 0) return 0;
        return Math.min(pMax, Math.round((sumN / sumM) * pMax));
    }
    let p1 = calcMoyNormalise(1, eleve.notes?.p1 || [], fiche.epreuvesParPeriode);
    let p2 = calcMoyNormalise(2, eleve.notes?.p2 || [], fiche.epreuvesParPeriode);
    let p3 = calcMoyNormalise(3, eleve.notes?.p3 || [], fiche.epreuvesParPeriode);
    let p4 = calcMoyNormalise(4, eleve.notes?.p4 || [], fiche.epreuvesParPeriode);
    let exam1 = eleve.notes?.exam1 || 0;
    let exam2 = eleve.notes?.exam2 || 0;
    return { p1, p2, p3, p4, exam1, exam2, totalS1: p1 + p2 + exam1, totalS2: p3 + p4 + exam2, total: p1 + p2 + exam1 + p3 + p4 + exam2, pMax };
}

async function loadAllFichesFromFirebaseTitu() {
    try {
        const snap = await getDocs(collection(db, "ecoles", ECOLET_ID, SC.FICHES));
        const fiches = [];
        const classesExclues = [
            "1ère A", "1ère B", "2ème A", "2ème B",
            "3ème A", "3ème B", "4ème A", "4ème B",
            "5ème A", "5ème B", "6ème A", "6ème B"
        ];
        for (const doc of snap.docs) {
            const data = doc.data();
            if (data._type === "prof") continue;
            if (!data.classe || !data.cours) continue;
            if (data.deleted === true || data.supprime === true) continue;
            if (data.corbeille === true) continue;
            if (data.school && data.school !== ECOLET_ID) continue;
            const classe = data.classe || '';
            if (classesExclues.includes(classe)) continue;
            const elevesValides = (data.eleves || []).filter(e => {
                if (!e) return false;
                if (e.abandon === true) return false;
                if (e.abandonne === true) return false;
                if (!e.nom || e.nom.trim() === '') return false;
                return true;
            });
            if (elevesValides.length === 0) continue;
            fiches.push({
                id: doc.id,
                cours: data.cours,
                classe: data.classe,
                option: data.option || '',
                eleves: elevesValides,
                p1Max: data.p1Max || 20,
                epreuvesParPeriode: data.epreuvesParPeriode || { 1: [], 2: [], 3: [], 4: [] },
                numeroRef: data.numeroRef || 0,
                titulaire: data.titulaire || '',
                profId: data.profId,
                lastModified: data.lastModified || data.updatedAt || data.dateCreation || new Date(),
                dateCreation: data.dateCreation
            });
        }
        return fiches;
    } catch (e) {
        return [];
    }
}

        infoEl.textContent = `📊 ${totalFiches} fiche(s) active(s) • ${totalEleves} élève(s) inscrit(s)`;

}

    if (typeof updateTitulaireStats === 'function') {
        updateTitulaireStats();
    }
}

function rechercherEleveTitu(nom) {
    const nomLower = nom.toLowerCase().trim();
    if (!nomLower) return [];
    const resultats = [];
    for (const f of toutesFichesCompletTitu) {
        for (const e of f.eleves) {
            const nomComplet = getNomComplet(e).toLowerCase();
            if (nomComplet.includes(nomLower)) {
                const notes = getNotesForEleveTitu(e, f);
                const identifiant = getNomComplet(e);
                resultats.push({ nomEleve: identifiant, sexe: e.sexe, cours: f.cours, classe: f.classe, option: f.option || '', p1: notes.p1, p2: notes.p2, p3: notes.p3, p4: notes.p4, exam1: notes.exam1, exam2: notes.exam2, totalS1: notes.totalS1, totalS2: notes.totalS2, total: notes.total, pMax: notes.pMax, _id: identifiant + '_' + f.id + '_' + f.cours });
            }
        }
    }
    resultats.sort((a, b) => (a.cours || '').localeCompare(b.cours || ''));
    return resultats;
}

document.getElementById('creerFicheBtn').addEventListener('click', async function() {
    if (isCreatingFiche) { toast("⏳ Une opération est déjà en cours...", 'warning'); return; }
    const cours = document.getElementById('coursInput').value.trim();
    const classe = document.getElementById('classeSelect').value;
    const option = document.getElementById('optionSelect').value;
    const noteMax = document.getElementById('p1MaxConfig').value || 20;
    const titulaire = currentProf ? currentProf.nom : '';
    if (!cours) { toast("Veuillez renseigner le cours", 'error'); return; }
    if (!classe) { toast("Veuillez sélectionner une classe", 'error'); return; }
    if (classe !== '7ème EB' && classe !== '8ème EB' && !option) { toast("Veuillez sélectionner une option", 'error'); return; }
    const fop = (classe === '7ème EB' || classe === '8ème EB') ? '' : option;
    const doublon = toutesFiches.find(f => f.cours === cours && f.classe === classe && (f.option || '') === fop);
    if (doublon) { toast("⚠️ Une fiche identique existe déjà !", 'warning'); return; }
    isCreatingFiche = true;
    const btn = this;
    btn.disabled = true;
    btn.innerHTML = '⏳ CRÉATION...';
    try {
        const nid = 'f' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        const nnum = getNextNumeroLocal();
        const now = new Date();
        if (!localEleves || localEleves.length === 0) {
            try { await getAllComptaEleves(); } catch (e) { localEleves = localEleves || []; }
        }
        const elevesCompta = localEleves || [];
        let elevesFiltres = elevesCompta.filter(e => {
            if (!e) return false;
            if (e.abandon) return false;
            if (e.classe !== classe) return false;
            if (fop === 'TOUTES') return true;
            if (fop && e.option !== fop) return false;
            return true;
        });
        if (elevesFiltres.length === 0) {
            showStyledConfirm('🚫 CRÉATION IMPOSSIBLE', `⚠️ Aucun élève inscrit n'a été trouvé pour :<br><br>• Classe : <strong>${classe}</strong><br>${fop ? `• Option : <strong>${fop}</strong>` : ''}<br><br>📌 Veuillez contacter la comptabilité ou la direction.`);
            btn.disabled = false;
            btn.innerHTML = '📝 CRÉER';
            isCreatingFiche = false;
            return;
        }
        let eleves = elevesFiltres.map(e => ({
            id: e.id || Date.now() + Math.random(),
            nom: e.nom || '', postnom: e.postnom || '', prenom: e.prenom || '',
            nomComplet: [e.nom || '', e.postnom || '', e.prenom || ''].filter(p => p.trim() !== '').join(' '),
            sexe: e.sexe || 'M',
            notes: { p1: [], p2: [], p3: [], p4: [], exam1: 0, exam2: 0 },
            eleveId: e.id, importeLe: new Date().toISOString(), source: "auto"
        }));
        const nouvelleFiche = {
            profId: currentProf.id, ficheId: nid, cours: cours, classe: classe, option: fop,
            titulaire: titulaire, anneeScolaire: "2026-2027", p1Max: parseFloat(noteMax) || 20,
            numeroRef: nnum, dateCreation: now, lastModified: now,
            epreuvesParPeriode: { 1: [{ nom: "Interrogation", max: 20 }], 2: [{ nom: "Interrogation", max: 20 }], 3: [{ nom: "Interrogation", max: 20 }], 4: [{ nom: "Interrogation", max: 20 }] },
            eleves: eleves, school: ECOLET_ID
        };
        await setDoc(doc(db, "ecoles", ECOLET_ID, SC.FICHES, nid), nouvelleFiche);
        currentFiche = nouvelleFiche;
        currentFicheId = nid;
        if (!toutesFiches.find(f => f.id === nid)) {
            toutesFiches.push({ id: nid, cours: cours, classe: classe, option: fop, numeroRef: nnum });
        }
        isCreatingFiche = false;
        document.getElementById('coursInput').value = '';
        document.getElementById('classeSelect').value = '';
        document.getElementById('optionSelect').value = '';
        document.getElementById('p1MaxConfig').value = 20;
        toggleOptionField();
        await refreshSelectors(nid);
        await selectFiche(nid);
        afficherEpreuves();
        afficherEleves();
        afficherCotation();
        setChampsModifiables(false);
        mettreAJourBoutons();
        toast(`✅ Fiche "${cours}" - ${classe} créée avec ${eleves.length} élève(s)`, 'success');
    } catch (error) {
        let msg = 'Erreur lors de la création';
        if (error.code === 'permission-denied') msg = "Permission refusée. Contactez l'administrateur.";
        else if (error.code === 'unavailable') msg = "Pas de connexion. Vérifiez votre réseau.";
        else if (error.message) msg = error.message;
        toast("❌ " + msg, 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '📝 CRÉER';
        isCreatingFiche = false;
    }
});

document.getElementById('rechargerElevesBtn').onclick = async function() {
    if (!currentFiche) { toast("Aucune fiche sélectionnée", 'error'); return; }
    const btn = this;
    btn.disabled = true;
    btn.innerHTML = '⏳ SYNCHRONISATION...';
    try {
        const classe = currentFiche.classe;
        const option = currentFiche.option;
        if (!classe) { toast("Veuillez d'abord configurer la classe", 'error'); btn.disabled = false; btn.innerHTML = '🔄 RECHARGER'; return; }
        try { await getAllComptaEleves(); } catch (e) {}
        const elevesCompta = localEleves || [];
        let elevesFiltres = elevesCompta.filter(e => {
            if (e.abandon) return false;
            if (e.classe !== classe) return false;
            if (option === 'TOUTES') return true;
            if (option && e.option !== option) return false;
            return true;
        });
        const notesExistantes = {};
        if (currentFiche.eleves) currentFiche.eleves.forEach(e => { if (e.id && e.notes) notesExistantes[e.id] = e.notes; });
        const anciensIds = new Set(currentFiche.eleves.map(e => e.id));
        const nouveauxIds = new Set(elevesFiltres.map(e => e.id));
        const ajoutes = elevesFiltres.filter(e => !anciensIds.has(e.id));
        const supprimes = currentFiche.eleves.filter(e => !nouveauxIds.has(e.id));
        currentFiche.eleves = elevesFiltres.map(e => ({
            id: e.id || Date.now() + Math.random(),
            nom: e.nom || '', postnom: e.postnom || '', prenom: e.prenom || '',
            nomComplet: [e.nom || '', e.postnom || '', e.prenom || ''].filter(p => p.trim() !== '').join(' '),
            sexe: e.sexe || 'M',
            notes: notesExistantes[e.id] || { p1: [], p2: [], p3: [], p4: [], exam1: 0, exam2: 0 },
            eleveId: e.id, importeLe: new Date().toISOString(), source: "reload"
        }));
        await saveCurrentFiche();
        afficherEleves();
        afficherCotation();
        let message = [];
        if (ajoutes.length > 0) message.push(`${ajoutes.length} ajouté(s)`);
        if (supprimes.length > 0) message.push(`${supprimes.length} supprimé(s)`);
        if (message.length > 0) toast(`✅ ${message.join(' et ')}`, 'success');
        else toast("✅ Aucun changement", 'info');
        btn.disabled = false;

};

        const ts1m = getTotalSemestreMax(1), ts2m = getTotalSemestreMax(2), tam = getTotalAnnuelMax();

(function initDragScroll() {
    const wrapper = document.querySelector('#tabCotation .table-wrapper');
    if (!wrapper) return;
    let isDown = false, startX = 0, scrollLeft = 0;
    wrapper.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        isDown = true;
        wrapper.style.cursor = 'grabbing';
        startX = e.pageX - wrapper.offsetLeft;
        scrollLeft = wrapper.scrollLeft;
    });
    wrapper.addEventListener('mouseleave', () => { isDown = false; wrapper.style.cursor = 'grab'; });
    wrapper.addEventListener('mouseup', () => { isDown = false; wrapper.style.cursor = 'grab'; });
    wrapper.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - wrapper.offsetLeft;
        wrapper.scrollLeft = scrollLeft - (x - startX) * 1.5;
    });
})();

        });
    });
});

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>picrd admin</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e6e8ee;
          --muted:#8b93a7; --accent:#4f8cff; --danger:#ff4d5e; --ok:#38c98b; --warn:#f5a623; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  header { padding:20px 24px; border-bottom:1px solid var(--line);
           display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; font-weight:600; }
  .spacer { flex:1; }
  .wrap { padding:24px; max-width:1400px; margin:0 auto; }
  input, select, button { font:inherit; }
  input[type=text], select { background:var(--card); border:1px solid var(--line);
    color:var(--text); padding:10px 12px; border-radius:8px; outline:none; }
  input:focus, select:focus { border-color:var(--accent); }
  button { background:var(--accent); color:#fff; border:0; padding:10px 16px;
    border-radius:8px; cursor:pointer; font-weight:500; }
  button:hover { filter:brightness(1.1); }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button.danger { background:var(--danger); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px;
           background:var(--line); color:var(--muted); }
  .badge.ok { background:#12351f; color:var(--ok); }
  .badge.warn { background:#3a1a1f; color:var(--danger); }
  #status { color:var(--muted); font-size:14px; flex:1; }
  .grid { display:grid; gap:16px;
          grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          overflow:hidden; display:flex; flex-direction:column; }
  .thumb { aspect-ratio:1/1; background:#0b0d11; overflow:hidden; cursor:pointer;
           display:flex; align-items:center; justify-content:center; position:relative; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .ext { color:var(--muted); font-size:13px; padding:8px; text-align:center; }
  .meta { padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
  .id { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--muted);
        word-break:break-all; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row button { padding:6px 10px; font-size:13px; }
  .empty { text-align:center; color:var(--muted); padding:60px 0; }
  #diag { background:#0b0d11; border:1px solid var(--line); border-radius:12px;
          margin-bottom:18px; padding:16px; display:none; }
  #diag.open { display:block; }
  #diag h2 { font-size:14px; margin:0 0 12px; color:var(--muted);
             text-transform:uppercase; letter-spacing:.5px; }
  .step { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);
          font-size:14px; align-items:flex-start; }
  .step:last-child { border-bottom:0; }
  .step .ico { flex-shrink:0; width:20px; text-align:center; }
  .step .msg { flex:1; }
  .step .msg code { background:#181b22; padding:2px 6px; border-radius:4px;
                    font-size:12px; color:var(--warn); }
  .step.ok .ico { color:var(--ok); } .step.err .ico { color:var(--danger); }
  .step.warn .ico { color:var(--warn); }
  .step .hint { display:block; color:var(--muted); font-size:13px; margin-top:4px; }
  pre#raw { background:#000; border:1px solid var(--line); border-radius:8px;
            padding:12px; overflow:auto; max-height:280px; font-size:12px;
            color:#c8d0e0; display:none; margin-top:12px; }
  pre#raw.open { display:block; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.8); display:none;
           align-items:center; justify-content:center; padding:20px; z-index:10; }
  #modal.open { display:flex; }
  #modal img { max-width:90vw; max-height:85vh; border-radius:8px; }
  #modal .close { position:fixed; top:16px; right:20px; font-size:28px;
                  cursor:pointer; color:#fff; background:none; border:0; }
  .confirm { background:var(--card); border:1px solid var(--line); border-radius:12px;
             padding:24px; max-width:380px; width:100%; }
  .confirm h3 { margin:0 0 8px; font-size:16px; }
  .confirm p { color:var(--muted); margin:0 0 18px; font-size:14px; word-break:break-all; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
           background:var(--card); border:1px solid var(--line); padding:12px 18px;
           border-radius:10px; font-size:14px; z-index:20;
           opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<header>
  <h1>🖼️ picrd admin</h1>
  <span class="badge" id="count">—</span>
  <div class="spacer"></div>
  <button class="ghost" id="diagToggle">🔍 Diagnostic</button>
  <button class="ghost" id="refresh">↻ Rafraîchir</button>
</header>

<div class="wrap">
  <div id="diag">
    <h2>Journal de diagnostic</h2>
    <div id="steps"></div>
    <pre id="raw"></pre>
  </div>

  <div class="bar">
    <select id="collection"><option value="">Toutes les collections</option></select>
    <input type="text" id="filter" placeholder="Filtrer par id / url / type…" style="width:260px">
    <span id="status">Prêt.</span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Clique sur « Rafraîchir » pour charger.</div>
</div>

<div id="modal"><button class="close" id="modalClose">×</button><img id="modalImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  // ⬇️ TA CLÉ
  const API_KEY = "pk_niboT6oXkLa1IYxsgwPCwpBCu8M0xdmNgLY6nEU1aFY";

  // ⬇️ Si CORS bloque depuis file://, mets le proxy ici :
  // const API = "https://corsproxy.io/?https://picrd.com/api";
  const API = "https://picrd.com/api";

  const $ = (s) => document.querySelector(s);
  const state = { files: [], filter: "", collection: "" };
  const el = {
    diagToggle: $("#diagToggle"), diag: $("#diag"), steps: $("#steps"), raw: $("#raw"),
    refresh: $("#refresh"), status: $("#status"), grid: $("#grid"),
    empty: $("#empty"), count: $("#count"), filter: $("#filter"),
    collection: $("#collection"), modal: $("#modal"), modalImg: $("#modalImg"),
    toast: $("#toast"),
  };

  let toastTimer;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove("show"), 2600);
  }
  function step(ico, msg, hint = "", cls = "") {
    const div = document.createElement("div");
    div.className = "step " + cls;
    div.innerHTML = `<div class="ico">${ico}</div><div class="msg">${msg}${hint ? `<span class="hint">${hint}</span>` : ""}</div>`;
    el.steps.appendChild(div);
  }
  function clearDiag() { el.steps.innerHTML = ""; el.raw.textContent = ""; el.raw.classList.remove("open"); }
  function showRaw(text) { el.raw.textContent = text || "(vide)"; el.raw.classList.add("open"); }
  el.diagToggle.onclick = () => el.diag.classList.toggle("open");

  // ---------- requête bas niveau ----------
  async function fetchFilesPage(page) {
    const url = `${API}/files?page=${page}`;
    const res = await fetch(url, {
      headers: { Authorization: `Bearer ${API_KEY}`, Accept: "application/json" },
    });
    const text = await res.text().catch(() => "");

    // L'API déclare "string" → on parse manuellement.
    let json = null;
    if (text) {
      try { json = JSON.parse(text); } catch {
        // Peut-être un JSON doublement encodé (string contenant du JSON)
        try { json = JSON.parse(JSON.parse(text)); } catch { /* vraiment pas du JSON */ }
      }
    }
    return { res, text, json, url };
  }

  // ---------- extraction générique d'un tableau ----------
  function findArray(obj) {
    if (Array.isArray(obj)) return obj;
    if (!obj || typeof obj !== "object") return null;
    for (const k of ["files", "data", "items", "results", "records"]) {
      if (Array.isArray(obj[k])) return obj[k];
    }
    return null;
  }

  // ---------- diagnostic ----------
  async function diagnose() {
    clearDiag();
    el.diag.classList.add("open");
    if (!API_KEY || API_KEY === "pk_your_key") {
      step("✖", "Clé API manquante.", "Remplis <code>API_KEY</code>.", "err"); return false;
    }
    step("✓", `Clé présente (<code>${API_KEY.slice(0,8)}…${API_KEY.slice(-4)}</code>).`, "", "ok");

    // Test réseau
    try {
      const h = await fetch("https://picrd.com/health");
      step(h.ok ? "✓" : "⚠", `<code>/health</code> → HTTP ${h.status}`, "", h.ok ? "ok" : "warn");
    } catch (e) {
      step("✖", "picrd.com injoignable.", `Erreur réseau : ${e.message}<br>CORS ? Essaie le proxy en haut du script.`, "err");
      return false;
    }

    // Test /files?page=1
    let r;
    try {
      r = await fetchFilesPage(1);
    } catch (e) {
      step("✖", "Requête <code>GET /api/files?page=1</code> échouée.", `${e.message}<br>Si la console dit « CORS », active le proxy.`, "err");
      return false;
    }

    if (r.res.status === 401) { step("✖", "HTTP 401 — clé refusée.", "Régénère une clé via le dashboard.", "err"); showRaw(r.text); return false; }
    if (r.res.status === 403) { step("✖", "HTTP 403 — scope manquant.", "La clé n'a pas le droit <code>files:read</code>.", "err"); showRaw(r.text); return false; }
    if (r.res.status === 422) { step("✖", "HTTP 422 — paramètre invalide.", "Le paramètre <code>page</code> est peut-être attendu différemment.", "err"); showRaw(r.text); return false; }
    if (!r.res.ok) { step("✖", `HTTP ${r.res.status} ${r.res.statusText}`, "", "err"); showRaw(r.text); return false; }
    step("✓", `HTTP ${r.res.status} — authentification OK.`, "", "ok");

    // JSON ?
    if (r.json === null) {
      step("⚠", "Réponse non JSON.", "Contenu brut ci-dessous — peut-être du HTML (page de login ?).", "warn");
      showRaw(r.text); return false;
    }
    step("✓", "Réponse parsée en JSON.", "", "ok");

    // Tableau ?
    const arr = findArray(r.json);
    if (!arr) {
      const keys = typeof r.json === "object" ? Object.keys(r.json).join(", ") : typeof r.json;
      step("⚠", "Aucun tableau dans la réponse.", `Clés détectées : <code>${keys}</code>`, "warn");
      showRaw(r.text); return false;
    }
    step("✓", `Page 1 : ${arr.length} fichier(s).`, "", "ok");

    if (arr.length) {
      const sample = arr[0];
      const keys = Object.keys(sample);
      const hasId = keys.some(k => ["id","file_id","uuid"].includes(k));
      const hasUrl = keys.some(k => ["url","raw_url"].includes(k));
      step(hasId && hasUrl ? "✓" : "⚠",
        `Champs du 1er objet : <code>${keys.join(", ")}</code>`,
        hasId && hasUrl ? "" : "Champs <code>id</code> ou <code>url</code> manquants — vérifie.",
        hasId && hasUrl ? "ok" : "warn");
      showRaw(JSON.stringify(sample, null, 2));
    }
    return true;
  }

  // ---------- transformation ----------
  function normalize(f) {
    return {
      id: f.id ?? f.file_id ?? f.uuid ?? null,
      url: f.url || f.raw_url || null,
      raw_url: f.raw_url || f.url || null,
      type: f.type || f.mime || f.content_type || "",
      size: f.size ?? f.bytes ?? null,
      collection: f.collection || f.collection_slug || null,
      expires_at: f.expires_at || f.expiresAt || null,
    };
  }

  function isExpired(f) { return f.expires_at && new Date(f.expires_at) < new Date(); }
  function fmtSize(n) {
    if (!n && n !== 0) return "";
    const u = ["o","Ko","Mo","Go"]; let i = 0; n = Number(n);
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return `${n.toFixed(i ? 1 : 0)} ${u[i]}`;
  }

  function render() {
    const f = state.filter.toLowerCase();
    const list = state.files.filter(x => {
      if (state.collection && x.collection !== state.collection) return false;
      if (!f) return true;
      return (x.id + " " + (x.url||"") + " " + x.type).toLowerCase().includes(f);
    });
    el.count.textContent = `${list.length} fichier${list.length > 1 ? "s" : ""}`;
    if (!list.length) {
      el.grid.innerHTML = "";
      el.empty.style.display = "block";
      el.empty.textContent = state.files.length ? "Aucun résultat pour ce filtre." : "Aucun fichier.";
      return;
    }
    el.empty.style.display = "none";
    el.grid.innerHTML = list.map(x => {
      const expired = isExpired(x);
      const isImg = /^image\//.test(x.type) || /\.(png|jpe?g|gif|webp|avif|svg)$/i.test(x.url||"");
      const thumb = isImg && x.raw_url
        ? `<img loading="lazy" src="${x.raw_url}" alt="" onerror="this.style.display='none';this.parentNode.innerHTML+='<div class=ext>image indisponible</div>'">`
        : `<div class="ext">📄 ${x.type || "fichier"}</div>`;
      const exp = x.expires_at
        ? `<span class="badge ${expired ? "warn" : ""}">${expired ? "expiré" : "expire " + new Date(x.expires_at).toLocaleString()}</span>`
        : `<span class="badge ok">permanent</span>`;
      return `
        <div class="card" data-id="${x.id}">
          <div class="thumb" data-open="${x.raw_url || ""}">${thumb}</div>
          <div class="meta">
            <div class="id" title="${x.id}">${x.id}</div>
            <div class="row" style="align-items:center">${exp}
              ${x.size != null ? `<span class="badge">${fmtSize(x.size)}</span>` : ""}
              ${x.collection ? `<span class="badge">${x.collection}</span>` : ""}
            </div>
            <div class="row">
              <button class="ghost" data-copy="${x.raw_url || ""}">Copier URL</button>
              <button class="danger" data-del="${x.id}">Supprimer</button>
            </div>
          </div>
        </div>`;
    }).join("");
  }

  // ---------- chargement paginé ----------
  async function load() {
    el.status.textContent = "Chargement…";
    el.refresh.disabled = true;

    const ok = await diagnose();
    if (!ok) { el.status.textContent = "❌ Échec — voir le diagnostic."; el.refresh.disabled = false; return; }

    try {
      const all = [];
      let page = 1;
      const seen = new Set();
      while (page <= 50) { // garde-fou
        const r = await fetchFilesPage(page);
        if (!r.res.ok) {
          step("✖", `Page ${page} : HTTP ${r.res.status}`, "", "err");
          showRaw(r.text);
          break;
        }
        const arr = findArray(r.json) || [];
        if (!arr.length) break;

        let newCount = 0;
        for (const item of arr) {
          const n = normalize(item);
          if (!n.id) continue;
          if (seen.has(n.id)) continue;
          seen.add(n.id);
          all.push(n);
          newCount++;
        }
        step("✓", `Page ${page} : ${arr.length} reçu(s), ${newCount} nouveau(x).`, "", "ok");

        if (newCount === 0 || arr.length === 0) break;
        page++;
      }

      state.files = all;
      const cols = [...new Set(all.map(f => f.collection).filter(Boolean))];
      el.collection.innerHTML = `<option value="">Toutes les collections</option>` +
        cols.map(c => `<option ${c === state.collection ? "selected" : ""}>${c}</option>`).join("");
      el.status.textContent = "";
      render();
      toast(`${all.length} fichier(s) chargé(s) — ${page - 1} page(s)`);
    } catch (e) {
      el.status.textContent = "❌ " + e.message;
      toast("Erreur : " + e.message);
    } finally {
      el.refresh.disabled = false;
    }
  }

  // ---------- suppression ----------
  function confirmDelete(id, url) {
    const box = document.createElement("div");
    box.className = "confirm";
    box.innerHTML = `
      <h3>Supprimer ce fichier ?</h3>
      <p>${id}<br>${url || ""}</p>
      <div class="row">
        <button class="danger" id="yes">Supprimer</button>
        <button class="ghost" id="no">Annuler</button>
      </div>`;
    el.modalImg.style.display = "none";
    el.modal.appendChild(box);
    el.modal.classList.add("open");
    const close = () => { box.remove(); el.modal.classList.remove("open"); el.modalImg.style.display = ""; };
    box.querySelector("#no").onclick = close;
    box.querySelector("#yes").onclick = async () => {
      box.querySelector("#yes").disabled = true;
      try {
        const res = await fetch(`${API}/files/${encodeURIComponent(id)}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${API_KEY}` },
        });
        if (!res.ok) {
          const t = await res.text().catch(()=>"");
          throw new Error(`HTTP ${res.status} ${t.slice(0,120)}`);
        }
        state.files = state.files.filter(f => f.id !== id);
        render();
        toast("Fichier supprimé ✅");
      } catch (e) {
        toast("Échec : " + e.message);
      } finally { close(); }
    };
  }

  // ---------- events ----------
  el.refresh.onclick = load;
  el.filter.oninput = (e) => { state.filter = e.target.value; render(); };
  el.collection.onchange = (e) => { state.collection = e.target.value; render(); };
  el.grid.addEventListener("click", (e) => {
    const copy = e.target.closest("[data-copy]");
    const del  = e.target.closest("[data-del]");
    const open = e.target.closest("[data-open]");
    if (copy) { if (copy.dataset.copy) navigator.clipboard.writeText(copy.dataset.copy); toast("URL copiée"); return; }
    if (del)  { confirmDelete(del.dataset.del, del.closest(".card").querySelector("[data-copy]")?.dataset.copy); return; }
    if (open && open.dataset.open) {
      el.modalImg.src = open.dataset.open;
      el.modalImg.style.display = "";
      el.modal.querySelectorAll(".confirm").forEach(n => n.remove());
      el.modal.classList.add("open");
    }
  });
  $("#modalClose").onclick = () => {
    el.modal.classList.remove("open");
    el.modal.querySelectorAll(".confirm").forEach(n => n.remove());
    el.modalImg.style.display = "";
  };
  el.modal.addEventListener("click", (e) => { if (e.target === el.modal) $("#modalClose").click(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && el.modal.classList.contains("open")) $("#modalClose").click();
  });

  load();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscription Écoles - NeTubeX RDC</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:30px 24px;max-width:500px;width:100%;box-shadow:0 10px 40px rgba(15,23,42,.1)}
.logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#007fff,#0066cc);display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin:0 auto 16px}
h1{font-size:22px;font-weight:900;text-align:center;color:#0f172a;margin-bottom:6px}
.subtitle{font-size:14px;text-align:center;color:#64748b;margin-bottom:22px}
.field{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:800;color:#475569;text-transform:uppercase;margin-bottom:6px;letter-spacing:.4px}
input,select{width:100%;padding:14px 16px;border:2px solid #e2e8f0;border-radius:12px;font-size:15px;background:#f8fafc;color:#0f172a;outline:none;font-family:inherit}
input:focus,select:focus{border-color:#007fff;background:#fff}
.phone-field{display:flex;align-items:center;background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;overflow:hidden}
.phone-field:focus-within{border-color:#007fff;background:#fff}
.phone-field span{padding:0 12px;font-weight:900;color:#64748b;font-size:15px}
.phone-field input{flex:1;border:none;background:transparent;padding:14px 12px 14px 0}
.btn{width:100%;padding:16px;border-radius:14px;font-size:15px;font-weight:900;border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#007fff;color:#fff;margin-top:8px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:12px 14px;border-radius:10px;font-size:13px;font-weight:700;text-align:center;margin-bottom:14px;display:none;line-height:1.5}
.msg.err{background:#fef2f2;border:1.5px solid #fca5a5;color:#991b1b;display:block}
.msg.ok{background:#ecfdf5;border:1.5px solid #a7f3d0;color:#065f46;display:block}
.stats-box{background:#f1f5f9;border:1.5px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:16px;display:none}
.stats-box.show{display:block}
.stats-title{font-size:13px;font-weight:900;color:#0f172a;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat-item{background:#fff;border-radius:10px;padding:12px 8px;text-align:center;border:1px solid #e2e8f0}
.stat-value{font-size:22px;font-weight:900;color:#007fff;line-height:1}
.stat-label{font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><i class="fa-solid fa-school"></i></div>
  <h1>Inscription Écoles</h1>
  <p class="subtitle">Créez votre compte Professeur, Préfet ou Directeur</p>
  <div id="msg" class="msg"></div>

  <form id="formInscription">
    <div class="field">
      <label>Nom complet *</label>
      <input type="text" id="nom" required placeholder="Ex: Jean Kabila">
    </div>
    <div class="field">
      <label>Prénom *</label>
      <input type="text" id="prenom" required placeholder="Ex: Jean">
    </div>
    <div class="field">
      <label>Sexe *</label>
      <div style="display:flex;gap:6px;background:#f8fafc;padding:5px;border-radius:12px">
        <button type="button" id="sexeHomme" onclick="choisirSexe('homme')" style="flex:1;padding:12px;border-radius:8px;font-size:14px;font-weight:800;border:none;cursor:pointer;font-family:inherit;background:transparent;color:#475569;text-transform:uppercase">Homme</button>
        <button type="button" id="sexeFemme" onclick="choisirSexe('femme')" style="flex:1;padding:12px;border-radius:8px;font-size:14px;font-weight:800;border:none;cursor:pointer;font-family:inherit;background:transparent;color:#475569;text-transform:uppercase">Femme</button>
      </div>
      <input type="hidden" id="sexe" value="">
    </div>
    <div class="field">
      <label>Numéro WhatsApp *</label>
      <div class="phone-field">
        <span>+243</span>
        <input type="tel" id="phone" required maxlength="9" inputmode="numeric" placeholder="97 000 00 00">
      </div>
    </div>
    <div class="field">
      <label>Rôle *</label>
      <select id="role" required>
        <option value="">— Choisir —</option>
        <option value="professeur">👨‍🏫 Professeur</option>
        <option value="prefet">👑 Préfet</option>
        <option value="directeur">🏫 Directeur</option>
      </select>
    </div>
    <div class="field" id="ecoleField" style="display:none">
      <label>École de rattachement *</label>
      <select id="ecole">
        <option value="">— Chargement —</option>
      </select>
    </div>

    <div class="stats-box" id="statsBox">
      <div class="stats-title"><i class="fa-solid fa-chart-simple" style="color:#007fff"></i> Statistiques de l'école</div>
      <div class="stats-grid">
        <div class="stat-item"><div class="stat-value" id="statPrefets">0</div><div class="stat-label">Préfets</div></div>
        <div class="stat-item"><div class="stat-value" id="statProfs">0</div><div class="stat-label">Profs</div></div>
        <div class="stat-item"><div class="stat-value" id="statNotes">0</div><div class="stat-label">Évals</div></div>
      </div>
    </div>

    <div class="field">
      <label>Mot de passe *</label>
      <input type="password" id="password" required minlength="6" maxlength="15" placeholder="6 à 15 caractères">
    </div>
    <button type="submit" class="btn" id="btnSubmit">
      <i class="fa-solid fa-user-plus"></i> Créer mon compte
    </button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
// ====== CONFIG FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
  authDomain: "netubexmoney.firebaseapp.com",
  projectId: "netubexmoney",
  storageBucket: "netubexmoney.firebasestorage.app",
  messagingSenderId: "856592608176",
  appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
};
const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// ====== VARIABLES ======
let _sexe = '';
const $ = (id) => document.getElementById(id);

// ====== SEXE ======
function choisirSexe(s) {
  _sexe = s;
  $('sexe').value = s;
  if (s === 'homme') {
    $('sexeHomme').style.background = '#007fff';
    $('sexeHomme').style.color = '#fff';
    $('sexeFemme').style.background = 'transparent';
    $('sexeFemme').style.color = '#475569';
  } else {
    $('sexeFemme').style.background = '#007fff';
    $('sexeFemme').style.color = '#fff';
    $('sexeHomme').style.background = 'transparent';
    $('sexeHomme').style.color = '#475569';
  }
}

// ====== CHARGER ÉCOLES ======
async function chargerEcoles() {
  const sel = $('ecole');
  try {
    const ecolesSnap = await db.collection('ecoles').get();
    const profsSnap = await db.collection('professeurs').get();
    const profsParEcole = {};
    const notesParEcole = {};
    profsSnap.forEach(d => {
      const p = d.data();
      Object.keys(p.ecoles || {}).forEach(eid => {
        profsParEcole[eid] = (profsParEcole[eid] || 0) + 1;
        const n = (p.ecoles[eid].notes ? Object.keys(p.ecoles[eid].notes).length : 0);
        notesParEcole[eid] = (notesParEcole[eid] || 0) + n;
      });
    });
    const ecoles = [];
    ecolesSnap.forEach(d => {
      const data = d.data();
      ecoles.push({
        id: d.id,
        nom: data.nom || 'Sans nom',
        ville: data.ville || '',
        nbPrefets: (data.prefets || []).length,
        nbProfs: profsParEcole[d.id] || 0,
        nbNotes: notesParEcole[d.id] || 0
      });
    });
    ecoles.sort((a, b) => a.nom.localeCompare(b.nom));
    if (ecoles.length === 0) {
      sel.innerHTML = '<option value="">— Aucune école —</option>';
      return;
    }
    sel.innerHTML = '<option value="">— Choisir une école —</option>' +
      ecoles.map(e => `<option value="${e.id}" data-prefets="${e.nbPrefets}" data-profs="${e.nbProfs}" data-notes="${e.nbNotes}">${e.nom} — ${e.ville}</option>`).join('');
  } catch (e) {
    console.error é(e);
    sel.innerHTML = '<option value="">—cole Erreur —</option>';
  }
}


// ====== ÉVÉ   NEMENTS UI ======
 const$('role').addEventListener('change', () => {
  const e role = $('role').value;
  $('ecoleField').style.display = role ? 'block' : 'none';
  if (!role) $('statsBox').classList.remove('show');
});

$('ecole').addEventListener('change', (e) => {
  const opt = e.target.options[e.target.selectedIndex];
  if (!opt || !opt.value) {
    $('statsBox').classList.remove('show');
    return;
  }
  $('statPrefets').textContent = opt.dataset.prefets || '0';
  $('statProfs').textContent = opt.dataset.profs || '0';
  $('statNotes').textContent = opt.dataset.notes || '0';
  $('statsBox').classList.add('show');
});

// ====== INSCRIPTION (LOGIGUE EXACTE DE L'APP NETUBEX) ======
async function inscrire(e) {
  e.preventDefault();
  const msg = $('msg');
  const btn = $('btnSubmit');
  const nom = $('nom').value.trim();
  const prenom = $('prenom').value.trim();
  const phoneRaw = $('phone').value.replace(/[^\d]/g, '');
  const role = $('role').value;
  const ecoleId = $('ecole').value;
  const password = $('password').value;

  msg.className = 'msg';
  msg.style.display = 'none';

  if (!nom || !prenom || !_sexe || phoneRaw.length !== 9 || !role || !ecoleId || !password) {
    msg.className = 'msg err';
    msg.textContent = 'Remplissez tous les champs.';
    return;
  }
  if (password.length < 6) {
    msg.className = 'msg err';
    msg.textContent = 'Mot de passe : minimum 6 caractères.';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Création…';

  const phone = '+243' + phoneRaw;
  const nomComplet = nom + ' ' + prenom;
  const nse = nomComplet.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
  const email = nse + phoneRaw + '@gmail.com';

  try {
    // 1. Vérifier téléphone unique
    const snap = await db.collection('netubers').where('phone', '==', phone).limit(1).get();
    if (!snap.empty) {
      msg.className = 'msg err';
      msg.textContent = 'Numéro déjà inscrit.';
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Créer mon compte';
      return;
    }

    // 2. Créer compte Firebase Auth
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    const dateNow = new Date().toISOString();

    // 3. Profil netubers
    const codeParrainage = 'NTX-' + uid.slice(0, 6).toUpperCase();
    await db.collection('netubers').doc(uid).set({
      prenom: prenom,
      nom: nom,
      nomComplet: nomComplet,
      sexe: _sexe,
      phone: phone,
      emailAuth: email,
      code: password,
      ville: '',
      quartier: '',
      actif: true,
      avatarUrl: '',
      role: role,
      ecoleId: ecoleId,
      professeurId: role === 'professeur' ? uid : null,
      dateCreation: dateNow,
      motDePasseProvisoire: false,
      stats: { deblocages: 0, commandes: 0, parrainage: 0, jetons: 0, badges: [] },
      notifications: [],
      parrainage: { code: codeParrainage, count: 0, palier: 0, joursRestants: 0, dateDernierePub: null }
    });

    // 4. Stats
    await db.collection('user_stats').doc(uid).set({
      totalVues: 0, nbAnnonces: 0, nbPubliees: 0, nbEnAttente: 0, nbRefusees: 0,
      totalDeblocages: 0, totalCommerceVues: 0, nbProduitsCommerce: 0,
      derniereMiseAJour: dateNow
    });

    // 5. Index téléphone
    try { await db.collection('phone_index').doc(phoneRaw).set({ uid: uid, dateCreation: dateNow }); } catch (e) {}

    // 6. RattachementcoleSnap = await db.collection('ecoles').doc(ecoleId).get();
    const ecoleData = ecoleSnap.exists ? ecoleSnap.data() : { nom: 'École', ville: '' };

    if (role === 'prefet' || role === 'directeur') {
      const prefets = ecoleData.prefets || [];
      if (!prefets.includes(uid)) prefets.push(uid);
      await db.collection('ecoles').doc(ecoleId).set({
        prefets: prefets,
        prefetPrincipal: ecoleData.prefetPrincipal || uid
      }, { merge: true });
    }

    if (role === 'professeur') {
      const ecolesObj = {};
      ecolesObj[ecoleId] = {
        ecoleNom: ecoleData.nom || 'École',
        dateAjout: dateNow, dateDebut: dateNow,
        statut: 'approuve', ajoutePar: uid, ajouteParNom: nomComplet,
        notes: {}, moyenneEcole: 0, nombreNotesEcole: 0
      };
      await db.collection('professeurs').doc(uid).set({
        uid: uid, nom: nomComplet, matiere: '', sections: [],
        ville: ecoleData.ville || '', anneesExperience: 0,
        diplomes: [], avatarUrl: '', bio: '', telephone: phone,
        contactActif: false, ecoles: ecolesObj, notesGlobales: {},
        moyenneGlobale: 0, nombreGlobal: 0, responsables: [],
        emailGen: email, dateCreation: dateNow, actif: true,
        creePar: 'auto-inscription'
      });
    }

    await auth.signOut();

    msg.className = 'msg ok';
    msg.innerHTML = '✅ Compte <strong>' + role + '</strong> créé et rattaché à <strong>' + (ecoleData.nom || 'École') + '</strong> !<br><br>Connectez-vous sur <strong>NeTubeX RDC</strong> avec :<br>📱 ' + phone + '<br>🔑 ' + password;
    $('formInscription').reset();
    _sexe = '';
    $('sexeHomme').style.background = 'transparent';
    $('sexeHomme').style.color = '#475569';
    $('sexeFemme').style.background = 'transparent';
    $('sexeFemme').style.color = '#475569';
    $('ecoleField').style.display = 'none';
    $('statsBox').classList.remove('show');
    btn.innerHTML = '<i class="fa-solid fa-check"></i> Compte créé';
    btn.disabled = true;
  } catch (err) {
    console.error(err);
    let txt = 'Erreur : ' + (err.message || 'inconnue');
    if (err.code === 'auth/email-already-in-use') txt = 'Cet email existe déjà.';
    if (err.code === 'auth/invalid-email') txt = 'Email invalide.';
    if (err.code === 'auth/weak-password') txt = 'Mot de passe trop faible.';
    msg.className = 'msg err';
    msg.textContent = txt;
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Créer mon compte';
  }
}

// ====== INITIALISATION ======
$('formInscription').addEventListener('submit', inscrire);
chargerEcoles();
</script>
</body>
</html>

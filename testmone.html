<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Adsterra iframe</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background:#f8fafc; margin:0; padding:16px; }
  .container { max-width:700px; margin:0 auto; }

  h1 { font-size:20px; font-weight:900; margin:0 0 4px; color:#0f172a; }
  .sub { color:#64748b; font-size:13px; margin:0 0 12px; }

  .status { padding:12px 16px; border-radius:10px; font-size:13.5px;
            font-weight:800; margin-bottom:16px; display:flex;
            align-items:center; gap:10px; }
  .status.ok   { background:#d1fae5; color:#065f46; }
  .status.err  { background:#fee2e2; color:#991b1b; }
  .status.wait { background:#fef3c7; color:#78350f; }

  .fb-post-ad {
    width:100%;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    padding:0 0 12px;
    border:1px solid #e2e8f0;
  }
  .fb-post-ad-head {
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:10px;
    padding:12px 14px 8px;
  }
  .fb-post-ad-avatar {
    width:44px; height:44px; border-radius:50%;
    background:#f59e0b; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
  }
  .fb-post-ad-name {
    font-weight:800; font-size:14.5px;
    color:#0f172a; line-height:1.35;
  }
  .fb-post-ad-badge {
    font-size:10px; font-weight:900; padding:5px 9px;
    border-radius:6px; text-transform:uppercase;
    letter-spacing:.4px; background:#f59e0b;
    color:#fff; flex-shrink:0;
  }

  /* ⭐ HAUTEUR RÉDUITE POUR RESSEMBLER AUX POSTS ⭐ */
  .fb-post-ad-media {
    width:100%;
    background:#f1f5f9;
    overflow:hidden;
    position:relative;
    height:340px;
    border:0;
  }
  .fb-post-ad-media iframe {
    width:100%;
    height:100%;
    border:0;
    display:block;
    overflow:hidden;
  }

  @media(min-width:640px){
    .fb-post-ad-media { height:400px; }
  }
  @media(min-width:1024px){
    .fb-post-ad-media { height:380px; }
  }

  #logBox {
    background:#020617; color:#5cb3ff; padding:14px;
    border-radius:10px; font-family:ui-monospace,monospace;
    font-size:11.5px; line-height:1.5; max-height:300px;
    overflow-y:auto; margin-top:16px;
  }
  #logBox .err { color:#f87171; }
  #logBox .ok { color:#4ade80; }
  #logBox .warn { color:#fbbf24; }
  #logBox .dim { color:#64748b; }
  #logBox > div { margin-bottom:3px; }

  .btn { padding:10px 18px; border-radius:8px; border:none;
    cursor:pointer; font-family:inherit; font-weight:900;
    font-size:13px; background:#007fff; color:#fff; margin-right:8px; }
  .btn.gray { background:#334155; }
  .info-badge { display:inline-block; padding:6px 12px; border-radius:8px;
    background:#0f172a; color:#5cb3ff; font-size:11px;
    font-weight:900; font-family:ui-monospace,monospace;
    margin:4px 4px 4px 0; }
</style>
</head>
<body>

<div class="container">

  <h1>🧪 Test Adsterra iframe</h1>
  <p class="sub">Hauteur réduite : 340 / 400 / 380 px selon écran</p>

  <div>
    <span class="info-badge" id="info1">État: attente</span>
    <span class="info-badge" id="info2">Hauteur: — px</span>
  </div>

  <div id="status" class="status wait" style="margin-top:12px">
    <span>⏳</span> <span id="statusText">Chargement…</span>
  </div>

  <article class="fb-post-ad">
    <div class="fb-post-ad-head">
      <div class="fb-post-ad-avatar">📢</div>
      <div style="min-width:0;overflow:hidden">
        <div class="fb-post-ad-name">Sponsorisé</div>
      </div>
      <span class="fb-post-ad-badge">PUBLICITÉ</span>
    </div>
    <div class="fb-post-ad-media" id="adIframe"></div>
  </article>

  <button class="btn" onclick="location.reload()">🔄 Relancer</button>
  <button class="btn gray" onclick="document.getElementById('logBox').innerHTML=''">🗑️ Vider</button>

  <div id="logBox"></div>

</div>

<script>
(function() {
  'use strict';

  var logEl = document.getElementById('logBox');
  var statusEl = document.getElementById('status');
  var statusTxt = document.getElementById('statusText');
  var info1 = document.getElementById('info1');
  var info2 = document.getElementById('info2');
  var adIframe = document.getElementById('adIframe');

  function log(msg, cls) {
    cls = cls || '';
    var d = document.createElement('div');
    d.className = cls;
    var t = new Date().toLocaleTimeString('fr-FR');
    d.textContent = '[' + t + '] ' + msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(txt, cls, icon) {
    statusEl.className = 'status ' + cls;
    statusTxt.textContent = txt;
    statusEl.querySelector('span').textContent = icon;
  }

  // Créer l'iframe
  var iframe = document.createElement('iframe');
  iframe.src = 'pub.html';
  iframe.setAttribute('scrolling', 'no');
  iframe.setAttribute('frameborder', '0');
  iframe.style.width = '100%';
  iframe.style.height = '100%';
  iframe.style.border = '0';
  iframe.style.display = 'block';
  iframe.style.overflow = 'hidden';

  iframe.onload = function() {
    log('✅ iframe chargée', 'ok');
    info1.textContent = 'État: chargée';
  };

  adIframe.appendChild(iframe);
  info2.textContent = 'Hauteur: ' + adIframe.offsetHeight + 'px';

  log('⏳ iframe injectée', 'dim');
  log('📏 Hauteur actuelle: ' + adIframe.offsetHeight + 'px', 'ok');

  setTimeout(function() {
    info2.textContent = 'Hauteur: ' + adIframe.offsetHeight + 'px';
    log('📏 Hauteur finale: ' + adIframe.offsetHeight + 'px', 'ok');
    setStatus('Test terminé ✅', 'ok', '✅');
  }, 8000);
})();
</script>

</body>
</html>

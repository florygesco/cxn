<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Private Bank</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b0e14;--panel:#121722;--panel2:#1a2130;--bord:#232c3d;--texte:#e6eaf2;--doux:#8b95a7;--primaire:#4f8cff;--primaire2:#3a7bf0;--ok:#22c55e;--danger:#ef4444;--rayon:14px;--ombre:0 4px 20px rgba(0,0,0,.35)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 600px at 20% -10%,#16203a 0%,var(--bg) 55%);color:var(--texte);min-height:100vh}
#app{max-width:1200px;margin:0 auto;padding:24px}
.topbar{display:flex;align-items:center;gap:18px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--bord);padding:20px 24px;border-radius:var(--rayon);box-shadow:var(--ombre);margin-bottom:22px;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;letter-spacing:-.4px;background:linear-gradient(90deg,#4f8cff,#9b6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--doux);letter-spacing:.4px;-webkit-text-fill-color:var(--doux)}
.solde-total{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end}
.solde-total .label{font-size:11px;color:var(--doux);text-transform:uppercase;letter-spacing:1px}
.solde-total .valeur{font-size:26px;font-weight:800;color:var(--texte)}
.btn-logout{background:transparent;border:1px solid var(--bord);color:var(--doux);padding:9px 15px;border-radius:9px;font-size:13px;cursor:pointer;transition:.15s}
.btn-logout:hover{border-color:var(--danger);color:var(--danger)}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--bord);border-radius:var(--rayon);padding:20px;box-shadow:var(--ombre)}
.panel h2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--doux);margin-bottom:16px}
.section{margin-bottom:22px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--doux)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.carte-enveloppe{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--bord);border-radius:var(--rayon);padding:16px;display:flex;flex-direction:column;gap:9px;transition:.15s;position:relative;overflow:hidden}
.carte-enveloppe:hover{transform:translateY(-3px);border-color:#33415c}
.carte-enveloppe.masquee{opacity:.45}
.carte-enveloppe::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent,#4f8cff)}
.carte-enveloppe .nom{font-weight:700;font-size:15px;padding-left:6px}
.carte-enveloppe .solde{font-size:22px;font-weight:800;padding-left:6px}
.carte-enveloppe .objectif{font-size:12px;color:var(--doux);padding-left:6px}
.pct-badge{align-self:flex-start;font-size:11px;background:rgba(79,140,255,.15);color:var(--primaire);padding:3px 9px;border-radius:20px;font-weight:700;margin-left:6px}
.barre-progress{height:7px;background:#0d1220;border-radius:4px;overflow:hidden;margin-left:6px}
.barre-progress>div{height:100%;border-radius:4px;transition:width .4s}
.carte-actions{display:flex;gap:14px;margin-top:4px;padding-left:6px}
.carte-actions button{background:none;border:none;cursor:pointer;font-size:12px;color:var(--doux);padding:4px 0;transition:.15s}
.carte-actions button:hover{color:var(--primaire)}
.carte-actions button.suppr:hover{color:var(--danger)}
.btn-primary{background:linear-gradient(180deg,var(--primaire),var(--primaire2));color:#fff;border:none;padding:11px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;transition:.15s;box-shadow:0 4px 14px rgba(79,140,255,.25)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:rgba(79,140,255,.08);color:var(--primaire);border:1px solid rgba(79,140,255,.3);padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;transition:.15s}
.btn-ghost:hover{background:rgba(79,140,255,.16)}
.vide{color:var(--doux);font-size:14px;padding:16px 0}
.cache{display:none!important}
select{background:var(--panel2);color:var(--texte);border:1px solid var(--bord);padding:10px 12px;border-radius:9px;font-size:14px;width:100%;cursor:pointer}
select:focus{outline:none;border-color:var(--primaire)}
.historique{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto;padding-right:4px}
.ligne-historique{background:var(--panel2);border:1px solid var(--bord);border-radius:12px;padding:13px 15px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ligne-historique .infos{display:flex;flex-direction:column;gap:3px}
.ligne-historique .date{font-size:11px;color:var(--doux);text-transform:uppercase;letter-spacing:.5px}
.ligne-historique .montant{font-weight:800;font-size:16px;color:var(--ok)}
.ligne-historique .note{font-size:13px;color:var(--texte)}
.repartition{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.repartition span{font-size:11px;background:#0d1220;padding:4px 9px;border-radius:20px;color:var(--doux);border:1px solid var(--bord)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-content{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--bord);border-radius:var(--rayon);padding:26px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:9px;max-height:90vh;overflow-y:auto;box-shadow:var(--ombre)}
.modal-content h3{font-size:18px;margin-bottom:6px}
.modal-content label{font-size:12px;color:var(--doux);margin-top:8px;text-transform:uppercase;letter-spacing:.5px}
.modal-content input{padding:11px 13px;border:1px solid var(--bord);border-radius:9px;font-size:14px;width:100%;background:var(--panel2);color:var(--texte)}
.modal-content input:focus{outline:none;border-color:var(--primaire)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.apercu{display:flex;flex-direction:column;gap:6px;margin-top:10px;background:#0d1220;padding:12px;border-radius:9px;border:1px solid var(--bord)}
.apercu .ligne{display:flex;justify-content:space-between;font-size:13px;color:var(--doux)}
.apercu .ligne strong{color:var(--texte)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--bord);color:var(--texte);padding:13px 22px;border-radius:10px;font-size:14px;z-index:200;box-shadow:var(--ombre)}
canvas{width:100%;height:220px;display:block}
.erreur{color:var(--danger);font-size:13px;margin-top:8px}
#ecranLogin{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--bord);padding:38px 34px;border-radius:var(--rayon);box-shadow:var(--ombre);width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
.login-box h1{font-size:24px;margin-bottom:2px;background:linear-gradient(90deg,#4f8cff,#9b6bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-box p{font-size:13px;color:var(--doux);margin-bottom:14px}
.login-box label{font-size:12px;color:var(--doux);text-transform:uppercase;letter-spacing:.5px}
.login-box input{padding:12px 13px;border:1px solid var(--bord);border-radius:9px;font-size:14px;width:100%;background:var(--panel2);color:var(--texte)}
.login-box input:focus{outline:none;border-color:var(--primaire)}
.login-box button{margin-top:14px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:stretch}.solde-total{align-items:flex-start}}
</style>
</head>
<body>
<div id="ecranLogin">
<div class="login-box">
<h1>Private Bank</h1>
<p>Sign in to access your vault</p>
<label for="loginEmail">Email</label>
<input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="username">
<label for="loginPassword">Password</label>
<input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
<button id="btnLogin" class="btn-primary">Sign in</button>
<p id="loginErreur" class="erreur cache"></p>
</div>
</div>
<div id="ecranApp" class="cache">
<div id="app">
<header class="topbar">
<div class="brand">Private Bank<small>Personal Wealth Vault</small></div>
<div class="solde-total">
<span class="label">Total Balance</span>
<span id="soldeTotal" class="valeur">0</span>
</div>
<button id="btnDepot" class="btn-primary">+ Deposit</button>
<button id="btnLogout" class="btn-logout">Log out</button>
</header>
<div class="layout">
<div class="panel">
<h2>Balance by Envelope</h2>
<canvas id="chartBar"></canvas>
</div>
<div class="panel">
<h2>Monthly Deposits</h2>
<canvas id="chartLine"></canvas>
</div>
</div>
<section class="section">
<div class="section-head">
<h2>Envelopes</h2>
<button id="btnNouvelleEnveloppe" class="btn-ghost">+ New Envelope</button>
</div>
<div id="listeEnveloppes" class="grid"></div>
<p id="messageVideEnveloppes" class="vide">No envelopes yet. Create one to get started.</p>
</section>
<section class="section">
<div class="section-head">
<h2>History</h2>
<select id="filtreEnveloppe" style="max-width:240px"><option value="">All envelopes</option></select>
</div>
<div id="listeHistorique" class="historique"></div>
<p id="messageVideHistorique" class="vide">No deposits recorded.</p>
</section>
<div id="modalDepot" class="modal cache">
<div class="modal-content">
<h3>New Deposit</h3>
<label for="selectEnveloppeDepot">Target</label>
<select id="selectEnveloppeDepot"><option value="__auto__">Auto-split (all envelopes)</option></select>
<label for="inputMontantDepot">Amount received</label>
<input type="number" id="inputMontantDepot" min="0" step="any" placeholder="0">
<label for="inputNoteDepot">Note (optional)</label>
<input type="text" id="inputNoteDepot" placeholder="e.g. November salary">
<div id="apercuRepartition" class="apercu"></div>
<div class="modal-actions">
<button id="btnAnnulerDepot" class="btn-ghost">Cancel</button>
<button id="btnValiderDepot" class="btn-primary">Confirm</button>
</div>
</div>
</div>
<div id="modalEnveloppe" class="modal cache">
<div class="modal-content">
<h3 id="titreModalEnveloppe">New Envelope</h3>
<label for="inputNomEnveloppe">Name</label>
<input type="text" id="inputNomEnveloppe" placeholder="e.g. Project savings">
<label for="inputObjectifEnveloppe">Goal (optional)</label>
<input type="number" id="inputObjectifEnveloppe" min="0" step="any" placeholder="0">
<label for="inputPourcentageEnveloppe">Allocation percentage (%)</label>
<input type="number" id="inputPourcentageEnveloppe" min="0" max="100" step="any" placeholder="0">
<label for="inputCouleurEnveloppe">Color</label>
<input type="color" id="inputCouleurEnveloppe" value="#4f8cff">
<div class="modal-actions">
<button id="btnAnnulerEnveloppe" class="btn-ghost">Cancel</button>
<button id="btnValiderEnveloppe" class="btn-primary">Save</button>
</div>
</div>
</div>
<div id="toast" class="toast cache"></div>
</div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",authDomain:"gesco-67c43.firebaseapp.com",projectId:"gesco-67c43",storageBucket:"gesco-67c43.firebasestorage.app",messagingSenderId:"333004443566",appId:"1:333004443566:web:de41f60000e418dce9023f",measurementId:"G-V7MF88Y5EE"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const ADMIN_EMAIL="ngendaflory2@gmail.com";
const DOC_REF=doc(db,"banque","data");
let etat={config:{devise:"FC"},enveloppes:[],transactions:[]};
let indexEdition=-1;
let filtreActif="";
const $=id=>document.getElementById(id);
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.remove("cache");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add("cache"),2500)}
function formatMontant(n){const v=Number(n)||0;return v.toLocaleString("en-US",{maximumFractionDigits:2})+" "+etat.config.devise}
function soldeEnveloppe(id){return etat.transactions.reduce((s,t)=>{const l=t.repartition.find(r=>r.envId===id);return s+(l?l.montant:0)},0)}
function soldeTotal(){return etat.transactions.reduce((s,t)=>s+t.montant,0)}
async function charger(){try{const snap=await getDoc(DOC_REF);if(snap.exists()){const d=snap.data();etat={config:d.config||{devise:"FC"},enveloppes:d.enveloppes||[],transactions:d.transactions||[]}}else{await setDoc(DOC_REF,etat)}}catch(e){toast("Firebase load error");console.error(e)}rendre()}
async function sauver(){try{await setDoc(DOC_REF,etat)}catch(e){toast("Save error");console.error(e)}}
function rendre(){$("soldeTotal").textContent=formatMontant(soldeTotal());rendreEnveloppes();rendreFiltre();rendreHistorique();dessinerGraphiques()}
function rendreEnveloppes(){const zone=$("listeEnveloppes");zone.innerHTML="";$("messageVideEnveloppes").classList.toggle("cache",etat.enveloppes.length>0);etat.enveloppes.forEach((env,i)=>{const solde=soldeEnveloppe(env.id);const pct=env.objectif>0?Math.min(100,solde/env.objectif*100):0;const carte=document.createElement("div");carte.className="carte-enveloppe"+(env.masquee?" masquee":"");carte.style.setProperty("--accent",env.couleur||"#4f8cff");carte.innerHTML=`<div class="nom">${env.nom}</div><div class="solde">${formatMontant(solde)}</div>${env.objectif>0?`<div class="objectif">Goal: ${formatMontant(env.objectif)} · ${pct.toFixed(1)}%</div><div class="barre-progress"><div style="width:${pct}%;background:${env.couleur||"#4f8cff"}"></div></div>`:""}<span class="pct-badge">${env.pourcentage}%</span><div class="carte-actions"><button data-action="edit" data-i="${i}">Edit</button><button data-action="mask" data-i="${i}">${env.masquee?"Show":"Hide"}</button><button class="suppr" data-action="del" data-i="${i}">Delete</button></div>`;zone.appendChild(carte)})}
function rendreFiltre(){const sel=$("filtreEnveloppe");sel.innerHTML='<option value="">All envelopes</option>';etat.enveloppes.forEach(env=>{const o=document.createElement("option");o.value=env.id;o.textContent=env.nom;sel.appendChild(o)});sel.value=filtreActif;const sel2=$("selectEnveloppeDepot");const cur=sel2.value;sel2.innerHTML='<option value="__auto__">Auto-split (all envelopes)</option>';etat.enveloppes.filter(e=>!e.masquee).forEach(env=>{const o=document.createElement("option");o.value=env.id;o.textContent=env.nom+" ("+env.pourcentage+"%)";sel2.appendChild(o)});if([...sel2.options].some(o=>o.value===cur))sel2.value=cur}
function rendreHistorique(){const zone=$("listeHistorique");zone.innerHTML="";let liste=etat.transactions;if(filtreActif)liste=liste.filter(t=>t.repartition.some(r=>r.envId===filtreActif));$("messageVideHistorique").classList.toggle("cache",liste.length>0);[...liste].reverse().forEach(t=>{const el=document.createElement("div");el.className="ligne-historique";const date=new Date(t.date).toLocaleString("en-US",{dateStyle:"medium",timeStyle:"short"});const rep=t.repartition.map(r=>`<span>${r.nom}: ${formatMontant(r.montant)}</span>`).join("");el.innerHTML=`<div class="infos"><span class="date">${date}</span><span class="montant">+ ${formatMontant(t.montant)}</span>${t.note?`<span class="note">${t.note}</span>`:""}<div class="repartition">${rep}</div></div>`;zone.appendChild(el)})}
function dessinerGraphiques(){dessinerBarres();dessinerLigne()}
function dessinerBarres(){const c=$("chartBar");const ctx=prep(c);const actives=etat.enveloppes.filter(e=>!e.masquee);if(actives.length===0){vide(ctx,c);return}const data=actives.map(e=>({nom:e.nom,valeur:soldeEnveloppe(e.id),couleur:e.couleur||"#4f8cff"}));const max=Math.max(...data.map(d=>d.valeur),1);const w=c.clientWidth,h=c.clientHeight;const padL=10,padR=10,padT=10,padB=44;const bw=(w-padL-padR)/data.length*0.6;const gap=(w-padL-padR)/data.length;ctx.font="11px sans-serif";ctx.textAlign="center";data.forEach((d,i)=>{const bh=(h-padT-padB)*(d.valeur/max);const x=padL+i*gap+(gap-bw)/2;const y=h-padB-bh;const g=ctx.createLinearGradient(0,y,0,h-padB);g.addColorStop(0,d.couleur);g.addColorStop(1,d.couleur+"33");ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x,y,bw,bh,[6,6,0,0]);ctx.fill();ctx.fillStyle="#8b95a7";const nom=d.nom.length>10?d.nom.slice(0,9)+"…":d.nom;ctx.fillText(nom,x+bw/2,h-padB+16);ctx.fillStyle="#e6eaf2";ctx.font="bold 11px sans-serif";ctx.fillText(compact(d.valeur),x+bw/2,y-6);ctx.font="11px sans-serif"})}
function dessinerLigne(){const c=$("chartLine");const ctx=prep(c);const parMois={};etat.transactions.forEach(t=>{const d=new Date(t.date);const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");parMois[k]=(parMois[k]||0)+t.montant});const cles=Object.keys(parMois).sort().slice(-6);if(cles.length===0){vide(ctx,c);return}const vals=cles.map(k=>parMois[k]);const max=Math.max(...vals,1);const w=c.clientWidth,h=c.clientHeight;const padL=36,padR=14,padT=14,padB=30;ctx.strokeStyle="#232c3d";ctx.lineWidth=1;for(let i=0;i<=3;i++){const y=padT+(h-padT-padB)*(i/3);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-padR,y);ctx.stroke()}const pts=cles.map((k,i)=>{const x=padL+(w-padL-padR)*(cles.length===1?0.5:i/(cles.length-1));const y=padT+(h-padT-padB)*(1-vals[i]/max);return{x,y,v:vals[i],k}});const grad=ctx.createLinearGradient(0,padT,0,h-padB);grad.addColorStop(0,"rgba(79,140,255,.4)");grad.addColorStop(1,"rgba(79,140,255,0)");ctx.beginPath();ctx.moveTo(pts[0].x,h-padB);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(pts[pts.length-1].x,h-padB);ctx.closePath();ctx.fillStyle=grad;ctx.fill();ctx.beginPath();pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.strokeStyle="#4f8cff";ctx.lineWidth=2.5;ctx.stroke();ctx.font="10px sans-serif";ctx.textAlign="center";pts.forEach(p=>{ctx.fillStyle="#4f8cff";ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();ctx.fillStyle="#8b95a7";const[d1]=p.k.split("-");ctx.fillText(p.k.slice(5)+"/"+d1.slice(2),p.x,h-10);ctx.fillStyle="#e6eaf2";ctx.font="bold 10px sans-serif";ctx.fillText(compact(p.v),p.x,p.y-9);ctx.font="10px sans-serif"})}
function prep(c){const r=window.devicePixelRatio||1;c.width=c.clientWidth*r;c.height=c.clientHeight*r;const ctx=c.getContext("2d");ctx.scale(r,r);ctx.clearRect(0,0,c.clientWidth,c.clientHeight);return ctx}
function vide(ctx,c){ctx.fillStyle="#8b95a7";ctx.font="13px sans-serif";ctx.textAlign="center";ctx.fillText("No data yet",c.clientWidth/2,c.clientHeight/2)}
function compact(n){if(n>=1e6)return(n/1e6).toFixed(1)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"k";return Math.round(n)}
function ouvrirModalDepot(){$("inputMontantDepot").value="";$("inputNoteDepot").value="";$("apercuRepartition").innerHTML="";$("selectEnveloppeDepot").value="__auto__";$("modalDepot").classList.remove("cache");majApercu()}
function fermerModalDepot(){$("modalDepot").classList.add("cache")}
function calculerRepartition(m){const cible=$("selectEnveloppeDepot").value;if(cible!=="__auto__"){const env=etat.enveloppes.find(e=>e.id===cible);if(!env)return[];return[{envId:env.id,nom:env.nom,montant:m}]}const actives=etat.enveloppes.filter(e=>!e.masquee);let total=0;const rep=actives.map(env=>{const part=Math.round(m*env.pourcentage)/100;total+=part;return{envId:env.id,nom:env.nom,montant:part}});const reste=m-total;if(Math.abs(reste)>0.001)rep.push({envId:"__rounding__",nom:"Rounding",montant:reste});return rep}
function majApercu(){const m=parseFloat($("inputMontantDepot").value)||0;const zone=$("apercuRepartition");zone.innerHTML="";if(m<=0)return;const rep=calculerRepartition(m);if(rep.length===0)return;rep.forEach(r=>{const l=document.createElement("div");l.className="ligne";l.innerHTML=`<span>${r.nom}</span><strong>${formatMontant(r.montant)}</strong>`;zone.appendChild(l)})}
function validerDepot(){const m=parseFloat($("inputMontantDepot").value);if(!m||m<=0){toast("Enter a valid amount");return}const rep=calculerRepartition(m);if(rep.length===0){toast("No envelope available");return}etat.transactions.push({date:new Date().toISOString(),montant:m,note:$("inputNoteDepot").value.trim(),repartition:rep});sauver();rendre();fermerModalDepot();toast("Deposit recorded")}
function ouvrirModalEnveloppe(i=-1){indexEdition=i;const t=$("titreModalEnveloppe");if(i>=0){const e=etat.enveloppes[i];t.textContent="Edit Envelope";$("inputNomEnveloppe").value=e.nom;$("inputObjectifEnveloppe").value=e.objectif||"";$("inputPourcentageEnveloppe").value=e.pourcentage;$("inputCouleurEnveloppe").value=e.couleur||"#4f8cff"}else{t.textContent="New Envelope";$("inputNomEnveloppe").value="";$("inputObjectifEnveloppe").value="";$("inputPourcentageEnveloppe").value="";$("inputCouleurEnveloppe").value="#4f8cff"}$("modalEnveloppe").classList.remove("cache")}
function fermerModalEnveloppe(){$("modalEnveloppe").classList.add("cache")}
function validerEnveloppe(){const nom=$("inputNomEnveloppe").value.trim();const objectif=parseFloat($("inputObjectifEnveloppe").value)||0;const pourcentage=parseFloat($("inputPourcentageEnveloppe").value)||0;const couleur=$("inputCouleurEnveloppe").value;if(!nom){toast("Name required");return}if(pourcentage<0||pourcentage>100){toast("Percentage must be 0-100");return}const autres=etat.enveloppes.filter((_,i)=>i!==indexEdition);const totalPct=autres.reduce((s,e)=>s+Number(e.pourcentage),0);if(totalPct+pourcentage>100){toast("Total allocation cannot exceed 100%");return}if(indexEdition>=0){etat.enveloppes[indexEdition]={...etat.enveloppes[indexEdition],nom,objectif,pourcentage,couleur}}else{etat.enveloppes.push({id:"env_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),nom,objectif,pourcentage,couleur,masquee:false})}sauver();rendre();fermerModalEnveloppe();toast("Envelope saved")}
function supprimerEnveloppe(i){if(!confirm("Delete this envelope? History is kept."))return;etat.enveloppes.splice(i,1);sauver();rendre();toast("Envelope deleted")}
function masquerEnveloppe(i){etat.enveloppes[i].masquee=!etat.enveloppes[i].masquee;sauver();rendre()}
function afficherErreurLogin(msg){const e=$("loginErreur");e.textContent=msg;e.classList.remove("cache")}
async function doLogin(){const email=$("loginEmail").value.trim();const pwd=$("loginPassword").value;if(!email||!pwd){afficherErreurLogin("Please enter email and password");return}try{$("loginErreur").classList.add("cache");await signInWithEmailAndPassword(auth,email,pwd)}catch(e){afficherErreurLogin("Invalid credentials")}}
async function doLogout(){await signOut(auth)}
$("btnDepot").addEventListener("click",ouvrirModalDepot);
$("btnAnnulerDepot").addEventListener("click",fermerModalDepot);
$("btnValiderDepot").addEventListener("click",validerDepot);
$("inputMontantDepot").addEventListener("input",majApercu);
$("selectEnveloppeDepot").addEventListener("change",majApercu);
$("btnNouvelleEnveloppe").addEventListener("click",()=>ouvrirModalEnveloppe());
$("btnAnnulerEnveloppe").addEventListener("click",fermerModalEnveloppe);
$("btnValiderEnveloppe").addEventListener("click",validerEnveloppe);
$("filtreEnveloppe").addEventListener("change",e=>{filtreActif=e.target.value;rendreHistorique()});
$("listeEnveloppes").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const i=parseInt(b.dataset.i);const a=b.dataset.action;if(a==="edit")ouvrirModalEnveloppe(i);else if(a==="del")supprimerEnveloppe(i);else if(a==="mask")masquerEnveloppe(i)});
$("btnLogin").addEventListener("click",doLogin);
$("loginPassword").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
$("btnLogout").addEventListener("click",doLogout);
window.addEventListener("resize",()=>{if(!$("ecranApp").classList.contains("cache"))dessinerGraphiques()});
onAuthStateChanged(auth,user=>{if(user&&user.email===ADMIN_EMAIL){$("ecranLogin").classList.add("cache");$("ecranApp").classList.remove("cache");charger()}else{if(user){signOut(auth)}$("ecranApp").classList.add("cache");$("ecranLogin").classList.remove("cache");$("loginPassword").value=""}});
</script>
</body>
</html>

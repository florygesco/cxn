<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>🏫 Direction - odari</title>
<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"}}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0A0A0A;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.container{max-width:480px;width:100%;}
.box{background:rgba(255,255,255,0.04);backdrop-filter:blur(60px);border-radius:32px;padding:36px 32px;border:1px solid rgba(255,255,255,0.06);box-shadow:0 40px 80px rgba(0,0,0,0.5);margin-bottom:12px;}
.box .logo{text-align:center;margin-bottom:16px;}
.box .logo .icon{background:linear-gradient(135deg,#EC4899,#8B5CF6);width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:28px;font-weight:900;color:#fff;box-shadow:0 0 40px rgba(236,72,153,0.2);}
.box h1{font-size:20px;font-weight:800;text-align:center;margin-top:6px;}
.box .sub{text-align:center;color:rgba(255,255,255,0.35);font-size:12px;margin-bottom:20px;}
.box label{display:block;font-size:10px;font-weight:600;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px;}
.box input{width:100%;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.06);color:#fff;font-size:14px;outline:none;transition:all 0.3s;margin-bottom:12px;}
.box input:focus{border-color:#8B5CF6;background:rgba(255,255,255,0.06);box-shadow:0 0 0 4px rgba(139,92,246,0.06);}
.box input::placeholder{color:rgba(255,255,255,0.12);}
.box select{width:100%;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,0.04);border:2px solid rgba(255,255,255,0.06);color:#fff;font-size:14px;outline:none;transition:all 0.3s;margin-bottom:12px;appearance:auto;cursor:pointer;}
.box select:focus{border-color:#8B5CF6;background:rgba(255,255,255,0.06);box-shadow:0 0 0 4px rgba(139,92,246,0.06);}
.box select option{background:#1a1a2e;color:#fff;}
.box select optgroup{background:#1a1a2e;color:rgba(255,255,255,0.5);font-weight:700;}
.box input.code-input{text-align:center;letter-spacing:8px;font-size:18px;font-family:monospace;}
.box .btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;transition:all 0.3s;color:#fff;margin-top:4px;}
.box .btn-success{background:linear-gradient(135deg,#10B981,#059669);box-shadow:0 8px 30px rgba(16,185,129,0.2);}
.box .btn-success:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(16,185,129,0.3);}
.box .btn-test{background:linear-gradient(135deg,#FBBF24,#F97316);box-shadow:0 8px 30px rgba(251,191,36,0.2);}
.box .btn-test:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(251,191,36,0.3);}
.box .btn-danger{background:linear-gradient(135deg,#EF4444,#DC2626);box-shadow:0 8px 30px rgba(239,68,68,0.2);}
.box .btn-danger:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(239,68,68,0.3);}
.box .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.box .error{color:#EC4899;font-size:12px;text-align:center;margin-top:6px;min-height:18px;}
.box .success{color:#10B981;font-size:12px;text-align:center;margin-top:6px;min-height:18px;}
.box .debug{background:rgba(255,255,255,0.02);border-radius:8px;padding:8px 12px;font-size:10px;color:rgba(255,255,255,0.3);margin-top:8px;font-family:monospace;word-break:break-all;max-height:80px;overflow-y:auto;}
.box .info{text-align:center;color:rgba(255,255,255,0.08);font-size:9px;margin-top:12px;}
.loader{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:1000;visibility:hidden;opacity:0;transition:all 0.3s;}
.modal.show{visibility:visible;opacity:1;}
.modal-box{background:rgba(20,20,40,0.98);border-radius:16px;padding:20px;max-width:380px;width:90%;border:1px solid rgba(255,255,255,0.06);text-align:center;}
.modal-box .big{font-size:40px;margin-bottom:6px;}
.modal-box .code-display{background:rgba(0,0,0,0.4);border-radius:10px;padding:12px;margin:10px 0;border:2px solid #10B981;}
.modal-box .code-display .num{font-size:28px;font-weight:800;letter-spacing:6px;color:#10B981;font-family:monospace;}
.modal-box .btn{width:auto;padding:8px 28px;border-radius:30px;border:none;font-weight:700;font-size:13px;cursor:pointer;background:#10B981;color:#fff;}
.modal-box .btn:hover{opacity:0.9;}
.toast{position:fixed;bottom:20px;right:20px;background:rgba(20,20,40,0.95);backdrop-filter:blur(20px);border-radius:10px;padding:10px 18px;border-left:3px solid #10B981;transform:translateY(100px);opacity:0;transition:all 0.3s;z-index:999;max-width:90%;font-size:13px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.error{border-left-color:#EC4899;}
.toast.warning{border-left-color:#FBBF24;}
</style>
</head>
<body>

<div class="container">
  <div class="box">
    <div class="logo"><div class="icon">🏫</div></div>
    <h1 id="schoolName">COMPLEXE SCOLAIRE ODARI</h1>
    <p class="sub">Direction · Ajouter un enseignant</p>

    <label>👤 Nom</label>
    <input type="text" id="ensNom" placeholder="KASONGO Jean" />

    <label>📚 Cycle</label>
    <select id="ensCycle" onchange="changerCycle()">
      <option value="primaire">📚 Primaire</option>
      <option value="maternelle">🧸 Maternelle</option>
    </select>

    <label>📖 Classes</label>
    <select id="ensClasses" multiple style="min-height:120px;overflow-y:auto;">
      <optgroup label="PRIMAIRE">
        <option value="1ère A">1ère A</option>
        <option value="1ère B">1ère B</option>
        <option value="2ème A">2ème A</option>
        <option value="2ème B">2ème B</option>
        <option value="3ème A">3ème A</option>
        <option value="3ème B">3ème B</option>
        <option value="4ème A">4ème A</option>
        <option value="4ème B">4ème B</option>
        <option value="5ème A">5ème A</option>
        <option value="5ème B">5ème B</option>
        <option value="6ème A">6ème A</option>
        <option value="6ème B">6ème B</option>
      </optgroup>
      <optgroup label="MATERNELLE">
        <option value="Niveau 1">Niveau 1</option>
        <option value="Niveau 2">Niveau 2</option>
        <option value="Niveau 3">Niveau 3</option>
      </optgroup>
    </select>
    <p style="font-size:9px;color:rgba(255,255,255,0.2);margin-top:-6px;margin-bottom:10px;">💡 Maintenez Ctrl (ou Cmd) pour sélectionner plusieurs classes</p>

    <label>🔑 Code</label>
    <input type="text" id="ensCode" class="code-input" placeholder="••••••" maxlength="6" />

    <button class="btn btn-success" id="btnAjouter">➕ AJOUTER</button>
    <button class="btn btn-test" id="btnTest">🧪 AJOUTER TEST</button>
    <button class="btn btn-danger" id="btnVerifier">🔍 VÉRIFIER</button>
    <div class="error" id="msg"></div>
    <div class="debug" id="debug"></div>
    <div class="info">💡 École: odari · Maintenez Ctrl pour sélectionner plusieurs classes</div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg">✅</span></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="big">✅</div>
    <h3 id="modalNom" style="color:#8B5CF6;font-size:17px;">Enseignant</h3>
    <p style="color:rgba(255,255,255,0.4);font-size:12px;margin:4px 0;">Code :</p>
    <div class="code-display"><div class="num" id="modalCode">123456</div></div>
    <p style="color:rgba(255,255,255,0.3);font-size:10px;">⚠️ Transmettez ce code</p>
    <br><button class="btn" onclick="fermerModal()">OK</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, query, where } from "firebase/firestore";
import { getAuth, createUserWithEmailAndPassword } from "firebase/auth";

const firebaseConfig = {
  apiKey: "AIzaSyDX430AIfzzgfq3o8tXHwQfIptgWOZ-K8c",
  authDomain: "gesco-67c43.firebaseapp.com",
  projectId: "gesco-67c43",
  storageBucket: "gesco-67c43.firebasestorage.app",
  messagingSenderId: "333004443566",
  appId: "1:333004443566:web:de41f60000e418dce9023f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ECOLET_ID = "odari";

document.getElementById('schoolName').textContent = 'COMPLEXE SCOLAIRE ODARI';
document.getElementById('debug').textContent = '📁 École: odari';

function genererCode() {
  return String(Math.floor(100000 + Math.random() * 900000));
}

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  el.className = 'toast ' + type;
  setTimeout(() => el.classList.add('show'), 10);
  setTimeout(() => el.classList.remove('show'), 3000);
}

function getClassesSelectionnees() {
  const select = document.getElementById('ensClasses');
  const classes = [];
  for (let i = 0; i < select.options.length; i++) {
    if (select.options[i].selected) {
      classes.push(select.options[i].value);
    }
  }
  return classes;
}

window.changerCycle = function() {
  const cycle = document.getElementById('ensCycle').value;
  const select = document.getElementById('ensClasses');
  const options = select.querySelectorAll('option');
  const isPrimaire = cycle === 'primaire';
  const classesPrimaire = ['1ère A','1ère B','2ème A','2ème B','3ème A','3ème B','4ème A','4ème B','5ème A','5ème B','6ème A','6ème B'];
  const classesMaternelle = ['Niveau 1','Niveau 2','Niveau 3'];
  
  options.forEach(opt => {
    const val = opt.value;
    if (!val) return;
    if (isPrimaire) {
      opt.style.display = classesPrimaire.includes(val) ? '' : 'none';
    } else {
      opt.style.display = classesMaternelle.includes(val) ? '' : 'none';
    }
  });
};

document.getElementById('ensCode').addEventListener('input', function() {
  this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
});

document.getElementById('btnAjouter').addEventListener('click', async function() {
  const nom = document.getElementById('ensNom').value.trim();
  const cycle = document.getElementById('ensCycle').value;
  const classes = getClassesSelectionnees();
  const code = document.getElementById('ensCode').value.trim();

  if (!nom) { toast('⚠️ Nom requis', 'error'); return; }
  if (classes.length === 0) { toast('⚠️ Sélectionnez au moins une classe', 'error'); return; }
  if (!code || code.length < 6) { toast('⚠️ Code à 6 chiffres', 'error'); return; }

  this.disabled = true;
  this.textContent = '⏳...';

  try {
    const email = 'ens.' + nom.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z\s]/g, '').replace(/\s+/g, '.') + '.' + ECOLET_ID + '@gmail.com';
    const ensId = 'ens_' + Date.now();

    await createUserWithEmailAndPassword(auth, email, code).catch(() => {});
    await setDoc(doc(db, 'ecoles', ECOLET_ID, 'enseignants', ensId), {
      _type: 'enseignant',
      id: ensId,
      nom: nom,
      cycle: cycle,
      classes: classes,
      code: code,
      email: email,
      actif: true,
      createdAt: Date.now()
    });

    document.getElementById('modalNom').textContent = nom;
    document.getElementById('modalCode').textContent = code;
    document.getElementById('modal').classList.add('show');

    document.getElementById('ensNom').value = '';
    document.getElementById('ensCode').value = genererCode();
    document.querySelectorAll('#ensClasses option').forEach(opt => opt.selected = false);

    toast('✅ ' + nom + ' ajouté !');
    await verifier();

  } catch(e) {
    toast('❌ ' + e.message, 'error');
  }

  this.disabled = false;
  this.textContent = '➕ AJOUTER';
});

document.getElementById('btnTest').addEventListener('click', async function() {
  this.disabled = true;
  this.textContent = '⏳...';

  try {
    const nom = 'KASONGO Jean';
    const code = '123456';
    const email = 'ens.kasongo.jean.' + ECOLET_ID + '@gmail.com';
    const ensId = 'ens_' + Date.now();

    await createUserWithEmailAndPassword(auth, email, code).catch(() => {});
    await setDoc(doc(db, 'ecoles', ECOLET_ID, 'enseignants', ensId), {
      _type: 'enseignant',
      id: ensId,
      nom: nom,
      cycle: 'primaire',
      classes: ['1ère A', '1ère B'],
      code: code,
      email: email,
      actif: true,
      createdAt: Date.now()
    });

    document.getElementById('modalNom').textContent = nom;
    document.getElementById('modalCode').textContent = code;
    document.getElementById('modal').classList.add('show');

    toast('✅ Enseignant TEST ajouté !');
    await verifier();

  } catch(e) {
    toast('❌ ' + e.message, 'error');
  }

  this.disabled = false;
  this.textContent = '🧪 AJOUTER TEST';
});

document.getElementById('btnVerifier').addEventListener('click', verifier);

async function verifier() {
  const debug = document.getElementById('debug');
  debug.textContent = '🔍 École: odari\n';

  try {
    const snap = await getDocs(collection(db, 'ecoles', ECOLET_ID, 'enseignants'));

    let countTotal = 0, countType = 0, countActif = 0;
    let details = '';

    snap.forEach(ds => {
      const data = ds.data();
      countTotal++;
      if (data._type === 'enseignant') countType++;
      if (data.actif === true) countActif++;
      details += '\n- ' + (data.nom || '?') + ' | _type: ' + (data._type || '?') + ' | actif: ' + data.actif + ' | classes: ' + (data.classes || []).join(', ');
    });

    debug.textContent += '📚 Documents: ' + countTotal + '\n';
    debug.textContent += '📌 _type="enseignant": ' + countType + '\n';
    debug.textContent += '✅ Actifs: ' + countActif + '\n';
    debug.textContent += details;

    if (countTotal === 0) {
      toast('⚠️ Aucun enseignant trouvé', 'error');
    } else if (countType === 0) {
      toast('⚠️ Aucun avec _type="enseignant"', 'error');
    } else if (countActif === 0) {
      toast('⚠️ Aucun actif (actif: false)', 'error');
    } else {
      toast('✅ ' + countActif + ' enseignant(s) trouvé(s)');
    }

  } catch(e) {
    debug.textContent += '\n❌ Erreur: ' + e.message;
    toast('❌ ' + e.message, 'error');
  }
}

window.fermerModal = function(){
  document.getElementById('modal').classList.remove('show');
};

document.getElementById('ensCode').value = genererCode();

setTimeout(verifier, 1000);
</script>
</body>
</html>

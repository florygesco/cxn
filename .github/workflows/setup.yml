name: Setup Project

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/setup.yml'

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create all project files
        run: |
          mkdir -p app/src/main/java/com/edgeapp
          mkdir -p app/src/main/assets
          mkdir -p .github/workflows

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EdgeApp"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.edgeapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.edgeapp"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="EdgeApp"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/edgeapp/MainActivity.kt << 'EOF'
          package com.edgeapp

          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.view.WindowManager
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.setFlags(
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  )
                  window.statusBarColor = Color.TRANSPARENT
                  window.navigationBarColor = Color.TRANSPARENT
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      window.attributes.layoutInDisplayCutoutMode =
                          WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  webView = WebView(this).apply {
                      setBackgroundColor(Color.TRANSPARENT)
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      webViewClient = WebViewClient()
                      loadUrl("file:///android_asset/index.html")
                  }
                  setContentView(webView)
              }

              override fun onBackPressed() {
                  if (webView.canGoBack()) webView.goBack()
                  else super.onBackPressed()
              }
          }
          EOF

          cat > app/src/main/assets/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
          <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
          <title>Edge App</title>
          <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            html { background: #0F2027; height: 100%; }
            body {
              width: 100%; min-height: 100vh;
              font-family: -apple-system, sans-serif; color: #fff;
              background: linear-gradient(180deg, #0F2027 0%, #203A43 50%, #2C5364 100%);
              background-attachment: fixed; background-size: 100% 100vh;
            }
            .hero {
              min-height: 100vh;
              display: flex; flex-direction: column; justify-content: center; align-items: center;
              text-align: center; padding: 24px;
              padding-top: calc(24px + env(safe-area-inset-top));
            }
            h1 { font-size: 32px; margin-bottom: 12px; }
            p { opacity: 0.85; max-width: 340px; }
          </style>
          </head>
          <body>
            <section class="hero">
              <h1>Edge App 🚀</h1>
              <p>Le contenu passe sous la barre de batterie.</p>
            </section>
          </body>
          </html>
          EOF

          cat > .github/workflows/build.yml << 'EOF'
          name: Build APK
          on:
            push:
              branches: [ main ]
            workflow_dispatch:
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Setup JDK 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: 17
                - name: Setup Android SDK
                  uses: android-actions/setup-android@v3
                - name: Generate Gradle wrapper
                  run: gradle wrapper --gradle-version 8.2
                - name: Build Debug APK
                  run: ./gradlew assembleDebug
                - name: Upload APK
                  uses: actions/upload-artifact@v4
                  with:
                    name: edge-app-apk
                    path: app/build/outputs/apk/debug/app-debug.apk
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Setup project files" || echo "Nothing to commit"
          git push

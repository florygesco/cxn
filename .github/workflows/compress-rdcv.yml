
name: Compression NeTubeX RDC

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compress-rdcv-main
  cancel-in-progress: false

jobs:
  compress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML minifier
        run: npm install --no-save --package-lock=false html-minifier-terser

      - name: Compress rdcv.html
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { minify } = require('html-minifier-terser');

          async function main() {
            const file = 'rdcv.html';
            const temp = 'rdcv.html.tmp';

            if (!fs.existsSync(file)) {
              throw new Error('rdcv.html introuvable');
            }

            const original = fs.readFileSync(file, 'utf8');

            const compressed = await minify(original, {
              collapseWhitespace: true,
              conservativeCollapse: true,
              removeComments: true,
              minifyCSS: true,
              minifyJS: false,
              removeOptionalTags: false,
              removeAttributeQuotes: false
            });

            if (!compressed) {
              throw new Error('Compression echouee');
            }

            const before = Buffer.byteLength(original);
            const after = Buffer.byteLength(compressed);

            if (after >= before) {
              throw new Error('Aucune reduction. Original conserve.');
            }

            fs.writeFileSync(temp, compressed, 'utf8');
            fs.renameSync(temp, file);

            console.log('Compression reussie');
            console.log('Avant : ' + before + ' octets');
            console.log('Apres : ' + after + ' octets');
            console.log('Reduction : ' +
              ((1 - after / before) * 100).toFixed(2) + '%');
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit compressed file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rdcv.html

          if ! git diff --cached --quiet; then
            git commit -m "Compress rdcv.html"
            git push origin HEAD:main
          else
            echo "Aucun changement a enregistrer"
          fi

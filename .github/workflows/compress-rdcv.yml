
name: Compression NeTubeX RDC

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install minifier
        run: npm install --no-save --package-lock=false html-minifier-terser

      - name: Compress HTML and CSS
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { minify } = require('html-minifier-terser');

          async function main() {
            const file = 'rdcv.html';

            const original = fs.readFileSync(file, 'utf8');

            const compressed = await minify(original, {
              collapseWhitespace: true,
              conservativeCollapse: true,
              removeComments: true,
              minifyCSS: true,
              minifyJS: false
            });

            if (!compressed || compressed.length >= original.length) {
              throw new Error('Compression impossible ou sans gain');
            }

            fs.writeFileSync(file + '.tmp', compressed);
            fs.renameSync(file + '.tmp', file);

            console.log('Avant : ' + original.length);
            console.log('Après : ' + compressed.length);
            console.log('Compression terminée.');
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit compressed file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rdcv.html
          if ! git diff --cached --quiet; then
            git commit -m "Compress rdcv.html"
            git push origin HEAD:main
          fi

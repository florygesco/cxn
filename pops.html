<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Adsterra Seul</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background:#f8fafc; margin:0; padding:0; }
  .container { max-width:700px; margin:0 auto; padding:16px; }

  h1 { font-size:20px; font-weight:900; margin:0 0 4px; color:#0f172a; }
  .sub { color:#64748b; font-size:13px; margin:0 0 12px; }

  .status { padding:12px 16px; border-radius:10px; font-size:13.5px;
            font-weight:800; margin-bottom:16px; display:flex;
            align-items:center; gap:10px; }
  .status.ok   { background:#d1fae5; color:#065f46; }
  .status.err  { background:#fee2e2; color:#991b1b; }
  .status.wait { background:#fef3c7; color:#78350f; }

  /* ===== CARTE PUB — MÊME STRUCTURE QUE TES POSTS ===== */
  .fb-post-ad {
    width:100%;
    background:#fff;
    border-radius:0;
    overflow:hidden;
    padding:0 0 12px;
    border:1px solid #e2e8f0;
    border-radius:14px;
  }
  .fb-post-ad-head {
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:10px;
    padding:12px 14px 8px;
  }
  .fb-post-ad-avatar {
    width:44px; height:44px; border-radius:50%;
    background:#f59e0b; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
  }
  .fb-post-ad-name {
    font-weight:800; font-size:14.5px;
    color:#0f172a; line-height:1.35;
  }
  .fb-post-ad-badge {
    font-size:10px; font-weight:900; padding:5px 9px;
    border-radius:6px; text-transform:uppercase;
    letter-spacing:.4px; background:#f59e0b;
    color:#fff; flex-shrink:0;
  }
  .fb-post-ad-media {
    width:100%;
    background:#f1f5f9;
    overflow:hidden;
    display:block;
    aspect-ratio:16/10;
    max-height:260px;
    position:relative;
  }

  /* ===== SLOT ADSTERRA : FORCE À REMPLIR ===== */
  #adsterraSlot {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
  }

  /* Force TOUT élément à l'intérieur du slot à prendre 100% */
  #adsterraSlot,
  #adsterraSlot > div,
  #adsterraSlot > div > div,
  #adsterraSlot > div > div > div {
    width:100%!important;
    max-width:100%!important;
    height:100%!important;
    max-height:100%!important;
  }

  /* Force les liens à remplir */
  #adsterraSlot a {
    display:block!important;
    width:100%!important;
    height:100%!important;
    max-width:100%!important;
  }

  /* Force les images à remplir (object-fit cover pour ne pas déformer) */
  #adsterraSlot img {
    width:100%!important;
    height:100%!important;
    max-width:100%!important;
    object-fit:cover!important;
    display:block!important;
  }

  @media(min-width:640px){
    .fb-post-ad-media { aspect-ratio:5/4; max-height:none; }
  }
  @media(min-width:1024px){
    .fb-post-ad-media { aspect-ratio:3/2; min-height:200px; max-height:340px; }
  }

  #logBox {
    background:#020617; color:#5cb3ff; padding:14px;
    border-radius:10px; font-family:ui-monospace,monospace;
    font-size:11.5px; line-height:1.5; max-height:300px;
    overflow-y:auto; margin-top:16px;
  }
  #logBox .err { color:#f87171; }
  #logBox .ok { color:#4ade80; }
  #logBox .warn { color:#fbbf24; }
  #logBox .dim { color:#64748b; }
  #logBox > div { margin-bottom:3px; }

  .btn {
    padding:10px 18px; border-radius:8px; border:none;
    cursor:pointer; font-family:inherit; font-weight:900;
    font-size:13px; background:#007fff; color:#fff; margin-right:8px;
  }
  .btn.gray { background:#334155; }

  .info-badge {
    display:inline-block; padding:6px 12px; border-radius:8px;
    background:#0f172a; color:#5cb3ff; font-size:11px;
    font-weight:900; font-family:ui-monospace,monospace;
    margin:4px 4px 4px 0;
  }
</style>
</head>
<body>

<div class="container">

  <h1>🧪 Test Adsterra Seul</h1>
  <p class="sub">Carte pub seule — contenu en pleine largeur</p>

  <div>
    <span class="info-badge" id="info1">Imgs: 0</span>
    <span class="info-badge" id="info2">Pub: — px</span>
    <span class="info-badge" id="info3">Ratio: —</span>
  </div>

  <div id="status" class="status wait" style="margin-top:12px">
    <span>⏳</span> <span id="statusText">Chargement…</span>
  </div>

  <!-- CARTE ADSTERRA UNIQUEMENT -->
  <article class="fb-post-ad" id="adsterraCard">
    <div class="fb-post-ad-head">
      <div class="fb-post-ad-avatar">📢</div>
      <div style="min-width:0;overflow:hidden">
        <div class="fb-post-ad-name">Sponsorisé</div>
      </div>
      <span class="fb-post-ad-badge">PUBLICITÉ</span>
    </div>
    <div class="fb-post-ad-media" id="adsterraMedia">
      <div id="adsterraSlot"></div>
    </div>
  </article>

  <button class="btn" onclick="location.reload()">🔄 Relancer</button>
  <button class="btn gray" onclick="document.getElementById('logBox').innerHTML=''">🗑️ Vider</button>

  <div id="logBox"></div>

</div>

<script>
(function() {
  'use strict';

  var ADSTERRA_KEY = 'c8e9df92013d3020593ad443d2530ad4';
  var ADSTERRA_SCRIPT_URL = 'https://bluntutilities.com/c8e9df92013d3020593ad443d2530ad4/invoke.js';

  var logEl = document.getElementById('logBox');
  var statusEl = document.getElementById('status');
  var statusTxt = document.getElementById('statusText');
  var info1 = document.getElementById('info1');
  var info2 = document.getElementById('info2');
  var info3 = document.getElementById('info3');
  var card = document.getElementById('adsterraCard');
  var slot = document.getElementById('adsterraSlot');
  var containerId = 'container-' + ADSTERRA_KEY;

  function log(msg, cls) {
    cls = cls || '';
    var d = document.createElement('div');
    d.className = cls;
    var t = new Date().toLocaleTimeString('fr-FR');
    d.textContent = '[' + t + '] ' + msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(txt, cls, icon) {
    statusEl.className = 'status ' + cls;
    statusTxt.textContent = txt;
    statusEl.querySelector('span').textContent = icon;
  }

  // Force tous les styles sur les éléments Adsterra
  function forcerStyles() {
    var c = document.getElementById(containerId);
    if (!c) return;

    // Container = 100%
    c.style.width = '100%';
    c.style.maxWidth = '100%';
    c.style.height = '100%';
    c.style.maxHeight = '100%';
    c.style.overflow = 'hidden';

    // Tous les enfants (quel que soit le niveau)
    var tousLesDivs = c.querySelectorAll('div, span, section, article');
    tousLesDivs.forEach(function(el) {
      el.style.width = '100%';
      el.style.maxWidth = '100%';
    });

    // Tous les liens
    var tousLiens = c.querySelectorAll('a');
    tousLiens.forEach(function(a) {
      a.style.display = 'block';
      a.style.width = '100%';
      a.style.maxWidth = '100%';
    });

    // Toutes les images
    var toutesImgs = c.querySelectorAll('img');
    toutesImgs.forEach(function(img) {
      img.style.width = '100%';
      img.style.maxWidth = '100%';
      img.style.height = '100%';
      img.style.objectFit = 'cover';
      img.style.display = 'block';
    });
  }

  log('Script démarré', 'dim');

  // Container + script
  if (!slot.querySelector('#' + containerId)) {
    var c = document.createElement('div');
    c.id = containerId;
    c.style.width = '100%';
    c.style.height = '100%';
    c.style.overflow = 'hidden';
    c.style.position = 'relative';
    slot.appendChild(c);
  }

  var s = document.createElement('script');
  s.type = 'text/javascript';
  s.async = true;
  s.setAttribute('data-cfasync', 'false');
  s.src = ADSTERRA_SCRIPT_URL;
  s.onerror = function() {
    log('❌ Script bloqué', 'err');
    setStatus('Script bloqué', 'err', '❌');
  };
  s.onload = function() {
    log('✅ invoke.js chargé', 'ok');
  };
  slot.appendChild(s);

  // Boucle : force les styles en permanence
  var t0 = Date.now();
  var iv = setInterval(function() {
    forcerStyles();

    var c = document.getElementById(containerId);
    if (!c) return;

    var imgs = c.querySelectorAll('img');
    var imgsVisibles = Array.from(imgs).filter(function(img) {
      return img.offsetWidth > 0;
    }).length;

    // Mesure la largeur de l'image par rapport à la carte
    var largeurCard = card.offsetWidth;
    var largeurImg = imgs.length > 0 ? imgs[0].offsetWidth : 0;
    var largeurMedia = document.getElementById('adsterraMedia').offsetWidth;
    var ratio = largeurImg > 0 ? Math.round((largeurImg / largeurMedia) * 100) : 0;

    info1.textContent = 'Imgs: ' + imgs.length;
    info2.textContent = 'Pub: ' + card.offsetHeight + 'px';
    info3.textContent = 'Largeur img: ' + ratio + '%';

    log('⏱ ' + Math.round((Date.now() - t0) / 1000) + 's — Imgs: ' + imgs.length + ' | Largeur img: ' + largeurImg + 'px / ' + largeurMedia + 'px (' + ratio + '%)', 'dim');

    if (Date.now() - t0 > 10000) {
      clearInterval(iv);
      forcerStyles();

      log('═══════════════════════════════', 'dim');
      log('Imgs finales: ' + imgs.length, 'dim');
      log('Largeur image: ' + largeurImg + 'px', 'dim');
      log('Largeur média: ' + largeurMedia + 'px', 'dim');
      log('Ratio: ' + ratio + '%', 'dim');

      if (imgs.length === 0) {
        setStatus('Aucune pub reçue', 'err', '❌');
      } else if (ratio >= 90) {
        setStatus('Pleine largeur ✅ (' + ratio + '%)', 'ok', '✅');
      } else {
        setStatus('Largeur partielle (' + ratio + '%)', 'warn', '⚠️');
      }
    }
  }, 500);

  // Fallback
  setTimeout(function() {
    var c = document.getElementById(containerId);
    if (c && c.innerHTML.length < 100 && card) {
      card.style.display = 'none';
    }
  }, 8000);
})();
</script>

</body>
</html>

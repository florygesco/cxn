<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Adsterra Pur</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background:#f8fafc; margin:0; padding:16px; }
  .container { max-width:700px; margin:0 auto; }

  h1 { font-size:20px; font-weight:900; margin:0 0 4px; color:#0f172a; }
  .sub { color:#64748b; font-size:13px; margin:0 0 12px; }

  .status { padding:12px 16px; border-radius:10px; font-size:13.5px;
            font-weight:800; margin-bottom:16px; display:flex;
            align-items:center; gap:10px; }
  .status.ok   { background:#d1fae5; color:#065f46; }
  .status.err  { background:#fee2e2; color:#991b1b; }
  .status.wait { background:#fef3c7; color:#78350f; }

  .fb-post-ad {
    width:100%; background:#fff; padding:12px 14px;
    border:1px solid #e2e8f0; border-radius:14px;
  }
  .fb-post-ad-head {
    display:grid; grid-template-columns:auto 1fr auto;
    align-items:center; gap:10px; padding:0 0 8px;
  }
  .fb-post-ad-avatar {
    width:44px; height:44px; border-radius:50%;
    background:#f59e0b; color:#fff; display:flex;
    align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
  }
  .fb-post-ad-name {
    font-weight:800; font-size:14.5px;
    color:#0f172a; line-height:1.35;
  }
  .fb-post-ad-badge {
    font-size:10px; font-weight:900; padding:5px 9px;
    border-radius:6px; text-transform:uppercase;
    letter-spacing:.4px; background:#f59e0b;
    color:#fff; flex-shrink:0;
  }
  .fb-post-ad-media {
    width:100%; background:#f1f5f9; overflow:hidden;
    aspect-ratio:16/10; max-height:260px; position:relative;
  }
  @media(min-width:640px){
    .fb-post-ad-media { aspect-ratio:5/4; max-height:none; }
  }
  @media(min-width:1024px){
    .fb-post-ad-media { aspect-ratio:3/2; min-height:200px; max-height:340px; }
  }

  #logBox {
    background:#020617; color:#5cb3ff; padding:14px;
    border-radius:10px; font-family:ui-monospace,monospace;
    font-size:11.5px; line-height:1.5; max-height:400px;
    overflow-y:auto; margin-top:16px;
  }
  #logBox .err  { color:#f87171; }
  #logBox .ok   { color:#4ade80; }
  #logBox .warn { color:#fbbf24; }
  #logBox .dim  { color:#64748b; }
  #logBox > div { margin-bottom:3px; }

  .btn {
    padding:10px 18px; border-radius:8px; border:none;
    cursor:pointer; font-family:inherit; font-weight:900;
    font-size:13px; background:#007fff; color:#fff; margin-right:8px;
  }
  .btn.gray { background:#334155; }

  .info-badge {
    display:inline-block; padding:6px 12px; border-radius:8px;
    background:#0f172a; color:#5cb3ff; font-size:11px;
    font-weight:900; font-family:ui-monospace,monospace;
    margin:4px 4px 4px 0;
  }
</style>
</head>
<body>

<div class="container">

  <h1>🧪 Test Adsterra Pur</h1>
  <p class="sub">Uniquement la carte pub — structure Adsterra inspectée en détail</p>

  <div>
    <span class="info-badge" id="info1">Imgs: 0</span>
    <span class="info-badge" id="info2">Liens: 0</span>
    <span class="info-badge" id="info3">Enfants: 0</span>
    <span class="info-badge" id="info4">Masqués: 0</span>
  </div>

  <div id="status" class="status wait" style="margin-top:12px">
    <span>⏳</span> <span id="statusText">Chargement…</span>
  </div>

  <article class="fb-post-ad" id="adsterraCard">
    <div class="fb-post-ad-head">
      <div class="fb-post-ad-avatar">📢</div>
      <div style="min-width:0;overflow:hidden">
        <div class="fb-post-ad-name">Sponsorisé</div>
      </div>
      <span class="fb-post-ad-badge">PUBLICITÉ</span>
    </div>
    <div class="fb-post-ad-media" id="adsterraMedia">
      <div id="adsterraSlot"></div>
    </div>
  </article>

  <button class="btn" onclick="location.reload()">🔄 Relancer</button>
  <button class="btn gray" onclick="document.getElementById('logBox').innerHTML=''">🗑️ Vider</button>
  <button class="btn" onclick="inspecter()">🔍 Inspecter</button>

  <div id="logBox"></div>

</div>

<script>
(function() {
  'use strict';

  var ADSTERRA_KEY = 'c8e9df92013d3020593ad443d2530ad4';
  var ADSTERRA_SCRIPT_URL = 'https://bluntutilities.com/c8e9df92013d3020593ad443d2530ad4/invoke.js';

  var logEl = document.getElementById('logBox');
  var statusEl = document.getElementById('status');
  var statusTxt = document.getElementById('statusText');
  var info1 = document.getElementById('info1');
  var info2 = document.getElementById('info2');
  var info3 = document.getElementById('info3');
  var info4 = document.getElementById('info4');
  var card = document.getElementById('adsterraCard');
  var slot = document.getElementById('adsterraSlot');
  var containerId = 'container-' + ADSTERRA_KEY;
  var masques = 0;

  function log(msg, cls) {
    cls = cls || '';
    var d = document.createElement('div');
    d.className = cls;
    var t = new Date().toLocaleTimeString('fr-FR');
    d.textContent = '[' + t + '] ' + msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(txt, cls, icon) {
    statusEl.className = 'status ' + cls;
    statusTxt.textContent = txt;
    statusEl.querySelector('span').textContent = icon;
  }

  // ⭐ INSPECTION COMPLÈTE — montre la structure exacte
  function inspecter() {
    var c = document.getElementById(containerId);
    if (!c) {
      log('❌ Container introuvable', 'err');
      return;
    }

    log('═══════════════════════════════', 'dim');
    log('🔍 INSPECTION DU CONTAINER', 'ok');
    log('═══════════════════════════════', 'dim');

    log('Enfants directs : ' + c.children.length, 'dim');
    Array.from(c.children).forEach(function(child, i) {
      log('  Enfant ' + i + ' : <' + child.tagName + '> class="' + (child.className || '') + '"', 'dim');
    });

    log('', 'dim');
    var toutesImgs = c.querySelectorAll('img');
    log('Images (total) : ' + toutesImgs.length, 'dim');
    toutesImgs.forEach(function(img, i) {
      var parent = img.parentElement;
      var grandParent = parent ? parent.parentElement : null;
      log('  Img ' + i + ' : src="' + (img.src || '').slice(0, 50) + '..."', 'dim');
      log('       parent=' + (parent ? parent.tagName : '?'), 'dim');
      log('       grand-parent=' + (grandParent ? grandParent.tagName + ' (id=' + (grandParent.id || '?') + ')' : '?'), 'dim');
    });

    log('', 'dim');
    var tousLiens = c.querySelectorAll('a');
    log('Liens (total) : ' + tousLiens.length, 'dim');
    tousLiens.forEach(function(a, i) {
      log('  Lien ' + i + ' : href="' + (a.href || '').slice(0, 50) + '..."', 'dim');
    });

    log('', 'dim');
    log('HTML total : ' + c.innerHTML.length + ' caractères', 'dim');
    log('═══════════════════════════════', 'dim');
  }

  // Masque les pubs en trop en utilisant plusieurs stratégies
  function masquerPubsEnTrop() {
    var c = document.getElementById(containerId);
    if (!c) return;

    var imgs = c.querySelectorAll('img');
    if (imgs.length <= 1) return;

    // STRATÉGIE 1 : masque les enfants directs 2, 3, 4
    var enfants = Array.from(c.children);
    if (enfants.length > 1) {
      for (var i = 1; i < enfants.length; i++) {
        if (enfants[i].style.display !== 'none') {
          enfants[i].style.display = 'none';
          masques++;
        }
      }
    }

    // STRATÉGIE 2 : pour chaque image sauf la 1ère, masque son bloc parent
    for (var j = 1; j < imgs.length; j++) {
      var img = imgs[j];
      if (img.style.display === 'none') continue;
      // Remonte jusqu'à l'enfant direct du container
      var node = img;
      while (node && node.parentElement && node.parentElement !== c) {
        node = node.parentElement;
      }
      if (node && node.parentElement === c && !node.contains(imgs[0])) {
        if (node.style.display !== 'none') {
          node.style.display = 'none';
          masques++;
        }
      }
    }
  }

  log('Script démarré', 'dim');

  // Container + script
  if (!slot.querySelector('#' + containerId)) {
    var c = document.createElement('div');
    c.id = containerId;
    c.style.width = '100%';
    c.style.height = '100%';
    c.style.overflow = 'hidden';
    c.style.position = 'relative';
    slot.appendChild(c);
  }

  var s = document.createElement('script');
  s.type = 'text/javascript';
  s.async = true;
  s.setAttribute('data-cfasync', 'false');
  s.src = ADSTERRA_SCRIPT_URL;
  s.onerror = function() {
    log('❌ Script bloqué', 'err');
    setStatus('Script bloqué', 'err', '❌');
  };
  s.onload = function() {
    log('✅ invoke.js chargé', 'ok');
  };
  slot.appendChild(s);

  // Boucle de surveillance
  var t0 = Date.now();
  var iv = setInterval(function() {
    var c = document.getElementById(containerId);
    if (!c) return;

    var imgs = c.querySelectorAll('img').length;
    var liens = c.querySelectorAll('a').length;
    var enfants = c.children.length;

    info1.textContent = 'Imgs: ' + imgs;
    info2.textContent = 'Liens: ' + liens;
    info3.textContent = 'Enfants: ' + enfants;
    info4.textContent = 'Masqués: ' + masques;

    // Tente de masquer les pubs en trop
    masquerPubsEnTrop();

    if (Date.now() - t0 > 10000) {
      clearInterval(iv);
      masquerPubsEnTrop();

      var imgsRestantes = c.querySelectorAll('img').length;
      var imgsVisibles = Array.from(c.querySelectorAll('img')).filter(function(img) {
        return img.style.display !== 'none' && img.offsetHeight > 0;
      }).length;

      log('═══════════════════════════════', 'dim');
      log('Enfants finaux : ' + c.children.length, 'dim');
      log('Images finales : ' + imgsRestantes + ' (visibles: ' + imgsVisibles + ')', 'dim');
      log('Masqués cumulés : ' + masques, 'dim');

      if (imgsRestantes === 0) {
        setStatus('Aucune pub reçue', 'err', '❌');
      } else if (imgsVisibles === 1) {
        setStatus('1 pub visible ✅', 'ok', '✅');
      } else {
        setStatus(imgsVisibles + ' pubs visibles', 'warn', '⚠️');
      }
    }
  }, 500);

  // Fallback
  setTimeout(function() {
    var c = document.getElementById(containerId);
    if (c && c.innerHTML.length < 100 && card) {
      card.style.display = 'none';
    }
  }, 8000);

  window.inspecter = inspecter;
})();
</script>

</body>
</html>

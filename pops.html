<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Adsterra Forcé</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#f8fafc; }
  body { font-family: system-ui, -apple-system, sans-serif; }

  /* PAS de max-width sur le body : toute la largeur de l'écran */
  .wrapper { padding:16px; }

  h1 { font-size:20px; font-weight:900; margin:0 0 4px; color:#0f172a; }
  .sub { color:#64748b; font-size:13px; margin:0 0 12px; }

  .status { padding:12px 16px; border-radius:10px; font-size:13.5px;
            font-weight:800; margin-bottom:16px; display:flex;
            align-items:center; gap:10px; }
  .status.ok   { background:#d1fae5; color:#065f46; }
  .status.err  { background:#fee2e2; color:#991b1b; }
  .status.wait { background:#fef3c7; color:#78350f; }

  /* ⭐ CARTE PUB PLEINE LARGEUR ⭐ */
  .fb-post-ad {
    width:100%;
    max-width:100%;
    display:block;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    padding:0 0 12px;
    border:1px solid #e2e8f0;
  }
  .fb-post-ad-head {
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:10px;
    padding:12px 14px 8px;
  }
  .fb-post-ad-avatar {
    width:44px; height:44px; border-radius:50%;
    background:#f59e0b; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
  }
  .fb-post-ad-name {
    font-weight:800; font-size:14.5px;
    color:#0f172a; line-height:1.35;
  }
  .fb-post-ad-badge {
    font-size:10px; font-weight:900; padding:5px 9px;
    border-radius:6px; text-transform:uppercase;
    letter-spacing:.4px; background:#f59e0b;
    color:#fff; flex-shrink:0;
  }

  /* Zone média : pleine largeur */
  .fb-post-ad-media {
    width:100%;
    max-width:100%;
    display:block;
    background:#f1f5f9;
    overflow:hidden;
    position:relative;
    min-height:150px;
  }

  /* Slot : force 100% de la carte */
  #adsterraSlot {
    width:100%;
    max-width:100%;
    display:block;
    position:relative;
  }

  /* ⭐⭐ FORCE TOUT LE CONTENU ADSTERRA À 100% ⭐⭐ */
  #adsterraSlot,
  #adsterraSlot > *,
  #adsterraSlot > * > *,
  #adsterraSlot > * > * > *,
  #adsterraSlot > * > * > * > * {
    width:100%!important;
    max-width:100%!important;
    min-width:0!important;
    box-sizing:border-box!important;
  }

  #adsterraSlot a {
    display:block!important;
    width:100%!important;
    max-width:100%!important;
  }

  #adsterraSlot img {
    width:100%!important;
    max-width:100%!important;
    height:auto!important;
    display:block!important;
    object-fit:cover!important;
  }

  /* Force l'ID container Adsterra aussi */
  #container-c8e9df92013d3020593ad443d2530ad4,
  #container-c8e9df92013d3020593ad443d2530ad4 > *,
  #container-c8e9df92013d3020593ad443d2530ad4 > * > * {
    width:100%!important;
    max-width:100%!important;
    min-width:0!important;
    box-sizing:border-box!important;
  }

  #logBox {
    background:#020617; color:#5cb3ff; padding:14px;
    border-radius:10px; font-family:ui-monospace,monospace;
    font-size:11.5px; line-height:1.5; max-height:300px;
    overflow-y:auto; margin-top:16px;
  }
  #logBox .err { color:#f87171; }
  #logBox .ok { color:#4ade80; }
  #logBox .warn { color:#fbbf24; }
  #logBox .dim { color:#64748b; }
  #logBox > div { margin-bottom:3px; }

  .btn { padding:10px 18px; border-radius:8px; border:none;
    cursor:pointer; font-family:inherit; font-weight:900;
    font-size:13px; background:#007fff; color:#fff; margin-right:8px; }
  .btn.gray { background:#334155; }

  .info-badge { display:inline-block; padding:6px 12px; border-radius:8px;
    background:#0f172a; color:#5cb3ff; font-size:11px;
    font-weight:900; font-family:ui-monospace,monospace;
    margin:4px 4px 4px 0; }
</style>
</head>
<body>

<div class="wrapper">

  <h1>🧪 Test Adsterra Forcé</h1>
  <p class="sub">Force 100% de la largeur écran, sans max-width parent</p>

  <div>
    <span class="info-badge" id="info1">Imgs: 0</span>
    <span class="info-badge" id="info2">Card: — px</span>
    <span class="info-badge" id="info3">Img: — px</span>
    <span class="info-badge" id="info4">Ratio: —</span>
  </div>

  <div id="status" class="status wait" style="margin-top:12px">
    <span>⏳</span> <span id="statusText">Chargement…</span>
  </div>

  <article class="fb-post-ad" id="adsterraCard">
    <div class="fb-post-ad-head">
      <div class="fb-post-ad-avatar">📢</div>
      <div style="min-width:0;overflow:hidden">
        <div class="fb-post-ad-name">Sponsorisé</div>
      </div>
      <span class="fb-post-ad-badge">PUBLICITÉ</span>
    </div>
    <div class="fb-post-ad-media" id="adsterraMedia">
      <div id="adsterraSlot"></div>
    </div>
  </article>

  <button class="btn" onclick="location.reload()">🔄 Relancer</button>
  <button class="btn gray" onclick="document.getElementById('logBox').innerHTML=''">🗑️ Vider</button>

  <div id="logBox"></div>

</div>

<script>
(function() {
  'use strict';

  var ADSTERRA_KEY = 'c8e9df92013d3020593ad443d2530ad4';
  var ADSTERRA_SCRIPT_URL = 'https://bluntutilities.com/c8e9df92013d3020593ad443d2530ad4/invoke.js';

  var logEl = document.getElementById('logBox');
  var statusEl = document.getElementById('status');
  var statusTxt = document.getElementById('statusText');
  var info1 = document.getElementById('info1');
  var info2 = document.getElementById('info2');
  var info3 = document.getElementById('info3');
  var info4 = document.getElementById('info4');
  var card = document.getElementById('adsterraCard');
  var slot = document.getElementById('adsterraSlot');
  var containerId = 'container-' + ADSTERRA_KEY;

  function log(msg, cls) {
    cls = cls || '';
    var d = document.createElement('div');
    d.className = cls;
    var t = new Date().toLocaleTimeString('fr-FR');
    d.textContent = '[' + t + '] ' + msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(txt, cls, icon) {
    statusEl.className = 'status ' + cls;
    statusTxt.textContent = txt;
    statusEl.querySelector('span').textContent = icon;
  }

  // Force TOUS les styles sur tous les éléments Adsterra
  function forcer100() {
    var c = document.getElementById(containerId);
    if (!c) return;

    c.style.width = '100%';
    c.style.maxWidth = '100%';
    c.style.minWidth = '0';
    c.style.display = 'block';
    c.style.boxSizing = 'border-box';
    c.style.overflow = 'hidden';

    // Tous les descendants (récursif)
    var tous = c.querySelectorAll('*');
    tous.forEach(function(el) {
      el.style.width = '100%';
      el.style.maxWidth = '100%';
      el.style.minWidth = '0';
      el.style.boxSizing = 'border-box';
      if (el.tagName === 'A') {
        el.style.display = 'block';
      }
      if (el.tagName === 'IMG') {
        el.style.width = '100%';
        el.style.maxWidth = '100%';
        el.style.height = 'auto';
        el.style.display = 'block';
        el.style.objectFit = 'cover';
      }
    });
  }

  log('Script démarré', 'dim');

  if (!slot.querySelector('#' + containerId)) {
    var c = document.createElement('div');
    c.id = containerId;
    c.style.width = '100%';
    c.style.display = 'block';
    slot.appendChild(c);
  }

  var s = document.createElement('script');
  s.type = 'text/javascript';
  s.async = true;
  s.setAttribute('data-cfasync', 'false');
  s.src = ADSTERRA_SCRIPT_URL;
  s.onerror = function() {
    log('❌ Script bloqué', 'err');
    setStatus('Script bloqué', 'err', '❌');
  };
  s.onload = function() {
    log('✅ invoke.js chargé', 'ok');
  };
  slot.appendChild(s);

  var t0 = Date.now();
  var iv = setInterval(function() {
    forcer100();

    var c = document.getElementById(containerId);
    if (!c) return;

    var imgs = c.querySelectorAll('img');
    var premiere = imgs[0];

    var largeurCard = card.offsetWidth;
    var largeurImg = premiere ? premiere.offsetWidth : 0;
    var ratio = largeurCard > 0 ? Math.round((largeurImg / largeurCard) * 100) : 0;

    info1.textContent = 'Imgs: ' + imgs.length;
    info2.textContent = 'Card: ' + largeurCard + 'px';
    info3.textContent = 'Img: ' + largeurImg + 'px';
    info4.textContent = 'Ratio: ' + ratio + '%';

    log('⏱ ' + Math.round((Date.now() - t0) / 1000) + 's — Card: ' + largeurCard + 'px | Img: ' + largeurImg + 'px | Ratio: ' + ratio + '%', 'dim');

    if (Date.now() - t0 > 10000) {
      clearInterval(iv);
      forcer100();

      log('═══════════════════════════════', 'dim');
      log('Carte: ' + largeurCard + 'px', 'dim');
      log('Image: ' + largeurImg + 'px', 'dim');
      log('Ratio: ' + ratio + '%', 'dim');

      if (imgs.length === 0) {
        setStatus('Aucune pub reçue', 'err', '❌');
      } else if (ratio >= 90) {
        setStatus('Pleine largeur ✅ (' + ratio + '%)', 'ok', '✅');
      } else {
        setStatus('Largeur partielle (' + ratio + '%)', 'warn', '⚠️');
        log('⚠️ Ratio < 90% — il reste un max-width quelque part', 'warn');
      }
    }
  }, 500);

  setTimeout(function() {
    var c = document.getElementById(containerId);
    if (c && c.innerHTML.length < 100 && card) {
      card.style.display = 'none';
    }
  }, 8000);
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Adsterra Full</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; background:#f8fafc; margin:0; padding:0; }
  .container { max-width:700px; margin:0 auto; padding:16px; }

  h1 { font-size:20px; font-weight:900; margin:0 0 4px; color:#0f172a; }
  .sub { color:#64748b; font-size:13px; margin:0 0 12px; }

  .status { padding:12px 16px; border-radius:10px; font-size:13.5px;
            font-weight:800; margin-bottom:16px; display:flex;
            align-items:center; gap:10px; }
  .status.ok   { background:#d1fae5; color:#065f46; }
  .status.err  { background:#fee2e2; color:#991b1b; }
  .status.wait { background:#fef3c7; color:#78350f; }

  /* ⭐ FAUX POST pour comparer (structure exacte NeTubeX) ⭐ */
  .fake-post {
    background:#fff;
    border-radius:0;
    overflow:hidden;
    padding:0 0 12px;
    border-bottom:3px solid #e2e8f0;
  }
  .fake-post-head {
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:10px;
    padding:12px 14px 8px;
  }
  .fake-post-avatar {
    width:44px; height:44px; border-radius:50%;
    background:#007fff; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:15px; flex-shrink:0;
  }
  .fake-post-name { font-weight:800; font-size:14.5px; color:#0f172a; line-height:1.35; }
  .fake-post-sub { font-size:12.5px; color:#64748b; margin-top:2px; line-height:1.35; }
  .fake-post-badge {
    font-size:10px; font-weight:900; padding:5px 9px; border-radius:6px;
    text-transform:uppercase; background:#10b981; color:#fff; flex-shrink:0;
  }
  .fake-post-body { padding:0 14px 10px; }
  .fake-post-title { font-size:16px; font-weight:800; color:#0f172a; line-height:1.35; margin:0 0 5px; }
  .fake-post-desc { font-size:14.5px; line-height:1.45; color:#334155; margin:0; }
  .fake-post-price-row {
    display:flex; align-items:center; justify-content:space-between;
    gap:8px; flex-wrap:wrap; padding:0 14px 10px;
  }
  .fake-post-price {
    display:inline-flex; align-items:center; gap:5px; font-weight:900;
    font-size:13px; padding:6px 11px; border-radius:7px;
    background:rgba(0,127,255,.1); color:#007fff;
  }
  .fake-post-views {
    display:inline-flex; align-items:center; gap:4px; padding:5px 10px;
    border-radius:20px; background:rgba(0,127,255,.08); color:#007fff;
    font-size:11px; font-weight:800; text-transform:uppercase;
  }
  .fake-post-media {
    width:100%; background:#f1f5f9; overflow:hidden; display:block;
    aspect-ratio:16/10; max-height:260px; position:relative;
  }
  .fake-post-media img {
    width:100%; height:100%; object-fit:cover; display:block;
  }

  /* ⭐ CARTE ADSTERRA — MÊME STRUCTURE ⭐ */
  .fb-post-ad {
    width:100%;
    background:#fff;
    border-radius:0;
    overflow:hidden;
    padding:0 0 12px;
    border-bottom:3px solid #e2e8f0;
  }
  .fb-post-ad-head {
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:10px;
    padding:12px 14px 8px;
  }
  .fb-post-ad-avatar {
    width:44px; height:44px; border-radius:50%;
    background:#f59e0b; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
  }
  .fb-post-ad-name {
    font-weight:800; font-size:14.5px;
    color:#0f172a; line-height:1.35;
  }
  .fb-post-ad-badge {
    font-size:10px; font-weight:900; padding:5px 9px;
    border-radius:6px; text-transform:uppercase;
    letter-spacing:.4px; background:#f59e0b;
    color:#fff; flex-shrink:0;
  }
  .fb-post-ad-media {
    width:100%;
    background:#f1f5f9;
    overflow:hidden;
    display:block;
    aspect-ratio:16/10;
    max-height:260px;
    position:relative;
  }

  /* Adsterra injecte dans ce slot : on force à remplir */
  #adsterraSlot {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
  }
  #adsterraSlot > div {
    width:100%!important;
    height:100%!important;
  }
  #adsterraSlot img {
    width:100%!important;
    height:100%!important;
    object-fit:cover!important;
    display:block!important;
  }
  #adsterraSlot a {
    display:block!important;
    width:100%!important;
    height:100%!important;
  }

  @media(min-width:640px){
    .fake-post-media, .fb-post-ad-media { aspect-ratio:5/4; max-height:none; }
  }
  @media(min-width:1024px){
    .fake-post-media, .fb-post-ad-media { aspect-ratio:3/2; min-height:200px; max-height:340px; }
  }

  #logBox {
    background:#020617; color:#5cb3ff; padding:14px;
    border-radius:10px; font-family:ui-monospace,monospace;
    font-size:11.5px; line-height:1.5; max-height:300px;
    overflow-y:auto; margin-top:16px;
  }
  #logBox .err { color:#f87171; }
  #logBox .ok { color:#4ade80; }
  #logBox .warn { color:#fbbf24; }
  #logBox .dim { color:#64748b; }
  #logBox > div { margin-bottom:3px; }

  .btn { padding:10px 18px; border-radius:8px; border:none;
    cursor:pointer; font-family:inherit; font-weight:900;
    font-size:13px; background:#007fff; color:#fff; margin-right:8px; }
  .btn.gray { background:#334155; }
  .info-badge { display:inline-block; padding:6px 12px; border-radius:8px;
    background:#0f172a; color:#5cb3ff; font-size:11px;
    font-weight:900; font-family:ui-monospace,monospace;
    margin:4px 4px 4px 0; }
</style>
</head>
<body>

<div class="container">

  <h1>🧪 Test Adsterra Full</h1>
  <p class="sub">Carte pub = même structure que tes posts NeTubeX</p>

  <div>
    <span class="info-badge" id="info1">Post: —</span>
    <span class="info-badge" id="info2">Pub: —</span>
    <span class="info-badge" id="info3">Imgs: 0</span>
  </div>

  <div id="status" class="status wait" style="margin-top:12px">
    <span>⏳</span> <span id="statusText">Chargement…</span>
  </div>

  <!-- FAUX POST avec image (pour comparer) -->
  <article class="fake-post" id="postAvant">
    <div class="fake-post-head">
      <div class="fake-post-avatar">BE</div>
      <div style="min-width:0;overflow:hidden">
        <div class="fake-post-name">Boutique Élégance</div>
        <div class="fake-post-sub">Kinshasa · Il y a 5 min</div>
      </div>
      <span class="fake-post-badge">MODE</span>
    </div>
    <div class="fake-post-body">
      <h3 class="fake-post-title">Robes en pagne à partir de 15$</h3>
      <p class="fake-post-desc">Nouvelle collection disponible à Kinshasa.</p>
    </div>
    <div class="fake-post-price-row">
      <div class="fake-post-price"><i>💰</i> 15$ / pièce</div>
      <div class="fake-post-views"><i>👁</i> 3 Vues</div>
    </div>
    <div class="fake-post-media">
      <img src="https://picsum.photos/600/375?random=1" alt="">
    </div>
  </article>

  <!-- CARTE ADSTERRA -->
  <article class="fb-post-ad" id="adsterraCard">
    <div class="fb-post-ad-head">
      <div class="fb-post-ad-avatar">📢</div>
      <div style="min-width:0;overflow:hidden">
        <div class="fb-post-ad-name">Sponsorisé</div>
      </div>
      <span class="fb-post-ad-badge">PUBLICITÉ</span>
    </div>
    <div class="fb-post-ad-media" id="adsterraMedia">
      <div id="adsterraSlot"></div>
    </div>
  </article>

  <button class="btn" onclick="location.reload()">🔄 Relancer</button>
  <button class="btn gray" onclick="document.getElementById('logBox').innerHTML=''">🗑️ Vider</button>

  <div id="logBox"></div>

</div>

<script>
(function() {
  'use strict';

  var ADSTERRA_KEY = 'c8e9df92013d3020593ad443d2530ad4';
  var ADSTERRA_SCRIPT_URL = 'https://bluntutilities.com/c8e9df92013d3020593ad443d2530ad4/invoke.js';

  var logEl = document.getElementById('logBox');
  var statusEl = document.getElementById('status');
  var statusTxt = document.getElementById('statusText');
  var info1 = document.getElementById('info1');
  var info2 = document.getElementById('info2');
  var info3 = document.getElementById('info3');
  var card = document.getElementById('adsterraCard');
  var slot = document.getElementById('adsterraSlot');
  var postAvant = document.getElementById('postAvant');
  var containerId = 'container-' + ADSTERRA_KEY;

  function log(msg, cls) {
    cls = cls || '';
    var d = document.createElement('div');
    d.className = cls;
    var t = new Date().toLocaleTimeString('fr-FR');
    d.textContent = '[' + t + '] ' + msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(txt, cls, icon) {
    statusEl.className = 'status ' + cls;
    statusTxt.textContent = txt;
    statusEl.querySelector('span').textContent = icon;
  }

  // Mesure le post précédent
  setTimeout(function() {
    if (postAvant) {
      var h = postAvant.getBoundingClientRect().height;
      info1.textContent = 'Post: ' + Math.round(h) + 'px';
      log('📏 Hauteur post : ' + Math.round(h) + 'px', 'ok');
    }
  }, 500);

  log('Script démarré', 'dim');

  // Container Adsterra
  if (!slot.querySelector('#' + containerId)) {
    var c = document.createElement('div');
    c.id = containerId;
    c.style.width = '100%';
    c.style.height = '100%';
    c.style.overflow = 'hidden';
    c.style.position = 'relative';
    slot.appendChild(c);
  }

  var s = document.createElement('script');
  s.type = 'text/javascript';
  s.async = true;
  s.setAttribute('data-cfasync', 'false');
  s.src = ADSTERRA_SCRIPT_URL;
  s.onerror = function() {
    log('❌ Script bloqué', 'err');
    setStatus('Script bloqué', 'err', '❌');
  };
  s.onload = function() {
    log('✅ invoke.js chargé', 'ok');
  };
  slot.appendChild(s);

  // Force les styles sur le contenu Adsterra
  function forcerStyles() {
    var c = document.getElementById(containerId);
    if (!c) return;

    // Force le container à remplir le slot
    c.style.width = '100%';
    c.style.height = '100%';
    c.style.maxHeight = '100%';
    c.style.overflow = 'hidden';

    // Force tous les enfants directs
    Array.from(c.children).forEach(function(child) {
      child.style.width = '100%';
      child.style.maxWidth = '100%';
    });

    // Force les images à remplir
    c.querySelectorAll('img').forEach(function(img) {
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.objectFit = 'cover';
      img.style.display = 'block';
    });

    // Force les liens à remplir
    c.querySelectorAll('a').forEach(function(a) {
      a.style.width = '100%';
      a.style.display = 'block';
    });
  }

  var t0 = Date.now();
  var iv = setInterval(function() {
    forcerStyles();

    var c = document.getElementById(containerId);
    if (!c) return;
    var imgs = c.querySelectorAll('img').length;
    var cardH = card.getBoundingClientRect().height;
    info2.textContent = 'Pub: ' + Math.round(cardH) + 'px';
    info3.textContent = 'Imgs: ' + imgs;

    log('⏱ ' + Math.round((Date.now() - t0) / 1000) + 's — Imgs: ' + imgs + ' | Pub: ' + Math.round(cardH) + 'px | Post: ' + Math.round(postAvant.getBoundingClientRect().height) + 'px', 'dim');

    if (Date.now() - t0 > 10000) {
      clearInterval(iv);
      forcerStyles();

      log('═══════════════════════════════', 'dim');
      var postH = postAvant ? postAvant.getBoundingClientRect().height : 0;
      var pubH = card.getBoundingClientRect().height;
      log('Post: ' + Math.round(postH) + 'px | Pub: ' + Math.round(pubH) + 'px | Diff: ' + Math.round(Math.abs(postH - pubH)) + 'px', 'dim');

      if (imgs === 0) {
        setStatus('Aucune pub reçue', 'err', '❌');
      } else if (Math.abs(postH - pubH) < 30) {
        setStatus('Pub alignée au post ✅', 'ok', '✅');
      } else {
        setStatus('Pub : ' + Math.round(pubH) + 'px (post : ' + Math.round(postH) + 'px)', 'warn', '⚠️');
      }
    }
  }, 500);

  setTimeout(function() {
    var c = document.getElementById(containerId);
    if (c && c.innerHTML.length < 100 && card) {
      card.style.display = 'none';
    }
  }, 8000);
})();
</script>

</body>
</html>

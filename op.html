<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NeTubeX Vidéo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #0a0e1a; color: #e8eef5; margin: 0; }
  .page { display: none; }
  .page.active { display: block; }
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: rgba(17,24,39,0.95); backdrop-filter: blur(12px);
    border-top: 1px solid rgba(148,163,184,.18);
    display: grid; grid-template-columns: repeat(3, 1fr);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab-btn {
    padding: 14px 8px 12px; background: transparent; border: none; cursor: pointer;
    color: #94a3b8; font-size: 11px; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-family: inherit;
  }
  .tab-btn i { font-size: 20px; }
  .tab-btn.active { color: #3B82F6; }
  .header {
    position: sticky; top: 0; z-index: 40;
    background: rgba(17,24,39,0.92); backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(148,163,184,.15);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
  }
  .header-title { font-size: 22px; font-weight: 900; letter-spacing: -.5px; }
  .btn {
    padding: 14px 20px; border-radius: 12px; border: none; cursor: pointer;
    font-family: inherit; font-weight: 900; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-blue { background: #2563EB; color: #fff; }
  .btn-green { background: #10b981; color: #fff; }
  .btn-red { background: #ef4444; color: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .input {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    background: #141c2b; border: 2px solid #334155;
    color: #f1f5f9; font-size: 16px; font-family: inherit;
    outline: none; box-sizing: border-box;
  }
  .input:focus { border-color: #3B82F6; background: #111827; }
  .card {
    background: #111827; border: 1px solid rgba(148,163,184,.15);
    border-radius: 16px; padding: 20px;
  }
  .video-card {
    background: #000; border-radius: 16px; overflow: hidden;
    margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .video-frame {
    width: 100%; aspect-ratio: 9/16; max-height: 78vh;
    background: #000; position: relative;
  }
  .video-frame video {
    width: 100%; height: 100%; object-fit: contain; background: #000;
  }
  .video-meta { padding: 14px 16px; background: #111827; }
  .toast {
    position: fixed; top: 90px; left: 50%; transform: translate(-50%, -150%);
    background: #0f172a; color: #fff; padding: 14px 22px; border-radius: 14px;
    font-size: 14px; font-weight: 800; z-index: 900;
    transition: transform .3s ease; max-width: 85vw; text-align: center;
    border: 1px solid #334155;
  }
  .toast.show { transform: translate(-50%, 0); }
  .progress-wrap { height: 10px; background: #1a2233; border-radius: 6px; overflow: hidden; }
  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #2563EB, #3B82F6);
    transition: width .2s;
  }
  .auth-screen {
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; padding: 24px; box-sizing: border-box;
    max-width: 420px; margin: 0 auto;
  }
  .error-box {
    padding: 12px 14px; background: #7f1d1d; border: 1.5px solid #ef4444;
    border-radius: 10px; color: #fecaca; font-weight: 700; font-size: 14px;
    margin-bottom: 12px;
  }
  .main-content { padding-bottom: 90px; }
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="page-auth" class="page active">
  <div class="auth-screen">
    <h1 style="font-size:36px;font-weight:900;text-align:center;margin:0 0 6px;letter-spacing:-1.5px;">
      NeTube<span style="color:#3B82F6;">X</span>
    </h1>
    <p style="text-align:center;color:#94a3b8;font-size:14px;margin:0 0 28px;font-weight:600;">
      Chaque vidéo compte.
    </p>

    <div id="authError" class="error-box" style="display:none;"></div>

    <div style="display:flex;flex-direction:column;gap:12px;">
      <input id="authEmail" type="email" class="input" placeholder="Email" autocomplete="email">
      <input id="authPassword" type="password" class="input" placeholder="Mot de passe (min. 6)" autocomplete="current-password">
      <button id="btnLogin" class="btn btn-blue" style="width:100%;" onclick="handleLogin()">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Se connecter
      </button>
      <button id="btnSignup" class="btn btn-green" style="width:100%;" onclick="handleSignup()">
        <i class="fa-solid fa-user-plus"></i> Créer un compte
      </button>
    </div>

    <p style="text-align:center;color:#64748b;font-size:12px;margin-top:24px;">
      En continuant, vous acceptez les conditions NeTubeX.
    </p>
  </div>
</div>

<!-- ============ FEED ============ -->
<div id="page-feed" class="page">
  <div class="header">
    <div class="header-title">NeTube<span style="color:#3B82F6;">X</span></div>
    <button class="btn btn-blue" style="padding:10px 16px;font-size:13px;" onclick="ouvrirPublier()">
      <i class="fa-solid fa-plus"></i> Publier
    </button>
  </div>
  <div class="main-content" style="max-width:600px;margin:0 auto;padding:16px;">
    <div id="feedListe"></div>
  </div>
</div>

<!-- ============ PUBLIER ============ -->
<div id="page-publish" class="page">
  <div class="header">
    <div class="header-title">Publier une vidéo</div>
  </div>
  <div class="main-content" style="max-width:600px;margin:0 auto;padding:16px;">
    <div class="card">
      <div id="videoPickerZone" onclick="document.getElementById('videoFileInput').click()"
           style="border:2px dashed #334155;border-radius:14px;padding:30px 20px;text-align:center;cursor:pointer;background:#0f172a;margin-bottom:16px;">
        <div style="font-size:40px;margin-bottom:8px;">🎬</div>
        <div id="videoPickerLabel" style="font-size:15px;font-weight:800;color:#f1f5f9;">Choisir une vidéo</div>
        <div style="font-size:13px;color:#64748b;margin-top:4px;">MP4, WebM, MOV · max 500 Mo</div>
        <input type="file" id="videoFileInput" accept="video/*" style="display:none" onchange="onVideoSelected(event)">
      </div>

      <label style="display:block;font-size:12px;font-weight:900;color:#94a3b8;text-transform:uppercase;margin-bottom:8px;">Description</label>
      <textarea id="videoDescription" class="input" rows="3" maxlength="300" placeholder="Décrivez votre vidéo…" style="resize:none;margin-bottom:16px;font-family:inherit;"></textarea>

      <div id="videoProgressZone" style="display:none;margin-bottom:16px;">
        <div class="progress-wrap"><div id="videoProgressBar" class="progress-bar"></div></div>
        <div id="videoProgressText" style="font-size:13px;font-weight:800;color:#94a3b8;margin-top:8px;text-align:center;">0 %</div>
      </div>

      <div id="videoError" class="error-box" style="display:none;"></div>

      <button id="videoPublishBtn" class="btn btn-green" style="width:100%;" onclick="lancerPublication()">
        <i class="fa-solid fa-paper-plane"></i> Publier la vidéo
      </button>
    </div>
  </div>
</div>

<!-- ============ PROFIL ============ -->
<div id="page-profil" class="page">
  <div class="header">
    <div class="header-title">Mon profil</div>
    <button class="btn btn-red" style="padding:10px 14px;font-size:13px;" onclick="handleLogout()">
      <i class="fa-solid fa-right-from-bracket"></i>
    </button>
  </div>
  <div class="main-content" style="max-width:600px;margin:0 auto;padding:16px;">
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:14px;">
        <div style="width:60px;height:60px;border-radius:50%;background:#2563EB;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff;flex-shrink:0;">
          <i class="fa-solid fa-user"></i>
        </div>
        <div style="min-width:0;flex:1;">
          <div id="profilEmail" style="font-size:16px;font-weight:800;word-break:break-all;">—</div>
          <div style="font-size:13px;color:#94a3b8;margin-top:2px;">Compte NeTubeX</div>
        </div>
      </div>
    </div>

    <h2 style="font-size:18px;font-weight:900;margin:0 0 12px;">
      <i class="fa-solid fa-video" style="color:#3B82F6;margin-right:6px;"></i> Mes vidéos
    </h2>
    <div id="mesVideosListe"></div>
  </div>
</div>

<!-- ============ TAB BAR ============ -->
<div id="tabBar" class="tab-bar" style="display:none;">
  <button class="tab-btn active" data-tab="feed" onclick="switchTab('feed')">
    <i class="fa-solid fa-house"></i><span>Accueil</span>
  </button>
  <button class="tab-btn" data-tab="publish" onclick="switchTab('publish')">
    <i class="fa-solid fa-plus-circle"></i><span>Publier</span>
  </button>
  <button class="tab-btn" data-tab="profil" onclick="switchTab('profil')">
    <i class="fa-solid fa-user"></i><span>Profil</span>
  </button>
</div>

<div id="toast" class="toast"></div>

<!-- ============ SCRIPT ============ -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
  getFirestore, collection, addDoc, deleteDoc, doc, query,
  orderBy, onSnapshot, serverTimestamp, where, limit
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// ============ CONFIG FIREBASE (projet existant) ============
const firebaseConfig = {
  apiKey: "AIzaSyB_GdmPBnWl3w6g99j1cGO7vxDdxmKr4QA",
  authDomain: "netubexmoney.firebaseapp.com",
  projectId: "netubexmoney",
  storageBucket: "netubexmoney.firebasestorage.app",
  messagingSenderId: "856592608176",
  appId: "1:856592608176:web:69f9df9cfd4f8c28630475"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ============ PUBLITIO ============
const PUBLITIO_PRESET = "cbnwpcbP";
const PUBLITIO_UPLOAD_URL = `https://api.publit.io/v1/files/create/${PUBLITIO_PRESET}`;
const VIDEO_MAX_SIZE = 500 * 1024 * 1024;

function uploadToPublitio(file, onProgress) {
  if (!file.type || !file.type.startsWith("video/")) {
    return Promise.reject(new Error("Veuillez sélectionner une vidéo."));
  }
  if (file.size > VIDEO_MAX_SIZE) {
    return Promise.reject(new Error("La vidéo dépasse 500 Mo."));
  }
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    var form = new FormData();
    form.append("file", file);
    xhr.upload.onprogress = function(e) {
      if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
    };
    xhr.onload = function() {
      if (xhr.status < 200 || xhr.status >= 300) {
        reject(new Error("Échec de l'envoi (" + xhr.status + ")."));
        return;
      }
      try {
        var raw = JSON.parse(xhr.responseText);
        // Publitio peut envelopper la réponse dans .response
        var data = (raw && raw.response) ? raw.response : raw;

        // Cherche l'URL dans plusieurs champs possibles
        var videoUrl =
          data.url_mp4 ||
          data.url ||
          data.secure_url ||
          data.url_mp4_download ||
          data.original_url ||
          null;

        var publitioId = data.id || data.publitio_id || null;
        var thumbnailUrl = data.thumbnail_url || data.thumbnail || null;

        if (!publitioId || !videoUrl) {
          console.error("RÉPONSE PUBLITIO NON EXPLOITABLE :", raw);
          reject(new Error("Publitio n'a pas renvoyé d'URL vidéo. Vérifiez la console (F12)."));
          return;
        }

        resolve({
          publitioId: publitioId,
          videoUrl: videoUrl,
          thumbnailUrl: thumbnailUrl
        });
      } catch (e) {
        reject(new Error("Réponse Publitio invalide."));
      }
    };
    xhr.onerror = function() { reject(new Error("Erreur réseau.")); };
    xhr.open("POST", PUBLITIO_UPLOAD_URL);
    xhr.send(form);
  });
}

// ============ STATE ============
let currentUser = null;
let selectedFile = null;
let unsubFeed = null;
let unsubMine = null;
let videoObserver = null;
let currentTab = 'feed';

// ============ UI HELPERS ============
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3200);
}
function esc(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, function(m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}
function showPage(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  var el = document.getElementById('page-' + name);
  if (el) el.classList.add('active');
  window.scrollTo(0, 0);
}
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  showPage(tab);
  if (tab === 'feed') startFeed();
  if (tab === 'profil') startMyVideos();
  if (tab === 'publish') resetPublishForm();
}

// ============ AUTH ============
window.handleLogin = async function() {
  var email = document.getElementById('authEmail').value.trim();
  var pwd = document.getElementById('authPassword').value;
  var errBox = document.getElementById('authError');
  errBox.style.display = 'none';
  if (!email || !pwd) { toast('Remplissez tous les champs.'); return; }
  var btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connexion…';
  try {
    await signInWithEmailAndPassword(auth, email, pwd);
  } catch (e) {
    errBox.textContent = traduireErreur(e.code || e.message);
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Se connecter';
  }
};

window.handleSignup = async function() {
  var email = document.getElementById('authEmail').value.trim();
  var pwd = document.getElementById('authPassword').value;
  var errBox = document.getElementById('authError');
  errBox.style.display = 'none';
  if (!email || !pwd) { toast('Remplissez tous les champs.'); return; }
  if (pwd.length < 6) { toast('Mot de passe : 6 caractères minimum.'); return; }
  var btn = document.getElementById('btnSignup');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Création…';
  try {
    await createUserWithEmailAndPassword(auth, email, pwd);
  } catch (e) {
    errBox.textContent = traduireErreur(e.code || e.message);
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Créer un compte';
  }
};

window.handleLogout = async function() {
  if (unsubFeed) { unsubFeed(); unsubFeed = null; }
  if (unsubMine) { unsubMine(); unsubMine = null; }
  if (videoObserver) { videoObserver.disconnect(); videoObserver = null; }
  await signOut(auth);
  toast('Déconnecté');
};

function traduireErreur(code) {
  var map = {
    'auth/invalid-email': 'Email invalide.',
    'auth/user-not-found': 'Aucun compte avec cet email.',
    'auth/wrong-password': 'Mot de passe incorrect.',
    'auth/invalid-credential': 'Email ou mot de passe incorrect.',
    'auth/email-already-in-use': 'Cet email est déjà utilisé.',
    'auth/weak-password': 'Mot de passe trop faible.',
    'auth/too-many-requests': 'Trop de tentatives. Réessayez plus tard.',
    'auth/network-request-failed': 'Erreur réseau.'
  };
  return map[code] || 'Erreur : ' + code;
}

// ============ PUBLICATION ============
window.ouvrirPublier = function() { switchTab('publish'); };

window.resetPublishForm = function() {
  selectedFile = null;
  document.getElementById('videoFileInput').value = '';
  document.getElementById('videoPickerLabel').textContent = 'Choisir une vidéo';
  document.getElementById('videoDescription').value = '';
  document.getElementById('videoProgressZone').style.display = 'none';
  document.getElementById('videoProgressBar').style.width = '0%';
  document.getElementById('videoProgressText').textContent = '0 %';
  document.getElementById('videoError').style.display = 'none';
};

window.onVideoSelected = function(e) {
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  if (!f.type.startsWith('video/')) { toast('Veuillez choisir une vidéo.'); e.target.value = ''; return; }
  if (f.size > VIDEO_MAX_SIZE) { toast('Vidéo trop lourde (max 500 Mo).'); e.target.value = ''; return; }
  selectedFile = f;
  var nom = f.name.length > 32 ? f.name.slice(0, 29) + '…' : f.name;
  document.getElementById('videoPickerLabel').textContent = '✅ ' + nom;
};

window.lancerPublication = async function() {
  if (!currentUser) { toast('Connectez-vous.'); return; }
  if (!selectedFile) { toast('Choisissez une vidéo.'); return; }
  var desc = document.getElementById('videoDescription').value.trim();
  var btn = document.getElementById('videoPublishBtn');
  var zone = document.getElementById('videoProgressZone');
  var bar = document.getElementById('videoProgressBar');
  var txt = document.getElementById('videoProgressText');
  var errBox = document.getElementById('videoError');
  errBox.style.display = 'none';
  zone.style.display = 'block';
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Envoi…';
  try {
    // 1. Upload Publitio
    var pub = await uploadToPublitio(selectedFile, function(pct) {
      bar.style.width = pct + '%';
      txt.textContent = pct + ' %';
    });

    // 2. Firestore — nettoyage strict (jamais undefined)
    var videoData = {
      ownerUid: currentUser.uid,
      publitioId: pub.publitioId,
      videoUrl: pub.videoUrl,
      description: desc || "",
      createdAt: serverTimestamp(),
      accountType: 'creator',
      status: 'published',
      validViews: 0
    };
    if (pub.thumbnailUrl) videoData.thumbnailUrl = pub.thumbnailUrl;

    // Sécurité finale : retire tout champ undefined
    Object.keys(videoData).forEach(function(k) {
      if (videoData[k] === undefined) delete videoData[k];
    });

    await addDoc(collection(db, 'videos'), videoData);

    toast('✅ Vidéo publiée !');
    setTimeout(function() { switchTab('feed'); }, 500);
  } catch (e) {
    errBox.textContent = e.message || 'Échec du téléversement.';
    errBox.style.display = 'block';
    console.error("Erreur publication :", e);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publier la vidéo';
  }
};

// ============ FEED ============
function renderVideoCard(v, mode) {
  var dateStr = 'Récemment';
  if (v.createdAt && v.createdAt.seconds) {
    var d = new Date(v.createdAt.seconds * 1000);
    dateStr = d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  var delBtn = mode === 'mine'
    ? '<button onclick="supprimerVideo(\'' + v.id + '\')" style="margin-top:10px;padding:10px 16px;border-radius:10px;background:#ef4444;color:#fff;border:none;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit;width:100%;"><i class="fa-solid fa-trash"></i> Supprimer</button>'
    : '';
  var posterAttr = v.thumbnailUrl ? ' poster="' + esc(v.thumbnailUrl) + '"' : '';
  return (
    '<article class="video-card">' +
      '<div class="video-frame">' +
        '<video src="' + esc(v.videoUrl) + '"' + posterAttr + ' controls playsinline preload="metadata"></video>' +
      '</div>' +
      '<div class="video-meta">' +
        (v.description ? '<p style="font-size:15px;line-height:1.5;color:#f1f5f9;margin:0 0 8px;">' + esc(v.description) + '</p>' : '') +
        '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:#94a3b8;font-weight:700;">' +
          '<span><i class="fa-regular fa-calendar"></i> ' + dateStr + '</span>' +
          '<span><i class="fa-solid fa-eye"></i> ' + (v.validViews || 0) + '</span>' +
        '</div>' +
        delBtn +
      '</div>' +
    '</article>'
  );
}

function attachPauseObserver() {
  if (videoObserver) videoObserver.disconnect();
  if (!('IntersectionObserver' in window)) return;
  videoObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (!e.isIntersecting && !e.target.paused) e.target.pause();
    });
  }, { threshold: 0.5 });
  document.querySelectorAll('.video-frame video').forEach(function(v) {
    videoObserver.observe(v);
  });
}

function startFeed() {
  var el = document.getElementById('feedListe');
  el.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;"><i class="fa-solid fa-spinner fa-spin"></i> Chargement…</div>';
  if (unsubFeed) { unsubFeed(); unsubFeed = null; }
  var q = query(collection(db, 'videos'), orderBy('createdAt', 'desc'), limit(50));
  unsubFeed = onSnapshot(q, function(snap) {
    var list = [];
    snap.forEach(function(d) { list.push(Object.assign({ id: d.id }, d.data())); });
    if (list.length === 0) {
      el.innerHTML = '<div class="card" style="text-align:center;padding:60px 20px;"><div style="font-size:48px;opacity:.35;margin-bottom:14px;">🎬</div><h3 style="font-size:17px;font-weight:800;margin:0 0 8px;">Aucune vidéo</h3><p style="font-size:14px;color:#94a3b8;margin:0;">Soyez le premier à publier !</p></div>';
      return;
    }
    el.innerHTML = list.map(function(v) { return renderVideoCard(v, 'feed'); }).join('');
    attachPauseObserver();
  }, function(err) {
    el.innerHTML = '<div class="error-box">Erreur : ' + esc(err.message) + '</div>';
  });
}

// ============ MES VIDÉOS ============
window.supprimerVideo = async function(videoId) {
  if (!confirm('Supprimer cette vidéo ?\n(Le fichier reste sur Publitio, seul l\'affichage est retiré.)')) return;
  try {
    await deleteDoc(doc(db, 'videos', videoId));
    toast('Vidéo supprimée');
  } catch (e) {
    toast('Erreur : ' + e.message);
  }
};

function startMyVideos() {
  var el = document.getElementById('mesVideosListe');
  if (!currentUser) { el.innerHTML = ''; return; }
  el.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;"><i class="fa-solid fa-spinner fa-spin"></i> Chargement…</div>';
  if (unsubMine) { unsubMine(); unsubMine = null; }
  var q = query(collection(db, 'videos'), where('ownerUid', '==', currentUser.uid));
  unsubMine = onSnapshot(q, function(snap) {
    var list = [];
    snap.forEach(function(d) { list.push(Object.assign({ id: d.id }, d.data())); });
    list.sort(function(a, b) {
      return (b.createdAt && b.createdAt.seconds || 0) - (a.createdAt && a.createdAt.seconds || 0);
    });
    if (list.length === 0) {
      el.innerHTML = '<div class="card" style="text-align:center;padding:40px 20px;"><div style="font-size:48px;opacity:.35;margin-bottom:14px;">📹</div><h3 style="font-size:16px;font-weight:800;margin:0 0 10px;">Aucune vidéo</h3><button class="btn btn-blue" onclick="switchTab(\'publish\')" style="padding:12px 20px;font-size:14px;margin:0 auto;display:inline-flex;"><i class="fa-solid fa-plus"></i> Publier</button></div>';
      return;
    }
    el.innerHTML = list.map(function(v) { return renderVideoCard(v, 'mine'); }).join('');
    attachPauseObserver();
  }, function(err) {
    el.innerHTML = '<div class="error-box">Erreur : ' + esc(err.message) + '</div>';
  });
}

// ============ SESSION ============
onAuthStateChanged(auth, function(user) {
  currentUser = user;
  if (user) {
    showPage('feed');
    document.getElementById('tabBar').style.display = 'grid';
    document.getElementById('profilEmail').textContent = user.email;
    switchTab('feed');
  } else {
    showPage('auth');
    document.getElementById('tabBar').style.display = 'none';
    if (unsubFeed) { unsubFeed(); unsubFeed = null; }
    if (unsubMine) { unsubMine(); unsubMine = null; }
  }
});
</script>

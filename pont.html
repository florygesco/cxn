<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Chargement...</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0a1628;color:#fff;font-family:'Inter',sans-serif}
.spinner{width:50px;height:50px;border:4px solid rgba(255,255,255,0.2);border-top-color:#60a5fa;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="spinner"></div>
<script>
(function(){
    var urlParams = new URLSearchParams(window.location.search);
    var ecole = urlParams.get('ecole');
    var role = urlParams.get('role');
    var code = urlParams.get('code');
    var auth = urlParams.get('auth');

    if (auth === '1' && ecole && role) {
        try {
            sessionStorage.setItem('ecoleId', ecole);
            sessionStorage.setItem('role', role);
            sessionStorage.setItem('code', code || '');
            sessionStorage.setItem('isAuthenticated', 'true');
            sessionStorage.setItem('loginTime', Date.now().toString());
            sessionStorage.setItem('projet', '2');
        } catch(e) {
            console.error('Erreur sessionStorage:', e);
        }
    }

    window.location.replace('/');
})();
</script>
</body>
</html>

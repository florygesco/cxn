<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace parental — Créneaux d'accès</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--vert:#1a5c3a;--vert-hover:#237a4d;--vert-fonce:#0d3520;--vert-deep:#082414;--vert-citron:#a8d94a;--vert-citron-pale:#e8f5c4;--vert-menthe-clair:#e8f2ec;--gris-bg:#eef0ed;--gris-carte:#f4f6f3;--gris-texte:#2a2e2c;--gris-texte-doux:#4a4f4c;--bordure:#d0d6d0;--ombre-forte:0 24px 60px rgba(26,92,58,.12)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
html,body{min-height:100vh;width:100%}
body{background:linear-gradient(160deg,var(--gris-bg) 0%,var(--vert-menthe-clair) 100%);display:flex;align-items:center;justify-content:center;padding:24px;color:var(--gris-texte);-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;top:-20%;right:-10%;width:600px;height:600px;background:radial-gradient(circle,rgba(168,217,74,.18) 0%,transparent 60%);border-radius:50%;pointer-events:none;animation:float 8s ease-in-out infinite}
body::after{content:'';position:fixed;bottom:-30%;left:-10%;width:500px;height:500px;background:radial-gradient(circle,rgba(26,92,58,.08) 0%,transparent 65%);border-radius:50%;pointer-events:none;animation:float 10s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,-20px)}}
.card{position:relative;z-index:2;background:var(--gris-carte);border:1px solid var(--bordure);border-radius:28px;padding:56px 48px;max-width:560px;width:100%;text-align:center;box-shadow:var(--ombre-forte);animation:zoomIn .5s cubic-bezier(.16,1,.3,1) forwards;opacity:0;transform:scale(.94)}
@keyframes zoomIn{to{opacity:1;transform:scale(1)}}
.icon-wrap{width:92px;height:92px;border-radius:24px;background:var(--vert-citron-pale);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:2.6rem;color:var(--vert);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
h1{font-family:'Poppins',sans-serif;font-size:1.6rem;font-weight:700;color:var(--vert-fonce);margin-bottom:14px;letter-spacing:-.4px}
.intro{font-size:1.05rem;color:var(--gris-texte-doux);line-height:1.7;margin-bottom:32px}
.intro strong{color:var(--vert);font-weight:700}
.creneaux{display:flex;flex-direction:column;gap:14px;margin-bottom:32px}
.creneau{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--vert-citron-pale);border:2px solid var(--vert);border-radius:16px;padding:18px 24px;transition:transform .3s,box-shadow .3s,background .3s}
.creneau:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(26,92,58,.15);background:var(--vert-menthe-clair)}
.creneau .jour{display:flex;align-items:center;gap:14px;font-family:'Poppins',sans-serif;font-weight:700;font-size:1.1rem;color:var(--vert-fonce)}
.creneau .jour i{width:42px;height:42px;border-radius:11px;background:var(--vert);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0}
.creneau .horaire{font-family:'Poppins',sans-serif;font-weight:700;font-size:1.05rem;color:var(--vert);background:#fff;border:1px solid var(--bordure);border-radius:30px;padding:8px 18px;white-space:nowrap}
.note{font-size:.92rem;color:var(--gris-texte-doux);font-style:italic;margin-bottom:34px;padding:16px 20px;background:var(--vert-menthe-clair);border-radius:12px;border-left:3px solid var(--vert);text-align:left;line-height:1.6}
.btn-accueil{display:inline-flex;align-items:center;justify-content:center;gap:12px;background:var(--vert);color:#fff;padding:17px 44px;border-radius:12px;font-family:'Poppins',sans-serif;font-weight:600;font-size:1.05rem;text-decoration:none;border:1px solid var(--vert);cursor:pointer;transition:background .25s,transform .25s,box-shadow .25s;width:100%;position:relative;overflow:hidden}
.btn-accueil::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transition:left .6s}
.btn-accueil:hover::before{left:100%}
.btn-accueil:hover{background:var(--vert-hover);transform:translateY(-3px);box-shadow:0 14px 36px rgba(26,92,58,.4)}
.btn-accueil:active{transform:translateY(0) scale(.97)}
.btn-accueil i{font-size:1.1rem}
.footer-note{margin-top:22px;font-size:.82rem;color:var(--gris-texte-doux);letter-spacing:.3px}
.footer-note i{color:var(--vert);margin-right:6px}
@media(max-width:520px){
.card{padding:40px 26px;border-radius:22px}
.icon-wrap{width:76px;height:76px;font-size:2.1rem;border-radius:20px}
h1{font-size:1.35rem}
.intro{font-size:.98rem;margin-bottom:26px}
.creneau{flex-direction:column;align-items:flex-start;gap:12px;padding:16px 18px}
.creneau .horaire{width:100%;text-align:center;padding:10px 14px}
.btn-accueil{padding:15px 28px;font-size:1rem}
.note{font-size:.86rem;padding:14px 16px}
}
</style>
</head>
<body>
<div class="card">
    <div class="icon-wrap">
        <i class="fas fa-calendar-alt"></i>
    </div>

    <h1>🔒 Espace parental</h1>
    <p class="intro">
        L'espace parental est accessible <strong>seulement 2 jours par semaine</strong> :
    </p>

    <div class="creneaux">
        <div class="creneau">
            <div class="jour"><i class="fas fa-calendar-day"></i> Jeudi</div>
            <div class="horaire">8h – 20h</div>
        </div>
        <div class="creneau">
            <div class="jour"><i class="fas fa-calendar-day"></i> Vendredi</div>
            <div class="horaire">8h – 20h</div>
        </div>
    </div>

    <p class="note">
        <i class="fas fa-info-circle" style="color:var(--vert);margin-right:6px;"></i>
        Merci de revenir pendant ces créneaux pour accéder à votre espace. 🙏
    </p>

    <a href="https://www.netubex.com" class="btn-accueil">
        <i class="fas fa-home"></i> Retour à l'accueil
    </a>

    <p class="footer-note">
        <i class="fas fa-shield-alt"></i> Développé par NeTubeX SARL
    </p>
</div>

<script>
// Empêcher le clic droit et les raccourcis de développement
document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) { e.preventDefault(); return false; }
    if (e.ctrlKey && ['U','u','S','s'].includes(e.key)) { e.preventDefault(); return false; }
});
</script>
</body>
</html>
